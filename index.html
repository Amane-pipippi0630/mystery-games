<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汐見ミステリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;min-height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 60%) no-repeat;display:flex;justify-content:center}
#wrap{width:100%;max-width:560px;padding:34px 16px 40px}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em;text-align:center}
h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:38px;letter-spacing:.08em;text-align:center;margin:8px 0 10px;text-shadow:0 4px 30px #000}
.lead{color:var(--sub);font-size:14px;line-height:1.9;text-align:center;text-wrap:balance}
.stat{display:flex;justify-content:center;gap:10px;margin:18px 0 6px}
.stat span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px}
.order{color:var(--sub);font-size:12.5px;line-height:1.8;text-align:center;margin:6px 0 18px;text-wrap:balance}
.sec{color:var(--sub);font-size:12px;letter-spacing:.2em;margin:22px 2px 10px}
.game{display:block;width:100%;text-align:left;color:inherit;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;cursor:pointer;position:relative}
.game:hover{border-color:var(--accent)}
.game{transition:transform .08s,filter .15s,border-color .15s}
.game:active{transform:scale(.98);filter:brightness(1.2)}
.game.going{border-color:var(--accent);filter:brightness(1.2)}
.game.going .img::before{content:'開いています…';position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;background:#0e1117aa;color:#fff;font-size:15px;font-weight:700;letter-spacing:.1em}
.game .img{aspect-ratio:16/7;background:linear-gradient(135deg,#2a3348,#151a24);background-size:cover;background-position:center;position:relative}
.game .img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#171b24 100%)}
.game .body{padding:2px 16px 15px;position:relative}
.game .tag{display:inline-block;color:#1a1405;background:var(--accent);font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:6px}
.game .era{color:var(--sub);font-size:12px}
.game h2{font-family:'Shippori Mincho',serif;font-weight:800;font-size:22px;margin:6px 0 4px}
.game p{color:var(--sub);font-size:13.5px;line-height:1.8}
.game .badges{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:1}
.game .badges span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff2a;border-radius:999px;padding:4px 10px;font-size:12px}
.game .badges .clear{border-color:var(--accent);color:var(--accent);font-weight:700}
.game.soon{cursor:default}
.game.soon .img{filter:grayscale(.6) brightness(.7)}
.game.soon .badges .wait{color:var(--sub)}
.game.locked .img{filter:blur(6px) brightness(.4)}
.game.locked h2{letter-spacing:.3em}
.game.epi{border-color:var(--accent)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
footer{color:#5c6370;font-size:11px;text-align:center;margin-top:24px}
.debug{margin:18px 0 6px;padding:14px;border:1px dashed #e0a43a;border-radius:16px;display:flex;flex-direction:column;gap:8px}
.debug h2{font-size:15px;color:#e0a43a}
.debug p{font-size:12px;color:#8a93a3;line-height:1.6}
.debug button{font:inherit;font-size:14px;padding:12px;border-radius:12px;border:1px solid #3a4254;background:#1b2130;color:#e8e8ea;cursor:pointer;text-align:left}
#openpop{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:24px}
#openpop .sheet{width:100%;max-width:340px;background:#161b26;border:1px solid #e0a43a;border-radius:20px;padding:22px 20px 18px;text-align:center}
#openpop .eyebrow{color:#e0a43a;font-size:12px;letter-spacing:.2em}
#openpop h3{font-family:'Shippori Mincho',serif;font-size:19px;margin:6px 0 12px}
#openpop .t{font-size:16px;font-weight:700;margin:6px 0}
#openpop .ok{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:15px;padding:12px;border-radius:999px;border:0;background:#e0a43a;color:#1a1405;cursor:pointer}
</style>
</head>
<body>
<div id="toast"></div>
<div id="wrap"></div>
<script type="application/json" id="hub-data">{"title": "汐見ミステリー", "eyebrow": "MYSTERY ADVENTURE SERIES", "lead": "港町・汐見と、1冊の古い手帳をめぐる推理アドベンチャー。", "order": "第一作から順に遊びます。前の作品をクリアすると、次の作品が開きます。番外編はいつでも遊べます。", "games": [{"id": "kamomejima", "tag": "第一作", "title": "鴎島館の論理", "era": "2026年夏", "lead": "嵐で孤立した島の洋館。閂のかかった書庫で、弁護士が死んでいた。", "thumb": "games/kamomejima/src/bg/island.jpg", "path": "games/kamomejima/index.html", "status": "play", "trilogy": true, "thumbUrl": "hub/thumbs/kamomejima.webp"}, {"id": "furiko", "tag": "第二作", "title": "振り子の止まる夜", "era": "2027年冬", "lead": "下町の川沿いに停められた車の中で、男が冷たくなっていた。", "thumb": "games/furiko/src/bg/shop.jpg", "path": "games/furiko/index.html", "status": "play", "trilogy": true, "requires": "kamomejima", "thumbUrl": "hub/thumbs/furiko.webp"}, {"id": "fuyu-shiomi", "tag": "第三作", "title": "冬の汐見", "era": "1959年冬", "lead": "品川の安宿で見つかった身元不明の男。手がかりは、汐見行きの切符の半券。", "thumb": "games/fuyu-shiomi/src/bg/beach.jpg", "path": "games/fuyu-shiomi/index.html", "status": "play", "trilogy": true, "requires": "furiko", "thumbUrl": "hub/thumbs/fuyu-shiomi.webp"}, {"id": "shiomi-port", "tag": "番外編", "title": "汐見港殺人事件", "era": "2025年秋", "lead": "鍵のかかった書斎で、水産会社の社長が死んでいた。30分ほどで遊べる短編。", "thumb": "games/shiomi-port/src/bg/study.jpg", "path": "games/shiomi-port/index.html", "status": "play", "thumbUrl": "hub/thumbs/shiomi-port.webp"}], "epilogue": {"id": "epilogue", "title": "最後のページ", "lead": "3作すべてを解いた人へ。", "path": "games/epilogue/index.html", "status": "play"}}</script>
<script>
'use strict';
(() => {
const H = JSON.parse(document.getElementById('hub-data').textContent);
const get = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const cleared = get('mg:cleared') || [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let toastT;
const toast = t => { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); };

const trilogy = H.games.filter(g => g.trilogy);
const triDone = trilogy.filter(g => cleared.includes(g.id)).length;
const allDone = triDone === trilogy.length;

function card(g, opt = {}) {
  const b = document.createElement('button');
  const done = cleared.includes(g.id);
  const auto = get('mg:' + g.id + ':auto');
  const cont = auto && auto.state && !auto.state.done;
  const soon = g.status !== 'play';
  // 前の作品をクリアするまで開かない（hub.json の requires）
  const need = g.requires && !cleared.includes(g.requires) ? H.games.find(x => x.id === g.requires) : null;
  if (need) { opt.locked = true; opt.msg = `『${need.title}』をクリアすると開きます`; opt.showTitle = true; }
  b.className = 'game' + (soon ? ' soon' : '') + (opt.locked ? ' locked' : '') + (opt.epi ? ' epi' : '');
  b.dataset.id = g.id;
  const badges = [done ? '<span class="clear">⭐️ クリア</span>' : '', cont ? '<span>つづきあり</span>' : '', soon && !opt.locked ? '<span class="wait">準備中</span>' : ''].join('');
  b.innerHTML = `<div class="img" style="${g.thumbUrl ? `background-image:url('${g.thumbUrl}')` : ''}"></div>
    <div class="badges">${badges}</div>
    <div class="body">${g.tag ? `<span class="tag">${esc(g.tag)}</span>` : ''}<span class="era">${esc(g.era || '')}</span>
    <h2>${esc(opt.locked && !opt.showTitle ? '？？？' : g.title)}</h2><p>${esc(opt.locked ? (opt.msg || `三部作をすべてクリアすると開きます（${triDone}/${trilogy.length}）`) : g.lead)}</p></div>`;
  b.onclick = () => {
    if (opt.locked) return toast(opt.msg || '三部作をすべてクリアすると開きます');
    if (soon) return toast('ただいま準備中です');
    b.classList.add('going'); document.querySelectorAll('.game').forEach(x => x.disabled = true);
    setTimeout(() => { location.href = g.path + (/[?&]debug\b/.test(location.search) ? '?debug' : ''); }, 150);
  };
  return b;
}

const w = document.getElementById('wrap');
w.innerHTML = `<div class="eyebrow">${esc(H.eyebrow)}</div><h1>${esc(H.title)}</h1><p class="lead">${esc(H.lead)}</p>
  <div class="stat"><span>⭐️ クリア ${H.games.filter(g => cleared.includes(g.id)).length} / ${H.games.length}</span></div>
  <p class="order">${esc(H.order)}</p><div class="sec">三部作</div>`;
trilogy.forEach(g => w.appendChild(card(g)));
if (triDone > 0) w.appendChild(card(H.epilogue, { locked: !allDone, epi: true }));
const others = H.games.filter(g => !g.trilogy);
if (others.length) {
  w.insertAdjacentHTML('beforeend', '<div class="sec">ほかの事件</div>');
  others.forEach(g => w.appendChild(card(g)));
}
// 新しく開いた作品を知らせる（前の作品をクリアして戻ってきたとき）
{
  const opened = H.games.filter(g => g.requires && cleared.includes(g.requires));
  if (H.epilogue && allDone) opened.push(H.epilogue);
  const seen = get('mg:opened') || [];
  const fresh = opened.filter(g => !seen.includes(g.id));
  try { localStorage.setItem('mg:opened', JSON.stringify(opened.map(g => g.id))); } catch (e) {}
  if (fresh.length) {
    const m = document.createElement('div'); m.id = 'openpop';
    m.innerHTML = `<div class="sheet" role="dialog" aria-label="新しい作品"><div class="eyebrow">NEW</div><h3>新しい作品が開きました</h3>${fresh.map(g => `<p class="t">『${esc(g.title)}』</p>`).join('')}<button class="ok">OK</button></div>`;
    m.querySelector('.ok').onclick = () => m.remove();
    m.onclick = e => { if (e.target === m) m.remove(); };
    document.body.appendChild(m);
  }
}
// デバッグ用：URL に ?debug をつけると、クリア記録を切り替えるボタンが出る（スマホとPCで記録が別々なので）
if (/[?&]debug\b/.test(location.search)) {
  const tri = trilogy.map(g => g.id);
  const sets = [['クリア記録なし', []], ['第一作をクリア', tri.slice(0, 1)], ['第二作までクリア', tri.slice(0, 2)], ['第三作までクリア（エピローグが開く）', tri.slice(0, 3)], ['すべてクリア', H.games.map(g => g.id).concat(H.epilogue ? [H.epilogue.id] : [])]];
  const box = document.createElement('section'); box.className = 'debug';
  box.innerHTML = '<h2>デバッグ：クリア記録</h2><p>このブラウザのクリア記録だけを書きかえます。各作品の途中のセーブはそのままです。</p><p class="now">いま：' + esc(cleared.join('、') || 'なし') + '</p>';
  sets.forEach(([label, ids]) => {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { localStorage.setItem('mg:cleared', JSON.stringify(ids)); location.reload(); };
    box.appendChild(b);
  });
  w.appendChild(box);
}
w.insertAdjacentHTML('beforeend', '<footer>進み具合とクリアの記録は、このブラウザに保存されます。<br>音楽：OpenTracks（旧DOVA-SYNDROME）の素材を使っています。音源の抜き出し・転用・再配布は禁止です。</footer>');
// 「戻る」で戻ってきたとき、押した状態が残らないようにする
window.addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
// サムネイルを先に読み込んでおく
H.games.forEach(g => { if (g.thumbUrl) new Image().src = g.thumbUrl; });
})();
</script>
</body>
</html>

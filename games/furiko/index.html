<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>振り子の止まる夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;height:100%;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#wrap{width:100%;max-width:560px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#wrap>*{flex-shrink:0} /* 長い文で文章欄が縮んで、文がボタンの下にはみ出さないように */
header{display:flex;align-items:center;justify-content:space-between}
#locname{font-family:'Shippori Mincho',serif;font-weight:800;font-size:19px;letter-spacing:.04em}
#locname small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.2em;margin-bottom:1px}
#bag-unused{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#bag-unused b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#scene{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px #0008}
#scene svg{width:100%;height:100%;display:block;filter:saturate(.8) contrast(1.05)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%),linear-gradient(180deg,transparent 60%,#0009);pointer-events:none}
#here{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
#here span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
#msgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-height:150px;position:relative;cursor:pointer}
#who{display:none;position:absolute;top:-12px;left:16px;background:var(--accent);color:#1a1405;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
#who.on{display:block}
#msg{font-size:16px;line-height:1.85;white-space:pre-wrap}
#msgbox.more::after{content:'';position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(45deg)}}
#cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cmd .label{grid-column:1/-1;color:var(--sub);font-size:13px;padding:2px 2px 0}
#cmd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;min-height:64px}
#cmd button svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cmd button:hover{border-color:var(--accent)}
#cmd button:active{transform:scale(.96);background:#262c3a}
#cmd.list{grid-template-columns:1fr 1fr}
#cmd.list button{flex-direction:row;justify-content:flex-start;min-height:50px;padding:10px 14px;text-align:left}
#cmd.pad{grid-template-columns:repeat(5,1fr)}
#cmd.pad button{min-height:52px;font-size:20px;border-radius:50%;aspect-ratio:1;padding:0}
#cmd button.back{background:transparent;color:var(--sub);border-style:dashed}
#cmd.pad button.back{border-radius:14px;aspect-ratio:auto;grid-column:1/-1;font-size:14px}
#cmd button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#cmd.one{grid-template-columns:1fr}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px #0006;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px;overflow:auto}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em}
#title h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:44px;line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 30px #000}
#title p{color:var(--sub);font-size:14px;line-height:1.9}
.big{width:240px;padding:14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:15px;font-weight:500;cursor:pointer}
.big.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#prologue{justify-content:flex-start}
#prologue .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:left;line-height:1.95;font-size:15px;margin:auto 0}
#prologue h2{font-family:'Shippori Mincho',serif;font-size:24px;text-align:center;margin-bottom:14px}
#prologue b{color:var(--accent)}
#prologue .cast{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
#prologue .cast div{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
#prologue .cast span{min-width:76px;color:var(--blue);font-weight:700}
.hide{display:none!important}

#hdr-r{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px 26px;max-height:85vh;overflow:auto}
#modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:12px}
#modal .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:14px}
#modal .row:not([disabled]):hover{border-color:var(--accent)}
#modal .row .t{flex:1}
#modal .row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#modal .row[disabled]{opacity:.45;cursor:default}
#modal .close{margin-top:6px;width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
#card{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 40%,#24304a 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:fade .6s}
#card .n{color:var(--accent);letter-spacing:.35em;font-size:13px}
#card .t{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;letter-spacing:.08em}
#card .tap{color:var(--sub);font-size:12px;margin-top:30px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#bg,#bg img{width:100%;height:100%;display:block;object-fit:cover}
#loading .bar{width:220px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px}
#nbook{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.nb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.nb-head h3{font-family:'Shippori Mincho',serif;font-size:21px}
.nb-x{background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.nb-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb-tabs button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.nb-tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.nb-body{flex:1;overflow:auto;padding:12px 14px 30px}
.nb-entry{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 44px 11px 14px;margin-bottom:8px}
.nb-entry.pinned{border-color:var(--accent)}
.nb-entry .meta{color:var(--blue);font-size:12px;font-weight:700;margin-bottom:3px}
.nb-entry .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.nb-entry .pin{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:20px;color:var(--sub);cursor:pointer;padding:2px 6px}
.nb-entry .pin.on{color:var(--accent)}
.nb-bar,.nb-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)}
.nb-filter input[type=search]{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px}
.nb-filter select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--text);font:inherit;font-size:13px;max-width:48%}
.nb-bar .cnt,.nb-body .cnt{margin-left:auto;color:var(--sub);font-size:12px;margin-bottom:6px}
.nb-empty,.nb-note{color:var(--sub);font-size:13px;line-height:1.8;padding:6px 2px}
#memo{width:100%;min-height:50vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:15px;line-height:1.8;resize:vertical}
#modal .recap{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:6px 0 18px}
#modal .eyebrow{margin-bottom:4px}
.nb-contra{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center;position:sticky;top:0;z-index:1}
.nb-contra .big{width:100%}
.nb-contra small{display:block;color:var(--sub);font-size:12px;margin-top:6px}
.nb-contra .sel{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.nb-contra .row2{display:flex;gap:8px}
.nb-contra .row2 .big{flex:1;width:auto}
.nb-contra .big.back{background:transparent;color:var(--sub);border-style:dashed}
.nb-contra .big[disabled]{opacity:.4}
.nb-entry.selectable{cursor:pointer}
.nb-entry.chosen{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
#cmd button{position:relative}
#cmd .badge{position:absolute;top:7px;right:9px;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;line-height:1.5}
.big,.pill,#modal .row,.nb-tabs button,.nb-x{transition:transform .08s,filter .15s,background .15s}
.big:active,.pill:active,#modal .row:not([disabled]):active,.nb-tabs button:active,.nb-x:active{transform:scale(.96);filter:brightness(1.25)}
.big.going{filter:brightness(1.25);pointer-events:none}
body.leaving::after{content:'開いています…';position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0e1117cc;color:var(--text);font-size:15px;letter-spacing:.1em;animation:fade .2s}
.nb-entry .broken{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;font-size:10.5px;padding:0 8px;margin-right:6px}
.nb-entry.is-broken .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c2553f99}
#modal .board .b-sus{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
#modal .board .b-sus span{background:var(--accent);color:#1a1405;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transition:.2s}
#modal .board .b-sus span.out{background:var(--panel2);color:var(--sub);text-decoration:line-through;font-weight:400}
#modal .board .row.on{border-color:var(--accent);background:#2a2a20}
#modal .board .row2{display:flex;gap:8px;margin-top:10px}
#modal .board .row2 .big{flex:1;width:auto}
#modal .board .row2 .big[disabled]{opacity:.4}
.nb-entry.doc{padding-right:14px}.nb-entry.doc .txt{white-space:pre-wrap;font-variant-numeric:tabular-nums;line-height:1.7}
#cmd #sq{grid-column:1/-1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:inherit}
#title .lock{color:var(--accent);margin:18px 0 6px}

</style>
</head>
<body>
<div id="loading" class="screen"><div class="eyebrow">LOADING</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">読み込み中…</p></div>
<div id="title" class="screen hide"></div>
<div id="prologue" class="screen hide"></div>
<div id="toast"></div>
<div id="wrap" class="hide">
  <header><div id="locname"></div><div id="hdr-r"><button class="pill" id="menu">メニュー</button></div></header>
  <div id="scene"><div id="bg"></div><div id="here"></div></div>
  <div id="msgbox"><div id="who"></div><div id="msg"></div></div>
  <div id="cmd"></div>

負わせない」\n\n千鶴は、手帳を胸に当てた。","card":"手帳：「この子のために、おれは久我誠一郎として生きる」","do":["flag:read3"]},{"if":"var:day==4 && !flag:read4","text":"手帳の続き。昭和三十四年の冬のページ。\n\n字が、ひどく乱れている。インクが紙を破りそうなほど強い。\n\n「取り返しのつかないことをした」\n\nそのあとは、読めないほど崩れていた。\n\n千鶴は、そこで手帳を閉じた。…続きは、新年会から帰ってからにしよう。\n\n手帳を持って作業場へ下り、作業台の端に置いた。目の届くところに置いておきたかった。","card":"手帳：昭和34年冬「取り返しのつかないことをした」。千鶴はまだ読み終えていない","do":["flag:read4"]},{"if":"var:day==4","text":"手帳は、作業場の作業台に置いてある。続きは、夜に読もう。"},{"text":"今日の分は、もう読んだ。一度に読んでしまうのが、もったいない。"}],"butsudan":{"seq":[{"text":"仏壇。母と、蒼の両親の写真。父の写真は、一枚もない。"},{"text":"母は、父のことを聞かれると、いつも「立派な人だった」としか言わなかった。そして、手帳のことを一度だけ話した。"}]},"futon":[{"if":"var:day==1 && flag:read1 && flag:ao_d1","text":"布団を敷いた。","do":["event:night1"]},{"if":"var:day==2 && flag:delivered && flag:read2","text":"布団を敷いた。","do":["event:night2"]},{"if":"var:day==3 && flag:invited && flag:phone && flag:ao_d3 && flag:read3","text":"布団を敷いた。","do":["event:night3"]},{"if":"var:day==4","text":"まだ昼間だ。今夜は新年会がある。"},{"text":"まだ、今日のうちにやっておきたいことがある。"}],"photo":{"text":"母・美代子の写真。宮下は母の旧姓だ。父が亡くなったあと、母は千鶴を連れて、この下町に移り住んだ。"},"mizuoke":{"text":"大きな水槽に、白い豆腐が沈んでいる。冷たい水の音。"},"street":[{"if":"var:day>=2","text":"時雨町の通り。路地の角にコンビニがある。夜でも明るい。"},{"text":"時雨町の通り。夕方の買い物客が行き来している。"}]},"choices":{"repair":{"prompt":"置き時計は、止まる前にだんだん遅れていった。ゼンマイは巻けている。歯車もきれいだ。てんぷのひげゼンマイが、少し光って見える…。原因は？","label":"止まった原因は？","options":[{"label":"ゼンマイが切れている","text":"（いいえ。ゼンマイは、ちゃんと巻けていた。…もう一度、よく見てみよう）","do":["miss","choice:repair"]},{"label":"ひげゼンマイがくっついている","text":"拡大鏡で見ると、ひげゼンマイの一巻きが、湿気でとなりにくっついていた。これで振れが小さくなり、だんだん遅れて、ついには止まったのだ。\n\nピンセットでそっとはがし、洗浄液で洗う。…時計は、また時を刻みはじめた。\n\n千鶴「ほんの少しのずれでも、時計は正直に遅れるのよ」","do":["flag:repaired"]},{"label":"油が切れている","text":"（油切れなら、急に重くなるはず。だんだん遅れて止まったのとは、少しちがう…）","do":["miss","choice:repair"]}]}},"show":{"ao":{"techou":[{"if":"flag:read1","text":"蒼「すごい字だな。…ばあちゃんのお父さんって、どんな人だったの？」\n\n千鶴「まだ、わからないの。これから読むのよ」"},{"text":"蒼「なにそれ。古い手帳？」"}]},"okuma":{"techou":{"text":"大熊「へえ、年季が入ってるなあ。大事にしなよ」"}},"tachibana":{"techou":{"text":"立花「まあ、これがそうなの。…よかったわね、ほんとに」"}},"nagao":{"techou":{"text":"長尾の目が、手帳に吸いつくように動いた。\n\n長尾「…それだ。渡してもらおう」"}}},"showDefault":"{name}は、不思議そうに見ている。"},"ch2":{"id":"ch2","label":"第二章","title":"夜の隅田川","nbTitle":"蒼のスマホのメモ","assistant":null,"recap":"1月14日の夕方、宮下時計店の作業場で、千鶴は長尾秀樹ともみ合いになり、大時計の真鍮の振り子で長尾を打った。長尾は動かなくなった。17時55分、大学から帰った孫の蒼が、それを見る。","start":{"loc":"workshop","text":"1月14日、午後5時55分。\n\n角のコンビニで肉まんを買って、いつものように店の裏口から入った。","do":["event:find"]},"thinkHint":"（ばあちゃんに、ちゃんと話を聞かないと）","think":[{"if":"!flag:checked","hints":["（落ち着け。まず、倒れている人を…）","（作業場の、倒れた男を「調べる」）"]},{"if":"!flag:ch_jiken || !flag:ch_techou","hints":["（何があったのか、ばあちゃんから聞かないと）","（ばあちゃんに「事件のこと」と「手帳のこと」を聞こう）"]},{"if":"!flag:sent","hints":["（…どうする。決めるのは、おれだ）","（作業場の電話を「調べる」。決めないと）"]},{"if":"!flag:pendulum","hints":["（ばあちゃんがやったって分かるものを、残しちゃいけない）","（床に落ちた振り子を「調べる」）"]},{"if":"!flag:calc","hints":["（このままじゃ、死んだのが5時台だってすぐばれる。…授業でやった、あれだ）","（2階の居間で、教科書とノートを「調べる」。冷え方の計算）"]},{"if":"!has:daisha","hints":["（おれひとりじゃ、人は運べない）","（作業場の裏口に、配達用の台車があったはず。「調べる」）"]},{"if":"!flag:drove","hints":["（あの人の車は、裏の路地にあるはずだ）","（裏の路地へ行って、車を「調べる」）"]},{"if":"!flag:left","hints":["（車を「調べる」。暖房は最強のまま、エンジンはかけたままで）"]},{"if":"!flag:home","hints":["（早く帰らないと。堤防下の道を「調べる」で、帰り道へ）"]},{"if":"!flag:cleaned","hints":["（作業場の床を、きれいにしないと）"]},{"if":"!flag:okuma_d","hints":["（8時だ。町会会館へ行って、片づけを手伝うって言ってある）"]},{"hints":["（会館で、ばあちゃんのそばにいよう。話しかけよう）"]}],"locations":{"workshop":{"name":"作業場","bg":"workshop","people":[{"id":"chizuru","if":"!flag:sent"}],"objs":{"body":"倒れた男","furiko":"振り子","daitokei":"大時計","phone":"作業場の電話","backdoor":"裏口","floor":"床"},"arrive":[{"if":"flag:home && !flag:cleaned","text":"作業場。午後7時5分。ストーブの火だけが、さっきのままだ。"},{"if":"flag:sent && !flag:drove","text":"作業場。男は、まだそこにいる。"},{"text":"作業場。"}]},"shop":{"name":"店","bg":"shop","people":[],"objs":{"clocks":"壁の時計","door":"ガラス戸"},"arrive":"店。シャッターが下りている。三十の時計の音が、やけに大きい。"},"living":{"name":"2階の居間","bg":"living","people":[],"objs":{"textbook":"教科書とノート","window":"窓","butsudan":"仏壇"},"arrive":"2階の居間。ちゃぶ台に、出しっぱなしのレポート。"},"alley":{"name":"裏の路地","bg":"alley","unlock":"flag:sent","people":[],"objs":{"car":"灰色の車","corner":"路地の角"},"arrive":"裏の路地。街灯はひとつきり。灰色のセダンが、塀すれすれに停まっている。"},"riverside":{"name":"隅田川・堤防下の道","bg":"riverside-night","unlock":"flag:drove && !flag:home","people":[],"objs":{"car":"長尾の車","river":"川","path":"帰り道"},"arrive":"隅田川の堤防下の道。人の気配はない。川の向こうに、高速道路の明かりが流れていく。"},"kaikan":{"name":"町会会館","bg":"kaikan","unlock":"flag:cleaned","people":["okuma",{"id":"chizuru","if":"flag:okuma_d"}],"objs":{"tables":"長机","clock":"会館の時計"},"arrive":"町会会館。午後8時。新年会は盛り上がっている。奥の席に、ばあちゃんの背中が見えた。"}},"events":{"find":{"pages":["作業場に、ばあちゃんが立っていた。\n\n右手に、大時計の振り子を握っている。","足もとに、灰色のコートの男が倒れていた。","蒼「…ばあちゃん？」\n\n千鶴は、ゆっくりこちらを向いた。目が、どこも見ていなかった。","蒼は、ばあちゃんの手から、そっと振り子を取った。重かった。指が、冷えきっていた。"],"do":[]},"send":{"pages":["蒼「ばあちゃん。新年会、行って」\n\n千鶴「…何を言ってるの」","蒼「6時半からでしょ。いつもどおり行って、乾杯の音頭とって。8時になったら、おれも片づけに行くから」","千鶴「蒼、だめよ。私がやったことなの。私が――」","蒼「ばあちゃんは、まだ手帳を読み終わってないんだ」","千鶴は、黙った。","蒼「ずっと探してたんだろ。一生かけて。…読み終わるまでは、だめだ」","午後6時15分。千鶴は、よそ行きのコートを着て、ガラス戸から出ていった。一度だけ振り返った。","蒼は、手帳を拾い上げ、2階の仏壇の引き出しにしまった。"],"do":["flag:sent"]},"drive":{"pages":["午後6時35分。台車に男を乗せ、裏口から路地へ出た。思っていたより、ずっと重かった。","助手席に押しこみ、シートベルトを締める。鍵を回すと、エンジンがかかった。","暖房のつまみを、いちばん右まで回す。27℃。送風口から、熱い風が吹き出した。","フロントガラスの上で、ドライブレコーダーの青いランプが点いていた。…前しか映らないはずだ。","手袋をして、ハンドルを握る。免許を取って、まだ半年。路地を出て、隅田川のほうへ。","午後6時47分。堤防下の、人通りのない道に停めた。"],"do":["flag:drove","goto:riverside"]},"walk":{"pages":["エンジンをかけたまま、ドアを閉めた。車の中で、暖房の音だけが続いている。","堤防の上の道を、早足で歩いた。15分。誰ともすれちがわなかった。","午後7時5分。裏口から作業場に戻った。"],"do":["flag:home","goto:workshop"]},"home":{"pages":["午後9時。新年会が終わり、蒼とばあちゃんは並んで会館を出た。","冷たい夜だった。吐く息が白い。","ばあちゃんは、何も聞かなかった。蒼も、何も言わなかった。","店の前まで来たとき、ばあちゃんが小さく言った。\n\n千鶴「蒼、ありがとう」","それだけだった。","店の奥で、大時計が時を刻んでいる。\n\nその音が、ほんのわずかに遅れていることに、まだ誰も気づいていなかった。"],"do":["chapter:ch3"]}},"triggers":[],"talk":{"chizuru":{"topics":{"ima":[{"if":"here:kaikan","text":"千鶴「…蒼。来てくれたのね」\n\nばあちゃんは、いつもの顔で笑った。手だけが、膝の上で固く組まれていた。","do":["event:home"]},{"if":"!flag:ch_jiken","text":"千鶴「蒼…警察を。警察を呼んで」\n\n声が震えていた。"},{"text":"千鶴「蒼、電話を」"}],"jiken":[{"text":"千鶴「長尾という人。久我グループの…父の会社にいた人。手帳を渡せって」\n\n千鶴「断ったら、ストーブに放りこもうとしたの。止めようとして、突き飛ばされて…気がついたら、振り子を」","card":"ばあちゃん：長尾は手帳をストーブに放りこもうとした。止めようとして突き飛ばされ、振り子で打った","do":["flag:ch_jiken"],"if":"!flag:sent && !flag:ch_jiken"},{"text":"千鶴「5時20分に来て…5時45分には、もう…」","if":"!flag:sent"}],"techou":[{"text":"千鶴「手帳は…そこ。床に落ちてる。燃えてはいない」\n\n千鶴「まだ、半分しか読んでないのよ。昭和三十四年のところで、止まってる」","card":"ばあちゃんは、手帳をまだ半分しか読んでいない","do":["flag:ch_techou"],"if":"!flag:sent && !flag:ch_techou"},{"text":"千鶴「父が何をしたのか、まだ分からないの。…分からないまま、私は」","if":"!flag:sent"}],"shinnen":{"text":"千鶴「新年会…6時半から。行くって、町会長さんに言ってある」","if":"!flag:sent"}}},"okuma":{"topics":{"ima":[{"if":"!flag:okuma_d","text":"大熊「おう、蒼くん！ 8時ぴったり。えらいえらい。じゃあ、そっちのビール瓶、裏に運んでくれ」\n\n大熊「千鶴さん？ 6時半から、ずっといるよ。乾杯の音頭もとってくれた。今日はなんだか静かだけどな」","card":"大熊：千鶴は6時半からずっと会館にいる。蒼は8時に片づけに来た","do":["flag:okuma_d"]},{"text":"大熊「助かるよ。若いのがいると、片づけが早い」"}],"machi":{"text":"大熊「今年は30人も来た。千鶴さんが来ると、みんな来るんだよ」"}}}},"look":{"body":[{"if":"!flag:checked","text":"しゃがんで、首に指を当てた。…何もない。手首も。何も。\n\n男の上着のポケットから、車の鍵がのぞいていた。財布には「長尾秀樹」の免許証と、古い名刺。「久我グループ 総務部長」。","do":["flag:checked","give:carkey"]},{"if":"!flag:drove","text":"長尾秀樹。68歳。頭の横に、小さな傷。血は、ほとんど出ていない。"},{"text":"男は、もうここにはいない。"}],"furiko":[{"if":"flag:sent && !flag:pendulum","text":"真鍮の振り子。重りの下の調整ねじのあたりに、血がこびりついていた。\n\n台所の布で、ねじの溝まで丁寧にぬぐう。布が、ねじに一度引っかかった。\n\n大時計のケースに掛け直し、スマホの時計を見ながら針を合わせる。午後6時20分。振り子を軽く押すと、大時計はまた時を刻みはじめた。","do":["flag:pendulum"]},{"if":"flag:pendulum","text":"振り子は、大時計の中で、何ごともなかったように振れている。"},{"text":"床に転がった真鍮の振り子。…いまは、ばあちゃんのそばにいないと。"}],"daitokei":[{"if":"flag:pendulum","text":"大時計。針は、スマホの時計と同じ時刻を指している。"},{"text":"大時計。振り子のない箱が、5時45分のまま止まっている。"}],"phone":[{"if":"flag:ch_jiken && flag:ch_techou && !flag:sent","text":"受話器を取った。1、1、0――最後の数字のところで、指が止まった。","do":["choice:decide"]},{"if":"flag:sent","text":"電話は、受話器を置いたままだ。"},{"text":"作業場の電話。…その前に、何があったのか知らないと。"}],"backdoor":[{"if":"flag:sent && !has:daisha && !flag:drove","text":"裏口に立てかけた、配達用の台車。重い置時計を運ぶためのものだ。","do":["give:daisha"]},{"text":"裏口。その先が、裏の路地だ。"}],"floor":[{"if":"flag:home && !flag:cleaned","text":"床を、雑巾で何度も拭いた。丸椅子を元の場所に戻し、ストーブの火を落とす。\n\n :{}},"ch3":{"id":"ch3","label":"第三章","title":"冷たい車","freshNotebook":true,"nbTitle":"桐生の捜査手帳","recap":"1月15日の朝。隅田川沿いの堤防下の道で、停まった車の運転席から男の遺体が見つかった。警視庁捜査一課の刑事・桐生直也は、墨田署の宇佐美遥と組んで、現場に向かう。――ここから、あなたは桐生として、あの夜をほどいていく。","start":{"loc":"riverside","text":"1月15日、金曜日。午前8時10分。\n\n隅田川の堤防下の道。黄色いテープの向こうに、灰色のセダンが停まっている。窓は白く曇り、内側に霜がついていた。\n\n宇佐美「桐生さん、おはようございます。墨田署の宇佐美です。…寒いですね、今朝は」"},"talk":{"usami":{"topics":{"ima":[{"if":"!flag:est","text":"宇佐美「見つけたのは、7時10分ごろにジョギングしていた人です。エンジンは止まっていて、車の中は冷えきっていたそうです。検視の森さんが来てます」"},{"if":"!flag:ident","text":"宇佐美「まずは、身元ですね。車の中に何か残っていないか、見てみましょう」"},{"if":"!flag:f01","text":"宇佐美「長尾秀樹、68歳。身元は分かりました。住所は錦糸町のマンションです。課長にも報告しておきましょう」"},{"if":"!flag:contra_m1","text":"宇佐美「長尾さんは、亡くなった日の夕方、時雨町の時計店に行く予定だったんですね。…時計店のまわりで、聞きこみをしましょう」"},{"text":"宇佐美「署に戻って、課長と話を合わせましょうか」"}],"hint":[{"if":"!flag:est","hints":["宇佐美「まず、いつ亡くなったのかが知りたいですね」","宇佐美「検視の森さんに『事件のこと』を聞いてみましょう」"]},{"if":"!flag:dashcam","hints":["宇佐美「この車、いつからここに停まっていたんでしょう」","宇佐美「最近の車には、たいていついてるものがありますよね。…前のガラスの上」","宇佐美「車の『ドライブレコーダー』を調べましょう」"]},{"if":"!flag:ident","hints":["宇佐美「この人が誰なのか、まだ分かりません」","宇佐美「車の中を『調べる』と、免許証が見つかるかもしれません」"]},{"if":"!flag:f01","hints":["宇佐美「長尾さんは、昨日どこへ行ったんでしょう」","宇佐美「錦糸町の長尾さんのマンションへ行って、机を調べましょう」"]},{"if":"!flag:chizuru_said","hints":["宇佐美「時計店の人に、話を聞かないと」","宇佐美「宮下時計店へ行って、千鶴さんに『1月14日のこと』を聞きましょう」"]},{"if":"!flag:alibi","hints":["宇佐美「千鶴さん、昨日の夜は新年会だったそうですね。…本当でしょうか」","宇佐美「町会会館の大熊さんに『新年会のこと』を聞きましょう」"]},{"if":"!flag:shout","hints":["宇佐美「時計店の両隣の人は、何か聞いていないでしょうか」","宇佐美「隣の立花豆腐店で、『1月14日のこと』を聞いてみましょう」"]},{"if":"!flag:contra_m1","hints":["宇佐美「千鶴さんの話と、立花さんの話…どこか、合わない気がします」","宇佐美「長尾さんは15分で帰った。でも、5時35分ごろに怒鳴り声がした…」","宇佐美「手帳の証言カードで『矛盾をつく』です。千鶴さんの『15分ほどで帰った』と、立花さんの『怒鳴り声』を、時計店で千鶴さんにつきつけましょう」"]},{"hints":["宇佐美「署に戻って、課長に報告しましょう」"]}],"zatsudan":{"seq":[{"text":"宇佐美「桐生さん、本庁の人なのに、現場によく来るって聞きました」\n\n桐生「足で稼ぐしか、能がないもんでね」"},{"text":"宇佐美「私、時雨町の生まれなんです。宮下時計店、子どものころ、腕時計を直してもらったことがあります」"},{"text":"宇佐美「冬の隅田川って、朝は霧が出るんですよ。今朝もそうでした」"}]}}},"kenshi":{"topics":{"jiken":{"seq":[{"text":"森「8時10分に測った直腸温が25.3℃。車の中はほぼ外気と同じ、0℃くらいまで :photos"]},{"text":"運転席。暖房のつまみは、いちばん右の27℃。燃料計はゼロ。助手席の足もとに、くしゃくしゃのレシート。…鑑識が持っていった。"}],"dashcam":[{"if":"!flag:dashcam","text":"前のガラスの上のドライブレコーダー。鑑識が、その場で記録を見せてくれた。\n\n昨日の18時35分、時雨町の路地から走り出し、18時47分にこの道で停まっている。そのあとは、朝まで同じ景色。\n\n映っているのは前だけだ。運転していた人の姿はない。","card":"ドライブレコーダー：1月14日18時35分に時雨町の路地を出て、18時47分にここで停まった。前しか映らない","cardId":"dashcam","do":["flag:dashcam"]},{"text":"18時47分に停まってから、記録はずっと同じ景色だ。夜中に、画面が少しずつ曇っていく。"}],"window":{"text":"窓の内側に、うっすらと霜。鑑識が、7時45分に測った霜の厚さの記録を見せてくれた。0.21mm。\n\n宇佐美「霜の厚さなんて、何に使うんでしょう」"},"ground":{"text":"車のまわりの地面は、霜で白い。足跡は、見つけた人と警察のものばかりだ。"},"board":[{"if":"flag:est","text":"ホワイトボード：「長尾秀樹（68）　死亡推定 1/14 20:30ごろ　頭部打撲」"},{"text":"ホワイトボード：「長尾秀樹（68）　隅田川堤防下」"}],"desk":[{"if":"!flag:f01","text":"机の上に、黒い手帳。最後に書きこまれた日は――\n\n「14日 17時 宮下時計店（時雨町）」\n\nその下に、強い筆圧で「手帳」と書いて、丸で囲んである。","card":"長尾の手帳：「14日 17時 宮下時計店（時雨町）」。その下に丸で囲んだ「手帳」","cardId":"f01","do":["flag:f01"]},{"text":"長尾の手帳。前のページには、「磯村」「鴎島」「時雨町？」と、いくつもの書きこみがある。"}],"mail":{"text":"郵便受けには、督促状が何通も。久我グループからの、退職の手続きの書類も混じっている。"},"shelf":{"text":"本棚に、久我グループの社史が何冊も。どれにも、付箋がびっしり貼ってある。"},"clocks":[{"if":"flag:chizuru_said","text":"三十の時計。正午が近い。…千鶴は、時計の前に立とうとしない。今日は合わせないのだろうか。"},{"text":"壁を埋める三十の時計。どれも、ほとんどそろって時を刻んでいる。"}],"daitokei":{"text":"店の奥の、背の高い大時計。ケースの中で、真鍮の振り子がゆっくり振れている。"},"workshop":{"text":"店の奥の作業場。きれいに片づいている。石油ストーブが、小さな音を立てている。\n\n千鶴「散らかっておりまして」"},"wall":{"text":"時計店との境の壁。耳を当てると、時計の音がかすかに聞こえる。"},"photo":{"text":"新年会の写真。乾杯の音頭をとる千鶴が、中央に写っている。撮った時刻は、18時41分。"}},"contradictions":[{"id":"m1","pairs":[["chizuru_15m","shout"]],"if":"here:shop","p":"chizuru","text":"千鶴に、2つの証言をつきつけた。\n\n桐生「長尾さんが15分で帰ったなら、5時35分の怒鳴り声は誰のものです？」\n\n千鶴は、しばらく黙っていた。\n\n千鶴「…言い争いに、なりました。古いものを渡せと言われて、お断りしたんです。大きな声を出されて…」\n\n千鶴「でも、5時50分には、お帰りになりました。裏の路地から、車で」","card":"千鶴（言い直し）：長尾と言い争いになった。17時50分に、裏の路地から車で帰った","cardId":"chizuru_1750","breaks":["chizuru_15m"],"do":["toast:千鶴の証言を崩した"],"notYet":"宇佐美「その食い違いは、千鶴さん本人に聞かないと。時計店へ行きましょう」","doneText":"宇佐美「その話は、もう千鶴さんに確かめました」"}],"contradictWrong":"宇佐美「…その2つ、食い違ってますか？ 私には、そうは見えないです」","triggers":[{"if":"flag:contra_m1 && flag:alibi && flag:est && flag:dashcam && !here:police && !flag:ch3_ready","do":["flag:ch3_ready","toast:墨田署で、西課長が待っている"]}],"events":{"close":{"bg":"police","pages":["桐生は、ホワイトボードに書きこんでいった。","桐生「長尾は17時過ぎに宮下時計店に来て、言い争いになった。千鶴さんは、17時50分に帰ったと言っている」","桐生「ドライブレコーダーでは、18時35分に時雨町の路地を出て、18時47分に堤防下で停まった。そして検視では、20時半ごろに死んでいる」","西課長「20時半なら、宮下千鶴は新年会だ。30人が見ている。シロだな」","桐生「ええ。ただ、森さんの話では、あの傷なら打たれた瞬間に意識を失う。長尾は、車で堤防下まで行ってから、2時間近く誰かを待っていて、そこで打たれたことになる」","宇佐美「でも、車のまわりに足跡はありませんでした」","桐生「……」","桐生は、宇佐美の撮った車内の写真を見つめた。暖房のつまみが、いちばん右を指している。","桐生「宇佐美。午後、大学に行く。…変わり者の物理学者に、会わせたい」"],"do":["chapter:ch4"]}},"show":{"kenshi":{"photos":{"text":"森「ああ、車内の写真ね。暖房が最強…。まあ、それで何が変わるってわけでもないだろう」"}},"chizuru":{"photos":{"text":"千鶴は、写真を見て、すぐに目をそらした。\n\n千鶴「…この方です。昨日いらしたのは」"}},"kacho":{"photos":{"text":"西課長「燃料切れで止まった車か。一晩中、暖房をつけっぱなしにしてたんだろう」"}},"okuma":{"photos":{"text":"大熊「ああ、この人だ。暮れに店の前をうろうろしてたのは」"}},"tachibana":{"photos":{"text":"立花「…この人よ。暮れに、千鶴さんのお店を見てた人」"}}},"showDefault":"{name}は、写真を見て首をかしげた。"},"ch4":{"id":"ch4","label":"第四章","title":"物理学者","recap":"長尾秀樹は1月14日、宮下時計店で千鶴と言い争いになった。千鶴は「17時50分に帰った」と言い、20時半ごろの死亡時刻には新年会にいた。ドライブレコーダーでは、車は18時35分に時雨町を出て、18時47分に堤防下で停まっている。桐生は、大学時代の同期で物理学者の白石澪を訪ねる。","start":{"loc":"lab","text":"1月15日、午後2時。城東工業大学、物理学科の研究室。\n\n本と実験器具の山の向こうから、白衣の女性が顔を出した。\n\n白石「桐生くん。卒業以来ね。…刑事が物理学者に会いに来るなんて、だいたい、ろくな話じゃない」"},"talk":{"usami":{"topics":{"ima":[{"if":"!flag:warm","text":"宇佐美「この方が、白石先生…。車の写真を見てもらうんですよね？」"},{"if":"!flag:engine","text":"宇佐美「車は、署の車両保管所に運んであります。白石先生にも見てもらいましょう」"},{"text":"宇佐美「物理って、こんなふうに使えるんですね…」"}],"hint":[{"if":"!flag:warm","hints":["宇佐美「白石先生に、現場の様子を見てもらいましょう」","宇佐美「『見せる』で、現場の写真を白石先生に見せましょう」"]},{"if":"!flag:reikyaku","hints":["宇佐美「温めていたって、どういうことでしょう。…体の冷え方のことかな」","宇佐美「白石先生に『物理のこと』を聞いてみましょう」"]},{"if":"!flag:heater","hints":["宇佐美「車両保管所へ行って、車を調べましょう」","宇佐美「車の暖房を『調べる』です」"]},{"if":"!has:receipt","hints":["宇佐美「燃料は、どれくらい入っていたんでしょう」","宇佐美「車の助手席の足もとに、レシートがありました。『調べる』で見てみましょう」"]},{"if":"!flag:engine","hints":["宇佐美「レシートから、何か分からないでしょうか」","宇佐美「白石先生に、給油のレシートを『見せる』んです」","宇佐美「手帳の『資料』に燃料の計算があります。残り約3Lを、1時間0.95Lで割ると…3時間と、何分でしょう？」"]},{"if":"!flag:frost_plan","hints":["宇佐美「エンジンが止まったあとのことも、確かめたいですね」","宇佐美「車の窓の霜を調べましょう。白石先生が一緒にいるときに」"]},{"if":"!flag:kenshi_ok","hints":["宇佐美「検視の森さんは、この話を聞いたらどう言うでしょう」","宇佐美「墨田署の森さんに『事件のこと』を聞きましょう」"]},{"hints":["宇佐美「研究室に戻って、白石先生と話をまとめましょう」"]}],"zatsudan":{"seq":[{"text":"宇佐美「白石先生と桐生さん、大学の同期なんですよね。…どんな学生だったんですか、桐生さん」\n\n白石「単位を落としかけて、私のノートを写してた」"},{"text":"宇佐美「研究室、暖房がききすぎてません？」\n\n白石「実験のために、一年中20℃なの。温度がずれると、測定がずれる」"}]}}},"shiraishi":{"topics":{"ima":[{"if":"!flag:warm","text":"白石「で、何を見ればいいの？ 写真か何かあるんでしょう」"},{"if":"!flag:engine","text":"白石「車そのものを見せて。写真だけじゃ、分からないことが多すぎる」"},{"if":"!flag:frost_plan","text":"白石「エンジンが止まったあとの車内のことも、知りたい」"},{"text":"白石「材料はそろってきた。研究室で話しましょう」"}],"butsuri":{"seq":[{"text":"白石「体の冷え方はね、まわりとの温度の差で決まる。ニュートンの冷却則。外が0℃なら速く冷えるし、まわりが27℃なら、ほとんど冷えない」\n\n白石「数字にしておく。実際はもっと複雑だけど、目安としてはこれで十分」","do":["doc:reikyaku","flag:reikyaku"]},{"text":"白石「検視の見立ては『ずっと冷えた車内にいた』という前提の計算。前提がちがえば、答えもちがう」"},{"text":"白石「物理はね、正しく測れば嘘をつかない。嘘をつくのは、いつも人間のほう」"}]},"kuruma":[{"if":"flag:engine","text":"白石「エンジンが動いていたのは、18時35分から21時45分ごろ。そのあいだ、車内はずっと27℃。…それが分かれば、冷え方の計算をやり直せる」"},{"text":"白石「暖房が最強で、燃料が切れるまで動いていた車。その意味を、考えてみて」"}],"zatsudan":{"seq":[{"text":"白石「授業？ 一年生に、熱の授業をしてる。身の回りのものは何でも測れる、ってね。…そういえば、熱心な子がいるのよ。冷却則のレポートを、誰よりも丁寧に書いてくる」"},{"text":"白石「桐生くん、まだあの古い腕時計してるの？ 3分遅れてる。直しなさい」"}]}}},"kenshi":{"topics":{"jiken":[{"if":"flag:engine && flag:frost_plan && !flag:kenshi_ok","text":"森「暖房が27℃で3時間以上…。そりゃあ、話が変わる。温められていたなら、そのぶん冷えるのが遅れる。私の見立てより、ずっと前に死んでいたことになる」\n\n森「…わかった。正式な結論は、その物理の先生の実験を待とう」","card":"森：暖房で温められていたなら、死亡は見立て（20時半）よりずっと前になる","cardId":"kenshi_ok","do":["flag:kenshi_ok"]},{"if":"flag:kenshi_ok","text":"森「物理の先生によろしく。私も、測り直すよ」"},{"text":"森「20時半ごろ。私の見立ては変わらんよ。…何か、新しい材料でもあるのか？」"}],"zatsudan":{"text":"森「解剖の結果、頭の傷の形は、丸くて硬いもの。金属かな。車の中に、そんなものはなかった」"}}},"kacho":{"topics":{"ima":[{"if":"flag:engine","text":"西課長「燃料の計算で死亡時刻をひっくり返す？ …面白い。続けろ」"},{"text":"西課長「物理学者ねえ。役に立つのか、それは」"}]}}},"locations":{"lab":{"name":"城東工業大学・白石研究室","bg":"lab","people":["usami","shiraishi"],"objs":{"desk":"白石の机","blackboard":"黒板","thermo":"温度計"},"arrive":"白石の研究室。黒板に、びっしりと式が書かれている。"},"garage":{"name":"墨田署・車両保管所","bg":"garage","unlock":"flag:warm","people":["usami",{"id":"shiraishi","if":"flag:warm"}],"objs":{"heater":"暖房","fuel":"燃料計","floor":"助手席の足もと","window":"窓の霜"},"arrive":"墨田署の車両保管所。長尾の灰色のセダンが、シートの上に置かれている。"},"police":{"name":"墨田署・捜査本部","bg":"police","people":["usami","kacho","kenshi"],"objs":{"board":"ホワイトボード"},"arrive":"墨田署の会議室。検視の森が、解剖の報告書を読んでいる。"}},"look":{"desk":{"text":"白石の机。学生のレポートの束。いちばん上の一枚に、赤ペンで「よくできています」。"},"blackboard":{"text":"黒板の式。T(t) = Tₐ + (T₀ − Tₐ)e^(−kt)。…宇佐美が、そっと目をそらした。"},"thermo":{"text":"壁の温度計。20.0℃。研究室は、一年中この温度に保たれているらしい。"},"heater":[{"if":"!flag:heater","text":"暖房のつまみは、いちばん右。27℃の最強。風量も最大。\n\n白石「真冬の夜に、ひとりで車にいて、ここまで上げる？ 汗だくになる温度よ」\n\n白石「誰かが、この車の中を、わざと温めた」","card":"車の暖房は27℃の最強、風量も最大。白石「誰かが、わざと車の中を温めた」","cardId":"heater","do":["flag:heater"]},{"text":"暖房のつまみ。いちばん右のままだ。"}],"fuel":{"text":"燃料計はゼロ。タンクは空っぽだ。エンジンは燃料切れで止まった。"},"floor":[{"if":"!has:receipt","text":"助手席の足もとに、くしゃくしゃのレシート。鑑識が袋に入れて残しておいてくれた。\n\n「1/14 15:40　錦糸町　レギュラー　1,000円」","do":["give:receipt"]},{"text":"助手席の足もと。もう何もない。…いや、シートの下に、小さな布の繊維が落ちている。鑑識が拾っていった。"}],"window":[{"if":"flag:engine && !flag:frost_plan","text":"窓の内側の霜。鑑識の記録では、今朝7時45分に0.21mm。\n\n白石「霜は、エンジンが止まって車内が冷えてから、少しずつ育つ。厚さを測れば、いつ止まったか分かる。…同じ車種で、再現実験をしましょう。二日ちょうだい」","card":"白石：霜の厚さ（7時45分に0.21mm）で、エンジンが止まった時刻を確かめる。同じ車種で再現実験をする","cardId":"frost","do":["flag:frost_plan"]},{"if":"flag:frost_plan","text":"霜は、もう溶けかけている。記録が残っていてよかった。"},{"text":"窓の霜。…何かの手がかりになるのだろうか。"}],"board":[{"if":"flag:engine","text":"ホワイトボード：「エンジン 18:35〜21:45ごろ　車内27℃」と、桐生が書き足した。"},{"text":"ホワイトボード：「死亡推定 1/14 20:30ごろ」"}]},"show":{"shiraishi":{"photos":[{"if":"!flag:warm","text":"白石は、写真を一枚ずつ机に並べた。燃料計のゼロ。暖房のつまみ。窓の霜。\n\n白石「…桐生くん。この車は、3時間ずっと誰かを温めていた」\n\n白石「死んだ人を、ね」","card":"白石：「この車は、3時間ずっと誰かを温めていた」","cardId":"warm","do":["flag:warm"]},{"text":"白石「写真はもういい。車そのものを見たい」"}],"receipt":[{"if":"!flag:engine","text":"白石「1,000円分。…この人、お金に困ってたのね。1,000円で入るのは6Lくらい。錦糸町から時雨町まで回り道して走って、3Lは使ってる」\n\n白石「アイドリングと暖房の最強で、1時間に0.95Lくらい。…さあ、エンジンは何時間動いていたでしょう」","do":["doc:nenryou","puzzle:fuel"]},{"text":"白石「エンジンは、3時間10分ほど動いていた。18時35分に走り出してからね」"}]},"kenshi":{"receipt":{"text":"森「給油のレシートか。燃料のことは、私の専門外だ」"}},"usami":{"receipt":{"text":"宇佐美「1,000円だけ…。長尾さん、本当にお金がなかったんですね」"}},"kacho":{"photos":{"text":"西課長「暖房最強ねえ。寒がりだったんだろう」"}}},"showDefault":"{name}は、首をかしげた。","puzzles":{"fuel":{"label":"エンジンが動いていた時間は？","prompt":"時雨町に着いたとき、燃料は残り約3L。アイドリング＋暖房で1時間に約0.95L。\nエンジンが動いていたのは何時間何分くらい？（4ケタ。例：2時間30分→0230）","display":"［ {code} ］","length":4,"answer":"0310","answers":["0305","0315"],"success":{"text":"白石「そう。3L ÷ 0.95L ＝ 約3.2時間、3時間10分くらい。18時35分に走り出したなら、エンジンが止まったのは21時45分ごろ」\n\n白石「つまりこの車は、21時45分まで、ずっと27℃だった」","card":"燃料の計算：エンジンは約3時間10分動いた。18時35分から21時45分ごろまで、車内は27℃","cardId":"engine","do":["flag:engine"]},"fail":"白石「{code}？ もう一度。3L を 0.95L で割って、時間と分に直すの。手帳の『資料』を見て」","cancel":"白石「ゆっくり考えて。資料は手帳に入れてある」"}},"contradictions":[],"triggers":[{"if":"flag:engine && flag:frost_plan && flag:kenshi_ok && flag:heater && !here:lab && !flag:ch4_ready","do":["flag:ch4_ready","toast:白石が研究室で待っている"]},{"if":"flag:engine && flag:frost_plan && flag:kenshi_ok && flag:heater && here:lab && !flag:ch4_done","do":["flag:ch4_done","event:close"]}],"events":{"close":{"bg":"lab","pages":["白石は、黒板の式を消して、時刻だけを書いた。","白石「18時35分、車が動き出す。21時45分、燃料が切れてエンジンが止まる。そのあいだ、車内は27℃」","白石「温められていたなら、体は冷えにくい。検視の20時半は、ずれている。もっと前よ。…たぶん、ずっと前」","桐生「長尾が最後に生きていたと分かっているのは、17時35分の怒鳴り声だ」","白石「その店には、何がある？」","宇佐美「時計です。三十台も」","白石は、少しだけ笑った。","白石「時計は、正直よ。止まったら止まったなりに、ずれたらずれたなりに、ちゃんと記録を残す」\n\n白石「…連れていって。その店へ」"],"do":["chapter:ch5"]}}},"ch5":{"id":"ch5","label":"第五章","title":"時計の街","recap":"白石の見立てでは、長尾の車は18時35分から21時45分ごろまで、暖房27℃で温められていた。検視の「20時半」はずれていて、死亡はもっと前らしい。長尾が最後に生きていたと分かっているのは、17時35分、宮下時計店での怒鳴り声。桐生は、白石と宇佐美を連れて、もう一度時計店へ向かう。","start":{"loc":"shop","text":"1月15日、午後5時40分。宮下時計店。\n\n白石は店に入るなり、足を止めた。三十の時計の音に、耳をすませている。\n\n白石「…ひとつ、ずれてる」"},"talk":{"usami":{"topics":{"ima":[{"if":"!flag:lag","text":"宇佐美「ずれてるって…私には、全部同じに聞こえます」"},{"if":"!flag:noon","text":"宇佐美「時計のこと、千鶴さんにも聞いてみましょうか」"},{"if":"!flag:contra_m2","text":"宇佐美「蒼くん…でしたっけ。昨日の夕方、どこにいたんでしょう」"},{"text":"宇佐美「白石先生、楽しそうですね。…不謹慎ですけど」"}],"hint":[{"if":"!flag:clocks","hints":["宇佐美「白石先生は、何がずれてると言ったんでしょう」","宇佐美「店の壁の時計を『調べる』です」"]},{"if":"!flag:lag","hints":["宇佐美「壁の時計は全部合ってた…。じゃあ、ずれてるのは？」","宇佐美「作業場へ行って、大時計を『調べる』です」"]},{"if":"!flag:noon","hints":["宇佐美「時計を合わせるのは、毎日なんですよね…？」","宇佐美「千鶴さんに『時計のこと』を聞きましょう」"]},{"if":"!flag:temp","hints":["宇佐美「振り子って、温度で長さが変わるって聞いたことがあります」","宇佐美「作業場の温度計を『調べる』です」"]},{"if":"!flag:measure","hints":["宇佐美「白石先生は、何を確かめたいんでしょう」","宇佐美「白石先生に『時計のこと』を聞いてみましょう」"]},{"if":"!flag:ao_19","hints":["宇佐美「蒼くんの話も聞いておきたいです」","宇佐美「蒼くんに『1月14日のこと』を聞きましょう」"]},{"if":"!flag:komatsu","hints":["宇佐美「蒼くんが帰ってきたところを、誰か見ていないでしょうか。…通りの角は、夜でも明るいですよね」","宇佐美「角のコンビニの小松さんに『1月14日のこと』を聞きましょう」"]},{"if":"!flag:contra_m2","hints":["宇佐美「蒼くんの話と、小松さんの話…合わないですよね」","宇佐美「証言カードで『矛盾をつく』です。蒼くんの『19時ごろ大学から帰った』と、小松さんの『17時55分』を、時計店で蒼くんにつきつけましょう」"]},{"hints":["宇佐美「店で、白石先生と話をまとめましょう」"]}],"zatsudan":{"seq":[{"text":"宇佐美「小さいころ、このお店で腕時計を直してもらったって言いましたよね。千鶴さん、覚えてないと思いますけど」"},{"text":"宇佐美「…千鶴さんが犯人だったら、嫌だな」\n\n桐生「刑事は、そう思ったところから始めるんだ」"}]}}},"shiraishi":{"topics":{"tokei":[{"if":"flag:lag && flag:noon && flag:temp && !flag:measure","text":"白石「正午に合わせていないなら、遅れは昨日の正午から積もった分のはず。でも、ほかの29台は合ってる。温度でもない」\n\n白石は、大時計のケースをのぞきこんだ。\n\n白石「振り子の重りが、印より少し下にある。…誰かが、振り子に触ったのね」\n\n白石「千鶴さん、一晩、この時計を測らせてください。どれだけの速さで遅れていくのか」\n\n千鶴は、しばらく黙ってから、うなずいた。","card":"白石：大時計の振り子の重りが、印より少し下にずれている。誰かが振り子に触った。一晩、遅れの速さを測る","cardId":"weight","do":["flag:measure"]},{"if":"flag:measure","text":"白石「測定は、私に任せて。明日の朝には、遅れの速さが分かる」"},{"if":"flag:lag","text":"白石「17.1秒。…この時計だけが、なぜ遅れているのか。ほかの時計と、何がちがうのか」"},{"text":"白石「三十台、ちゃんと聞いてみて。音でも、目でも」"}],"butsuri":{"seq":[{"text":"白石「振り子時計は、振り子の長さで速さが決まる。長くなれば、ゆっくり振れる。だから遅れる」"},{"text":"白石「長さ1mの振り子なら、0.4mm長くなるだけで、1日に17秒くらい遅れる。…ほんの少しのずれでも、時計は正直に遅れる」"}]},"ao":[{"if":"flag:ao_home","text":"白石「宮下蒼くん。私の『熱と冷却』の授業を取ってる。…冷却則のレポートを、誰よりも丁寧に書いてくる子よ」\n\n白石は、それ以上何も言わなかった。","card":"白石：蒼は白石の「熱と冷却」の授業を取っている","cardId":"ao_student"},{"text":"白石「お孫さんがいるのね。…会ってみたい」"}]}},"chizuru":{"topics":{"tokei":{"seq":[{"text":"千鶴「毎日お昼に、ラジオの時報に合わせております。四十年、一日も欠かしたことは…」\n\n千鶴は、言葉を切った。\n\n千鶴「…今日だけは、合わせておりません。刑事さんがいらして、気が動転してしまって」","card":"千鶴：毎日正午に30台を時報に合わせる。今日（1月15日）だけは合わせていない","cardId":"noon","do":["flag:noon"]},{"text":"千鶴「昨日のお昼には、たしかに全部合わせました。大時計も」"}]},"kinou":{"text":"千鶴「申し上げたとおりです。長尾さんは5時50分にお帰りになって、私は6時15分ごろ、新年会に出かけました」"},"ao":[{"if":"flag:contra_m2","text":"千鶴「蒼は…あの子は、何も悪くありません」\n\n千鶴の声が、はじめて震えた。"},{"text":"千鶴「孫は、6時ごろ帰ると言っておりました。…いえ、昨日は何時だったかしら」"}],"nagao":{"text":"千鶴「長尾さんのことは、もう全部お話ししました」"}}},"ao":{"topics":{"kinou":[{"if":"!flag:ao_19","text":"蒼「昨日ですか。実験が長引いて、大学から帰ったのは7時ごろです。ばあちゃんはもう新年会に出てて。それから8時に、会館の片づけを手伝いに行きました」","card":"蒼：1月14日は19時ごろ大学から帰った。祖母はもう新年会に出ていた","cardId":"ao_19","do":["flag:ao_19"]},{"if":"flag:contra_m2","text":"蒼「…5時55分に帰りました。それだけです」"},{"text":"蒼「7時ごろです。…何度聞かれても」"}],"butsuri":{"text":"蒼「白石先生の授業は…はい。おもしろいです」\n\n蒼は、白石の顔を見ようとしなかった。"},"nagao":{"text":"蒼「知りません。会ったことも、ない人です」"},"techou":{"text":"蒼「手帳？ …なんのことですか」\n\n一瞬、蒼の目が、店の奥の階段のほうへ動いた。"}}},"komatsu":{"topics":{"kinou":{"seq":[{"text":"小松「蒼くん？ 昨日の夕方、来ましたよ。肉まんを2つ。レジの時計で5時55分くらい。そのまま、時計屋さんの裏口のほうへ入っていきました。毎日そうなんで」","card":"小松：1月14日の17時55分ごろ、蒼が肉まんを買い、時計店の裏口へ入っていった","cardId":"komatsu","do":["flag:komatsu"]},{"text":"小松「そのあとは…7時ごろに一度、裏の路地のほうから歩いてきたような。暗かったんで、自信ないです」"}]},"machi":{"text":"小松「この辺、夜は静かですよ。車もめったに通らないし」"}}}},"locations":{"shop":{"name":"宮下時計店","bg":"shop","people":["usami","shiraishi","chizuru",{"id":"ao","if":"flag:ao_home"}],"objs":{"clocks":"壁の時計","door":"ガラス戸"},"arrive":[{"if":"flag:ao_home","text":"宮下時計店。帳場の横に、蒼が立っている。"},{"text":"宮下時計店。三十の時計の音。"}]},"workshop":{"name":"作業場","bg":"workshop","people":["usami","shiraishi"],"objs":{"daitokei":"大時計","thermo":"温度計","stove":"ストーブ","bench":"作業台"},"arrive":"店の奥の作業場。きれいに片づいている。…片づきすぎている、と桐生は思った。"},"conbini":{"name":"角のコンビニ","bg":"conbini","unlock":"flag:ao_19","people":["usami","komatsu"],"objs":{"register":"レジ","window":"窓"},"arrive":"通りの角のコンビニ。窓から、時計店の看板が見える。"},"alley":{"name":"裏の路地","bg":"alley","people":["usami"],"objs":{"wall":"塀","ground":"地面"},"arrive":"時計店の裏の路地。車一台がやっと通れる幅だ。"}},"look":{"clocks":[{"if":"!flag:clocks","text":"白石が、スマホの時報と見くらべながら、一台ずつ確かめていく。\n\n白石「…29台は、ずれても0.5秒以内。昨日のお昼に合わせたなら、これくらいね。さすが」\n\n白石「残りの一台は、ここにはない」","do":["flag:clocks"]},{"text":"壁の29台。どれも、ほぼ正確だ。"}],"door":{"text":"ガラス戸の向こう。もう暗い。角のコンビニの明かりが見える。"},"daitokei":[{"if":"flag:clocks && !flag:lag","text":"作業場の大時計。白石がストップウォッチを押す。\n\n白石「17.1秒、遅れてる。この一台だけ」","card":"大時計だけが17.1秒遅れている（1月15日17時45分）。ほかの29台はほぼ正確","cardId":"lag","do":["flag:lag","event:ao_home"]},{"if":"flag:lag","text":"大時計。真鍮の振り子が、ほかの時計より、ほんのわずかにゆっくり振れている…ように見える。"},{"text":"大時計。ケースの中で、真鍮の振り子が振れている。"}],"thermo":[{"if":"!flag:temp","text":"壁の温度計。記録式で、一年分の紙が巻いてある。\n\n千鶴「時計のために、一年中20℃にしております」\n\n白石が記録を指でたどる。「昨日も、20℃からほとんど動いてない」","card":"作業場の温度計の記録：一年中20℃。1月14日も変わらない","cardId":"temp","do":["flag:temp"]},{"text":"温度計。20.0℃。"}],"stove":{"text":"石油ストーブ。中をのぞくと、灰の中に、焦げた布の切れ端がひとつ。…気のせいかもしれない。"},"bench":{"text":"作業台。道具が、定規で測ったようにきっちり並んでいる。"},"register":{"text":"レジの時計。正確だ。防犯カメラは、店内しか映していない。"},"window":{"text":"窓から見える時計店の看板。裏口のほうは、角度があって見えない。"},"wall":{"text":"路地の塀に、真新しいこすれた跡。車の色と同じ、灰色の塗料がついている。"},"ground":{"text":"路地の地面に、細い二本の轍のような跡。台車か何かの車輪だろうか。"}},"events":{"ao_home":{"pages":["裏口の戸が開く音がした。","若い男が、作業場をのぞきこんで、立ち止まった。","蒼「…ばあちゃん、この人たち、誰」","千鶴「蒼。刑事さんよ。昨日、うちに来たお客さんのことで」","白石が、ゆっくり振り返った。\n\n白石「宮下くん」\n\n蒼の顔から、血の気が引いた。\n\n蒼「…白石、先生」"],"do":["flag:ao_home","goto:shop"]},"close":{"bg":"shop","pages":["店を出ると、冷たい風が吹いていた。","宇佐美「蒼くんは、17時55分に帰ってた。千鶴さんは、長尾は17時50分に帰ったと言ってる。…5分ちがいで、すれちがったってことですか」","桐生「そういうことになっている」","白石「大時計の振り子に、誰かが触った。いつ触ったかは、明日の朝の測定で分かる」","桐生は、店の看板を見上げた。宮下時計店。\n\n桐生「千鶴さんは、なぜ長尾を店に入れたんだろう。初めて会った男を、閉店後に」","桐生「長尾が何を欲しがっていたのか。…それを知っている人間に、心当たりがある」"],"do":["chapter:ch6"]}},"contradictions":[{"id":"m2","pairs":[["ao_19","komatsu"]],"if":"here:shop && flag:ao_home","p":"ao","text":"蒼に、2つの証言をつきつけた。\n\n桐生「7時に帰ったなら、5時55分に裏口から入っていったのは誰だ」\n\n蒼は、しばらく唇をかんでいた。\n\n蒼「…忘れてました。5時55分です。肉まん買って、いつもどおり裏口から」\n\n蒼「でも、そのときにはもう、ばあちゃんひとりでした。長尾って人は、いなかった」","card":"蒼（言い直し）：17時55分に帰った。そのとき長尾はもういなかった","cardId":"ao_1755","breaks":["ao_19"],"do":["toast:蒼の証言を崩した"],"notYet":"宇佐美「蒼くん本人に聞きましょう。時計店にいるはずです」","doneText":"宇佐美「蒼くんのことは、もう確かめました」"}],"contradictWrong":"宇佐美「…その2つ、食い違ってますか？」","triggers":[{"if":"flag:contra_m2 && flag:measure && !here:shop && !flag:ch5_ready","do":["flag:ch5_ready","toast:店で、白石が待っている"]},{"if":"flag:contra_m2 && flag:measure && here:shop && !flag:ch5_done","do":["flag:ch5_done","event:close"]}],"show":{"chizuru":{"receipt":{"text":"千鶴「…存じません」"}},"ao":{"photos":{"text":"蒼は、写真から目をそらした。\n\n蒼「…知らない車です」"}}},"showDefault":"{name}は、黙って首を振った。"},"ch6":{"id":"ch6","label":"第六章","title":"三島陽","recap":"宮下時計店の大時計だけが、17.1秒遅れていた。振り子の重りが印より下にずれていて、誰かが振り子に触ったらしい。孫の蒼は「19時に帰った」とうそをついていたが、本当は17時55分に帰っていた。長尾は、なぜ千鶴を訪ねたのか。桐生は、長尾の手帳にあった「手帳」という書きこみの意味を探る。","start":{"loc":"cafe","text":"1月16日、土曜日。午前10時。錦糸町の喫茶店「振子」。\n\n奥の席で、ひょろりとした男が手を挙げた。\n\n三島「桐生さん、ですね。三島陽です。フリーの記者をやってます。…長尾さんのことなら、たぶん、私がいちばん詳しい」"},"talk":{"usami":{"topics":{"ima":[{"if":"!flag:history","text":"宇佐美「三島さんは、去年の鴎島の事件にも居合わせた記者さんだそうです」"},{"if":"!flag:iso_num","text":"宇佐美「手帳を持ち出した人がいるなら、その人に話を聞きたいですね」"},{"text":"宇佐美「千鶴さんが、久我家の…。思ってもみませんでした」"}],"hint":[{"if":"!flag:history","hints":["宇佐美「長尾さんの手帳の『手帳』って、何のことでしょう」","宇佐美「三島さんに『手帳のこと』を聞きましょう」"]},{"if":"!flag:sell","hints":["宇佐美「長尾さんは、手帳をどうしたかったんでしょう」","宇佐美「三島さんに『長尾のこと』を聞きましょう」"]},{"if":"!flag:daughter","hints":["宇佐美「手帳を書いた人には、家族がいたんでしょうか」","宇佐美「三島さんに『久我家のこと』を聞きましょう」"]},{"if":"!flag:iso_num","hints":["宇佐美「手帳を持ち出した磯村さんに、連絡がとれないでしょうか」","宇佐美「三島さんなら、磯村さんの連絡先を知っているかもしれません。三島さんに『昔のこと』を聞いてみましょう」"]},{"if":"!flag:returned","hints":["宇佐美「磯村さんに、電話してみましょう」","宇佐美「墨田署へ行って、電話の磯村さんに『手帳のこと』を聞きましょう」"]},{"if":"!flag:read","hints":["宇佐美「千鶴さんは、手帳を読んだんでしょうか」","宇佐美「千鶴さんと親しい人…町会長の大熊さんに『手帳のこと』を聞きましょう」"]},{"hints":["宇佐美「墨田署で、話をまとめましょう」"]}],"zatsudan":{"seq":[{"text":"宇佐美「この喫茶店、『振子』っていうんですね。…偶然でしょうか」\n\n三島「偶然ですよ。コーヒーがうまいから選んだだけです」"},{"text":"宇佐美「三島さんのおじいさんも、記者だったんですか」"}]}}},"mishima":{"topics":{"techou":{"seq":[{"text":"三島「鳶色の手帳。久我グループを興した久我誠一郎――本当の名前は、佐伯修という男が、引き揚げ船の中から書きつづけたものです」\n\n三島「去年の夏、鴎島の久我館の金庫から見つかりました。そして、執事の磯村さんが持ち去った」","card":"三島：鳶色の手帳は、久我誠一郎（本名・佐伯修）が書きつづけたもの。去年の夏、鴎島の久我館で見つかり、執事の磯村が持ち去った","cardId":"history","do":["flag:history"]},{"text":"三島「手帳には、黒田家が隠したかったことが書いてある。創業者が、本物の久我ではなかったこと。それから…」\n\n三島「それ以上は、私にもわかりません。中身を読んだことはないので」"}]},"nagao":[{"if":"flag:history","text":"三島「長尾さんから、去年の暮れに電話がありました。『手帳を買わないか。記者なら、高く売れるだろう』って」\n\n三島「断りました。…あの人は、黒田家にも売りつけるつもりだったと思います。処分しろなんて、誰にも言われてない。金になると思ったんです」","card":"三島：長尾は手帳を記者や黒田家に売りつけるつもりだった。「処分しろ」と命じた者はいないはず","cardId":"sell","do":["flag:sell"]},{"text":"三島「長尾さんのことを話すには、先に手帳の話をしないと」"}],"kuga":[{"if":"flag:history","text":"三島「久我誠一郎には、娘がひとりいました。千鶴さん。社長が昭和35年に亡くなったあと、奥さんは千鶴さんを連れて旧姓に戻った」\n\n三島「旧姓は――宮下です」","card":"三島：久我誠一郎の娘・千鶴は、父の死後、母の旧姓「宮下」を名乗った","cardId":"daughter","do":["flag:daughter"]},{"text":"三島「久我家の話は、手帳の話からしたほうが早い」"}],"mukashi":{"seq":[{"text":"三島「祖父の透も、記者でした。汐見日報。昭和34年、品川で起きたある殺人事件を、ずっと追っていた」\n\n三島「事件は、犯人不明のまま打ち切られました。祖父は、最後まで記事を書かせてもらえなかった」\n\n三島「磯村さんの連絡先なら、知ってますよ。鴎島で教えてもらいました。いまは汐見の下宿にいるそうです」","do":["flag:iso_num"]},{"text":"三島「祖父の取材メモに、こうあります。『手帳が見つかったら、あの子に届けてくれ』。…ある刑事に、そう頼まれたそうです」"}]},"zatsudan":{"text":"三島「ここのブレンド、酸味が強いでしょう。祖父の好みだったんです」"}}},"isomura":{"topics":{"techou":{"seq":[{"text":"磯村「…はい。12月20日に、宮下千鶴様にお返しいたしました。あの手帳は、もともと、お嬢様のものです」\n\n磯村「ただ、最後のページだけが、ございませんでした。私が金庫からお預かりしたときには、もう破り取られておりました」","card":"磯村（電話）：12月20日、手帳を千鶴に返した。最後のページは破り取られていた","cardId":"returned","do":["flag:returned"]},{"text":"磯村「千鶴様は、手帳を胸に抱いて、しばらく動かれませんでした。…六十年以上、探しておられたのです」"}]},"nagao":{"text":"磯村「長尾が…。あの男は、屋敷を出た私を、ずっとつけておりました。私の不注意です。千鶴様に、ご迷惑を」\n\n磯村の声が、かすれた。"},"kuga":{"text":"磯村「黒田家は、手帳のことを知らぬふりをするでしょう。長尾に何かを命じたなどと、認めるはずもございません」"}}},"okuma":{"topics":{"techou":[{"text":"大熊「手帳？ …ああ、そういえば、新年会の前の週だったかな。千鶴さんが、うれしそうに言ってたよ」\n\n大熊「『あと少しで、父の手帳を読み終わるの』って。あんな顔の千鶴さん、初めて見た」","card":"大熊：新年会の前の週、千鶴は「あと少しで、父の手帳を読み終わる」とうれしそうに話していた","cardId":"read","do":["flag:read"]}],"shinnen":{"text":"大熊「新年会の千鶴さん？ そういや、乾杯のあとはずっと黙ってたな。手を、膝の上でぎゅっと握ってた」"},"ao":{"text":"大熊「蒼くんは、いい子だよ。両親を早くに亡くして、 :{"photos":{"text":"三島「…長尾さんだ。鴎島の事件のあと、一度だけ会ったことがあります」"}},"okuma":{"photos":{"text":"大熊「暮れに店の前をうろうろしてた男だ」"}}},"showDefault":"{name}は、首をかしげた。"},"ch7":{"id":"ch7","label":"第七章","title":"検証","recap":"宮下千鶴は久我誠一郎の娘で、12月20日に磯村から父の手帳を受け取っていた。長尾は手帳を売るために奪いに来て、言い争いになった。千鶴は「あと少しで読み終わる」と話していた。白石から、霜の実験と振り子の測定が終わったと連絡が入る。","start":{"loc":"lab","text":"1月17日、日曜日。午前10時。白石研究室。\n\n机の上に、三枚の紙が並んでいる。白石は、徹夜明けの顔で、コーヒーを二つ差し出した。\n\n白石「三つ、確かめる。霜、冷え方、振り子。順番にね」"},"talk":{"usami":{"topics":{"ima":[{"if":"!flag:v1","text":"宇佐美「霜の実験から、ですね」"},{"if":"!flag:v3","text":"宇佐美「計算、私も手伝います。…たぶん」"},{"text":"宇佐美「蒼くん、本当に…」"}],"hint":[{"if":"!flag:v1","hints":["宇佐美「まず、霜の実験の結果を聞きましょう」","宇佐美「白石先生に『車のこと』を聞きましょう」","宇佐美「資料『霜の再現実験』で、0.21mmは何時間後ですか？ 7時45分から、その時間だけさかのぼると…」"]},{"if":"!flag:v2","hints":["宇佐美「エンジンが止まった時刻が分かりました。次は、体の冷え方ですね」","宇佐美「白石先生に『事件のこと』を聞きましょう」","宇佐美「資料『遺体の冷え方』です。下がった11.7℃のうち、18:35〜21:45の暖かい車内で何℃、21:45〜8:10の冷えた車内で何℃。残りが、お店の中で下がった分です」","宇佐美「暖かい車内が3時間10分で0.95℃、冷えた車内が10時間25分で10.42℃。残り0.33℃を、1時間0.4℃で割ると約50分。18時35分の50分前は…」"]},{"if":"!flag:v3","hints":["宇佐美「最後は振り子です」","宇佐美「白石先生に『時計のこと』を聞きましょう」","宇佐美「資料『大時計の振り子』です。17.1秒を、1時間0.73秒で割ると、何時間前に掛け直されたか分かります」","宇佐美「17.1 ÷ 0.73 ＝ 約23.4時間。23時間25分です。1月15日の17時45分から、23時間25分さかのぼると…」"]},{"if":"!flag:ao_cant","hints":["宇佐美「蒼くんが来ました。話を聞きましょう」","宇佐美「蒼くんに『物理のこと』を聞いてみましょう」"]},{"if":"!flag:report","hints":["宇佐美「蒼くんのこと、白石先生はよく知ってますよね」","宇佐美「白石先生に『蒼のこと』を聞きましょう」"]},{"if":"!flag:contra_m3","hints":["宇佐美「蒼くんの話と、白石先生の話…」","宇佐美「証言カードで『矛盾をつく』です。蒼くんの『冷却の計算なんて、できません』と、白石先生の『一番よく書いた学生』を、蒼くんにつきつけましょう」"]},{"hints":["宇佐美「…蒼くんの実験ノートを、白石先生に見せましょう」"]}],"zatsudan":{"text":"宇佐美「研究室、日曜日なのに学生さんがいますね」\n\n白石「物理学者に日曜日はないの」"}}},"shiraishi":{"topics":{"kuruma":[{"if":"!flag:v1","text":"白石「同じ車種を借りて、外気0℃の部屋で、エンジンを止めてから窓の内側の霜を測った。長尾の車の霜は、7時45分に0.21mm。表は手帳に入れておく」\n\n白石「エンジンが止まったのは、何時何分？」","do":["doc:shimo","puzzle:v1"]},{"text":"白石「霜は、21時45分の答えを裏づけた。燃料の計算とも合う」"}],"jiken":[{"if":"flag:v1 && !flag:v2","text":"白石「死亡時刻を計算し直す。体の冷え方の表と、時刻はそろってる。18時35分から21時45分は暖かい車内、21時45分から8時10分は冷えた車内。その前は、どこにいた？」\n\n白石「死亡は がった体温は 37.0 − 25.3 ＝ 11.7℃。\n暖かい車内（18:35〜21:45）、冷えた車内（21:45〜8:10）で下がった分を引くと、残りは店の中で下がった分。\n死亡は何時何分ごろ？（4ケタ、5分単位）","display":"［ {code} ］","length":4,"answer":"1745","answers":["1740","1750"],"success":{"text":"白石「暖かい車内の3時間10分で0.95℃、冷えた車内の10時間25分で10.42℃。合わせて11.37℃。残りの0.33℃が、20℃の部屋で下がった分。0.33 ÷ 0.4 ＝ 約50分」\n\n白石「18時35分の50分前。死亡は17時45分ごろ。…場所は、一年中20℃に保たれた部屋」\n\n宇佐美「時計店の、作業場…」","card":"冷え方の計算：死亡は1月14日17時45分ごろ。車が動く前の約50分は、20℃の部屋にいた","cardId":"death","do":["flag:v2"]},"fail":"白石「{code}？ 惜しいかどうかも、資料を見ながら確かめて。車の中で下がった分を全部引いて、残りを1時間0.4℃で割るの」","cancel":"白石「計算は、紙に書くと分かりやすいわよ」"},"v3":{"label":"振り子が掛け直されたのは？","prompt":"1月15日17時45分に17.1秒遅れ。遅れる速さは1時間に0.73秒。\n振り子が掛け直され、時刻を合わせ直されたのは何時何分ごろ？（4ケタ、5分単位）","display":"［ {code} ］","length":4,"answer":"1820","answers":["1815","1825"],"success":{"text":"白石「17.1 ÷ 0.73 ＝ 約23.4時間。23時間25分前。1月14日の18時20分ごろ」\n\n白石「誰かが、そのとき振り子を外したまま止まっていた大時計に、振り子を掛け直した。重りの調整ねじを、知らずに少し回してしまってね。そして、スマホか何かで時刻を合わせた」\n\n桐生「千鶴さんは、18時15分ごろに新年会へ出かけた。…18時20分に店にいたのは」\n\n白石は、何も言わなかった。","card":"振り子の測定：大時計の振り子は1月14日18時20分ごろに掛け直された。千鶴はその前に店を出ている","cardId":"rehang","do":["flag:v3","event:ao"]},"fail":"白石「{code}？ 17.1を0.73で割って、時間と分に直す。それを15日の17時45分からさかのぼるの」","cancel":"白石「最後のひとつよ」"}},"events":{"ao":{"pages":["白石は、スマホを取り出して、短いメッセージを打った。","二十分後。研究室の扉が、ノックされた。","蒼「白石先生。…レポートのことで呼ばれたんですけど」","蒼は、桐生と宇佐美を見て、足を止めた。"],"do":["flag:ao_here"]},"close":{"bg":"lab","pages":["白石は、蒼の実験ノートを、ゆっくりめくった。","レポートの欄外。消しかけた鉛筆の字。\n\n「室温27℃→1時間0.3℃くらい。3時間温めれば、2時間以上遅く見える」\n\n「6時半〜9時。新年会」","白石「…よくできてる。式の使い方は、正しい」","白石「ひとつだけ、見落としてる。燃料よ。車は、朝までは温めてくれなかった。それと、振り子の重り」","蒼は、何も言わなかった。膝の上で、手が震えていた。","桐生「宮下蒼くん。明日、時計店で、おばあさんと一緒に話を聞かせてほしい」","蒼「…ばあちゃんは、関係ない」","桐生は、それには答えなかった。"],"do":["chapter:ch8"]}},"contradictions":[{"id":"m3","pairs":[["ao_cant","report"]],"if":"flag:ao_here","p":"ao","text":"蒼に、2つの証言をつきつけた。\n\n桐生「冷却の計算ができない学生が、冷却則のレポートを一番よく書けるのか」\n\n蒼は、長いあいだ黙っていた。\n\nやがて、かばんから一冊のノートを出して、机に置いた。\n\n蒼「…実験ノートです。レポートの下書きも、ここに」","card":"蒼が実験ノートを差し出した","cardId":"jikken_card","breaks":["ao_cant"],"do":["give:jikken","toast:蒼の証言を崩し const TOK = /\s*(\|\||&&|!|\(|\)|true|false|[a-z]+:[A-Za-z0-9_\-]+(?:\s*(?:>=|<=|==|!=|>|<)\s*-?\d+)?)/y;

  if (k === 'flag') return !!S.f[n];
  if (k === 'here') return S.loc === n;
  if (k === 'var' || k === 'talked') {
    const x = k === 'var' ? (S.v[n] || 0) : (S.seq['talkc:' + S.chapter + ':' + n] || 0);

function run(list) {

    const i = e.indexOf(':'), k = i < 0 ? e : e.slice(0, i), a = i < 0 ? '' : e.slice(i + 1);
    switch (k) {
      case 'give': if (!S.items.includes(a)) { S.items.push(a); toast('入手：' + D.items[a]); } break;
      case 'take': S.items = S.items.filter(x => x !== a); break;
      case 'flag': S.f[a] = 1; break;
      case 'unflag': delete S.f[a]; break;
      case 'set': { const [n, v] = a.split('='); S.v[n] = +v; break; }
      case 'inc': S.v[a] = (S.v[a] || 0) + 1; break;
      case 'miss': S.v.miss = (S.v.miss || 0) + 1; break;
      case 'toast': if (!S.toasted) S.toasted = []; if (!S.toasted.includes(a)) { S.toasted.push(a); toast(a); } break;
      case 'goto': pending.goto = a; break;
      case 'puzzle': pending.puzzle = a; break;
      case 'ending': pending.ending = a; break;
      case 'chapter': pending.chapter = a; break;
      case 'event': pending.event = a; break;
      case 'board': pending.board = a; break;
      case 'choice': pending.choice = a; break;
      case 'search': pending.search = a; break;
      case 'doc': if (!S.docs) S.docs = []; if (!S.docs.includes(a)) { S.docs.push(a); toast('資料に追加：' + D.docs[a].title); } break;

function resolve(entry, key) {

  if (Array.isArray(entry)) return entry.find(r => cond(r.if)) || null;
  if (entry.seq) { const k = S.chapter + '|' + key, i = S.seq[k] || 0; S.seq[k] = i + 1; return entry.seq[Math.min(i, entry.seq.length - 1)]; }

// 行けるようになった場所は、エンジンが自動で知らせる（シナリオに toast を書かなくてよい）
const openLocs = () => Object.keys(ch().locations).filter(k => avail(k));

// 文を出した直後に場面・問い・謎へ移るときは、「つぎへ」をはさんで文を読めるようにする
// （まちがえて選び直すときは、返事と選択肢を一緒に出したいので、はさまない）
let actSaid = false;
// 聞いたあとは、同じ人の話題（話題のない人なら「だれに聞く？」）に戻る。毎回「聞く」を押し直さなくてよい

// 話した回数：talk:人物 は全章の合計（推理で選べる人に使う）、talkc:章:人物 はその章の回数（talked: 条件に使う）

  if (SIM) { E.pages.forEach(t => say(t)); pending = {}; openBefore = openLocs(); run(E.do); return after(); }

    }

// ---------- 選択式の問い ----------

  // 選ぶ前に手帳（資料・証言カード）を見返せる
  btns([...Q.options.map((o, i) => [o.label, () => choose(id, i)]), ['手帳を見る', () => openNotebook(), 'back']], Q.label || '選ぶ');

// ---------- 記事の検索 ----------
// 章の searches: {id: {label, prompt, placeholder, entries: [{keys: [ことば...], ...ルール}], none}}。効果 search:id で出す
// 入力した言葉に keys のどれかが含まれていれば、そのルールを行う（最初に当たったもの。if も使える）
// 空白を無視し、全角を半角にそろえ、数字の頭の0を取る（「10月08日」→「10月8日」）
const norm = t => String(t).normalize('NFKC').replace(/\s/g, '').replace(/(^|\D)0+(?=\d)/g, '$1');
function searchAnswer(id, q) {
  const Q = ch().searches[id]; S.simSearch = null;
  // 見つからないときは、その返事を残したまま入力欄を出し直す
  if (!norm(q)) { reask = id; return act({ text: Q.empty || '何も入力していない。', do: ['search:' + id] }); }
  S.v.searches = (S.v.searches || 0) + 1;
  const hit = Q.entries.find(e => cond(e.if) && e.keys.some(k => norm(q).includes(norm(k))));
  if (hit) return act(hit);
  reask = id; act({ text: fmt(Q.none || '「{q}」の記事は見つからなかった。', { q }), do: ['search:' + id] });
}
function openSearch(id) {
  const Q = ch().searches[id];
  if (Q.prompt && reask !== id) say(Q.prompt, { nolog: true });
  reask = null;
  const c = $('cmd'); c.innerHTML = ''; c.className = 'list';
  c.insertAdjacentHTML('beforeend', `<div class="label">${esc(Q.label || 'ことばで探す')}</div><input id="sq" type="search" enterkeyhint="search" placeholder="${esc(Q.placeholder || '例：会社の名前')}" autocomplete="off">`);
  const go = () => searchAnswer(id, $('sq').value);
  $('sq').onkeydown = e => { if (e.key === 'Enter') go(); };
  [['探す', go, 'primary'], ['手帳を見る', () => openNotebook(), 'back'], ['やめる', () => main(), 'back']].forEach(([t, fn, cls]) => {
    const b = document.createElement('button'); b.className = cls; b.innerHTML = `<span>${t}</span>`; b.onclick = fn; c.appendChild(b);
  });
}

function puzzleAnswer(id, code) {
  const P = ch().puzzles[id];

}

// ---------- 推理ボード（消去法） ----------
// 章の boards: {id: {suspects: [人物id], conditions: [{id, label, keeps: [条件に合う人物id], correct}], culprit,
//   success: ルール, wrong: {none, many, decoy}}}
// 条件を選ぶたびに、合わない人が外れる。正しい条件をすべて選んで犯人ひとりが残れば成功
const boardLeft = (B, sel) => B.suspects.filter(p => sel.every(cid => B.conditions.find(c => c.id === cid).keeps.includes(p)));
function boardSubmit(id, sel) {
  const B = ch().boards[id];
  S.simBoard = null;
  const left = boardLeft(B, sel);
  // 正しい条件だけで犯人ひとりが残れば成功（犯人に合わない「まちがった条件」を選ぶと、犯人は必ず外れる）
  const ok = left.length === 1 && left[0] === B.culprit && sel.every(cid => B.conditions.find(c => c.id === cid).correct);
  if (ok) return act(B.success);
  const why = !left.length ? B.wrong.none : left.length > 1 ? B.wrong.many : B.wrong.decoy;
  act({ text: why, do: ['miss'] });
}
function openBoard(id) {
  const B = ch().boards[id];

    m.innerHTML = `<div class="sheet board"><div class="eyebrow">推理ボード</div><h3>${esc(B.title || '犯人の条件')}</h3><p class="nb-note">${esc(B.lead || '')}</p>
      <div class="b-sus">${B.suspects.map(p => `<span class="${left.includes(p) ? '' : 'out'}">${esc(short(p))}</span>`).join('')}</div>
      <div class="b-con"></div><div class="row2"></div></div>`;
    const box = m.querySelector('.b-con');

      b.innerHTML = `<span class="t">${sel.includes(c.id) ? '☑' : '☐'} ${esc(c.label)}</span>`;
      b.onclick = () => { sel = sel.includes(c.id) ? sel.filter(x => x !== c.id) : [...sel, c.id]; draw(); };

    go.disabled = !sel.length; go.onclick = () => { closeModal(); boardSubmit(id, sel); };

    document.body.appendChild(m);
  };
  draw();
}

// ---------- 矛盾をつく ----------
// 章の contradictions: [{id, pairs: [[カードid, カードid], ...], if, text, do}]
function contradict(ids) {
  const same = (p) => (p[0] === ids[0] && p[1] === ids[1]) || (p[0] === ids[1] && p[1] === ids[0]);
  const list = ch().contradictions || [];
  const hit = list.find(x => x.pairs.some(same));
  if (hit && S.f['contra_' + hit.id]) return act({ text: hit.doneText || 'その食い違いは、もう明らかにした。' });
  if (hit && cond(hit.if)) {
    // 崩した証言カードに印を付け、認めた内容を新しいカードにする
    S.cards.forEach(c => { if (c.id && ids.includes(c.id) && hit.broken !== false && (hit.breaks || [ids[0], ids[1]]).includes(c.id)) c.broken = true; });
    return act({ text: hit.text, do: [...(hit.do || []), 'flag:contra_' + hit.id], card: hit.card, cardId: hit.cardId }, { p: hit.p || null });
  }
  if (hit) return act({ text: hit.notYet || 'いまは、それをつきつける相手がいない。' });
  act({ text: ch().contradictWrong || D.contradictWrong || 'その2つは、食い違っていないようだ…。', do: ['miss'] });
}

  const list = document.createElement('div'); body.appendChild(list);
  const draw = () => {
    const q = nbQ.q.trim();
    const hits = [];
    for (let i = S.log.length - 1; i >= 0 && hits.length < 300; i--) {
      const e = S.log[i];
      if (nbQ.who && speaker(e) !== nbQ.who) continue;
      if (nbQ.place && e.c + '|' + e.l !== nbQ.place) continue;
      if (nbQ.ch && e.c !== nbQ.ch) continue;
      if (nbQ.pin && !e.pin) continue;
      if (q && !e.t.includes(q)) continue;
      hits.push(e);
    }
    list.innerHTML = hits.length ? `<div class="cnt">${hits.length}件（新しい順）</div>` : '<p class="nb-empty">見つかりませんでした。</p>';
    hits.forEach(e => list.appendChild(entryEl(e, () => { e.pin = !e.pin; autosave(); draw(); })));
  };
  const s = bar.querySelector('input[type=search]');
  s.oninput = () => { nbQ.q = s.value; draw(); };
  bar.querySelectorAll('select').forEach(x => x.onchange = () => { nbQ[x.dataset.k] = x.value; draw(); });
  bar.querySelector('.pinonly').onchange = e => { nbQ.pin = e.target.checked; draw(); };
  draw();
}
function nbNotes(body) {
  const ns = S.notes || [];
  body.innerHTML = `<p class="nb-note">${esc(D.notes.lead || '')}（${ns.length}件）</p>` + (ns.length ? '' : '<p class="nb-empty">まだ何も書き留めていない。</p>');
  ns.forEach(n => body.appendChild(entryEl({ ...n, l: null }, () => { n.pin = !n.pin; autosave(); openNotebook(); }, true)));
}
// 資料：doc:id で増える。表や数字を見ながら推理するためのもの（game.json の docs: {id: {title, text}}）
function nbDocs(body) {
  const ds = S.docs || [];
  body.innerHTML = ds.length ? ds.map(k => `<div class="nb-entry doc"><div class="meta">${esc(D.docs[k].title)}</div><div class="txt">${esc(D.docs[k].text)}</div></div>`).join('') : '<p class="nb-empty">まだ資料はありません。</p>';
}
function nbItems(body) {
  body.innerHTML = S.items.length ? S.items.map(i => `<div class="nb-entry"><div class="txt">${esc(D.items[i])}</div></div>`).join('') : '<p class="nb-empty">まだ何も持っていない。</p>';
}
function nbMemo(body) {
  body.innerHTML = '<p class="nb-note">自分用のメモです。ゲームの進み方には関係しません。</p><textarea id="memo" placeholder="気づいたことを書いておこう"></textarea>';
  const t = body.querySelector('textarea'); t.value = S.memo || '';
  let timer; t.oninput = () => { S.memo = t.value; clearTimeout(timer); timer = setTimeout(autosave, 400); };
}
function nbStory(body) {
  const ids = Object.keys(D.chapters), upto = ids.indexOf(S.chapter);
  const parts = ids.slice(0, upto + 1).map(id => D.chapters[id]).filter(C => C.recap);
  body.innerHTML = parts.length ? parts.map(C => `<div class="nb-entry"><div class="meta">${esc((C.label || '') + ' ' + (C.title || ''))}</div><div class="txt">${esc(C.recap)}</div></div>`).join('') : '<p class="nb-empty">まだ記録はありません。</p>';
}
// 章のはじめと「つづきから」で、その章の「これまでの話」を出す
function showRecap() {
  const C = ch();
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><div class="eyebrow">これまでの話</div><h3>${esc((C.label || '') + ' ' + (C.title || ''))}</h3><p class="recap">${esc(C.recap)}</p></div>`;
  const b = document.createElement('button'); b.className = 'big primary'; b.textContent = 'つづける'; b.style.width = '100%';
  b.onclick = closeModal; m.firstChild.appendChild(b);
  document.body.appendChild(m);
}

// ---------- プレイ時間 ----------
// 画面が見えていて、最後の操作から2分以内のあいだだけ数える（放置した時間は入れない）
let lastInput = Date.now();
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, true));
setInterval(() => {
  if (!S || S.done || document.visibilityState !== 'visible' || Date.now() - lastInput > 120000) return;
  S.v.playSec = (S.v.playSec || 0) + 5;
}, 5000);
const hm = s => { s = s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };

// ---------- 起動時の一括読み込み ----------
// 背景をすべて先に読み込んでおき、遊んでいる間は通信しないようにする。
function preload() {
  const urls = Object.values((D.assets && D.assets.bg) || {});
  let done = 0, failed = 0;
  const bar = $('loadbar'), txt = $('loadtxt');
  const tick = () => { bar.style.width = (urls.length ? done / urls.length * 100 : 100) + '%'; txt.textContent = `読み込み中… ${done}/${urls.length}`; };
  tick();
  // 日本語フォントは文字ごとに分割配信されるので、ゲームで使う文字をすべて一度描いて先に取り寄せる
  const fonts = new Promise(res => {
    const chars = [...new Set(JSON.stringify(Object.assign({}, D, { assets: null })))].join('');
    const box = document.createElement('div');
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;opacity:0;pointer-events:none';
    box.innerHTML = [["'Noto Sans JP'", 400], ["'Noto Sans JP'", 500], ["'Noto Sans JP'", 700], ["'Shippori Mincho'", 700], ["'Shippori Mincho'", 800]]
      .map(([f, w]) => `<span style="font-family:${f};font-weight:${w}">${chars.replace(/[<&]/g, '')}</span>`).join('');
    document.body.appendChild(box);
    const finish = () => { box.remove(); res(); };
    if (!document.fonts) return finish();
    setTimeout(finish, 8000);
    requestAnimationFrame(() => document.fonts.ready.then(finish, finish));
  });
  return Promise.all([fonts, ...urls.map(u => new Promise(res => {
    const im = new Image();
    im.onload = () => { done++; tick(); res(); };
    im.onerror = () => { done++; failed++; tick(); res(); };
    im.src = u;
    preloaded.push(im);
  }))]).then(() => failed);
}
const preloaded = [];

window.addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('leaving'); toTitle(); } });
// ---------- 検証用（tools/verify.py が使う） ----------
const sim = {
  // 章のはじめの状態を作る（prev に前の章の終わりの状態を渡せる）
  begin(ch_, prev) {
    SIM = true; S = prev ? JSON.parse(JSON.stringify(prev)) : fresh();
    delete S.simEnd; delete S.simPuzzle; delete S.simBoard; delete S.simChoice; delete S.simSearch;
    S.chapter = ch_; S.loc = D.chapters[ch_].start.loc; resetFor(D.chapters[ch_]); say(D.chapters[ch_].start.text);
    const sd = D.chapters[ch_].start.do; if (sd) { pending = {}; openBefore = openLocs(); run(sd); after(); }
    return JSON.parse(JSON.stringify(S));
  },
  set(st) { SIM = true; S = JSON.parse(JSON.stringify(st)); },
  get() { return JSON.parse(JSON.stringify(S)); },
  actions() {
    if (S.simEnd) return [];
    if (S.simBoard) {
      // 条件の組み合わせをすべて試す
      const B = ch().boards[S.simBoard], ids = B.conditions.map(c => c.id), out = [];
      for (let m = 1; m < (1 << ids.length); m++) out.push({ t: 'board', id: S.simBoard, sel: ids.filter((_, i) => m & (1 << i)) });
      return out;
    }
    if (S.simSearch) { const Q = ch().searches[S.simSearch]; return [...Q.entries.map(e => ({ t: 'search', id: S.simSearch, q: e.keys[0] })), { t: 'search', id: S.simSearch, q: 'ああああ' }]; }
    if (S.simChoice) return ch().choices[S.simChoice].options.map((_, i) => ({ t: 'choice', id: S.simChoice, i }));
    if (S.simPuzzle) { const P = ch().puzzles[S.simPuzzle]; return [{ t: 'code', id: S.simPuzzle, code: P.answer }, { t: 'code', id: S.simPuzzle, code: P.answer === '0000' ? '1111' : '0000' }]; }
    const a = [];
    Object.keys(ch().locations).forEach(k => { if (k !== S.loc && avail(k)) a.push({ t: 'move', k }); });
    if (ch().think) a.push({ t: 'think' });
    here().forEach(p => { const ts = topicsOf(p); if (ts) ts.forEach(tp => a.push({ t: 'topic', p, tp })); else a.push({ t: 'talk', p }); });
    Object.keys(loc().objs || {}).forEach(o => a.push({ t: 'look', o }));
    S.items.forEach(i => here().forEach(p => a.push({ t: 'show', i, p })));
    if (ch().accuse) accusable().forEach(p => a.push({ t: 'accuse', p }));
    const cs = ch().contradictions || [];
    if (cs.length && S.cards.length >= 2) {
      const ids = S.cards.map((c, i) => c.id || '#' + i);
      cs.forEach(x => x.pairs.forEach(([u, v]) => { if (ids.includes(u) && ids.includes(v)) a.push({ t: 'contra', ids: [u, v] }); }));
      a.push({ t: 'contra', ids: [ids[0], ids[1]] });
    }
    return a;
  },
  apply(x) {
    switch (x.t) {
      case 'move': return moveTo(x.k);
      case 'talk': return talk(x.p);
      case 'topic': return talkTopic(x.p, x.tp);
      case 'look': return look(x.o);
      case 'show': return showTo(x.i, x.p);
      case 'accuse': return accuse(x.p);
      case 'contra': return contradict(x.ids);
      case 'code': return puzzleAnswer(x.id, x.code);
      case 'board': return boardSubmit(x.id, x.sel);
      case 'choice': return choose(x.id, x.i);
      case 'search': return searchAnswer(x.id, x.q);
      case 'think': return think();
    }
  },
  seen: () => [...simSeen],
};

document.title = D.title;
window.__mg = { get state() { return S; }, cond, D, openNotebook, toastLog, sim, startChapter: id => { $('wrap').classList.remove('hide'); startChapter(id); } };
preload().then(failed => {
  $('loading').classList.add('hide');
  toTitle();
  if (failed) toast(`背景 ${failed} 枚を読み込めませんでした`);
});
})();

</script>

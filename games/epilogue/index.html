<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>最後のページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;height:100%;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#wrap{width:100%;max-width:560px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#wrap>*{flex-shrink:0} /* 長い文で文章欄が縮んで、文がボタンの下にはみ出さないように */
header{display:flex;align-items:center;justify-content:space-between}
#locname{font-family:'Shippori Mincho',serif;font-weight:800;font-size:19px;letter-spacing:.04em}
#locname small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.2em;margin-bottom:1px}
#bag-unused{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#bag-unused b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#scene{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px #0008}
#scene svg{width:100%;height:100%;display:block;filter:saturate(.8) contrast(1.05)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%),linear-gradient(180deg,transparent 60%,#0009);pointer-events:none}
#here{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
#here span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
#msgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-height:150px;position:relative;cursor:pointer}
#who{display:none;position:absolute;top:-12px;left:16px;background:var(--accent);color:#1a1405;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
#who.on{display:block}
#msg{font-size:16px;line-height:1.85;white-space:pre-wrap}
#msgbox.more::after{content:'';position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(45deg)}}
#cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cmd .label{grid-column:1/-1;color:var(--sub);font-size:13px;padding:2px 2px 0}
#cmd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;min-height:64px}
#cmd button svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cmd button:hover{border-color:var(--accent)}
#cmd button:active{transform:scale(.96);background:#262c3a}
#cmd.list{grid-template-columns:1fr 1fr}
#cmd.list button{flex-direction:row;justify-content:flex-start;min-height:50px;padding:10px 14px;text-align:left}
#cmd.pad{grid-template-columns:repeat(5,1fr)}
#cmd.pad button{min-height:52px;font-size:20px;border-radius:50%;aspect-ratio:1;padding:0}
#cmd button.back{background:transparent;color:var(--sub);border-style:dashed}
#cmd.pad button.back{border-radius:14px;aspect-ratio:auto;grid-column:1/-1;font-size:14px}
#cmd button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#cmd.one{grid-template-columns:1fr}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px #0006;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px;overflow:auto}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em}
#title h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:44px;line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 30px #000}
#title p{color:var(--sub);font-size:14px;line-height:1.9}
.big{width:240px;padding:14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:15px;font-weight:500;cursor:pointer}
.big.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#prologue{justify-content:flex-start}
#prologue .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:left;line-height:1.95;font-size:15px;margin:auto 0}
#prologue h2{font-family:'Shippori Mincho',serif;font-size:24px;text-align:center;margin-bottom:14px}
#prologue b{color:var(--accent)}
#prologue .cast{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
#prologue .cast div{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
#prologue .cast span{min-width:76px;color:var(--blue);font-weight:700}
.hide{display:none!important}

#hdr-r{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px 26px;max-height:85vh;overflow:auto}
#modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:12px}
#modal .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:14px}
#modal .row:not([disabled]):hover{border-color:var(--accent)}
#modal .row .t{flex:1}
#modal .row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#modal .row[disabled]{opacity:.45;cursor:default}
#modal .close{margin-top:6px;width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
#card{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 40%,#24304a 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:fade .6s}
#card .n{color:var(--accent);letter-spacing:.35em;font-size:13px}
#card .t{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;letter-spacing:.08em}
#card .tap{color:var(--sub);font-size:12px;margin-top:30px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#bg,#bg img{width:100%;height:100%;display:block;object-fit:cover}
#loading .bar{width:220px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px}
#nbook{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.nb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.nb-head h3{font-family:'Shippori Mincho',serif;font-size:21px}
.nb-x{background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.nb-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb-tabs button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.nb-tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.nb-body{flex:1;overflow:auto;padding:12px 14px 30px}
.nb-entry{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 44px 11px 14px;margin-bottom:8px}
.nb-entry.pinned{border-color:var(--accent)}
.nb-entry .meta{color:var(--blue);font-size:12px;font-weight:700;margin-bottom:3px}
.nb-entry .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.nb-entry .pin{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:20px;color:var(--sub);cursor:pointer;padding:2px 6px}
.nb-entry .pin.on{color:var(--accent)}
.nb-bar,.nb-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)}
.nb-filter input[type=search]{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px}
.nb-filter select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--text);font:inherit;font-size:13px;max-width:48%}
.nb-bar .cnt,.nb-body .cnt{margin-left:auto;color:var(--sub);font-size:12px;margin-bottom:6px}
.nb-empty,.nb-note{color:var(--sub);font-size:13px;line-height:1.8;padding:6px 2px}
#memo{width:100%;min-height:50vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:15px;line-height:1.8;resize:vertical}
#modal .recap{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:6px 0 18px}
#modal .eyebrow{margin-bottom:4px}
.nb-contra{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center;position:sticky;top:0;z-index:1}
.nb-contra .big{width:100%}
.nb-contra small{display:block;color:var(--sub);font-size:12px;margin-top:6px}
.nb-contra .sel{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.nb-contra .row2{display:flex;gap:8px}
.nb-contra .row2 .big{flex:1;width:auto}
.nb-contra .big.back{background:transparent;color:var(--sub);border-style:dashed}
.nb-contra .big[disabled]{opacity:.4}
.nb-entry.selectable{cursor:pointer}
.nb-entry.chosen{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
#cmd button{position:relative}
#cmd .badge{position:absolute;top:7px;right:9px;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;line-height:1.5}
.big,.pill,#modal .row,.nb-tabs button,.nb-x{transition:transform .08s,filter .15s,background .15s}
.big:active,.pill:active,#modal .row:not([disabled]):active,.nb-tabs button:active,.nb-x:active{transform:scale(.96);filter:brightness(1.25)}
.big.going{filter:brightness(1.25);pointer-events:none}
body.leaving::after{content:'開いています…';position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0e1117cc;color:var(--text);font-size:15px;letter-spacing:.1em;animation:fade .2s}
.nb-entry .broken{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;font-size:10.5px;padding:0 8px;margin-right:6px}
.nb-entry.is-broken .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c2553f99}
#modal .board .b-sus{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
#modal .board .b-sus span{background:var(--accent);color:#1a1405;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transition:.2s}
#modal .board .b-sus span.out{background:var(--panel2);color:var(--sub);text-decoration:line-through;font-weight:400}
#modal .board .row.on{border-color:var(--accent);background:#2a2a20}
#modal .board .row2{display:flex;gap:8px;margin-top:10px}
#modal .board .row2 .big{flex:1;width:auto}
#modal .board .row2 .big[disabled]{opacity:.4}
.nb-entry.doc{padding-right:14px}.nb-entry.doc .txt{white-space:pre-wrap;font-variant-numeric:tabular-nums;line-height:1.7}
#cmd #sq{grid-column:1/-1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:inherit}
#title .lock{color:var(--accent);margin:18px 0 6px}
/* 音のオン・オフ */
.pill.off{color:var(--sub);text-decoration:line-through}
#title .pill.sndt{margin-top:4px;font-size:12px}
#title .credit{color:#5c6370;font-size:11px;line-height:1.7;max-width:320px;margin-top:6px}
#sndpop{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
#sndpop .sheet{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px 18px}
#sndpop h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:6px}
#sndpop .lead{color:var(--sub);font-size:13px;line-height:1.7;margin-bottom:14px}
#sndpop .row{display:grid;grid-template-columns:4.5em 1fr 2.5em;align-items:center;gap:10px;padding:8px 0}
#sndpop .n{font-size:14px;font-weight:500}
#sndpop .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
#sndpop input[type=range]{width:100%;accent-color:var(--accent);height:28px}
#sndpop .btns{display:flex;gap:8px;margin-top:14px}
#sndpop .btns .big{flex:1;width:auto}
#sndpop .big.back{background:transparent;color:var(--sub);border-style:dashed}

</style>
</head>
<body>
<div id="loading" class="screen"><div class="eyebrow">LOADING</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">読み込み中…</p></div>

<div id="prologue" class="screen hide"></div>

<div id="wrap" class="hide">

"arrive":"磯辺町。網元の大きな家は、もうない。畑の向こうに、海が光っている。"}},"look":{"photo":[{"if":"!flag:photo","text":"署の壁の、古い表彰写真。昭和の制服の男たち。中央の、目の鋭い中年の刑事の下に、名前がある。「沖田庄吉」。\n\n祖父のメモに、何度も出てきた名前だ。","do":["flag:photo"]},{"text":"沖田庄吉の写真。まっすぐ、こちらを見ている。"}],"box":[{"if":"flag:keibu_okita && !flag:okita_box","text":"警部が、倉庫から段ボール箱を出してきた。「沖田庄吉　遺品　ご遺族の希望により署で保管」。\n\n中に、黒い表紙の日誌が一冊。陽は、警部の許しをもらって、大事なところを書き写した。","do":["doc:okita","flag:okita_box"]},{"if":"flag:okita_box","text":"沖田の日誌。最後のページに、押し花のような、乾いた菊の花びらがはさまっていた。"},{"text":"棚の上の段ボール箱。…警部に話を聞いてからにしよう。"}],"desk":{"text":"文机に、黒田家の紋の入った便箋と、書きかけの手紙。宛名は「黒田タキ様」。"},"amigura":{"text":"網倉の焼け跡は、もう畑になっている。石垣の焦げあとだけが、八十六年前の火事を覚えている。"},"tokawa":{"text":"網元・戸川家の屋敷の跡。いまは空き地だ。片すみに、小さな墓がふたつ。戸川の長男と、源次のものだという。"}},"talk":{"keibu":{"topics":{"okita":{"seq":[{"text":"警部「沖田さんは、わしが署に入るずっと前に辞めた人だ。だが、汐見の刑事で、あの人の話を知らんやつはおらん」\n\n警部「品川の事件を、最後まで追った。上から止められても、ひとりで。…遺品が、まだ署に残っとるはずだ。見ていくか」","do":["flag:keibu_okita"]},{"text":"警部「三島さんの記事が出たら、沖田さんにも読ませてやりたかった」"}]},"ima":{"text":"警部「おととしの秋に、汐見水産の社長の事件があってな。マコトと二人で片づけた。…この町は、小さな事件ばかりだ」"}}},"makoto":{"topics":{"okita":{"seq":[{"text":"マコト「沖田さんは、1998年に亡くなったそうです。最後まで、汐見の浜の近くに住んでいたって」\n\nマコト「毎年12月になると、浜に花を流していたそうです。誰のためかは、言わなかったって」","do":["flag:makoto_okita"]},{"text":"マコト「沖田さんの事件、やっと終わりますね」"}]},"ima":[{"if":"flag:okita_box && flag:i_1960 && flag:i_rokujuu && flag:k_kaji","text":"マコト「信州の寺へ行かれるんですね。…宮下さんたちは、週末に汐見に着くそうです。浜でお待ちしてますって」","do":["event:close"]},{"text":"マコト「磯村さんの下宿は、港の上の坂です。健治さんは、磯辺町で網を直してますよ」"}]}},"isomura":{"topics":{"sen960":{"seq":[{"text":"磯村「昭和35年の12月。旦那様――佐伯様は、汐見へ発つ前の晩、私を書斎に呼ばれました。私は十八でした」\n\n磯村「『わしが戻らんかったら、黒田さんが手帳を取りに来る。そのときは、黙って渡せ。逆らえば、お前が追い出される』。それから、手帳の最後のページを、目の前で破り取られました」\n\n磯村「『これだけは、汐見に持っていく』と」","do":["flag:i_1960"]},{"text":"磯村「三日後、新聞に、社長の事故の記事が出ました。その日の昼、黒田様が書斎に来られた。私は、言われたとおり、手帳を渡しました。…二年後、鴎島の館ができると、黒田様は私に、それを書庫の金庫に入れさせました」"}]},"rokujuu":{"seq":[{"text":"磯村「私は、空襲で親をなくした子でした。旦那様が、十六の私を書生にしてくださった。旦那様がいなくなったあと、黒田家が私を置いてくださった」\n\n磯村「手帳を持ち出せば、黒田様が千鶴様への為替をやめる。そう言われていました。…それに、私は臆病でした。六十六年、金庫の鍵の音を聞くたびに、旦那様に詫びておりました」","do":["flag:i_rokujuu"]},{"text":"磯村「鴎島で金庫が開き、奥様が財産を汐見に返すとおっしゃった。…もう、黒田家に義理立てする理由はない、と思いました。だから、持ち出したのです」\n\n磯村「千鶴様の居場所は、為替の送り先で、ずっと知っておりました。それでも、時計店の前に立つまで、四か月かかりました。…長尾につけられていたことにも、気づかずに」"}]},"techou":{"text":"磯村「千鶴様は、手帳を胸に抱いて、しばらく動かれませんでした。私は、六十六年分の荷を、やっと下ろした気がいたしました」"}}},"kenji":{"topics":{"kaji":{"seq":[{"text":"健治「じいさん――吾助は、昭和35年の暮れに、沖田さんに火事の本当のことを話して、翌年の春に死にました。死ぬ前に、わしの親父に言うたそうです。『佐伯の家の墓を、守ってやってくれ』と」\n\n健治「それから六十六年、うちが佐伯家の墓を掃除しとります」","do":["flag:k_kaji"]},{"text":"健治「戸川の家は、トメさんが昭和40年に亡くなって、絶えました。…網元の家が、火事と戦争と、源次さんのことで、みんな消えてしもうた」\n\n健治「三島さんの記事で、佐伯の修さんが火をつけとらんかったことが、町じゅうに知れる。じいさんも、やっと楽になれるでしょう」"}]},"ima":{"text":"健治「佐伯家の墓は、丘の上です。宮下さんが来られたら、案内しますよ」"}}}},"show":{"isomura":{"fuutou":{"text":"磯村は、封筒の表の字を見て、両手をついた。\n\n磯村「…あの晩、旦那様が破り取られたページです。汐見の海に、一緒に沈んだものと思っておりました」"}},"keibu":{"fuutou":{"text":"警部「…沖田さんが預けた封筒か。六十七年。長い預かりものだったな」"}},"makoto":{"fuutou":{"text":"マコト「これが…。宮下さんに、ちゃんと届くんですね」"}},"kenji":{"fuutou":{"text":"健治「修さんの字ですか。…じいさんが見たら、泣いたでしょうな」"}}},"showDefault":"{name}は、それを見つめた。","events":{"close":{"pages":["沖田は、昭和63年に千鶴の店を訪ね、名乗らずに帰っていた。手帳が見つかるまでは、と。","磯村は、六十六年、金庫の鍵の音を聞くたびに、佐伯に詫びていた。","吾助の家は、六十六年、誰も参らない佐伯家の墓を掃除していた。","みんな、何かを待っていた。","陽は、信州行きの列車に乗った。最後に、もうひとりの「誠一郎」に会いに行く。"],"do":["chapter:ch4"]}}},"ch4":{"id":"ch4","label":"第四章","title":"もうひとりの誠一郎","recap":"汐見で、陽は三つのことを知った。沖田は昭和63年に千鶴の店を訪ね、名乗らずに帰っていた。磯村は佐伯の最後の晩に、手帳の最後のページが破り取られるのを見ていた。吾助の家は六十六年、佐伯家の墓を守っていた。陽は、信州の寺へ向かう。","start":{"loc":"temple","text":"2027年10月。信州の山寺。\n\n紅葉が境内を埋めている。本堂の縁側で、作務衣の住職が頭を下げた。\n\n住職「三島さんですね。先代の父から、話は聞いておりました。…いつか、誰かが来るだろう、と」"},"thinkHint":"（{name}さんに、まだ聞いていないことがある）","think":[{"if":"!flag:j_seiichiro","hints":["（住職さんに『本物の久我誠一郎』のことを聞こう）"]},{"if":"!flag:j_shino","hints":["（住職さんに『父のこと』…先代の住職と、志乃さんのことを聞こう）"]},{"if":"!flag:j_ishi","hints":["（墓地の、名前のない小さな石を「調べる」）"]},{"hints":["（汐見へ戻ろう。本堂の山門を「調べる」）"]}],"locations":{"temple":{"name":"信州・寺の本堂","bg":"temple","people":["jushoku"],"objs":{"sanmon":"山門","kura":"蔵の箱"},"arrive":"本堂。線香のにおい。"},"haka":{"name":"信州・寺の墓地","bg":"grave","people":["jushoku"],"objs":{"kuga":"久我家の墓","ishi":"名前のない小さな石"},"arrive":"墓地のいちばん奥。紅葉の下に、久我家の墓がある。"}},"look":{"sanmon":[{"if":"flag:j_seiichiro && flag:j_shino && flag:j_ishi","text":"山門を出ると、谷の向こうに雪をかぶった山が見えた。\n\n陽は、汐見へ戻る。千鶴と蒼が、浜で待っている。","do":["event:close"]},{"text":"山門。…まだ、聞きたいことが残っている。"}],"kura":{"text":"蔵から出してきたという、古い木箱。志乃の遺品だ。点字の聖書と、束ねた手紙。"},"kuga":{"text":"久我家之墓。志乃が眠っている。今朝も、新しい花が供えてある。"},"ishi":[{"if":"!flag:j_ishi","text":"久我家の墓の横の、小さな石。名前は刻まれていない。\n\n住職「昭和31年、志乃さまが亡くなられたあと、誠一郎さん――佐伯さんが置いていかれた石です。『本当の誠一郎の墓じゃ。名前は、いつか本当のことが言えるようになったら刻んでくれ』と」\n\n住職「父は、六十年、その日を待ちました。…やっと刻めます」","do":["flag:j_ishi"]},{"text":"名前のない小さな石。もうすぐ、本当の名前が刻まれる。"}]},"talk":{"jushoku":{"topics":{"seiichiro":{"seq":[{"text":"住職「本物の誠一郎さんは、東京の帝大の文学部の学生だったそうです。本ばかり読んでいる、やさしい人だった、と志乃さまは」\n\n住職「戦地から、母上への手紙が何通も届いていました。蔵に残っています。…一通、読んでみてください」\n\n陽は、住職の許しをもらって、軍事郵便を一通書き写した。","do":["doc:gunji","flag:j_seiichiro"]},{"text":"住職「戦地で、佐伯さんに字を教えていたんですね。佐伯さんは網を、誠一郎さんは字を。…佐伯さんの字が、誠一郎さんの字に似ていたのは、そのせいでしょう」"}]},"chichi":{"seq":[{"text":"住職「父は、志乃さまの手紙を、志乃さまの口から聞いて書きとめました。亡くなる三日前の晩だったそうです」\n\n住職「父の日記には、こうあります。『志乃さま、口述。誠一郎さんに。中身は、わたしの胸ひとつに』。…父は、最後まで、誰にも中身を言いませんでした」","do":["flag:j_shino"]},{"text":"住職「父は、昭和の終わりに九十を過ぎて亡くなるまで、命日ごとに来る佐伯さん――いえ、佐伯さんが亡くなってからは、毎年12月に来る汐見の刑事さんを、待っていました」\n\n住職「沖田さん、とおっしゃったかな。毎年、志乃さまの墓と、名前のない石に、手を合わせていかれた」"}]},"ima":{"text":"住職「三島さんの記事が出たら、石に名前を刻みます。『久我誠一郎　昭和二十一年六月　南の海に眠る』と」"}}}},"show":{"jushoku":{"fuutou":{"text":"住職は、封筒を両手で受け取りかけて、やめた。\n\n住職「これは、宮下さんが開けるものです。…父の字が、中にあるはずです。志乃さまの言葉を書きとめた、父の字が」"}}},"showDefault":"{name}は、それを見つめた。","events":{"close":{"pages":["汐見へ戻る列車の中で、陽は軍事郵便の写しを読み返した。","「無口ですが、まっすぐな男です」","本物の久我誠一郎は、佐伯修をそう書いていた。","二人の誠一郎がいた。ひとりは南の海に眠り、ひとりは汐見の海に眠っている。","――汐見。週末の朝。"],"do":["chapter:ch5"]}}},"ch5":{"id":"ch5","label":"終章","title":"汐見の海","recap":"信州の寺で、陽は本物の久我誠一郎の軍事郵便を読んだ。「無口ですが、まっすぐな男です」。佐伯が置いた名前のない石には、もうすぐ本当の名前が刻まれる。週末、千鶴と蒼が汐見に着いた。","start":{"loc":"grave","text":"2027年10月。汐見・磯辺町の丘の墓地。\n\n健治に案内されて、千鶴と蒼が、小さな墓の前に立っていた。"},"thinkHint":"（{name}さんと、話そう）","think":[{"if":"!flag:haka","hints":["（墓石を「調べる」）"]},{"if":"!flag:told","hints":["（千鶴さんに、この旅で分かったことを伝えよう）","（千鶴さんに『これからのこと』を聞こう）"]},{"hints":["（浜へ。波打ちぎわを「調べる」）"]}],"locations":{"grave":{"name":"磯辺町・佐伯家の墓","bg":"grave","people":["chizuru","ao"],"objs":{"haka":"墓石","sea":"海"},"arrive":"海を見下ろす丘の墓地。"},"beach":{"name":"汐見の浜","bg":"beach","unlock":"flag:haka && flag:told","people":["chizuru","ao"],"objs":{"nami":"波打ちぎわ"},"arrive":"汐見の浜。秋の夕方。波が、静かに打ち寄せている。"}},"look":{"haka":[{"if":"!flag:haka","text":"佐伯家の墓。墓石の裏に、古い字。「佐伯修　昭和二十一年六月　没」。\n\n墓のまわりは、きれいに掃き清められている。健治の家が、六十六年守ってきた墓だ。\n\n千鶴「父は、ここに一度だけ帰ってきたんですね。自分の墓に、花を供えに」\n\n千鶴は、持ってきた白い菊を供え、長いあいだ手を合わせていた。","do":["flag:haka"]},{"text":"白い菊が、海風に揺れている。"}],"sea":{"text":"丘の下に、汐見の浜が見える。沖田が毎年、花を二人分流した浜だ。"},"nami":{"text":"千鶴が、波打ちぎわで、陽を振り返った。","do":["event:open"]}},"talk":{"chizuru":{"topics":{"kore":[{"if":"flag:haka && !flag:told","text":"陽は、この旅で聞いたことを、ひとつずつ話した。\n\n為替を送っていたのは、黒田惣一郎だったこと。野々村が四十五年、人に字を教えたこと。磯村が、父の最後の晩を見ていたこと。沖田が昭和63年に、この店に来ていたこと。本物の誠一郎が、父を「まっすぐな男」と書いていたこと。\n\n千鶴は、黙って聞いていた。\n\n千鶴「…あの、古い腕時計のおじいさん。修理代を、どうしても多く置いていこうとした人。…沖田さんだったんですね」\n\n千鶴「みんな、待っていてくれたんですね。六十七年」","do":["flag:told"]},{"text":"千鶴「店に戻ったら、また正午に時計を合わせます。それが、私の仕事ですから」\n\n千鶴「黒田さんの奥さまに、お返事をします。奨学金に、父と、もうひとりの誠一郎さんの名前を、どうぞ、と」"}],"chichi":{"seq":[{"text":"千鶴「母は、父のことを『立派な人だった』としか言いませんでした。…立派じゃなかった。人を殺した。それでも」\n\n千鶴「名前を託されて、それを最後まで守ろうとした人だった」"},{"text":"千鶴「蒼が私のためにしたことと、父が私のためにしたことは、どこか似ています。…似てほしくなかった。でも、似ているから、分かることもある」"}]}}},"ao":{"topics":{"ima":{"text":"蒼「ここが、ひいじいちゃんの町…。海の音が、大きいですね」"},"kore":{"text":"蒼「おれ、ちゃんと勉強します。時間の測り方。…今度は、誰かを助けるために」"}}}},"show":{"chizuru":{"fuutou":{"text":"千鶴「浜で、開けます」"}},"ao":{"fuutou":{"text":"蒼「ばあちゃん、手が震えてる」"}}},"showDefault":"{name}は、それを見つめた。","events":{"open":{"bgm":"epilogue_ending","bgmKeep":true,"pages":["千鶴は、封筒の封を、そっと切った。","中から出てきたのは、一枚の、黄ばんだ紙だった。手帳と同じ大きさ。端に、破り取った跡。","千鶴「…最後のページ」","紙には、古い手紙が貼られていた。父の字ではない。先代の住職の、ていねいな筆の字。その下に、父の字で、ひとこと。\n\n「志乃さまより。この手紙だけは、黒田に渡さん」","千鶴は、声に出して読んだ。波の音に、消えてしまいそうな声で。","誠一郎へ\n\n（住職さまに書きとめていただいています）\n\nあなたが初めてこの寺に来た日のことを、よく覚えています。あなたは、わたしの手を握って、はい、と言いました。","誠一郎は、ペンより重いものを持ったことのない子でした。あなたの手は、あの子の手より大きくて、指の先に、網で切った古い傷がありました。","それでも、あなたは毎月来てくれました。あの子が南の島で何を食べ、何を笑い、誰に字を教えたか、たくさん話してくれました。あなたの話す誠一郎は、わたしの知らない誠一郎で、それでも、たしかにわたしの息子でした。","戦地からのあの子の手紙に、網の繕いのうまい、無口でまっすぐな男のことが書いてありました。あなたが、その人なのでしょう。名前は、聞かないでおきます。","千鶴は、そこで声を詰まらせた。\n\n蒼が、ばあちゃんの肩に手を置いた。\n\n千鶴は、最後の三行を、ゆっくり読んだ。","陽は、取材メモを閉じた。祖父と沖田の約束は、ここで終わった。"],"do":["ending:main"]}}}},"nbTitle":"三島陽の取材手帳","titleScreen":{"eyebrow":"汐見ミステリー 隠しエピローグ","title":"最後の<br>ページ","lead":"六十七年前に預かった封筒を、<br>持ち主の娘に届けに行く。"},"prologue":{"eyebrow":"EPILOGUE","title":"あらすじ","paragraphs":["2027年10月。フリー記者の<b>三島陽<\/b>は、亡き祖父・三島透の遺品の中に、一通の封筒をしまっていた。表には古い字で「この手帳が娘の手に渡ったら、一緒に渡してほしい　佐伯修」。","鴎島で見つかり、時雨町の時計店に返された鳶色の手帳。春の判決のあと、警察に預けられていた手帳が、ようやく持ち主のもとへ戻ったという。","陽は、封筒を鞄に入れて、時計店へ向かう。そこから、六十七年分の「語られなかったこと」をたどる旅が始まる。"],"cast":[["三島 陽","フリー記者。三島透の孫"],["宮下 千鶴","時計職人。佐伯修の娘"],["宮下 蒼","千鶴の孫"],["黒田 タキ","黒田惣一郎の未亡人"],["磯村","黒田家の元執事"]],"button":"封筒を届けに行く"},"resumeText":"続きから始めよう。","assistant":null,"talkDefault":"{name}は、静かにほほえんだ。","items":{"fuutou":"佐伯修の封筒","memo":"祖父の取材メモ"},"people":{"chizuru":{"name":"宮下千鶴","short":"千鶴"},"ao":{"name":"宮下蒼","short":"蒼"},"taki":{"name":"黒田タキ","short":"タキ"},"shizuka":{"name":"野々村静","short":"静"},"isomura":{"name":"磯村"},"keibu":{"name":"汐見署の警部","short":"警部"},"makoto":{"name":"マコト"},"kenji":{"name":"吾助の孫・健治","short":"健治"},"jushoku":{"name":"信州の寺の住職","short":"住職"}},"topics":{"ima":"いまのこと","techou":"手帳のこと","haha":"母のこと","chichi":"父のこと","kuroda":"黒田惣一郎のこと","nagao":"長尾のこと","zaidan":"財団のこと","nonomura":"野々村のこと","sen960":"1960年12月のこと","rokujuu":"六十年のこと","okita":"沖田のこと","kaji":"昭和16年の火事","seiichiro":"本物の久我誠一郎","kore":"これからのこと"},"endings":{"main":{"bg":"beach","place":"汐見の浜","small":"最後のページ","pages":["――その後のこと。","三島陽の記事「名前を託された男」は、全国紙に載った。佐伯修の「戦死」の記録は正され、品川の事件は六十八年ぶりに、犯人の名前とともに閉じられた。","汐見港の警部とマコトは、今日も汐見署で、小さな事件を追っている。署の壁の沖田の写真の横に、陽の記事が一枚、貼られた。","葛西湊は、創業者の伝記を書きあげた。題は『託された名前』。鷹宮恭介は、その原稿の最初の読者になった。","黒田タキが作った汐見の町の財団は、この春、はじめての奨学生を送り出した。奨学金の名前は「佐伯・久我奨学金」という。","磯村は、汐見の下宿で、陽の記事を何度も読み返した。それから、タキに長い手紙を書いた。六十六年分の、お礼と、お詫びを。","野々村静は、父の日記を、川崎の夜間中学の図書室に寄贈した。","健治は、佐伯家の墓の掃除を、これからも続けるという。戸川家の墓にも、同じ花を供えて。","桐生直也と白石澪は、また別の事件で顔を合わせている。宇佐美遥は、宮下時計店で腕時計を直してもらった。","宮下蒼は、大学に戻った。白石の研究室で、時間の測り方を学んでいる。","宮下千鶴は、時計店を開けている。毎日正午に、三十の時計を時報に合わせる。奥の大時計の振り子の重りは、印の位置に戻された。","信州の寺の久我家の墓には、名前のなかった小さな石に、文字が刻まれた。「久我誠一郎　昭和二十一年六月　南の海に眠る」。\n\n汐見の佐伯家の墓は、こう刻み直された。「佐伯修　昭和三十五年十二月　汐見の海に眠る」。","そして、鳶色の手帳の最後のページには、色あせた手紙が、もう一度貼られた。","あなたが誠一郎でないことは、最初にこの手に触れた日から分かっていました。\n\nそれでも、毎月来てくれてありがとう。\n\nあの子のぶんまで、生きてください。\n\n　　　　　　　　　　　　　　　　志乃"],"finalBg":"beach","finalPlace":"汐見ミステリー","finalSmall":"完","ranks":[{"label":"すべての物語を見届けた人"}],"result":"～ 汐見ミステリー 完 ～\n\nプレイ時間：{time}\n\n港町・汐見と、一冊の手帳をめぐる物語は、ここで終わります。\n\n最後まで遊んでくれて、ありがとう！"}},"docs":{"memo":{"title":"祖父・三島透の取材メモ（抜き書き）","text":"昭和35年12月　沖田さんから封筒を預かる。表に「この手帳が娘の手に渡ったら、一緒に渡してほしい」。開けない。\n\n昭和36年　デスクに呼ばれる。「久我の件は書くな。上から言われている」。上とは誰か、聞かなかった。聞けば答えは分かっていた。\n\n昭和45年　黒田惣一郎が汐見日報の大株主になった。\n\n平成7年　黒田惣一郎死去。書けるか、と思った。だが手帳がない。証拠のない記事は、佐伯修を二度殺すことになる。\n\n平成9年　沖田さんから電話。「あの子の居場所は分かっとる。だが手帳が見つかるまでは、行かんでくれ」。宮下時計店。時雨町。\n\n平成27年（陽の書きこみ）　祖父、入院。最後に言ったこと。「封筒は、手帳と一緒にな」"},"techou_a":{"title":"鳶色の手帳（抜き書き・昭和21〜33年）","text":"昭和21年6月　引き揚げ船の中で、久我が死んだ。おれは約束した。久我の名前で生きる。久我の母を、最後まで頼まれた。\n\n昭和21年8月　信州の寺へ。母上は目が見えない。おれの手を握って、誠一郎、と呼んだ。はい、と答えた。\n\n昭和23年　闇市で、中古の機帆船を一艘。久我の名前で、借金をした。\n\n昭和25年　久我海運。看板の字は、久我に習った字で書いた。\n\n昭和26年　黒田惣一郎を雇う。数字に強く、人を見る目がある。…人を使う目も。\n\n昭和28年　美代子と結婚。本当のことは言えなかった。\n\n昭和30年4月　娘が生まれた。千鶴と名づけた。この子のために、おれは久我誠一郎として生きる。この子には、何も背負わせない。\n\n昭和31年4月　母上が亡くなった。住職さまから、母上の口述の手紙を受け取る。まだ読めん。\n\n昭和33年　空襲で親をなくした磯村という子を、書生として家に置く。十六。昔のおれに似とる。\n\n昭和33年10月　新社屋の写真を撮られた。断ればよかった。"},"techou_b":{"title":"鳶色の手帳（抜き書き・昭和33〜35年）","text":"昭和33年11月　戸川源次が会社に来た。船で見たと言う。\n\n昭和34年1月　三十万。払えば、また来る。払わねば、汐見の警察へ行く。\n\n昭和34年2月10日　取り返しのつかないことをした。\n\n昭和34年2月（数日後、落ちついた字で）　品川の千鳥屋。源次は酒に酔うて、千鶴の名前を出した。娘にも教えてやる、と。気がついたら、荷札のひもを手に巻いとった。窓を開け、火鉢を消した。汐見の漁師なら誰でも知っとることを、人を隠すのに使うた。\n\n昭和34年3月　黒田が来た。「社長の秘密は、私がお守りします。そのかわり、会社のことは私にお任せを」。捜査は止まった。止めたのは、わしの罪を知る男じゃ。\n\n昭和35年10月　汐見の刑事がまだ追うとる。あの火事のときの、若い巡査さんじゃ。あの人には、わしの口から話したい。\n\n昭和35年12月　汐見へ帰る。母上の手紙は、この手帳から外して持っていく。黒田に渡すわけにはいかん。\n\n千鶴。おまえの父の名前は、佐伯修という。久我誠一郎は、父の恩人の名前じゃ。どちらの名前も、汚してしもうた。すまん。"},"miyoko":{"title":"佐伯から美代子への手紙（昭和35年12月・汐見の浜屋から）","text":"美代子へ\n\nわしは久我誠一郎ではない。汐見の漁師の倅で、佐伯修という。戦地で死んだ恩人の名前を借りて、生きてきた。お前を、偽りの名前の中に巻きこんだ。千鶴もじゃ。\n\n品川で人を殺したのも、わしじゃ。お前が新聞で何を読んでも、それは本当のことじゃ。\n\n千鶴には、父は事故で死んだと言うてくれ。あの子が大人になって、知りたいと思うたら、そのとき本当のことを。\n\n頼みがひとつある。千鶴に、父は立派な人だったと言うてやってくれ。嘘でいい。あの子が胸を張れるように。\n\n　　　　　修"},"nonomura":{"title":"野々村の日記（抜き書き）","text":"昭和34年2月10日　社長の寝台券で夜汐に乗る。社長は「わしは品川で用がある」と言った。何の用か、聞かなかった。聞けば、止められたかもしれない。\n\n昭和34年3月　刑事さんに本当のことを言った。社長は、ぼくを一度も責めなかった。\n\n昭和36年　会社を辞める。黒田さんは、引き留めなかった。\n\n昭和40年　川崎の夜間中学の教師になる。昼間働く人たちに、字を教える。社長も、昔、戦地で誰かに字を教わったと言っていた。\n\n平成22年（娘・静の書きこみ）　父、死去。最後の夜、「社長は、ぼくに夜学の月謝を出してくれた人だ」と、何度も言っていました。"},"okita":{"title":"沖田庄吉の日誌（汐見署に残された遺品）","text":"昭和35年12月　佐伯、上がらず。三島くんに封筒を渡した。\n\n昭和36年12月　浜に花を流す。二人分。佐伯と、源次と。\n\n昭和50年3月　退職。品川の件は、わしの中では終わっとらん。\n\n昭和63年5月　東京の下町、時雨町に宮下という時計屋。千鶴さんだった。腕時計の修理を頼んだ。手帳が見つかるまでは名乗らんと決めた。あの子は、佐伯と同じ、細い器用な指をしていた。\n\n平成9年　三島くんに電話。あの子の居場所を伝えた。\n\n平成10年（最後の書きこみ）　海が鳴っとる。今年も、花は二人分。"},"gunji":{"title":"久我誠一郎の軍事郵便（志乃あて・寺に残っていたもの）","text":"母上様\n\nこちらは暑く、毎日汗ばかりかいております。部隊に、汐見という日本海の港町の漁師の倅がおります。佐伯と申します。網の繕いがたいそううまく、私は網を教わり、かわりに字を教えております。無口ですが、まっすぐな男です。\n\n私は、東京に帰ったら、また本を読む暮らしに戻りたいと思います。母上の目のかわりに、たくさん本を読んで差し上げます。\n\n昭和二十年一月　誠一郎"}},"requires":[{"id":"kamomejima","title":"鴎島館の論理"},{"id":"furiko","title":"振り子の止まる夜"},{"id":"fuyu-shiomi","title":"冬の汐見"}],"audio":{"base":"../../audio/","credit":"音楽：OpenTracks（旧DOVA-SYNDROME）。音源の抜き出し・転用・再配布は禁止です。","title":"epilogue_daily","bgm":"epilogue_daily","deduce":"common_deduce","ending":"epilogue_ending","step":"asphalt","amb":{"shop":"amb_clocks","temple":"amb_temple","haka":"amb_temple","room":"amb_room","kuroda":"amb_room","kawasaki":"amb_room","police":"amb_room","geshuku":"amb_room","isobe":"amb_harbor_now","grave":"amb_harbor_now","beach":"amb_harbor_now"}},"assets":{"bg":{"beach":"bg/beach.webp","geshuku":"bg/geshuku.webp","grave":"bg/grave.webp","isobe":"bg/isobe.webp","kawasaki":"bg/kawasaki.webp","kuroda":"bg/kuroda.webp","police":"bg/police.webp","room":"bg/room.webp","shop":"bg/shop.webp","temple":"bg/temple.webp"}}}</script>
<script>
// mystery-games 共通エンジン
// シナリオは <script id="game-data"> の JSON から読む（tools/build.py が埋め込む）。
// 書き方は engine/README.md を参照。
'use strict';
(() => {
const D = JSON.parse(document.getElementById('game-data').textContent);
const KEY = 'mg:' + D.id;
const $ = id => document.getElementById(id);
const SLOTS = 3;

// ---------- 保存 ----------
const store = {
  get(k) { try { const v = localStorage.getItem(KEY + ':' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) {} },
};
function markCleared() {
  if (SIM) return;
  try {
    const c = JSON.parse(localStorage.getItem('mg:cleared') || '[]');
    if (!c.includes(D.id)) { c.push(D.id); localStorage.setItem('mg:cleared', JSON.stringify(c)); }
  } catch (e) {}
}

// ---------- 状態 ----------
let S = null;
let pending = {};
// 検証モード（tools/verify.py）：画面に何も出さず、場面は一気に進め、章の終わりや謎解きで止まる
let SIM = false;
const simSeen = new Set();
const fresh = () => ({ chapter: D.start, loc: null, f: {}, v: { turns: 0, miss: 0 }, items: [], seq: {}, done: false, log: [], cards: [], memo: '', seenCards: 0 });
const ch = () => D.chapters[S.chapter];
const loc = () => ch().locations[S.loc];
// 場所にいる人。{"id": "...", "if": "条件"} で、場面によって出入りさせられる
const here = (L = loc()) => (L.people || []).filter(p => typeof p === 'string' || cond(p.if)).map(p => typeof p === 'string' ? p : p.id);
const person = p => D.people[p] || { name: p };
const short = p => person(p).short || person(p).name;
// 助手（ヒント役）は章ごとに変えられる：章の assistant / assistantHint / hintTopic が game.json より優先
const AS = () => ('assistant' in ch()) ? ch().assistant : D.assistant;
const HT = () => ch().hintTopic || D.hintTopic;
const fmt = (t, o) => String(t).replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
function snapshot(label) {
  return { state: JSON.parse(JSON.stringify(S)), at: Date.now(), label: label || ((ch().label ? ch().label + ' ' : '') + (loc() ? loc().name : '')) };
}
function autosave() { if (S && !SIM) store.set('auto', snapshot()); }

// ---------- 条件 ----------
// 例: "has:capsule && !flag:sent"  "var:wait>=1"  "count:talk:haru>=2" は不可（キーは英数字と _ -）
const TOK = /\s*(\|\||&&|!|\(|\)|true|false|[a-z]+:[A-Za-z0-9_\-]+(?:\s*(?:>=|<=|==|!=|>|<)\s*-?\d+)?)/y;
function cond(src) {
  if (src == null || src === '') return true;
  const toks = []; TOK.lastIndex = 0;
  while (TOK.lastIndex < src.length) {
    const at = TOK.lastIndex, m = TOK.exec(src);
    if (!m) { if (/^\s*$/.test(src.slice(at))) break; throw new Error('条件の書き方が正しくありません: ' + src); }
    toks.push(m[1]);
  }
  let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const or = () => { let v = and(); while (peek() === '||') { next(); const r = and(); v = v || r; } return v; };
  const and = () => { let v = not(); while (peek() === '&&') { next(); const r = not(); v = v && r; } return v; };
  const not = () => { if (peek() === '!') { next(); return !not(); } return atom(); };
  const atom = () => {
    const t = next();
    if (t === '(') { const v = or(); if (next() !== ')') throw new Error('かっこが閉じていません: ' + src); return v; }
    return term(t, src);
  };
  const v = or();
  if (p < toks.length) throw new Error('条件の書き方が正しくありません: ' + src);
  return v;
}
function term(t, src) {
  if (t === 'true') return true;
  if (t === 'false') return false;
  const m = t && t.match(/^([a-z]+):([A-Za-z0-9_\-]+)(?:\s*(>=|<=|==|!=|>|<)\s*(-?\d+))?$/);
  if (!m) throw new Error('条件の書き方が正しくありません: ' + src);
  const [, k, n, op, num] = m;
  if (k === 'has') return S.items.includes(n);
  if (k === 'flag') return !!S.f[n];
  if (k === 'here') return S.loc === n;
  if (k === 'var' || k === 'talked') {
    const x = k === 'var' ? (S.v[n] || 0) : (S.seq['talkc:' + S.chapter + ':' + n] || 0);
    if (!op) return x > 0;
    const y = +num;
    return { '>=': x >= y, '<=': x <= y, '==': x === y, '!=': x !== y, '>': x > y, '<': x < y }[op];
  }
  throw new Error('不明な条件: ' + t);
}

// ---------- 効果 ----------
function run(list) {
  for (const e of list || []) {
    const i = e.indexOf(':'), k = i < 0 ? e : e.slice(0, i), a = i < 0 ? '' : e.slice(i + 1);
    switch (k) {
      case 'give': if (!S.items.includes(a)) { S.items.push(a); toast('入手：' + D.items[a]); snd.se('note'); } break;
      case 'take': S.items = S.items.filter(x => x !== a); break;
      case 'flag': S.f[a] = 1; break;
      case 'unflag': delete S.f[a]; break;
      case 'set': { const [n, v] = a.split('='); S.v[n] = +v; break; }
      case 'inc': S.v[a] = (S.v[a] || 0) + 1; break;
      case 'miss': S.v.miss = (S.v.miss || 0) + 1; break;
      case 'toast': if (!S.toasted) S.toasted = []; if (!S.toasted.includes(a)) { S.toasted.push(a); toast(a); } break;
      case 'goto': pending.goto = a; break;
      case 'puzzle': pending.puzzle = a; break;
      case 'ending': pending.ending = a; break;
      case 'chapter': pending.chapter = a; break;
      case 'event': pending.event = a; break;
      case 'board': pending.board = a; break;
      case 'choice': pending.choice = a; break;
      case 'search': pending.search = a; break;
      case 'doc': if (!S.docs) S.docs = []; if (!S.docs.includes(a)) { S.docs.push(a); toast('資料に追加：' + D.docs[a].title); snd.se('note'); } break;
      case 'card': { const k = a.indexOf(':'); addCard({ card: a.slice(k + 1) }, { p: a.slice(0, k) || null }); break; }
      default: throw new Error('不明な効果: ' + e);
    }
  }
}
const runAll = rules => (rules || []).forEach(r => { if (cond(r.if)) run(r.do); });

// 文字列 / ルール / ルールの配列（最初に条件が合うもの）/ {seq:[...]}（話すたびに次へ。最後はくり返し）
function resolve(entry, key) {
  if (entry == null) return null;
  if (typeof entry === 'string') return { text: entry };
  if (Array.isArray(entry)) return entry.find(r => cond(r.if)) || null;
  if (entry.seq) { const k = S.chapter + '|' + key, i = S.seq[k] || 0; S.seq[k] = i + 1; return entry.seq[Math.min(i, entry.seq.length - 1)]; }
  return cond(entry.if) ? entry : null;
}

// ---------- 表示 ----------
let typer = null, full = '', toastT;
const toastLog = [];
function toast(t) { toastLog.push(t); if (SIM) return; const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }
function say(t, meta) {
  if (t == null) return;
  if (S && !(meta && meta.nolog)) S.log.push({ c: S.chapter, l: S.loc, p: (meta && meta.p) || null, t });
  if (SIM) { simSeen.add(t); return; }

// game.json の audio: {base, title, bgm, deduce, ending, step, amb: {場所id: 環境音}}。章は audio: {bgm, amb, hush}

})();

    btns([...here().map(p => [person(p).name, () => showTo(i, p)]), ['もどる', showMenu, 'back']], D.items[i] + 'をだれに見せる？');

}
function showTo(i, p) {

}

function accuse(p) {
  const A = ch().accuse;
  if (p === A.culprit) {
    const miss = (A.required || []).filter(x => !cond(x.if)).map(x => '・' + x.label);
    if (miss.length) return act({ text: fmt(A.missingText, { missing: miss.join('\n'), name: short(p) }) });
    autosave();

// ---------- イベント（何ページか続けて見せる場面） ----------
// 章の events: {id: {bg, place, pages: [文...], do: [最後に行う効果]}}

// ---------- 考える（助手のいない章のヒント） ----------
// 章の think：ルール（hints も使える）。まず「まだ話を聞いていない人」を thinkHint の文で教え、なければ think の文
function think() {
  const h = assistantHint(ch().thinkHint);
  if (h) { S.v.hints = (S.v.hints || 0) + 1; return act(h); }
  const e = ch().think;
  if (Array.isArray(e)) {
    const i = e.findIndex(r => cond(r.if)), r = e[i];
    if (r && r.hints) {
      const hk = 'hint:' + S.chapter + ':think:' + i, lv = S.seq[hk] || 0;
      S.seq[hk] = lv + 1; S.v.hints = (S.v.hints || 0) + 1;
      return act({ text: r.hints[Math.min(lv, r.hints.length - 1)], do: r.do });
    }
  }
  act(resolve(e, 'think') || { text: '…いまは、考えがまとまらない。' });
}

// ---------- 記事の検索 ----------
// 章の searches: {id: {label, prompt, placeholder, entries: [{keys: [ことば...], ...ルール}], none}}。効果 search:id で出す
// 入力した言葉に keys のどれかが含まれていれば、そのルールを行う（最初に当たったもの。if も使える）
// 空白を無視し、全角を半角にそろえ、数字の頭の0を取る（「10月08日」→「10月8日」）
const norm = t => String(t).normalize('NFKC').replace(/\s/g, '').replace(/(^|\D)0+(?=\d)/g, '$1');
function searchAnswer(id, q) {
  const Q = ch().searches[id]; S.simSearch = null;
  // 見つからないときは、その返事を残したまま入力欄を出し直す
  if (!norm(q)) { reask = id; return act({ text: Q.empty || '何も入力していない。', do: ['search:' + id] }); }
  S.v.searches = (S.v.searches || 0) + 1;
  const hit = Q.entries.find(e => cond(e.if) && e.keys.some(k => norm(q).includes(norm(k))));
  if (hit) return act(hit);
  reask = id; act({ text: fmt(Q.none || '「{q}」の記事は見つからなかった。', { q }), do: ['search:' + id] });
}
function openSearch(id) {
  snd.deduce(true);
  const Q = ch().searches[id];
  if (Q.prompt && reask !== id) say(Q.prompt, { nolog: true });
  reask = null;
  const c = $('cmd'); c.innerHTML = ''; c.className = 'list';
  c.insertAdjacentHTML('beforeend', `<div class="label">${esc(Q.label || 'ことばで探す')}</div><input id="sq" type="search" enterkeyhint="search" placeholder="${esc(Q.placeholder || '例：会社の名前')}" autocomplete="off">`);
  const go = () => searchAnswer(id, $('sq').value);
  $('sq').onkeydown = e => { if (e.key === 'Enter') go(); };
  [['探す', go, 'primary'], ['手帳を見る', () => openNotebook(), 'back'], ['やめる', () => main(), 'back']].forEach(([t, fn, cls]) => {
    const b = document.createElement('button'); b.className = cls; b.innerHTML = `<span>${t}</span>`; b.onclick = fn; c.appendChild(b);
  });
}

// ---------- 謎解き（番号入力） ----------
function openPuzzle(id) {

function puzzleAnswer(id, code) {

// ---------- 推理ボード（消去法） ----------
// 章の boards: {id: {suspects: [人物id], conditions: [{id, label, keeps: [条件に合う人物id], correct}], culprit,
//   success: ルール, wrong: {none, many, decoy}}}
// 条件を選ぶたびに、合わない人が外れる。正しい条件をすべて選んで犯人ひとりが残れば成功
const boardLeft = (B, sel) => B.suspects.filter(p => sel.every(cid => B.conditions.find(c => c.id === cid).keeps.includes(p)));
function boardSubmit(id, sel) {
  const B = ch().boards[id];
  S.simBoard = null;
  const left = boardLeft(B, sel);
  // 正しい条件だけで犯人ひとりが残れば成功（犯人に合わない「まちがった条件」を選ぶと、犯人は必ず外れる）
  const ok = left.length === 1 && left[0] === B.culprit && sel.every(cid => B.conditions.find(c => c.id === cid).correct);
  if (ok) return act(B.success);
  const why = !left.length ? B.wrong.none : left.length > 1 ? B.wrong.many : B.wrong.decoy;
  act({ text: why, do: ['miss'] });
}

// ---------- 矛盾をつく ----------
// 章の contradictions: [{id, pairs: [[カードid, カードid], ...], if, text, do}]
function contradict(ids) {
  const same = (p) => (p[0] === ids[0] && p[1] === ids[1]) || (p[0] === ids[1] && p[1] === ids[0]);
  const list = ch().contradictions || [];
  const hit = list.find(x => x.pairs.some(same));
  if (hit && S.f['contra_' + hit.id]) return act({ text: hit.doneText || 'その食い違いは、もう明らかにした。' });
  if (hit && cond(hit.if)) {
    // 崩した証言カードに印を付け、認めた内容を新しいカードにする
    S.cards.forEach(c => { if (c.id && ids.includes(c.id) && hit.broken !== false && (hit.breaks || [ids[0], ids[1]]).includes(c.id)) c.broken = true; });
    return act({ text: hit.text, do: [...(hit.do || []), 'flag:contra_' + hit.id], card: hit.card, cardId: hit.cardId }, { p: hit.p || null });
  }
  if (hit) return act({ text: hit.notYet || 'いまは、それをつきつける相手がいない。' });
  act({ text: ch().contradictWrong || D.contradictWrong || 'その2つは、食い違っていないようだ…。', do: ['miss'] });
}

  m.querySelector('.nb-x').onclick = () => { if (nbSel) snd.deduce(false); nbSel = null; m.remove(); };
  m.querySelectorAll('.nb-tabs button').forEach(b => b.onclick = () => { nbTab = b.dataset.k; nbSel = null; openNotebook(); });
  document.body.appendChild(m);
  const body = m.querySelector('.nb-body');
  if (nbTab === 'docs' && !D.docs) nbTab = 'cards';
  ({ cards: nbCards, notes: nbNotes, log: nbLog, docs: nbDocs, items: nbItems, memo: nbMemo, story: nbStory })[nbTab](body);
  if (keep) body.scrollTop = keep;
}
const pinBtn = (on, fn) => { const b = document.createElement('button'); b.className = 'pin' + (on ? ' on' : ''); b.textContent = on ? '★' : '☆'; b.title = 'ピン留め'; b.onclick = e => { e.stopPropagation(); fn(); }; return b; };
function entryEl(e, onPin, isCard) {
  const d = document.createElement('div'); d.className = 'nb-entry' + (e.pin ? ' pinned' : '') + (e.broken ? ' is-broken' : '');
  const who = speaker(e), where = placeName(e.c, e.l);
  d.innerHTML = `<div class="meta">${e.broken ? '<span class="broken">崩した</span>' : ''}${esc(who || (isCard ? '調べたこと' : '（地の文）'))}${where ? '・' + esc(where) : ''}${D.chapters[e.c] && D.chapters[e.c].label ? '・' + esc(D.chapters[e.c].label) : ''}</div><div class="txt">${esc(e.t)}</div>`;
  d.prepend(pinBtn(e.pin, onPin));
  return d;
}
let nbSel = null; // 矛盾をつくときに選んだカードの番号
function nbCards(body) {
  S.seenCards = S.cards.length; updateNbBadge(); autosave();
  const only = nbQ.pinCards && !nbSel;
  if ((ch().contradictions || []).length && S.cards.length >= 2 && !S.done) {
    const box = document.createElement('div'); box.className = 'nb-contra';
    if (!nbSel) {
      box.innerHTML = '<button class="big primary">矛盾をつく</button><small>食い違っている証言カードを2枚選んで、つきつける</small>';
      box.querySelector('button').onclick = () => { nbSel = []; snd.deduce(true); openNotebook(); };
    } else {
      box.innerHTML = `<div class="sel">食い違うカードを2枚選ぶ（${nbSel.length}/2）</div><div class="row2"><button class="big back">やめる</button><button class="big primary" ${nbSel.length === 2 ? '' : 'disabled'}>つきつける</button></div>`;
      const [cancel, go] = box.querySelectorAll('button');
      cancel.onclick = () => { nbSel = null; snd.deduce(false); openNotebook(); };
      go.onclick = () => {
        const ids = nbSel.map(i => S.cards[i].id || ('#' + i)); nbSel = null;
        $('nbook').remove(); contradict(ids);
        $('msgbox').scrollIntoView({ block: 'nearest' }); // つきつけた結果の文を、すぐ読める位置に
      };
    }
    body.appendChild(box);
  }
  const bar = document.createElement('div'); bar.className = 'nb-bar';
  bar.innerHTML = `<label><input type="checkbox" ${only ? 'checked' : ''}> ピン留めだけ</label><span class="cnt">${S.cards.length}枚</span>`;
  bar.querySelector('input').onchange = e => { nbQ.pinCards = e.target.checked; openNotebook(); };
  body.appendChild(bar);
  const list = S.cards.filter(c => !only || c.pin);
  if (!list.length) body.insertAdjacentHTML('beforeend', '<p class="nb-empty">まだ証言カードはありません。大事な証言を聞くと、ここに記録されます。</p>');
  list.forEach(c => {
    const el = entryEl(c, () => { c.pin = !c.pin; autosave(); openNotebook(); }, true);
    if (nbSel) {
      const i = S.cards.indexOf(c);
      el.classList.add('selectable'); if (nbSel.includes(i)) el.classList.add('chosen');
      el.onclick = () => {
        const k = nbSel.indexOf(i);
        if (k >= 0) nbSel.splice(k, 1); else if (nbSel.length < 2) nbSel.push(i);
        openNotebook();
      };
    }
    body.appendChild(el);
  });
}
function nbLog(body) {
  const whoSet = [...new Set(S.log.map(speaker).filter(Boolean))];
  const placeSet = [...new Set(S.log.map(e => e.c + '|' + e.l).filter(k => !k.endsWith('|null')))];
  const chSet = [...new Set(S.log.map(e => e.c))];
  const sel = (key, opts, label) => `<select data-k="${key}"><option value="">${label}</option>${opts.map(([v, n]) => `<option value="${esc(v)}" ${nbQ[key] === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const bar = document.createElement('div'); bar.className = 'nb-filter';
  bar.innerHTML = `<input type="search" placeholder="ことばで探す" value="${esc(nbQ.q)}">`
    + sel('who', whoSet.map(w => [w, w]), '話した人：すべて')
    + sel('place', placeSet.map(k => { const [c, l] = k.split('|'); return [k, placeName(c, l)]; }), '場所：すべて')
    + (chSet.length > 1 ? sel('ch', chSet.map(c => [c, D.chapters[c].label || D.chapters[c].title || c]), '章：すべて') : '')
    + `<label><input type="checkbox" class="pinonly" ${nbQ.pin ? 'checked' : ''}> ピン留めだけ</label>`;
  body.appendChild(bar);
  const list = document.createElement('div'); body.appendChild(list);
  const draw = () => {
    const q = nbQ.q.trim();
    const hits = [];
    for (let i = S.log.length - 1; i >= 0 && hits.length < 300; i--) {
      const e = S.log[i];
      if (nbQ.who && speaker(e) !== nbQ.who) continue;
      if (nbQ.place && e.c + '|' + e.l !== nbQ.place) continue;
      if (nbQ.ch && e.c !== nbQ.ch) continue;
      if (nbQ.pin && !e.pin) continue;
      if (q && !e.t.includes(q)) continue;
      hits.push(e);
    }
    list.innerHTML = hits.length ? `<div class="cnt">${hits.length}件（新しい順）</div>` : '<p class="nb-empty">見つかりませんでした。</p>';
    hits.forEach(e => list.appendChild(entryEl(e, () => { e.pin = !e.pin; autosave(); draw(); })));
  };
  const s = bar.querySelector('input[type=search]');
  s.oninput = () => { nbQ.q = s.value; draw(); };
  bar.querySelectorAll('select').forEach(x => x.onchange = () => { nbQ[x.dataset.k] = x.value; draw(); });
  bar.querySelector('.pinonly').onchange = e => { nbQ.pin = e.target.checked; draw(); };
  draw();
}
function nbNotes(body) {
  const ns = S.notes || [];
  body.innerHTML = `<p class="nb-note">${esc(D.notes.lead || '')}（${ns.length}件）</p>` + (ns.length ? '' : '<p class="nb-empty">まだ何も書き留めていない。</p>');
  ns.forEach(n => body.appendChild(entryEl({ ...n, l: null }, () => { n.pin = !n.pin; autosave(); openNotebook(); }, true)));
}
// 資料：doc:id で増える。表や数字を見ながら推理するためのもの（game.json の docs: {id: {title, text}}）
function nbDocs(body) {
  const ds = S.docs || [];
  body.innerHTML = ds.length ? ds.map(k => `<div class="nb-entry doc"><div class="meta">${esc(D.docs[k].title)}</div><div class="txt">${esc(D.docs[k].text)}</div></div>`).join('') : '<p class="nb-empty">まだ資料はありません。</p>';
}
function nbItems(body) {
  body.innerHTML = S.items.length ? S.items.map(i => `<div class="nb-entry"><div class="txt">${esc(D.items[i])}</div></div>`).join('') : '<p class="nb-empty">まだ何も持っていない。</p>';
}
function nbMemo(body) {
  body.innerHTML = '<p class="nb-note">自分用のメモです。ゲームの進み方には関係しません。</p><textarea id="memo" placeholder="気づいたことを書いておこう"></textarea>';
  const t = body.querySelector('textarea'); t.value = S.memo || '';
  let timer; t.oninput = () => { S.memo = t.value; clearTimeout(timer); timer = setTimeout(autosave, 400); };
}
function nbStory(body) {
  const ids = Object.keys(D.chapters), upto = ids.indexOf(S.chapter);
  const parts = ids.slice(0, upto + 1).map(id => D.chapters[id]).filter(C => C.recap);
  body.innerHTML = parts.length ? parts.map(C => `<div class="nb-entry"><div class="meta">${esc((C.label || '') + ' ' + (C.title || ''))}</div><div class="txt">${esc(C.recap)}</div></div>`).join('') : '<p class="nb-empty">まだ記録はありません。</p>';
}
// 章のはじめと「つづきから」で、その章の「これまでの話」を出す
function showRecap() {
  const C = ch();
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><div class="eyebrow">これまでの話</div><h3>${esc((C.label || '') + ' ' + (C.title || ''))}</h3><p class="recap">${esc(C.recap)}</p></div>`;
  const b = document.createElement('button'); b.className = 'big primary'; b.textContent = 'つづける'; b.style.width = '100%';
  b.onclick = closeModal; m.firstChild.appendChild(b);
  document.body.appendChild(m);
}

// ---------- プレイ時間 ----------
// 画面が見えていて、最後の操作から2分以内のあいだだけ数える（放置した時間は入れない）
let lastInput = Date.now();
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, true));
setInterval(() => {
  if (!S || S.done || document.visibilityState !== 'visible' || Date.now() - lastInput > 120000) return;
  S.v.playSec = (S.v.playSec || 0) + 5;
}, 5000);
const hm = s => { s = s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };

// ---------- 起動時の一括読み込み ----------
// 背景をすべて先に読み込んでおき、遊んでいる間は通信しないようにする。
function preload() {
  const urls = Object.values((D.assets && D.assets.bg) || {});
  let done = 0, failed = 0;
  const bar = $('loadbar'), txt = $('loadtxt');
  const tick = () => { bar.style.width = (urls.length ? done / urls.length * 100 : 100) + '%'; txt.textContent = `読み込み中… ${done}/${urls.length}`; };
  tick();
  // 日本語フォントは文字ごとに分割配信されるので、ゲームで使う文字をすべて一度描いて先に取り寄せる
  const fonts = new Promise(res => {
    const chars = [...new Set(JSON.stringify(Object.assign({}, D, { assets: null })))].join('');
    const box = document.createElement('div');
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;opacity:0;pointer-events:none';
    box.innerHTML = [["'Noto Sans JP'", 400], ["'Noto Sans JP'", 500], ["'Noto Sans JP'", 700], ["'Shippori Mincho'", 700], ["'Shippori Mincho'", 800]]
      .map(([f, w]) => `<span style="font-family:${f};font-weight:${w}">${chars.replace(/[<&]/g, '')}</span>`).join('');
    document.body.appendChild(box);
    const finish = () => { box.remove(); res(); };
    if (!document.fonts) return finish();
    setTimeout(finish, 8000);
    requestAnimationFrame(() => document.fonts.ready.then(finish, finish));
  });
  return Promise.all([fonts, ...urls.map(u => new Promise(res => {
    const im = new Image();
    im.onload = () => { done++; tick(); res(); };
    im.onerror = () => { done++; failed++; tick(); res(); };
    im.src = u;
    preloaded.push(im);
  }))]).then(() => failed);
}
const preloaded = [];

window.addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('leaving'); toTitle(); } });
// ---------- 検証用（tools/verify.py が使う） ----------
const sim = {
  // 章のはじめの状態を作る（prev に前の章の終わりの状態を渡せる）
  begin(ch_, prev) {
    SIM = true; S = prev ? JSON.parse(JSON.stringify(prev)) : fresh();
    delete S.simEnd; delete S.simPuzzle; delete S.simBoard; delete S.simChoice; delete S.simSearch;
    S.chapter = ch_; S.loc = D.chapters[ch_].start.loc; resetFor(D.chapters[ch_]); say(D.chapters[ch_].start.text);
    const sd = D.chapters[ch_].start.do; if (sd) { pending = {}; openBefore = openLocs(); run(sd); after(); }
    return JSON.parse(JSON.stringify(S));
  },
  set(st) { SIM = true; S = JSON.parse(JSON.stringify(st)); },
  get() { return JSON.parse(JSON.stringify(S)); },
  actions() {
    if (S.simEnd) return [];
    if (S.simBoard) {
      // 条件の組み合わせをすべて試す
      const B = ch().boards[S.simBoard], ids = B.conditions.map(c => c.id), out = [];
      for (let m = 1; m < (1 << ids.length); m++) out.push({ t: 'board', id: S.simBoard, sel: ids.filter((_, i) => m & (1 << i)) });
      return out;
    }
    if (S.simSearch) { const Q = ch().searches[S.simSearch]; return [...Q.entries.map(e => ({ t: 'search', id: S.simSearch, q: e.keys[0] })), { t: 'search', id: S.simSearch, q: 'ああああ' }]; }
    if (S.simChoice) return ch().choices[S.simChoice].options.map((_, i) => ({ t: 'choice', id: S.simChoice, i }));
    if (S.simPuzzle) { const P = ch().puzzles[S.simPuzzle]; return [{ t: 'code', id: S.simPuzzle, code: P.answer }, { t: 'code', id: S.simPuzzle, code: P.answer === '0000' ? '1111' : '0000' }]; }
    const a = [];
    Object.keys(ch().locations).forEach(k => { if (k !== S.loc && avail(k)) a.push({ t: 'move', k }); });
    if (ch().think) a.push({ t: 'think' });
    here().forEach(p => { const ts = topicsOf(p); if (ts) ts.forEach(tp => a.push({ t: 'topic', p, tp })); else a.push({ t: 'talk', p }); });
    Object.keys(loc().objs || {}).forEach(o => a.push({ t: 'look', o }));
    S.items.forEach(i => here().forEach(p => a.push({ t: 'show', i, p })));
    if (ch().accuse) accusable().forEach(p => a.push({ t: 'accuse', p }));
    const cs = ch().contradictions || [];
    if (cs.length && S.cards.length >= 2) {
      const ids = S.cards.map((c, i) => c.id || '#' + i);
      cs.forEach(x => x.pairs.forEach(([u, v]) => { if (ids.includes(u) && ids.includes(v)) a.push({ t: 'contra', ids: [u, v] }); }));
      a.push({ t: 'contra', ids: [ids[0], ids[1]] });
    }
    return a;
  },
  apply(x) {
    switch (x.t) {
      case 'move': return moveTo(x.k);
      case 'talk': return talk(x.p);
      case 'topic': return talkTopic(x.p, x.tp);
      case 'look': return look(x.o);
      case 'show': return showTo(x.i, x.p);
      case 'accuse': return accuse(x.p);
      case 'contra': return contradict(x.ids);
      case 'code': return puzzleAnswer(x.id, x.code);
      case 'board': return boardSubmit(x.id, x.sel);
      case 'choice': return choose(x.id, x.i);
      case 'search': return searchAnswer(x.id, x.q);
      case 'think': return think();
    }
  },
  seen: () => [...simSeen],
};

document.title = D.title;
window.__mg = { get state() { return S; }, get sound() { return snd.state; }, cond, D, openNotebook, toastLog, sim, startChapter: id => { $('wrap').classList.remove('hide'); startChapter(id); } };
preload().then(failed => {
  $('loading').classList.add('hide');
  toTitle();
  soundPanel(null, true);
  if (failed) toast(`背景 ${failed} 枚を読み込めませんでした`);
});
})();

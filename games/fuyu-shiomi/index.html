<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冬の汐見</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;height:100%;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#wrap{width:100%;max-width:560px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#wrap>*{flex-shrink:0} /* 長い文で文章欄が縮んで、文がボタンの下にはみ出さないように */
header{display:flex;align-items:center;justify-content:space-between}
#locname{font-family:'Shippori Mincho',serif;font-weight:800;font-size:19px;letter-spacing:.04em}
#locname small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.2em;margin-bottom:1px}
#bag-unused{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#bag-unused b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#scene{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px #0008}
#scene svg{width:100%;height:100%;display:block;filter:saturate(.8) contrast(1.05)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%),linear-gradient(180deg,transparent 60%,#0009);pointer-events:none}
#here{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
#here span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
#msgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-height:150px;position:relative;cursor:pointer}
#who{display:none;position:absolute;top:-12px;left:16px;background:var(--accent);color:#1a1405;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
#who.on{display:block}
#msg{font-size:16px;line-height:1.85;white-space:pre-wrap}
#msgbox.more::after{content:'';position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(45deg)}}
#cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cmd .label{grid-column:1/-1;color:var(--sub);font-size:13px;padding:2px 2px 0}
#cmd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;min-height:64px}
#cmd button svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cmd button:hover{border-color:var(--accent)}
#cmd button:active{transform:scale(.96);background:#262c3a}
#cmd.list{grid-template-columns:1fr 1fr}
#cmd.list button{flex-direction:row;justify-content:flex-start;min-height:50px;padding:10px 14px;text-align:left}
#cmd.pad{grid-template-columns:repeat(5,1fr)}
#cmd.pad button{min-height:52px;font-size:20px;border-radius:50%;aspect-ratio:1;padding:0}
#cmd button.back{background:transparent;color:var(--sub);border-style:dashed}
#cmd.pad button.back{border-radius:14px;aspect-ratio:auto;grid-column:1/-1;font-size:14px}
#cmd button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#cmd.one{grid-template-columns:1fr}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px #0006;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px;overflow:auto}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em}
#title h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:44px;line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 30px #000}
#title p{color:var(--sub);font-size:14px;line-height:1.9}
.big{width:240px;padding:14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:15px;font-weight:500;cursor:pointer}
.big.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#prologue{justify-content:flex-start}
#prologue .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:left;line-height:1.95;font-size:15px;margin:auto 0}
#prologue h2{font-family:'Shippori Mincho',serif;font-size:24px;text-align:center;margin-bottom:14px}
#prologue b{color:var(--accent)}
#prologue .cast{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
#prologue .cast div{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
#prologue .cast span{min-width:76px;color:var(--blue);font-weight:700}
.hide{display:none!important}

#hdr-r{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px 26px;max-height:85vh;overflow:auto}
#modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:12px}
#modal .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:14px}
#modal .row:not([disabled]):hover{border-color:var(--accent)}
#modal .row .t{flex:1}
#modal .row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#modal .row[disabled]{opacity:.45;cursor:default}
#modal .close{margin-top:6px;width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
#card{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 40%,#24304a 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:fade .6s}
#card .n{color:var(--accent);letter-spacing:.35em;font-size:13px}
#card .t{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;letter-spacing:.08em}
#card .tap{color:var(--sub);font-size:12px;margin-top:30px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#bg,#bg img{width:100%;height:100%;display:block;object-fit:cover}
#loading .bar{width:220px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px}
#nbook{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.nb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.nb-head h3{font-family:'Shippori Mincho',serif;font-size:21px}
.nb-x{background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.nb-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb-tabs button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.nb-tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.nb-body{flex:1;overflow:auto;padding:12px 14px 30px}
.nb-entry{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 44px 11px 14px;margin-bottom:8px}
.nb-entry.pinned{border-color:var(--accent)}
.nb-entry .meta{color:var(--blue);font-size:12px;font-weight:700;margin-bottom:3px}
.nb-entry .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.nb-entry .pin{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:20px;color:var(--sub);cursor:pointer;padding:2px 6px}
.nb-entry .pin.on{color:var(--accent)}
.nb-bar,.nb-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)}
.nb-filter input[type=search]{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px}
.nb-filter select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--text);font:inherit;font-size:13px;max-width:48%}
.nb-bar .cnt,.nb-body .cnt{margin-left:auto;color:var(--sub);font-size:12px;margin-bottom:6px}
.nb-empty,.nb-note{color:var(--sub);font-size:13px;line-height:1.8;padding:6px 2px}
#memo{width:100%;min-height:50vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:15px;line-height:1.8;resize:vertical}
#modal .recap{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:6px 0 18px}
#modal .eyebrow{margin-bottom:4px}
.nb-contra{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center;position:sticky;top:0;z-index:1}
.nb-contra .big{width:100%}
.nb-contra small{display:block;color:var(--sub);font-size:12px;margin-top:6px}
.nb-contra .sel{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.nb-contra .row2{display:flex;gap:8px}
.nb-contra .row2 .big{flex:1;width:auto}
.nb-contra .big.back{background:transparent;color:var(--sub);border-style:dashed}
.nb-contra .big[disabled]{opacity:.4}
.nb-entry.selectable{cursor:pointer}
.nb-entry.chosen{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
#cmd button{position:relative}
#cmd .badge{position:absolute;top:7px;right:9px;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;line-height:1.5}
.big,.pill,#modal .row,.nb-tabs button,.nb-x{transition:transform .08s,filter .15s,background .15s}
.big:active,.pill:active,#modal .row:not([disabled]):active,.nb-tabs button:active,.nb-x:active{transform:scale(.96);filter:brightness(1.25)}
.big.going{filter:brightness(1.25);pointer-events:none}
body.leaving::after{content:'開いています…';position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0e1117cc;color:var(--text);font-size:15px;letter-spacing:.1em;animation:fade .2s}
.nb-entry .broken{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;font-size:10.5px;padding:0 8px;margin-right:6px}
.nb-entry.is-broken .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c2553f99}
#modal .board .b-sus{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
#modal .board .b-sus span{background:var(--accent);color:#1a1405;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transition:.2s}
#modal .board .b-sus span.out{background:var(--panel2);color:var(--sub);text-decoration:line-through;font-weight:400}
#modal .board .row.on{border-color:var(--accent);background:#2a2a20}
#modal .board .row2{display:flex;gap:8px;margin-top:10px}
#modal .board .row2 .big{flex:1;width:auto}
#modal .board .row2 .big[disabled]{opacity:.4}
.nb-entry.doc{padding-right:14px}.nb-entry.doc .txt{white-space:pre-wrap;font-variant-numeric:tabular-nums;line-height:1.7}
#cmd #sq{grid-column:1/-1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:inherit}
#title .lock{color:var(--accent);margin:18px 0 6px}
/* 音のオン・オフ */
.pill.off{color:var(--sub);text-decoration:line-through}
#title .pill.sndt{position:absolute;top:14px;right:14px;font-size:12px}  /* 音のボタンは右上の端に */
#title .credit{color:#5c6370;font-size:11px;line-height:1.7;max-width:320px;margin-top:6px}
#sndpop{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
#sndpop .sheet{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px 18px}
#sndpop h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:6px}
#sndpop .lead{color:var(--sub);font-size:13px;line-height:1.7;margin-bottom:14px}
#sndpop .row{display:grid;grid-template-columns:4.5em 1fr 2.5em;align-items:center;gap:10px;padding:8px 0}
#sndpop .n{font-size:14px;font-weight:500}
#sndpop .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
#sndpop input[type=range]{width:100%;accent-color:var(--accent);height:28px}
#sndpop .btns{display:flex;gap:8px;margin-top:14px}
#sndpop .btns .big{flex:1;width:auto}
#sndpop .big.back{background:transparent;color:var(--sub);border-style:dashed}
/* デバッグ：進み具合 */
.pill.dbg{border-color:#e0a43a;color:#e0a43a}
#flow{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#flow .fl-head{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#flow .fl-head b{color:#e0a43a;font-size:15px;white-space:nowrap}
#flow select{flex:1;min-width:0;font:inherit;font-size:13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
#flow .fl-x{font-size:22px;background:none;border:0;color:var(--sub);padding:0 6px;cursor:pointer}
#flow .fl-legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px 0;font-size:12px;color:var(--sub);align-items:center}
#flow .fl-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--line)}
#flow .fl-legend .done::before{background:#3f6b4a}#flow .fl-legend .now::before{background:#e0a43a}#flow .fl-legend .wait::before{background:#2a3142}
#flow .fl-tip{font-size:11.5px;color:var(--sub);padding:6px 14px 8px;line-height:1.6}
#flow .fl-cols{flex:1;overflow:auto;display:flex;gap:12px;padding:4px 14px 20px;align-items:flex-start}
#flow .fl-col{flex:0 0 220px;display:flex;flex-direction:column;gap:8px}
#flow .fl-lv{font-size:12px;color:var(--sub);position:sticky;top:0;background:var(--bg);padding:4px 0}
#flow .fl-n{text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid #2a3142;border-radius:10px;padding:8px 10px;color:var(--text);display:flex;flex-direction:column;gap:3px;cursor:pointer}
#flow .fl-n .k{font-size:12.5px;font-weight:700;line-height:1.45}
#flow .fl-n .t{font-size:11px;color:var(--sub);line-height:1.5}
#flow .fl-n .g{font-size:11px;color:#9fb4d8;line-height:1.5}
#flow .fl-n.done{border-left-color:#3f6b4a;opacity:.75}#flow .fl-n.now{border-left-color:#e0a43a;box-shadow:0 0 0 1px #e0a43a55}#flow .fl-n.wait{border-left-color:#2a3142}
#flow .fl-n.sel{outline:2px solid #fff}#flow .fl-n.up{outline:2px solid #6aa9ff}#flow .fl-n.down{outline:2px solid #c77dff}#flow .fl-n.dim{opacity:.3}
#flow.hide-done .fl-n.done{display:none}
@media (max-width:600px){#flow .fl-cols{flex-direction:column;align-items:stretch}#flow .fl-col{flex:none}#flow .fl-lv{position:static}}
/* いつも同じボタン（記録・もどる）は、一覧の線の下にまとめる。記録はもどる（点線）とも中身のボタン（塗り）ともちがう、金色の枠 */
#cmd .foot{grid-column:1/-1;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
#cmd .foot button{flex:1;min-height:46px;flex-direction:row;justify-content:center;gap:7px;padding:8px 12px}
#cmd button.nb{background:transparent;border:1.5px solid var(--accent);color:var(--accent);position:relative}
#cmd .foot button.nb{border-radius:999px}
#cmd .foot button.nb svg{width:18px;height:18px}
#cmd button.nb:active{background:#2a2414}
#cmd .foot .badge{top:-8px;right:-4px}

</style>
</head>
<body>
<div id="loading" class="screen"><div class="eyebrow">LOADING</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">読み込み中…</p></div>
<div id="title" class="screen hide"></div>
<div id="prologue" class="screen hide"></div>
<div id="toast"></div>
<div id="wrap" class="hide">
  <header><div id="locname"></div><div id="hdr-r"><button class="pill" id="menu">メニュー</button><button class="pill" id="snd" aria-label="音の設定"></button></div></header>
  <div id="scene"><div id="bg"></div><div id="here"></div></div>
  <div id="msgbox"><div id="who"></div><div id="msg"></div></div>

告しよう"]}],"contradictions":[]},"ch4":{"id":"ch4","label":"第四章","title":"久我誠一郎","recap":"源次は久我海運の社長に3回会い、借金取りには「久我海運の社長から大金が入る」と言っていた。下宿の暦の2月10日には「夜　K」。千鳥屋の窓は、部屋を冷やして死亡時刻を遅く見せるために開けられていたのかもしれない。死亡は10日の夜もありうる。だが会社の予定では、社長は10日の夜、夜行で大阪へ発っている。","start":{"loc":"office","text":"昭和34年2月23日、月曜日。久我海運、七階の社長室。\n\n窓の外に、日本橋の屋根が広がっている。机の向こうの男は、新聞の写真よりも少し痩せて見えた。\n\n久我「警視庁の方と…汐見の方、ですか。遠いところを。久我です」","do":["set:day=9"]},"talk":{"hayase":{"topics":{"ima":[{"if":"!flag:alibi","text":"早瀬「（小声で）沖田さん、2月10日の夜のことを聞きましょう」"},{"if":"!flag:nono_see","text":"早瀬「秘書の野々村さんにも、話を聞いておきましょう」"},{"text":"早瀬「…あの社長、ひとつも隙がないですね」"}],"hint":[{"if":"!flag:alibi","hints":["早瀬「まずは、10日の夜のことです」","早瀬「久我社長に『2月10日の夜』を聞きましょう」"]},{"if":"!flag:himo","hints":["早瀬「この部屋、何か気になるものはありませんか。…凶器は、麻ひもでしたよね」","早瀬「社長室の、社長の机を『調べる』です」"]},{"if":"!flag:kuga11","hints":["早瀬「11日のことも、聞いておきましょう」","早瀬「久我社長に『2月11日のこと』を聞きましょう」"]},{"if":"!flag:tanomaa","hints":["早瀬「沖田さん、汐見のことを社長に聞いてみたらどうです」","早瀬「久我社長に『佐伯修のこと』を聞いてみましょう。…2回」"]},{"if":"!flag:nono_see","hints":["早瀬「社長を見送った人はいないんでしょうか」","早瀬「秘書室の野々村さんに『2月10日の夜』を聞きましょう」"]},{"if":"!flag:miyoko","hints":["早瀬「家の人の話も聞いておきたいですね」","早瀬「久我邸の奥さんに『2月10日の夜』を聞きましょう」"]},{"hints":["早瀬「警視庁に戻りましょう」"]}],"zatsudan":{"text":"早瀬「社長室、うちの課より広いですよ…」"}}},"kuga":{"topics":{"tooka":{"seq":[{"text":"久我「10日の夜は、21時30分の夜行急行『夜汐』で大阪へ発ちました。寝台です。控えもありますよ」\n\n久我は、机の引き出しから寝台券の控えを出した。「2月10日　夜汐　2号車　下段　久我誠一郎」。","card":"久我：10日夜は21時30分発の夜行急行「夜汐」で大阪へ（寝台券の控え：2号車 下段 久我誠一郎）","cardId":"alibi","do":["flag:alibi","give:meishi"]},{"text":"久我「車掌が検札に来ましたから、記録も残っているでしょう。…お疑いなら、どうぞ」"}]},"juichi":[{"if":"flag:alibi","text":"久我「11日の朝8時40分に大阪に着いて、ホテル浪速に入りました。夜行はどうも眠れなくて、朝から部屋で休んでいたんです。15時に、ロビーで支店長の森下と会いました」","card":"久我：11日は朝8時40分に大阪着。ホテル浪速で朝から部屋で休み、15時にロビーで支店長と会った","cardId":"kuga11","do":["flag:kuga11"]},{"text":"久我「11日ですか。…まず、10日のことからお話ししましょう」"}],"genji":{"seq":[{"text":"久我「戸川さん…ええ、何度かいらっしゃいました。戦地で苦労された方だと言って、援助を頼まれた。会社としてはお断りしました」\n\n久我「亡くなったとは、存じませんでした。お気の毒に」","card":"久我：源次は援助を頼みに来たが、会社として断った"},{"text":"久我「それ以上のことは、何も」"}]},"saeki":{"seq":[{"text":"沖田「汐見の磯 05「久我誠一郎　東京」。"},"tsuyoguchi":{"text":"裏の通用口。フロントの前を通らずに、エレベーターへ行ける。"},"ishitsu":[{"if":"!flag:coat_hotel","text":"フロントの奥の遺失物の棚。「2月12日　久我さまのお部屋　押し入れ」と札のついた包み。\n\n中から、安物の外套と、つぶれた帽子が出てきた。外套の裏に、縫いつけの札。\n\n「汐見　大和屋洋品店」\n\nフロント「お客さまのものではないと思いまして。久我さまにうかがったら、知らないとおっしゃって」","card":"ホテル浪速の遺失物：12日、「久我」の部屋の押し入れに安物の外套と帽子。外套の裏に「汐見 大和屋洋品店」の札","cardId":"coat_hotel","do":["flag:coat_hotel"]},{"text":"源次が汐見で買った外套と帽子。11日の朝、千鳥屋を出た男が着ていたものだ。"}]},"show":{"front":{"meishi":[{"if":"!flag:kicho","text":"フロントの男は、名刺の裏の署名と、宿帳の字を並べた。\n\nフロント「…ちがいますね。名刺のほうは右上がりの強い字ですが、宿帳のほうは、丸くて小さい。別の方の字です」","card":"ホテルの宿帳（11日9:05「久我誠一郎」）の字は、久我の名刺の署名とちがう","cardId":"kicho","do":["flag:kicho"]},{"text":"フロント「字がちがうのは、まちがいありません」"}]},"oka":{"meishi":{"text":"岡「この方が久我さん？ …いや、こんな貫禄のある人じゃなかったなあ」"}},"nonomura":{"meishi":{"text":"野々村は、名刺から目をそらした。"}},"morishita":{"meishi":{"text":"森下「社長の名刺ですね」"}},"oyaji":{"kirinuki":[{"if":"!flag:yatai_id","text":"親父は、新聞の写真をしばらく見ていた。\n\n親父「…顔は見てねえと言ったろう。だが、この背格好だ。肩の張り方と、背の高さ。まちがいねえとは言えねえが、こんな男だった」","card":"屋台の親父：10日の夜の背広の男は、久我の写真と背格好が似ている（顔は見ていない）","cardId":"yatai_id","do":["flag:yatai_id"]},{"text":"親父「似てる。それ以上は言えねえよ」"}],"meishi":{"text":"親父「名刺なんか見せられても、字は読めねえよ」"}}},"showDefault":"{name}は、首をかしげた。","puzzles":{"route":{"label":"品川を何時何分に出た？","prompt":"11日7時、千鳥屋の前。品川駅まで歩いて5分。14時半には大阪のホテル浪速に戻っている（駅から車で20分）。\n乗った列車は、品川を何時何分に出た？（4ケタ。例：9時08分→0908）","display":"［ {code} ］","length":4,"answer":"0708","success":{"text":"沖田「品川7時08分発、電車特急『朝凪』。大阪着13時58分。車で20分なら、14時半にホテルの通用口に着く」\n\n沖田「夜汐に乗ったのは、野々村だ。社長名義の寝台で。社長は10日の夜、品川の千鳥屋にいた。屋台の親父が見た背広の男だ。源次を殺して、窓を開け、火鉢を消し、朝になって源次の外套と帽子で宿を出た。『あと2晩、たのまぁ』と言って。その外套と帽子は、ホテルの押し入れに捨てていった」\n\n早瀬は、しばらく声が出なかった。","card":"時刻表：品川7:08発の電車特急「朝凪」で大阪13:58着。ホテル浪速に14時半。11日朝の千鳥屋の男は、大阪に15時にいられた","cardId":"route","do":["flag:route"]},"fail":"早瀬「{code}…それだと、間に合わないか、乗れないかです。7時5分に品川駅。そこから乗れる列車を、時刻表で探しましょう」","cancel":"早瀬「時刻表は、手帳の『資料』にあります」"}},"contradictions":[{"id":"m2","pairs":[["nono_see","nono_osaka"]],"if":"here:hisho","p":"nonomura","text":"野々村に、2つの証言をつきつけた。\n\n沖田「10日の夜、東京駅で見送って家に帰った人間が、11日の朝10時に、大阪の支店で書類を渡せるのか」\n\n野々村は、真っ青になった。\n\n野々村「……社長に、頼まれたんです。大阪支店に急ぎの書類を届けてくれ、社長名義の寝台を使っていい、ホテルにも社長の名前で記帳しておいてくれ、と」\n\n野々村「夜汐に乗ったのは、ぼくです。…社長は、乗っていません」","card":"野々村（告白）：社長に頼まれ、社長名義の寝台で自分が夜汐に乗った。ホテルにも社長の名前で記帳した。社長は乗っていない","cardId":"nono_confess","breaks":["nono_see"],"do":["toast:野々村の証言を崩した"],"notYet":"早瀬「野々村本人に、つきつけましょう。久我海運の秘書室です」","doneText":"早瀬「野々村は、もう認めました」"},{"id":"m3","pairs":[["kuga11","bed"]],"if":"here:office","p":"kuga","text":"久我に、2つの証言をつきつけた。\n\n沖田「11日の昼、あなたの部屋のベッドは使われておらず、荷物もなかった。朝から部屋で休んでいたというのは」\n\n久我は、しばらく沖田の顔を見ていた。\n\n久我「…言い方が悪かった。部屋ではなく、街を歩いていたんです。眠れなかったものでね。どこを歩いたかは、覚えていません」\n\n久我の声は、少しも揺れていなかった。","card":"久我（言い直し）：11日の昼は部屋ではなく、大阪の街を歩いていた。どこを歩いたかは覚えていない","cardId":"kuga_walk","breaks":["kuga11"],"do":["toast:久我の証言を崩した"],"notYet":"早瀬「社長本人に、つきつけましょう。社長室です」","doneText":"早瀬「社長は、もう言い直しました」"}],"contradictWrong":"早瀬「…その2つ、食い違ってますか？」","events":{"close":{"bg":"keishicho","pages":["課長は、机の上で指を組んでいた。","課長「沖田さん。捜査は、打ち切りだ」","早瀬「課長！ アリバイは崩れたんですよ！」","課長「崩れたのは、アリバイだけだ。社長が千鳥屋に入ったところを見た者はいない。凶器もない。…それに、上からの話だ。久我海運に、これ以上手を出すな、と」","沖田は、黙って立ち上がった。","昭和34年3月3日。品川の事件は、「捜査継続中」のまま、誰も手をつけなくなった。","帰りの夜行で、沖田は一睡もしなかった。\n\n佐伯修。十八年前、火をつけたと疑われた青年。死んだはずの男。\n\nおまえは、なぜ、久我誠一郎になった。","――それから、一年半が過ぎた。"],"do":["chapter:ch6"]}},"triggers":[{"if":"flag:route && !here:keishicho && !flag:ch5_ready","do":["flag:ch5_ready","toast:警視庁で、課長が呼んでいる"]}]},"ch6":{"id":"ch6","label":"第六章","title":"名前の行方","assistant":"mishima","assistantHint":"三島「沖田さん、{name}さんは、まだ何か話してくれそうですよ」","recap":"久我誠一郎のアリバイは崩れた。夜汐に乗ったのは秘書の野々村で、久我は10日の夜、品川の千鳥屋にいた。11日の朝、源次の外套と帽子で宿を出て、品川7時08分の「朝凪」で大阪へ向かったのだ。だが上からの圧力で、捜査は打ち切られた。それから一年半。","start":{"loc":"nippo","text":"昭和35年10月。汐見日報の編集部。\n\n三島「沖田さん、見つけました。引き揚げ船の記録です。復員局の知り合いに、一年かけて頼みこんで」\n\n三島は、黄ばんだ紙の写しを机に広げた。","do":["give:kiroku"]},"talk":{"mishima":{"topics":{"fune":[{"if":"!flag:kiroku_told","text":"三島「昭和21年6月、浦賀行きの引き揚げ船。南方の部隊の名簿です。『佐伯修　6月14日　病死・水葬』。そのすぐ下に、『久我誠一郎　発疹チフス　回復・浦賀にて下船』」\n\n三島「同じ部隊に、汐見の戸川源次の名前もあります。それから、片山という人。東京の蒲田で、町工場をやっているそうです」","card":"引き揚げ船の記録：佐伯修は6月14日に病死・水葬。久我誠一郎は発疹チフスから回復して下船。同じ部隊に戸川源次と片山","cardId":"kiroku","do":["flag:kiroku_told"]},{"text":"三島「佐伯修は死んで、久我誠一郎は生きて帰った。…記録では、そうなっています」"}],"ima":[{"if":"!flag:katayama","text":"三島「片山さんに会いに行きましょう。蒲田です」"},{"if":"!flag:shino","text":"三島「片山さんの話だと、久我の母親は信州にいたって。寺に身を寄せていたそうです」"},{"if":"!flag:pressure","text":"三島「東京の早瀬さんにも、会っておきませんか。打ち切りのときのことを、聞けるかもしれません」"},{"text":"三島「汐見に戻りましょうか」"}],"hint":[{"if":"!flag:kiroku_told","hints":["三島「この記録、見てください」","三島「ぼくに『引き揚げ船のこと』を聞いてください」"]},{"if":"!flag:katayama","hints":["三島「同じ船にいた人に、話を聞きましょう」","三島「蒲田の片山さんに『引き揚げ船のこと』を聞きましょう」","三島「片山さんに『引き揚げ船のこと』を、もう一度聞いてみてください。大事な話が続きそうです」"]},{"if":"!flag:shino","hints":["三島「久我の母親のことが、気になります」","三島「信州の寺の住職に『志乃のこと』を聞きましょう」"]},{"if":"!flag:tegami","hints":["三島「住職さん、ほかにも何か知っていそうです」","三島「住職にもう一度『志乃のこと』を聞いてみましょう」"]},{"if":"!flag:hisseki","hints":["三島「志乃さんのところに通った『誠一郎』が、いまの社長と同じ人か、確かめられないでしょうか」","三島「住職さんに、久我の名刺を『見せる』んです。署名の字を見てもらいましょう」"]},{"if":"!flag:pressure","hints":["三島「打ち切りのとき、何があったのか…東京の早瀬さんなら知っているかもしれません」","三島「警視庁へ行って、早瀬さんに『事件のこと』を聞きましょう」"]},{"hints":["三島「汐見日報に戻って、話をまとめましょう」"]}],"zatsudan":{"seq":[{"text":"三島「打ち切りのあと、ぼく、デスクにこっぴどく叱られました。『久我海運のことは書くな』って」"},{"text":"三島「でも、あきらめきれなくて。…沖田さんも、でしょう」\n\n沖田は、何も言わなかった。"}]},"saeki":{"text":"三島「佐伯修は、汐見で放火犯にされ、戦地で死んだことにされて、東京で社長になった。…三つの人生を生きた人ですね」"}}},"katayama":{"topics":{"fune":{"seq":[{"text":"片山「佐伯と久我か。…忘れられるもんか。背格好がそっくりでな。久我は大学出で、佐伯に字や帳簿を教えてた。兄弟みたいだった」\n\n片山「船で、チフスにかかったのは久我のほうだ。三日三晩、うなされて」"},{"text":"片山「死ぬ前の晩、久我が佐伯に言ったんだ。おれは隣で聞いてた。『おまえは故郷に帰れば放火犯だ。おれには、目の見えない母しかいない。おれの名前で生きてくれ。母を頼む』」\n\n片山「死んだのは、久我だ。佐伯は泣きながら、久我の認識票を受け取った。記録が逆になってるのは…佐伯が、そうしたんだろう」","card":"片山：船で死んだのは久我のほう。死ぬ前に久我は佐伯に「おれの名前で生きてくれ。母を頼む」と言った","cardId":"katayama","do":["flag:katayama"]},{"text":"片山「戸川の源次も、同じ船にいた。あいつも、見てたはずだ」"}]},"genji":{"text":"片山「源次は、船でも博打ばかりしてた。人の弱みを嗅ぎつけるのがうまい男だった」"},"saeki":{"text":"片山「佐伯は、無口で、まじめなやつだった。故郷のことは一言もしゃべらなかった。…火事のことがあったんだな」"},"zatsudan":{"seq":[{"text":"片山「船の中は、ひどいもんだった。毎日、誰かが死んで、毎日、誰かを海に送った。ラッパも鳴らさずにな」"},{"text":"片山「佐伯は、久我を送るとき、ずっと敬礼していた。死んだのは自分のほうだ、とでもいうみたいに」"}]}}},"jushoku":{"topics":{"shino":{"seq":[{"text":"住職「志乃さまは、目が見えませんでした。戦争で、一人息子の誠一郎さんを待っておられた」\n\n住職「昭和21年の夏、誠一郎さんが帰ってこられた。それから毎月、欠かさずいらした。十年間、一度も。母上は、それはうれしそうで」","card":"住職：昭和21年夏から、誠一郎は毎月欠かさず志乃を見舞った。十年間、一度も欠かさず。母上は、それはうれしそうだった","cardId":"shino","do":["flag:shino"]},{"text":"住職「志乃さまは、昭和31年の春に亡くなられました。亡くなる前に、わたしに手紙を口述なさった。『誠一郎に』と。…わたしが書いて、誠一郎さんにお渡ししました」\n\n住職「中身は、申し上げられません。ただ、母上は、すべて分かっておられたと思います」","card":"住職：志乃は亡くなる前、「誠一郎に」と手紙を口述した。住職が書いて渡した。「母上は、すべて分かっておられたと思います」","cardId":"tegami","do":["flag:tegami"]},{"text":"住職「誠一郎さんは、母上の葬儀で、ずっと母上の手を握っておられました」"}]},"kuga":{"text":"住職「誠一郎さんは、いまは大きな会社の社長だそうですね。…それでも、命日には必ず来られます」"},"zatsudan":{"text":"住職「この寺の紅葉は、志乃さまが好きでした。目は見えなくても、落ち葉を踏む音で、秋が分かるとおっしゃって」"}}},"hayase":{"topics":{"jiken":{"seq":[{"text":"早瀬「品川の件ですか。…沖田さん、ここだけの話にしてください」\n\n早瀬「打ち切りの前の日、久我海運の黒田専務が、刑事部長を訪ねてきてるんです。受付の記録に残ってました。次の日の朝、部長から課長に電話があって、それで」","card":"早瀬：昭和34年の打ち切りの前日、久我海運の黒田専務が刑事部長を訪ねていた。翌朝、部長から課長に電話があった","cardId":"pressure","do":["flag:pressure"]},{"text":"早瀬「黒田専務は、去年、副社長になりました。…社長は、黒田に首根っこを押さえられてるのかもしれません」"}]},"kuga":{"text":"早瀬「社長は、相変わらずです。新聞に載らない月はない。…でも、写真の顔は、ずいぶん老けました」"},"zatsudan":{"text":"早瀬「沖田さんの事件のあと、ぼく、時刻表を読むのが癖になっちゃいましたよ」"}}}},"locations":{"nippo":{"name":"汐見日報","bg":"nippo","people":["mishima"],"objs":{"kiroku":"記録の写し"},"arrive":"汐見日報の編集部。窓の外は、もう秋の色だ。"},"kamata":{"name":"東京・蒲田の町工場","bg":"geshuku","people":["mishima","katayama"],"objs":{"machine":"旋盤"},"arrive":"蒲田の町工場。油のにおいの中で、日焼けした男が手を止めた。"},"temple":{"name":"信州・寺","bg":"temple","unlock":"flag:katayama","people":["mishima","jushoku"],"objs":{"haka":"墓地","hondo":"本堂"},"arrive":"信州の山あいの寺。紅葉が、境内を埋めている。"},"keishicho":{"name":"東京・警視庁","bg":"keishicho","people":["mishima","hayase"],"objs":{"board":"黒板"},"arrive":"一年半ぶりの警視庁。早瀬は、少し痩せていた。"}},"look":{"kiroku":[{"text":"記録の写し。「佐伯修　6月14日　病死・水葬」。その字だけが、ほかよりも少し濃い。"}],"machine":{"text":"古い旋盤。片山「戦争から帰って、これ一台で始めた」"},"haka":{"text":"墓地のいちばん奥に、「久我家之墓」。新しい花が供えてある。その横に、小さな石。名前は刻まれていない。"},"hondo":{"text":"本堂。線香のにおい。"},"board":{"text":"黒板には、知らない事件の名前が並んでいる。品川の事件の名前は、もうどこにもない。"}},"show":{"katayama":{"kirinuki":{"text":"片山「…これは、佐伯だ。久我誠一郎、と書いてあるが、佐伯だよ。まちがいない」"},"photo":{"text":"片山「源次だな。…死んだのか」"}},"jushoku":{"kirinuki":{"text":"住職「誠一郎さんです」\n\n住職は、静かに言った。\n\n住職「わたしにとっては、この方が、誠一郎さんです」"},"meishi":{"text":"住職は、名刺の裏の署名を見て、うなずいた。\n\n住職「誠一郎さんの字です。母上への手紙は、いつもこの字でした。目の見えない母上のかわりに、わたしが読んでさしあげたのです。右上がりの、強い字で」","card":"住職：志乃あての手紙は、久我の名刺の署名と同じ右上がりの強い字だった","cardId":"hisseki","do":["flag:hisseki"]}}},"showDefault":"{name}は、首をかしげた。","events":{"close":{"bg":"nippo","pages":["汐見に戻る夜行の中で、三島が言った。","三島「佐伯は、名前を奪ったんじゃなかった。託されたんですね」","沖田「ああ」","三島「でも、源次を殺したのは…」","沖田「それも、佐伯だ」","沖田「品川の件を止めたのは、黒田だ。社長の秘密を握って、会社ごと握ろうとしている」","列車は、トンネルに入った。窓に、沖田の顔が映った。","――昭和35年12月。汐見。\n\n署の電話が鳴った。三島からだった。\n\n三島「沖田さん。磯辺町の、佐伯家の墓に、新しい花が供えてあるそうです」"],"do":["chapter:ch7"]}},"triggers":[{"if":"flag:katayama && flag:shino && flag:tegami && flag:hisseki && flag:pressure && here:nippo && !flag:ch6_done","do":["flag:ch6_done","event:close"]},{"if":"flag:katayama && flag:shino && flag:tegami && flag:hisseki && flag:pressure && !here:nippo && !flag:ch6_ready","do":["flag:ch6_ready","toast:汐見日報に戻ろう"]}],"contradictions":[]},"ch7":{"id":"ch7","label":"第七章","title":"焼けた網倉","assistant":"mishima","assistantHint":"三島「沖田さん、{name}さんは、まだ何か話してくれそうですよ」","recap":"引き揚げ船で死んだのは、本物の久我誠一郎だった。久我は死ぬ前に、佐伯修に「おれの名前で生きてくれ。母を頼む」と託した。佐伯は十年間、目の見えない志乃を、息子として毎月見舞った。昭和35年12月、汐見・磯辺町の佐伯家の墓に、新しい花が供えられた。","start":{"loc":"police","text":"昭和35年12月。汐見署。\n\n窓の外で、冬の海が鳴っている。三島が、外套の雪を払いながら入ってきた。\n\n三島「沖田さん。佐伯は、汐見に帰ってきているんでしょうか」"},"talk":{"mishima":{"topics":{"ima":[{"if":"!flag:hana","text":"三島「まずは、お墓を見に行きましょう」"},{"if":"!flag:contra_m4","text":"三島「昭和16年の火事…。佐伯は、本当に火をつけたんでしょうか」"},{"text":"三島「浜屋に、泊まっているんですね」"}],"hint":[{"if":"!flag:hana","hints":["三島「佐伯家のお墓を見に行きましょう」","三島「磯辺町の佐伯家の墓で、花を『調べる』です」"]},{"if":"!has:chosho","hints":["三島「昭和16年の火事の記録は、署に残っていませんか」","三島「汐見署の書庫で、古い調書を『調べる』です」"]},{"if":"!flag:gosuke","hints":["三島「火事のとき、網倉の近くにいた人はいないでしょうか」","三島「戸川家の元の使用人、吾助さんに『昭和16年の火事』を聞きましょう」"]},{"if":"!flag:contra_m4","hints":["三島「調書の源次の話と、吾助さんの話…合いませんよね」","三島「証言カードで『矛盾をつく』です。調書の源次の『網倉には近寄っていない』と、吾助さんの話を、戸川家でトメさんにつきつけましょう」"]},{"if":"!flag:hamaya","hints":["三島「佐伯は、どこに泊まっているんでしょう。港のことなら…」","三島「かもめのおかみさんに『久我のこと』を聞きましょう」"]},{"if":"!flag:hamaya_book","hints":["三島「浜屋に行ってみましょう」","三島「港の宿『浜屋』で、宿帳を『調べる』です」"]},{"hints":["三島「署に戻って、署長に」"]}],"zatsudan":{"seq":[{"text":"三島「ぼく、この一年半で、佐伯修について分かったことを全部ノートにまとめたんです。記事にはできませんけど」"},{"text":"三島「いつか、誰かに読んでもらえる日が来ますかね」\n\n沖田「…来る」"}]}}},"shocho":{"topics":{"ima":[{"if":"flag:hana && flag:contra_m4 && flag:hamaya && flag:hamaya_book","text":"署長「…行くのか、沖田」","do":["event:close"]},{"text":"署長「佐伯の倅が帰っとるかもしれん、か。…あの事件は、もう東京が手を引いた」"}],"kaji":{"text":"署長「昭和16年の火事は、火元不明で終わった。佐伯の倅は、証拠がなくて帰した。…お前は、あのとき、何度も上に食い下がったな」"}}},"tome":{"topics":{"kaji":[{"if":"flag:contra_m4","text":"トメ「火を出したのは、源次です。…主人が黙っとれと言うて、わたしも黙っとりました。修ちゃんひとりに、背負わせてしもうた」"},{"text":"トメ「網倉の火事のことは…もう、思い出したくありません」\n\nトメは、仏壇のほうを見た。"}],"genji":{"text":"トメ「源次の骨は、去年、東京から帰ってきました。…あの子が、何をしたというんです」"},"mukashi":{"text":"トメ「主人は、去年の暮れに亡くなりました。最後まで、火事のことは口にせんかった」"}}},"gosuke":{"topics":{"kaji":{"seq":[{"text":"吾助「…刑事さん、わしゃ、もう長くない。だから、言う」\n\n吾助「あの日、網倉の中で、源次坊ちゃんが煙草を吸っておった。わしゃ網を繕いながら、窓から見た。火が出る少し前のことじゃ」\n\n吾助「旦那さまに口止めされた。長男が死んだうえに、次男が火を出したとあっちゃ、戸川の家がもたん、と。…それで、佐伯の倅が」","card":"吾助：昭和16年、火が出る少し前、源次が網倉の中で煙草を吸っていた。戸川の旦那に口止めされた","cardId":"gosuke","do":["flag:gosuke"]},{"text":"吾助「修坊は、何もしとらん。わしが、黙っとったばっかりに…」"}]},"saeki":{"text":"吾助「修坊は、親の手伝いで網倉の掃除に来とっただけじゃ。まじめな子じゃった」"},"mukashi":{"seq":[{"text":"吾助「修坊は、網の繕いがうまかった。わしが教えたんじゃ。指が細うて、器用でな」"},{"text":"吾助「火事のあと、修坊は一度だけ、わしのところに来た。『吾助さん、わしはやっとらん』と。わしは…何も言えなんだ」"}]}}},"okami":{"topics":{"kuga":[{"if":"!flag:hamaya","text":"おかみ「東京の人？ …そういや、港の『浜屋』に、背広の人がひとりで泊まっとるよ。三日前から。朝早く、浜をひとりで歩いとるって」\n\nおかみ「それがさ、浜屋のおやじが言うには、汐見の言葉をしゃべるんだって」","card":"おかみ：港の宿「浜屋」に、背広の男が三日前から泊まっている。朝早く浜を歩き、汐見の言葉をしゃべる","cardId":"hamaya","do":["flag:hamaya"]},{"text":"おかみ「浜屋の人、明日の朝も浜に出るんじゃないかね」"}],"kaji":{"text":"おかみ「修ちゃんは、あの火事のあと、町を歩けなくなってね。…かわいそうだった」"}}},"hamaya":{"topics":{"kuga":{"seq":[{"text":"浜屋「東京の背広の人なら、三日前から。朝早くに浜へ出て、昼すぎに戻ってきて、あとは部屋で何か書いとる」\n\n浜屋「言葉が、こっちのもんでね。どこの生まれか聞いたら、笑うて答えんかった」"},{"text":"浜屋「明日の朝が最後じゃと言うとった。…刑事さん、あの人、何かしたんですか」"}]},"zatsudan":{"text":"浜屋「この冬は、海が荒れる。漁に出られん日ばかりじゃ」"}}}},"locations":{"police":{"name":"汐見署","bg":"shiomi-police","people":["mishima","shocho"],"objs":{"photo":"古い表彰写真"},"arrive":"汐見署。ダルマストーブの火が赤い。"},"shoko":{"name":"汐見署・書庫","bg":"shiomi-police","people":["mishima"],"objs":{"chosho":"古い調書の箱"},"arrive":"汐見署の地下の書庫。ほこりと、古い紙のにおい。"},"isobe":{"name":"磯辺町・戸川家","bg":"isobe","people":["mishima","tome","gosuke"],"objs":{"amigura":"網倉の跡"},"arrive":"磯辺町の戸川家。縁側に、腰の曲がった老人が座っている。戸川家に長く仕えていた吾助だ。"},"grave":{"name":"磯辺町・佐伯家の墓","bg":"grave","people":["mishima"],"objs":{"hana":"墓の花","sea":"海"},"arrive":"海を見下ろす丘の、小さな墓地。佐伯家の墓は、いちばん端にあった。"},"kamome":{"name":"港の飲み屋「かもめ」","bg":"kamome","people":["mishima","okami"],"objs":{},"arrive":"飲み屋「かもめ」。おかみが、ストーブに薪をくべている。"},"hamaya":{"name":"港の宿「浜屋」","bg":"inn","unlock":"flag:hamaya","people":["mishima","hamaya"],"objs":{"yadocho":"宿帳"},"arrive":"港の宿「浜屋」。玄関の土間に、潮のにおいがしみついている。"}},"look":{"photo":{"text":"古い表彰写真。若い自分が、まっすぐ前を見ている。"},"chosho":[{"if":"!has:chosho","text":"昭和16年10月の調書。\n\n「佐伯修（19）取り調べ。網倉に出入り。放火の証拠なし。帰宅させる」\n「戸川源次（19）聞き取り。当日は網倉には近寄っていない、と述べる」\n「火元　不明」\n\n調書の端に、若いころの自分の字で、小さく書きこみがあった。「佐伯がやったとは思えない」","card":"昭和16年の調書：佐伯修は証拠なしで帰された。戸川源次は「当日は網倉には近寄っていない」と述べた。火元は不明","cardId":"chosho","do":["give:chosho"]},{"text":"調書の箱。昭和16年の分は、もう読んだ。"}],"amigura":{"text":"網倉の跡。石垣の焦げあと。十九年前の秋、ここで火が出た。"},"hana":[{"if":"!flag:hana","text":"佐伯家の墓に、白い菊が供えてある。まだ新しい。線香は、汐見の漁師が使う太い黒いものだ。\n\n墓石の裏に、小さな文字が刻まれていた。「佐伯修　昭和二十一年六月　没」。\n\n死んだはずの男が、自分の墓に花を供えに来たのだ。","card":"佐伯家の墓に新しい白い菊と、汐見の漁師が使う黒い線香。墓石には「佐伯修 昭和二十一年六月 没」","cardId":"hana","do":["flag:hana"]},{"text":"白い菊が、海風に揺れている。"}],"sea":{"text":"冬の汐見の海。灰色の波が、浜に打ち寄せている。"},"yadocho":[{"if":"!flag:hamaya_book","text":"浜屋の宿帳。三日前の欄に、右上がりの強い字。\n\n「佐伯修　東京」\n\n三島「…本当の名前で、泊まっている」","card":"浜屋の宿帳：三日前の欄に、右上がりの強い字で「佐伯修　東京」","cardId":"hamaya_book","do":["flag:hamaya_book"]},{"text":"「佐伯修」。名刺と同じ字だ。"}]},"show":{"tome":{"chosho":{"text":"トメは、調書を見て、目を伏せた。"}},"gosuke":{"chosho":{"text":"吾助「源次坊ちゃんは、近寄っとらんかった？ …うそじゃ。わしは見た」"}},"mishima":{"chosho":{"text":"三島「沖田さんの字ですね。『佐伯がやったとは思えない』…」"}}},"showDefault":"{name}は、首をかしげた。","contradictions":[{"id":"m4","pairs":[["chosho","gosuke"]],"if":"here:isobe","p":"tome","text":"トメに、調書と吾助の話をつきつけた。\n\n沖田「源次は、網倉に近寄っていないと言った。だが吾助さんは、火の出る前に、源次が網倉で煙草を吸っているのを見ている」\n\nトメは、長いあいだ黙っていた。それから、仏壇の長男の写真を見た。\n\nトメ「…知っとりました。源次が、泣いて言うたんです。煙草の火を落とした、と。主人が、黙っとれと言うて」\n\nトメ「佐伯さんとこの修ちゃんには、ほんとうに、すまんことをしました」","card":"トメ（告白）：昭和16年の火事は、源次が煙草の火を落としたせい。夫に口止めされ、佐伯修に罪をかぶせた","cardId":"tome_confess","breaks":["chosho"],"do":["toast:十九年前の火事の真相が分かった"],"notYet":"三島「戸川家で、トメさんにつきつけましょう」","doneText":"三島「火事のことは、もう分かりました」"}],"contradictWrong":"三島「…その2つ、食い違ってますか？」","events":{"close":{"bg":"shiomi-police","pages":["署長は、窓の外の海を見ていた。","沖田「浜屋の宿帳に、本人の字で『佐伯修』と書いてありました。…自分の名前で、帰ってきたんです」","署長「佐伯の倅は、放火犯じゃなかった。十九年かかって、それが分かった。…だが、源次を殺したのは」","沖田「佐伯です」","署長「東京は手を引いた。お前が佐伯を捕まえても、上がもみ消すかもしれん」","沖田「それでも、本人の口から聞きたいんです」","署長は、何も言わなかった。","翌朝、夜明け前。沖田は、ひとりで浜へ向かった。三島には、署で待つように言った。"],"do":["chapter:ch8"]}},"triggers":[{"if":"flag:hana && flag:contra_m4 && flag:hamaya && flag:hamaya_book && !here:police && !flag:ch7_ready","do":["flag:ch7_ready","toast:汐見署で、署長に話そう"]}]},"ch8":{"id":"ch8","label":"第八章","title":"冬の海","assistant":null,"recap":"昭和16年の網倉の火事は、戸川源次の煙草の火が元だった。佐伯修は放火犯ではなかった。昭和35年12月、佐伯家の墓に花が供えられ、港の宿「浜屋」に、汐見の言葉を話す背広の男が泊まっている。夜明け前、沖田はひとりで浜へ向かう。","start":{"loc":"beach","text":"昭和35年12月。夜明け前の汐見の浜。\n\n雪まじりの風。波打ちぎわに、外套の男がひとり、海を見て立っていた。","do":["event:meet"]},"thinkHint":"（{name}に、まだ聞いていないことがある）","think":[{"if":"!flag:s_kaji","hints":["（まず、あのことを伝えなければ。十九年前の火事のことを）","（佐伯に『昭和16年の火事』のことを話そう）"]},{"if":"!flag:s_fune","hints":["（なぜ、久我誠一郎になったのか。佐伯に『引き揚げ船のこと』を聞こう）"]},{"if":"!flag:s_tooka","hints":["（あの夜のことを、本人の口から聞きたい。佐伯に『2月10日の夜』を聞こう）"]},{"hints":["（証拠は、そろっている。夜汐の寝台、屋台の目撃、ホテルの外套、荷札ひも…）","（『推理』で、源次を殺した者の名を言おう。そのあとは、捜査メモの「証言カード」を思い出しながら答えればいい）"]}],"talk":{"saeki":{"topics":{"kaji":[{"if":"!flag:s_kaji","text":"沖田「昭和16年の網倉の火事。火元は、戸川源次の煙草だった。吾助が見ていた。トメも、知っていた」\n\n沖田「お前は、火をつけていない。…十九年もかかって、すまなかった」\n\n佐伯は、長いあいだ海を見ていた。\n\n佐伯「……そうか。そうじゃったか」\n\n佐伯の声が、はじめて汐見の言葉になった。","card":"佐伯は、火事の真相を聞いて「そうじゃったか」と言った","cardId":"s_kaji","do":["flag:s_kaji"]},{"text":"佐伯「おふくろも親父も、死ぬまで、わしが火をつけたと思われたまんまじゃった」"}],"fune":[{"if":"flag:s_kaji && !flag:s_fune","text":"佐伯「久我は、わしに字を教えてくれた。帳簿のつけ方も、人の見方も。…船で、あいつは熱に浮かされながら言うた。『おれの名前で生きてくれ。母を頼む』」\n\n佐伯「わしは、あいつの名前を借りた。返す相手は、もうおらん。だから、母上のところへ毎月通うた。十年。あいつの代わりに」","card":"佐伯：「久我の名前を借りた。返す相手はいない。だから、母上のところへ十年通った」","cardId":"s_fune","do":["flag:s_fune"]},{"if":"flag:s_fune","text":"佐伯「母上は、わしの手を握って、誠一郎、と呼んでくれた。…分かっとったんかもしれん」"},{"text":"佐伯「その話は、あとにしてくれんか」"}],"tooka":[{"if":"flag:s_fune && !flag:s_tooka","text":"沖田「昭和34年2月10日の夜。夜汐に乗ったのは野々村だ。お前は品川の千鳥屋で、源次と会っていた」\n\n佐伯「…源次は、船で見とった。新聞の写真で、わしを見つけた。金をよこせ、出さんなら汐見の警察に言う、佐伯修は生きとる、と」\n\n佐伯「わしひとりなら、どうなってもよかった。じゃが、美代子と千鶴がおる。久我の母上との約束もある。…久我の名前を、人殺しの放火犯の名前にするわけにはいかんかった」","card":"佐伯：源次に「佐伯修は生きている、と汐見の警察に言う」と脅された。妻と娘、久我の母との約束を守りたかった","cardId":"s_tooka","do":["flag:s_tooka"]},{"if":"flag:s_tooka","text":"佐伯「沖田さん。あんたが東京に来たとき、すぐに分かった。あの火事のときの、若い巡査さんじゃと」"},{"text":"佐伯「その話は、もう少しあとで」"}],"shino":{"text":"佐伯「志乃さまは、亡くなる前に、わしに手紙をくださった。住職さんに書いてもろうて。…まだ、一度しか読んどらん。こわくてな」"},"genji":{"text":"佐伯「源次は、根っからの悪いやつじゃなかった。弱いやつじゃった。…わしと同じで」"},"kuroda":{"seq":[{"text":"佐伯「黒田は、源次のことを知っとる。品川のあと、わしの部屋に来て言うた。『社長の秘密は、私がお守りします。そのかわり、会社のことは私にお任せを』」\n\n佐伯「この一年半、わしは社長の椅子に座っとるだけの人形じゃった」"},{"text":"佐伯「わしがおらんようになったら、黒田は真っ先に書斎の手帳を取りに来るじゃろう。…それも、分かっとる」"}]},"chizuru":{"text":"佐伯「千鶴は、五つになった。わしが帰ると、玄関まで走ってくる。…あの子には、何も背負わせとうない。手帳には、そう書いた」"}}}},"locations":{"beach":{"name":"汐見の浜","bg":"beach","people":["saeki"],"objs":{"sea":"海","footprints":"足あと","town":"町の灯"}}},"look":{"sea":{"text":"冬の汐見の海。灰色のうねりが、遠くで白く砕けている。"},"footprints":{"text":"雪の上に、ひとりぶんの足あと。浜屋のほうから、波打ちぎわまで、まっすぐ続いている。"},"town":{"text":"磯辺町の灯が、ひとつ、ふたつ。網元の家の灯も見える。"}},"accuse":{"prompt":"戸川源次を殺したのは、誰だ？","suspects":["saeki","kuroda","nonomura","gondo","shujin"],"culprit":"saeki","required":[{"if":"flag:s_kaji","label":"火事"},{"if":"flag:s_fune","label":"名前"},{"if":"flag:s_tooka","label":"あの夜"}],"mi <script>
// mystery-games 共通エンジン
// シナリオは <script id="game-data"> の JSON から読む（tools/build.py が埋め込む）。
// 書き方は engine/README.md を参照。
'use strict';
(() => {
const D = JSON.parse(document.getElementById('game-data').textContent);
const KEY = 'mg:' + D.id;
const $ = id => document.getElementById(id);
const SLOTS = 3;

// ---------- 保存 ----------
const store = {
  get(k) { try { const v = localStorage.getItem(KEY + ':' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) {} },
};
function markCleared() {
  if (SIM) return;
  try {
    const c = JSON.parse(localStorage.getItem('mg:cleared') || '[]');
    if (!c.includes(D.id)) { c.push(D.id); localStorage.setItem('mg:cleared', JSON.stringify(c)); }
  } catch (e) {}
}

// ---------- 状態 ----------
let S = null;
let pending = {};
// 検証モード（tools/verify.py）：画面に何も出さず、場面は一気に進め、章の終わりや謎解きで止まる
let SIM = false;
const simSeen = new Set();
const fresh = () => ({ chapter: D.start, loc: null, f: {}, v: { turns: 0, miss: 0 }, items: [], seq: {}, done: false, log: [], cards: [], memo: '', seenCards: 0 });
const ch = () => D.chapters[S.chapter];
const loc = () => ch().locations[S.loc];
// 場所にいる人。{"id": "...", "if": "条件"} で、場面によって出入りさせられる
const here = (L = loc()) => (L.people || []).filter(p => typeof p === 'string' || cond(p.if)).map(p => typeof p === 'string' ? p : p.id);
const person = p => D.people[p] || { name: p };
const short = p => person(p).short || person(p).name;
// 助手（ヒント役）は章ごとに変えられる：章の assistant / assistantHint / hintTopic が game.json より優先
const AS = () => ('assistant' in ch()) ? ch().assistant : D.assistant;
const HT = () => ch().hintTopic || D.hintTopic;
const fmt = (t, o) => String(t).replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
function snapshot(label) {
  return { state: JSON.parse(JSON.stringify(S)), at: Date.now(), label: label || ((ch().label ? ch().label + ' ' : '') + (loc() ? loc().name : '')) };
}
function autosave() { if (S && !SIM) store.set('auto', snapshot()); }

// ---------- 条件 ----------
// 例: "has:capsule && !flag:sent"  "var:wait>=1"  "count:talk:haru>=2" は不可（キーは英数字と _ -）
const TOK = /\s*(\|\||&&|!|\(|\)|true|false|[a-z]+:[A-Za-z0-9_\-]+(?:\s*(?:>=|<=|==|!=|>|<)\s*-?\d+)?)/y;
function cond(src) {
  if (src == null || src === '') return true;
  const toks = []; TOK.lastIndex = 0;
  while (TOK.lastIndex < src.length) {
    const at = TOK.lastIndex, m = TOK.exec(src);
    if (!m) { if (/^\s*$/.test(src.slice(at))) break; throw new Error('条件の書き方が正しくありません: ' + src); }
    toks.push(m[1]);
  }
  let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const or = () => { let v = and(); while (peek() === '||') { next(); const r = and(); v = v || r; } return v; };
  const and = () => { let v = not(); while (peek() === '&&') { next(); const r = not(); v = v && r; } return v; };
  const not = () => { if (peek() === '!') { next(); return !not(); } return atom(); };
  const atom = () => {
    const t = next();
    if (t === '(') { const v = or(); if (next() !== ')') throw new Error('かっこが閉じていません: ' + src); return v; }
    return term(t, src);
  };
  const v = or();
  if (p < toks.length) throw new Error('条件の書き方が正しくありません: ' + src);
  return v;
}
function term(t, src) {
  if (t === 'true') return true;
  if (t === 'false') return false;
  const m = t && t.match(/^([a-z]+):([A-Za-z0-9_\-]+)(?:\s*(>=|<=|==|!=|>|<)\s*(-?\d+))?$/);
  if (!m) throw new Error('条件の書き方が正しくありません: ' + src);
  const [, k, n, op, num] = m;
  if (k === 'has') return S.items.includes(n);
  if (k === 'flag') return !!S.f[n];
  if (k === 'here') return S.loc === n;
  if (k === 'var' || k === 'talked') {
    const x = k === 'var' ? (S.v[n] || 0) : (S.seq['talkc:' + S.chapter + ':' + n] || 0);
    if (!op) return x > 0;
    const y = +num;
    return { '>=': x >= y, '<=': x <= y, '==': x === y, '!=': x !== y, '>': x > y, '<': x < y }[op];
  }
  throw new Error('不明な条件: ' + t);
}

// ---------- 効果 ----------
function run(list) {
  for (const e of list || []) {
    const i = e.indexOf(':'), k = i < 0 ? e : e.slice(0, i), a = i < 0 ? '' : e.slice(i + 1);
    switch (k) {
      case 'give': if (!S.items.includes(a)) { S.items.push(a); toast('入手：' + D.items[a]); snd.se('note'); } break;
      case 'take': S.items = S.items.filter(x => x !== a); break;
      case 'flag': S.f[a] = 1; break;
      case 'unflag': delete S.f[a]; break;
      case 'set': { const [n, v] = a.split('='); S.v[n] = +v; break; }
      case 'inc': S.v[a] = (S.v[a] || 0) + 1; break;
      case 'miss': S.v.miss = (S.v.miss || 0) + 1; break;
      case 'toast': if (!S.toasted) S.toasted = []; if (!S.toasted.includes(a)) { S.toasted.push(a); toast(a); } break;
      case 'goto': pending.goto = a; break;
      case 'puzzle': pending.puzzle = a; break;
      case 'ending': pending.ending = a; break;
      case 'chapter': pending.chapter = a; break;
      case 'event': pending.event = a; break;
      case 'board': pending.board = a; break;
      case 'choice': pending.choice = a; break;
      case 'search': pending.search = a; break;
      case 'doc': if (!S.docs) S.docs = []; if (!S.docs.includes(a)) { S.docs.push(a); toast('資料に追加：' + D.docs[a].title); snd.se('note'); } break;
      case 'card': { const k = a.indexOf(':'); addCard({ card: a.slice(k + 1) }, { p: a.slice(0, k) || null }); break; }
      default: throw new Error('不明な効果: ' + e);
    }
  }
}

// 文字列 / ルール / ルールの配列（最初に条件が合うもの）/ {seq:[...]}（話すたびに次へ。最後はくり返し）
function resolve(entry, key) {
  if (entry == null) return null;
  if (typeof entry === 'string') return { text: entry };
  if (Array.isArray(entry)) return entry.find(r => cond(r.if)) || null;
  if (entry.seq) { const k = S.chapter + '|' + key, i = S.seq[k] || 0; S.seq[k] = i + 1; return entry.seq[Math.min(i, entry.seq.length - 1)]; }

}

// ---------- 音 ----------
// game.json の audio: {base, title, bgm, deduce, ending, step, amb: {場所id: 環境音}}。章は audio: {bgm, amb, hush}
// イベントは "bgm"（そのイベントのあいだ流す。"bgmKeep": true でそのまま）と "hush"（いったん無音にする）
// ブラウザは最初のタップまで音を出せないので、タップされるまでは「何を流すか」だけ覚えておく
const snd = (() => {
  const A = D.audio || null;
  let ctx = null, want = { bgm: null, amb: null }, cur = { bgm: null, amb: null }, deduce = false, hushT = null, noteT = 0;
  // 音量（0〜100）。はじめは、音は出るが小さめ
  const DEF = { bgm: 30, amb: 30, se: 30 };
  let vol = Object.assign({}, DEF);
  const tracks = {}, ses = {};
  try {
    const v = localStorage.getItem('mg:sound');
    if (v === 'off') vol = { bgm: 0, amb: 0, se: 0 };
    else if (v && v[0] === '{') { const o = JSON.parse(v); for (const k in DEF) if (typeof o[k] === 'number') vol[k] = Math.max(0, Math.min(100, o[k])); }
  } catch (e) {}
  const save = () => { try { localStorage.setItem('mg:sound', JSON.stringify(vol)); } catch (e) {} };
  const anyOn = () => vol.bgm + vol.amb + vol.se > 0;
  const VOL = { bgm: 0.5, bgmUnder: 0.38, amb: 0.85, se: 0.7 };
  const url = n => A.base + n + '.m4a' + (A.v ? '?v=' + A.v : '');
  function track(n, loop) {
    if (tracks[n]) return tracks[n];
    const el = new Audio(url(n)); el.loop = loop; el.preload = 'auto';
    const t = { el, g: null, v: 0 };
    if (ctx && !ctx.none) { try { const s = ctx.createMediaElementSource(el); t.g = ctx.createGain(); t.g.gain.value = 0; s.connect(t.g).connect(ctx.destination); } catch (e) { t.g = null; } }
    if (!t.g) el.volume = 0;
    return (tracks[n] = t);
  }
  function setVol(t, v, sec) {
    t.v = v;
    if (t.g) { const g = t.g.gain, now = ctx.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(v, now + sec); }
    else { const from = t.el.volume, t0 = performance.now(); const step = () => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000 || 1)); try { t.el.volume = Math.max(0, Math.min(1, from + (v - from) * k)); } catch (e) {} if (k < 1) requestAnimationFrame(step); }; step(); }
    if (v > 0 && t.el.paused) t.el.play().catch(() => {});
    if (v === 0) setTimeout(() => { if (t.v === 0 && !t.hold) t.el.pause(); }, sec * 1000 + 50);
  }
  const level = kind => kind === 'amb' ? (deduce ? 0 : VOL.amb * vol.amb / 100) : (cur.amb && !deduce ? VOL.bgmUnder : VOL.bgm) * vol.bgm / 100;
  function apply(kind, sec = 1.2) {
    if (!A || !ctx) return;
    const n = kind === 'bgm' && deduce && A.deduce ? A.deduce : want[kind];
    if (cur[kind] && cur[kind] !== n) setVol(track(cur[kind], true), 0, sec);
    cur[kind] = n;
    if (n) { const t = track(n, !/_ending$/.test(n)); if (t.el.ended) t.el.currentTime = 0; setVol(t, level(kind), sec); }
  }
  const refresh = (sec) => { apply('amb', sec); apply('bgm', sec); };
  function unlock() {
    if (ctx || !A) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; }
    if (!ctx) ctx = { currentTime: 0, none: true };  // Web Audio が無い環境では、要素の音量で鳴らす
    refresh(0.6);
  }
  if (A && !SIM) ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true }));
  return {
    get state() { return { on: anyOn(), vol: Object.assign({}, vol), bgm: cur.bgm || want.bgm, amb: cur.amb || want.amb, deduce, playing: Object.entries(tracks).filter(([, t]) => !t.el.paused && t.v > 0).map(([n, t]) => n + '@' + t.el.currentTime.toFixed(1)) }; },
    bgm(n) { if (SIM || !A || want.bgm === (n || null)) return; want.bgm = n || null; if (!hushT) apply('bgm'); },
    amb(n) { if (SIM || !A || want.amb === (n || null)) return; want.amb = n || null; if (!hushT) { apply('amb'); apply('bgm', 1.5); } },
    // 推理の場面：環境音を止め、推理の曲にする
    deduce(v) { if (SIM || !A || deduce === !!v) return; deduce = !!v; if (!hushT) refresh(0.8); },
    // 対峙の前など：すべての音を止め、間をおいてから次の曲
    hush(ms = 1800) {
      if (SIM || !A) return;
      clearTimeout(hushT);
      if (!ctx) return;
      Object.values(tracks).forEach(t => setVol(t, 0, 0.6));
      cur = { bgm: null, amb: null };
      // 次の曲はタップの最中に鳴らしはじめておく（iPhone はタップの外では新しく鳴らせない）
      const nb = deduce && A.deduce ? A.deduce : want.bgm, pre = [nb, want.amb].filter(Boolean).map(n => track(n, !/_ending$/.test(n)));
      pre.forEach(t => { t.hold = true; t.el.play().catch(() => {}); });
      hushT = setTimeout(() => { hushT = null; pre.forEach(t => { t.hold = false; }); refresh(1.5); }, ms);
    },
    se(n) {
      if (SIM || !A || !vol.se || !ctx) return;
      if (n === 'note') { const now = Date.now(); if (now - noteT < 400) return; noteT = now; }
      const key = 'se_' + (n === 'step' ? 'step_' + (A.step || 'asphalt') : n);
      const el = ses[key] || (ses[key] = new Audio(url(key)));
      el.volume = VOL.se * vol.se / 100; el.currentTime = 0; el.play().catch(() => {});
    },
    // 音量バー：kind は bgm / amb / se、v は 0〜100
    setVol(kind, v) { vol[kind] = Math.max(0, Math.min(100, Math.round(v))); save(); unlock(); refresh(0.2); },
    get vol() { return Object.assign({}, vol); },
    mute() { vol = { bgm: 0, amb: 0, se: 0 }; save(); refresh(0.3); },
    unlock() { unlock(); },
    get on() { return anyOn(); },
    get enabled() { return !!A; },
  };
})();

// ---------- デバッグ：進み具合のフローチャート ----------
// URL に ?debug をつけたときだけ。章のデータから「何をすると → 何が手に入り → 何が開くか」を段階に分けて描く
const DEBUG = /[?&]debug\b/.test(location.search);
function flowGraph(cid) {
  const C = D.chapters[cid], cur = !!S && cid === S.chapter;
  const nodes = [], res = {};   // res: 資源（フラグ・もちもの・証言カード・場所）→ それを生む行動
  const locOf = o => Object.entries(C.locations).find(([, L]) => L.objs && o in L.objs);
  const pick = (r, v) => (r && r[v]) || [];
  // 条件のうち「そろうと進む」もの（! のついていないもの）
  const needs = src => {
    const out = [];
    if (!src) return out;
    const re = /(!?)\s*([a-z]+):([A-Za-z0-9_\-]+)/g; let m;
    while ((m = re.exec(src))) if (!m[1] && ['flag', 'has', 'var'].includes(m[2])) out.push((m[2] === 'has' ? 'item' : m[2]) + ':' + m[3]);
    return out;
  };
  const gives = r => {
    const g = [];
    for (const e of (r && r.do) || []) {
      const i = e.indexOf(':'), k = e.slice(0, i), a = e.slice(i + 1);
      if (k === 'flag') g.push('flag:' + a);
      else if (k === 'give') g.push('item:' + a);
      else if (k === 'set' || k === 'inc') g.push('var:' + a.split('=')[0]);
      else if (k === 'doc') g.push('doc:' + a);
      else if (['event', 'puzzle', 'choice', 'search', 'board'].includes(k)) g.push('go:' + k + ':' + a);
      else if (k === 'chapter' || k === 'ending') g.push(k + ':' + a);
    }
    if (r && r.cardId) g.push('card:' + r.cardId);
    return g;
  };
  const add = (kind, label, r, extra = {}) => {
    const g = (extra.gives || []).concat(gives(r));
    if (!g.length && !extra.keep) return;
    const n = { id: nodes.length, kind, label, text: (r && (r.text || r.card)) || '', need: needs(r && r.if).concat(extra.need || []), gives: g, rule: r, loc: extra.loc, p: extra.p, target: extra.target };
    nodes.push(n);
    g.forEach(x => { (res[x] = res[x] || []).push(n.id); });
  };
  const each = (e, fn) => { if (e == null || typeof e === 'string') return; if (Array.isArray(e)) e.forEach(fn); else if (e.seq) e.seq.forEach(fn); else fn(e); };
  const locNeed = l => (C.locations[l] && C.locations[l].unlock ? needs(C.locations[l].unlock) : []);
  const whereP = p => Object.keys(C.locations).filter(l => (C.locations[l].people || []).some(x => (typeof x === 'string' ? x : x.id) === p));
  // 章のはじめ・きっかけ・移動したとき
  if (C.start && C.start.do) add('start', '章のはじめ', C.start);
  (C.triggers || []).forEach(r => add('trigger', '条件がそろうと', r));
  (C.onMove || []).forEach(r => add('trigger', '移動したとき', r));
  // 聞く
  Object.entries(C.talk || {}).forEach(([p, e]) => {
    const ls = whereP(p), ln = ls.length === 1 ? locNeed(ls[0]) : [];
    if (e && e.topics) Object.entries(e.topics).forEach(([t, te]) => each(te, r => add('talk', `聞く：${short(p)}（${(D.topics && D.topics[t]) || t}）`, r, { need: ln, loc: ls[0], p })));
    else each(e, r => add('talk', `聞く：${short(p)}`, r, { need: ln, loc: ls[0], p }));
  });
  // 調べる
  Object.entries(C.look || {}).forEach(([o, e]) => {
    const L = locOf(o), name = L ? L[1].objs[o] : o;
    each(e, r => add('look', `調べる：${name}${L ? '（' + L[1].name + '）' : ''}`, r, { need: L ? locNeed(L[0]) : [], loc: L && L[0] }));
  });
  // 見せる
  Object.entries(C.show || {}).forEach(([it, byP]) => Object.entries(byP || {}).forEach(([p, e]) => each(e, r => add('show', `見せる：${(D.items && D.items[it]) || it} → ${short(p)}`, r, { need: ['item:' + it], p }))));
  // 矛盾
  (C.contradictions || []).forEach(x => add('contra', `矛盾をつく：${x.p ? short(x.p) : ''}`, x, { need: (x.pairs || [])[0] ? x.pairs[0].map(c => 'card:' + c) : [], gives: ['flag:contra_' + x.id], keep: true }));
  // 謎・問い・検索・推理ボード・イベント（ほかの行動から開く）
  Object.entries(C.puzzles || {}).forEach(([id, P]) => add('puzzle', `謎：${P.label || id}`, P.success, { target: 'go:puzzle:' + id, keep: true }));
  Object.entries(C.choices || {}).forEach(([id, Q]) => (Q.options || []).filter(o => !(o.do || []).some(d => d === 'miss' || d.startsWith('choice:'))).forEach(o => add('choice', `選ぶ：${Q.label || id}「${o.label}」`, o, { target: 'go:choice:' + id, keep: true })));
  Object.entries(C.searches || {}).forEach(([id, Q]) => (Q.entries || []).forEach(en => add('search', `検索：${Q.label || id}「${(en.keys || [])[0] || ''}」`, en, { target: 'go:search:' + id, keep: true })));
  Object.entries(C.boards || {}).forEach(([id, B]) => add('board', `推理ボード：${B.title || id}`, B.success, { target: 'go:board:' + id, keep: true }));
  Object.entries(C.events || {}).forEach(([id, E]) => add('event', `イベント：${(E.pages[0] || '').replace(/\s+/g, ' ').slice(0, 18)}…`, E, { target: 'go:event:' + id, keep: true }));
  // 開くもの（go:）は、それを開く行動を「必要」にする
  nodes.forEach(n => { if (n.target) n.need.push(n.target); });
  // 段階：必要なものを生む行動の、いちばん深い段階 + 1
  const lv = {};
  const level = (n, stack = new Set()) => {
    if (n.id in lv) return lv[n.id];
    if (stack.has(n.id)) return 0;
    stack.add(n.id);
    let L = 0;
    n.need.forEach(x => (res[x] || []).forEach(j => { if (j !== n.id) L = Math.max(L, level(nodes[j], stack) + 1); }));
    stack.delete(n.id);
    return (lv[n.id] = L);
  };
  nodes.forEach(n => level(n));
  // いまの章なら、済んだ・今できる・まだ を決める
  const have = x => {
    const [k, a] = [x.slice(0, x.indexOf(':')), x.slice(x.indexOf(':') + 1)];
    if (k === 'flag') return !!S.f[a];
    if (k === 'item') return S.items.includes(a);
    if (k === 'var') return (S.v[a] || 0) > 0;
    if (k === 'card') return S.cards.some(c => c.id === a);

// ---------- 行動 ----------
function main() {

// 行けるようになった場所は、エンジンが自動で知らせる（シナリオに toast を書かなくてよい）

// 文を出した直後に場面・問い・謎へ移るときは、「つぎへ」をはさんで文を読めるようにする
// （まちがえて選び直すときは、返事と選択肢を一緒に出したいので、はさまない）
let actSaid = false;
// 聞いたあとは同じ人の話題（話題のない人なら「だれに聞く？」）に、調べたあとは「何を調べる？」に戻る。毎回押し直さなくてよい
let backTo = null;

  const ps = here();
  if (rs.startsWith('topic:')) {
    const who = rs.slice(6);
    if (ps.includes(who) && (topicsOf(who) || []).length) return talk(who);
  }

}
function after() {
  const p = pending; pending = {};
  const rs = backTo; backTo = null;
  const said = actSaid && !SIM; actSaid = false;
  const gate = (id, fn) => (said && (id === null || reask !== id)) ? nextBtn(fn) : fn();
  if (openBefore) {
    const now = openLocs().filter(k => !openBefore.includes(k));
    if (now.length) toast(now.map(k => ch().locations[k].name).join('・') + 'に行けるようになった');
    openBefore = null;
  }
  if (p.goto) { S.loc = p.goto; renderScene(); }
  // 自動の進行：条件がそろったトリガーを1つだけ動かす（トリガーには once 用のフラグを do に入れておく）
  if (!p.event && !p.ending && !p.chapter && !p.puzzle && !p.choice && !p.search) {
    const t = (ch().triggers || []).find(r => cond(r.if));
    if (t) { pending = {}; run(t.do); Object.assign(p, pending); pending = {}; }
  }
  autosave();
  if (p.event) return gate(null, () => playEvent(p.event));
  if (SIM && p.puzzle) { S.simPuzzle = p.puzzle; return; }
  if (SIM && p.board) { S.simBoard = p.board; return; }
  if (!p.choice && !p.search) reask = null;

  if (p.search) return gate(p.search, () => openSearch(p.search));

  if (p.choice) return gate(p.choice, () => openChoice(p.choice));

const avail = id => cond(ch().locations[id].unlock);

// 話した回数：talk:人物 は全章の合計（推理で選べる人に使う）、talkc:章:人物 はその章の回数（talked: 条件に使う）
function bumpTalk(p) {

// ---------- 記事の検索 ----------

// ---------- 謎解き（番号入力） ----------

  snd.deduce(true);
  const P = ch().puzzles[id]; let code = '';
  const disp = () => fmt(P.display, { code: code.padEnd(P.length, '＊') });
  say(P.prompt + '\n' + disp());
  const draw = () => btns([...'1234567890'.split('').map(d => [d, () => {
    code += d;
    if (code.length < P.length) { say(disp()); draw(); }
    else puzzleAnswer(id, code);
  }]), ['やめる', () => { say(P.cancel || 'やめた。'); main(); }, 'back']], P.label, 'pad');
  draw();
}

function puzzleAnswer(id, code) {
  const P = ch().puzzles[id];
  S.simPuzzle = null;
  // answers：計算の答えで、少しの丸めの違いも正解にしたいとき（例：["1740", "1745", "1750"]）
  if (code === P.answer || (P.answers || []).includes(code)) act(P.success); else act({ text: fmt(P.fail, { code }) });
}

// ---------- 推理ボード（消去法） ----------
// 章の boards: {id: {suspects: [人物id], conditions: [{id, label, keeps: [条件に合う人物id], correct}], culprit,
//   success: ルール, wrong: {none, many, decoy}}}
// 条件を選ぶたびに、合わない人が外れる。正しい条件をすべて選んで犯人ひとりが残れば成功
const boardLeft = (B, sel) => B.suspects.filter(p => sel.every(cid => B.conditions.find(c => c.id === cid).keeps.includes(p)));
function boardSubmit(id, sel) {
  const B = ch().boards[id];
  S.simBoard = null;
  const left = boardLeft(B, sel);
  // 正しい条件だけで犯人ひとりが残れば成功（犯人に合わない「まちがった条件」を選ぶと、犯人は必ず外れる）
  const ok = left.length === 1 && left[0] === B.culprit && sel.every(cid => B.conditions.find(c => c.id === cid).correct);
  if (ok) return act(B.success);
  const why = !left.length ? B.wrong.none : left.length > 1 ? B.wrong.many : B.wrong.decoy;
  act({ text: why, do: ['miss'] });
}
function openBoard(id) {
  snd.deduce(true);

    m.innerHTML = `<div class="sheet board"><div class="eyebrow">推理ボード</div><h3>${esc(B.title || '犯人の条件')}</h3><p class="nb-note">${esc(B.lead || '')}</p>
      <div class="b-sus">${B.suspects.map(p => `<span class="${left.includes(p) ? '' : 'out'}">${esc(short(p))}</span>`).join('')}</div>
      <div class="b-con"></div><div class="row2"></div></div>`;
    const box = m.querySelector('.b-con');

      b.innerHTML = `<span class="t">${sel.includes(c.id) ? '☑' : '☐'} ${esc(c.label)}</span>`;
      b.onclick = () => { sel = sel.includes(c.id) ? sel.filter(x => x !== c.id) : [...sel, c.id]; draw(); };

  draw();
}

// ---------- 矛盾をつく ----------
// 章の contradictions: [{id, pairs: [[カードid, カードid], ...], if, text, do}]
function contradict(ids) {
  const same = (p) => (p[0] === ids[0] && p[1] === ids[1]) || (p[0] === ids[1] && p[1] === ids[0]);
  const list = ch().contradictions || [];
  const hit = list.find(x => x.pairs.some(same));
  if (hit && S.f['contra_' + hit.id]) return act({ text: hit.doneText || 'その食い違いは、もう明らかにした。' });
  if (hit && cond(hit.if)) {
    // 崩した証言カードに印を付け、認めた内容を新しいカードにする
    S.cards.forEach(c => { if (c.id && ids.includes(c.id) && hit.broken !== false && (hit.breaks || [ids[0], ids[1]]).includes(c.id)) c.broken = true; });
    return act({ text: hit.text, do: [...(hit.do || []), 'flag:contra_' + hit.id], card: hit.card, cardId: hit.cardId }, { p: hit.p || null });
  }
  if (hit) return act({ text: hit.notYet || 'いまは、それをつきつける相手がいない。' });
  act({ text: ch().contradictWrong || D.contradictWrong || 'その2つは、食い違っていないようだ…。', do: ['miss'] });
}

function nbLog(body) {

    + sel('who', whoSet.map(w => [w, w]), '話した人：すべて')

  ns.forEach(n => body.appendChild(entryEl({ ...n, l: null }, () => { n.pin = !n.pin; autosave(); openNotebook(); }, true)));
}
// 資料：doc:id で増える。表や数字を見ながら推理するためのもの（game.json の docs: {id: {title, text}}）
function nbDocs(body) {
  const ds = S.docs || [];
  body.innerHTML = ds.length ? ds.map(k => `<div class="nb-entry doc"><div class="meta">${esc(D.docs[k].title)}</div><div class="txt">${esc(D.docs[k].text)}</div></div>`).join('') : '<p class="nb-empty">まだ資料はありません。</p>';
}
function nbItems(body) {
  body.innerHTML = S.items.length ? S.items.map(i => `<div class="nb-entry"><div class="txt">${esc(D.items[i])}</div></div>`).join('') : '<p class="nb-empty">まだ何も持っていない。</p>';
}
function nbMemo(body) {
  body.innerHTML = '<p class="nb-note">自分用のメモです。ゲームの進み方には関係しません。</p><textarea id="memo" placeholder="気づいたことを書いておこう"></textarea>';
  const t = body.querySelector('textarea'); t.value = S.memo || '';
  let timer; t.oninput = () => { S.memo = t.value; clearTimeout(timer); timer = setTimeout(autosave, 400); };
}
function nbStory(body) {
  const ids = Object.keys(D.chapters), upto = ids.indexOf(S.chapter);
  const parts = ids.slice(0, upto + 1).map(id => D.chapters[id]).filter(C => C.recap);
  body.innerHTML = parts.length ? parts.map(C => `<div class="nb-entry"><div class="meta">${esc((C.label || '') + ' ' + (C.title || ''))}</div><div class="txt">${esc(C.recap)}</div></div>`).join('') : '<p class="nb-empty">まだ記録はありません。</p>';
}
// 章のはじめと「つづきから」で、その章の「これまでの話」を出す
function showRecap() {
  const C = ch();
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><div class="eyebrow">これまでの話</div><h3>${esc((C.label || '') + ' ' + (C.title || ''))}</h3><p class="recap">${esc(C.recap)}</p></div>`;
  const b = document.createElement('button'); b.className = 'big primary'; b.textContent = 'つづける'; b.style.width = '100%';
  b.onclick = closeModal; m.firstChild.appendChild(b);
  document.body.appendChild(m);
}

// ---------- プレイ時間 ----------
// 画面が見えていて、最後の操作から2分以内のあいだだけ数える（放置した時間は入れない）
let lastInput = Date.now();
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, true));
setInterval(() => {
  if (!S || S.done || document.visibilityState !== 'visible' || Date.now() - lastInput > 120000) return;
  S.v.playSec = (S.v.playSec || 0) + 5;
}, 5000);
const hm = s => { s = s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };

// ---------- 起動時の一括読み込み ----------
// 背景をすべて先に読み込んでおき、遊んでいる間は通信しないようにする。
function preload() {
  const urls = Object.values((D.assets && D.assets.bg) || {});
  let done = 0, failed = 0;
  const bar = $('loadbar'), txt = $('loadtxt');
  const tick = () => { bar.style.width = (urls.length ? done / urls.length * 100 : 100) + '%'; txt.textContent = `読み込み中… ${done}/${urls.length}`; };
  tick();
  // 日本語フォントは文字ごとに分割配信されるので、ゲームで使う文字をすべて一度描いて先に取り寄せる
  const fonts = new Promise(res => {
    const chars = [...new Set(JSON.stringify(Object.assign({}, D, { assets: null })))].join('');
    const box = document.createElement('div');
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;opacity:0;pointer-events:none';
    box.innerHTML = [["'Noto Sans JP'", 400], ["'Noto Sans JP'", 500], ["'Noto Sans JP'", 700], ["'Shippori Mincho'", 700], ["'Shippori Mincho'", 800]]
      .map(([f, w]) => `<span style="font-family:${f};font-weight:${w}">${chars.replace(/[<&]/g, '')}</span>`).join('');
    document.body.appendChild(box);
    const finish = () => { box.remove(); res(); };
    if (!document.fonts) return finish();
    setTimeout(finish, 8000);
    requestAnimationFrame(() => document.fonts.ready.then(finish, finish));
  });
  return Promise.all([fonts, ...urls.map(u => new Promise(res => {
    const im = new Image();
    im.onload = () => { done++; tick(); res(); };
    im.onerror = () => { done++; failed++; tick(); res(); };
    im.src = u;
    preloaded.push(im);
  }))]).then(() => failed);
}
const preloaded = [];

window.addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('leaving'); toTitle(); } });
// ---------- 検証用（tools/verify.py が使う） ----------
const sim = {
  // 章のはじめの状態を作る（prev に前の章の終わりの状態を渡せる）
  begin(ch_, prev) {
    SIM = true; S = prev ? JSON.parse(JSON.stringify(prev)) : fresh();
    delete S.simEnd; delete S.simPuzzle; delete S.simBoard; delete S.simChoice; delete S.simSearch;
    S.chapter = ch_; S.loc = D.chapters[ch_].start.loc; resetFor(D.chapters[ch_]); say(D.chapters[ch_].start.text);
    const sd = D.chapters[ch_].start.do; if (sd) { pending = {}; openBefore = openLocs(); run(sd); after(); }
    return JSON.parse(JSON.stringify(S));
  },
  set(st) { SIM = true; S = JSON.parse(JSON.stringify(st)); },
  get() { return JSON.parse(JSON.stringify(S)); },
  actions() {
    if (S.simEnd) return [];
    if (S.simBoard) {
      // 条件の組み合わせをすべて試す
      const B = ch().boards[S.simBoard], ids = B.conditions.map(c => c.id), out = [];
      for (let m = 1; m < (1 << ids.length); m++) out.push({ t: 'board', id: S.simBoard, sel: ids.filter((_, i) => m & (1 << i)) });
      return out;
    }
    if (S.simSearch) { const Q = ch().searches[S.simSearch]; return [...Q.entries.map(e => ({ t: 'search', id: S.simSearch, q: e.keys[0] })), { t: 'search', id: S.simSearch, q: 'ああああ' }]; }
    if (S.simChoice) return ch().choices[S.simChoice].options.map((_, i) => ({ t: 'choice', id: S.simChoice, i }));
    if (S.simPuzzle) { const P = ch().puzzles[S.simPuzzle]; return [{ t: 'code', id: S.simPuzzle, code: P.answer }, { t: 'code', id: S.simPuzzle, code: P.answer === '0000' ? '1111' : '0000' }]; }
    const a = [];
    Object.keys(ch().locations).forEach(k => { if (k !== S.loc && avail(k)) a.push({ t: 'move', k }); });
    if (ch().think) a.push({ t: 'think' });
    here().forEach(p => { const ts = topicsOf(p); if (ts) ts.forEach(tp => a.push({ t: 'topic', p, tp })); else a.push({ t: 'talk', p }); });
    Object.keys(loc().objs || {}).forEach(o => a.push({ t: 'look', o }));
    S.items.forEach(i => here().forEach(p => a.push({ t: 'show', i, p })));
    if (ch().accuse) accusable().forEach(p => a.push({ t: 'accuse', p }));
    const cs = ch().contradictions || [];
    if (cs.length && S.cards.length >= 2) {
      const ids = S.cards.map((c, i) => c.id || '#' + i);
      cs.forEach(x => x.pairs.forEach(([u, v]) => { if (ids.includes(u) && ids.includes(v)) a.push({ t: 'contra', ids: [u, v] }); }));
      a.push({ t: 'contra', ids: [ids[0], ids[1]] });
    }
    return a;
  },
  apply(x) {
    switch (x.t) {
      case 'move': return moveTo(x.k);
      case 'talk': return talk(x.p);
      case 'topic': return talkTopic(x.p, x.tp);
      case 'look': return look(x.o);
      case 'show': return showTo(x.i, x.p);
      case 'accuse': return accuse(x.p);
      case 'contra': return contradict(x.ids);
      case 'code': return puzzleAnswer(x.id, x.code);
      case 'board': return boardSubmit(x.id, x.sel);
      case 'choice': return choose(x.id, x.i);
      case 'search': return searchAnswer(x.id, x.q);
      case 'think': return think();
    }
  },
  seen: () => [...simSeen],
};

document.title = D.title;
window.__mg = { get state() { return S; }, get sound() { return snd.state; }, flow: cid => flowGraph(cid), openFlow, cond, D, openNotebook, toastLog, sim, startChapter: id => { $('wrap').classList.remove('hide'); startChapter(id); } };
preload().then(failed => {
  $('loading').classList.add('hide');
  toTitle();
  soundPanel(null, true);
  if (failed) toast(`背景 ${failed} 枚を読み込めませんでした`);
});
})();

</script>

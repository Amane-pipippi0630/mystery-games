<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鴎島館の論理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;height:100%;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#wrap{width:100%;max-width:560px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#wrap>*{flex-shrink:0} /* 長い文で文章欄が縮んで、文がボタンの下にはみ出さないように */
header{display:flex;align-items:center;justify-content:space-between}
#locname{font-family:'Shippori Mincho',serif;font-weight:800;font-size:19px;letter-spacing:.04em}
#locname small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.2em;margin-bottom:1px}
#bag-unused{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#bag-unused b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#scene{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px #0008}
#scene svg{width:100%;height:100%;display:block;filter:saturate(.8) contrast(1.05)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%),linear-gradient(180deg,transparent 60%,#0009);pointer-events:none}
#here{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
#here span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
#msgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-height:150px;position:relative;cursor:pointer}
#who{display:none;position:absolute;top:-12px;left:16px;background:var(--accent);color:#1a1405;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
#who.on{display:block}
#msg{font-size:16px;line-height:1.85;white-space:pre-wrap}
#msgbox.more::after{content:'';position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(45deg)}}
#cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cmd .label{grid-column:1/-1;color:var(--sub);font-size:13px;padding:2px 2px 0}
#cmd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;min-height:64px}
#cmd button svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cmd button:hover{border-color:var(--accent)}
#cmd button:active{transform:scale(.96);background:#262c3a}
#cmd.list{grid-template-columns:1fr 1fr}
#cmd.list button{flex-direction:row;justify-content:flex-start;min-height:50px;padding:10px 14px;text-align:left}
#cmd.pad{grid-template-columns:repeat(5,1fr)}
#cmd.pad button{min-height:52px;font-size:20px;border-radius:50%;aspect-ratio:1;padding:0}
#cmd button.back{background:transparent;color:var(--sub);border-style:dashed}
#cmd.pad button.back{border-radius:14px;aspect-ratio:auto;grid-column:1/-1;font-size:14px}
#cmd button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#cmd.one{grid-template-columns:1fr}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px #0006;transition:.3s;z-index:9;pointer-events:none;width:max-content;max-width:calc(100vw - 32px);box-sizing:border-box;text-align:center;line-height:1.5;word-break:auto-phrase;line-break:strict}
/* 長い名前（資料の題など）は折り返す。2行になったら角を小さく */
#toast.multi{border-radius:16px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px;overflow:auto}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em}
#title h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:44px;line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 30px #000}
#title p{color:var(--sub);font-size:14px;line-height:1.9}
.big{width:240px;padding:14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:15px;font-weight:500;cursor:pointer}
.big.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#prologue{justify-content:flex-start}
#prologue .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:left;line-height:1.95;font-size:15px;margin:auto 0}
#prologue h2{font-family:'Shippori Mincho',serif;font-size:24px;text-align:center;margin-bottom:14px}
#prologue b{color:var(--accent)}
#prologue .cast{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
#prologue .cast div{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
#prologue .cast span{min-width:76px;color:var(--blue);font-weight:700}
.hide{display:none!important}

#hdr-r{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px 26px;max-height:85vh;overflow:auto}
#modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:12px}
#modal .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:14px}
#modal .row:not([disabled]):hover{border-color:var(--accent)}
#modal .row .t{flex:1}
#modal .row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#modal .row[disabled]{opacity:.45;cursor:default}
#modal .close{margin-top:6px;width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
#card{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 40%,#24304a 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:fade .6s}
#card .n{color:var(--accent);letter-spacing:.35em;font-size:13px}
#card .t{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;letter-spacing:.08em}
#card .tap{color:var(--sub);font-size:12px;margin-top:30px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#bg,#bg img{width:100%;height:100%;display:block;object-fit:cover}
#loading .bar{width:220px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px}
#nbook{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.nb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.nb-head h3{font-family:'Shippori Mincho',serif;font-size:21px}
.nb-x{background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.nb-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb-tabs button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.nb-tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.nb-body{flex:1;overflow:auto;padding:12px 14px 30px}
.nb-entry{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 44px 11px 14px;margin-bottom:8px}
.nb-entry.pinned{border-color:var(--accent)}
.nb-entry .meta{color:var(--blue);font-size:12px;font-weight:700;margin-bottom:3px}
.nb-entry .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.nb-entry.item{padding:0}
.nb-entry.item summary{list-style:none;cursor:pointer;padding:11px 40px 11px 14px;position:relative}
.nb-entry.item summary::-webkit-details-marker{display:none}
.nb-entry.item summary::after{content:'';position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.nb-entry.item[open] summary::after{transform:translateY(-30%) rotate(225deg)}
.nb-entry.item .desc{padding:0 14px 12px;font-size:13px;line-height:1.75;color:var(--sub);white-space:pre-wrap}
.nb-entry .pin{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:20px;color:var(--sub);cursor:pointer;padding:2px 6px}
.nb-entry .pin.on{color:var(--accent)}
.nb-bar,.nb-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)}
.nb-filter input[type=search]{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px}
.nb-filter select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--text);font:inherit;font-size:13px;max-width:48%}
.nb-bar .cnt,.nb-body .cnt{margin-left:auto;color:var(--sub);font-size:12px;margin-bottom:6px}
.nb-empty,.nb-note{color:var(--sub);font-size:13px;line-height:1.8;padding:6px 2px}
#memo{width:100%;min-height:50vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:15px;line-height:1.8;resize:vertical}
#modal .recap{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:6px 0 18px}
#modal .eyebrow{margin-bottom:4px}
.nb-contra{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center;position:sticky;top:0;z-index:1}
.nb-contra .big{width:100%}
.nb-contra small{display:block;color:var(--sub);font-size:12px;margin-top:6px}
.nb-contra .sel{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.nb-contra .row2{display:flex;gap:8px}
.nb-contra .row2 .big{flex:1;width:auto}
.nb-contra .big.back{background:transparent;color:var(--sub);border-style:dashed}
.nb-contra .big[disabled]{opacity:.4}
.nb-entry.selectable{cursor:pointer}
.nb-entry.chosen{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
#cmd button{position:relative}
#cmd .badge{position:absolute;top:7px;right:9px;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;line-height:1.5}
.big,.pill,#modal .row,.nb-tabs button,.nb-x{transition:transform .08s,filter .15s,background .15s}
.big:active,.pill:active,#modal .row:not([disabled]):active,.nb-tabs button:active,.nb-x:active{transform:scale(.96);filter:brightness(1.25)}
.big.going{filter:brightness(1.25);pointer-events:none}
body.leaving::after{content:'開いています…';position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0e1117cc;color:var(--text);font-size:15px;letter-spacing:.1em;animation:fade .2s}
.nb-entry .broken{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;font-size:10.5px;padding:0 8px;margin-right:6px}
.nb-entry.is-broken .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c2553f99}
#modal .board .b-sus{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
#modal .board .b-sus span{background:var(--accent);color:#1a1405;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;transition:.2s}
#modal .board .b-sus span.out{background:var(--panel2);color:var(--sub);text-decoration:line-through;font-weight:400}
#modal .board .row.on{border-color:var(--accent);background:#2a2a20}
#modal .board .row2{display:flex;gap:8px;margin-top:10px}
#modal .board .row2 .big{flex:1;width:auto}
#modal .board .row2 .big[disabled]{opacity:.4}
.nb-entry.doc{padding-right:14px}.nb-entry.doc .txt{white-space:pre-wrap;font-variant-numeric:tabular-nums;line-height:1.7}
#cmd #sq{grid-column:1/-1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:inherit}
#title .lock{color:var(--accent);margin:18px 0 6px}
/* 音のオン・オフ */
.pill.off{color:var(--sub);text-decoration:line-through}
#title .pill.sndt{position:absolute;top:14px;right:14px;font-size:12px}  /* 音のボタンは右上の端に */
#title .credit{color:#5c6370;font-size:11px;line-height:1.7;max-width:320px;margin-top:6px}
#sndpop{position:fixed;inset:0;z-index:20;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px}
#sndpop .sheet{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px 18px}
#sndpop h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:6px}
#sndpop .lead{color:var(--sub);font-size:13px;line-height:1.7;margin-bottom:14px}
#sndpop .row{display:grid;grid-template-columns:4.5em 1fr 2.5em;align-items:center;gap:10px;padding:8px 0}
#sndpop .n{font-size:14px;font-weight:500}
#sndpop .v{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
#sndpop input[type=range]{width:100%;accent-color:var(--accent);height:28px}
#sndpop .btns{display:flex;gap:8px;margin-top:14px}
#sndpop .btns .big{flex:1;width:auto}
#sndpop .big.back{background:transparent;color:var(--sub);border-style:dashed}
/* デバッグ：進み具合 */
.pill.dbg{border-color:#e0a43a;color:#e0a43a}
#flow{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
#flow .fl-head{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
#flow .fl-head b{color:#e0a43a;font-size:15px;white-space:nowrap}
#flow select{flex:1;min-width:0;font:inherit;font-size:13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
#flow .fl-x{font-size:22px;background:none;border:0;color:var(--sub);padding:0 6px;cursor:pointer}
#flow .fl-legend{display:flex;flex-wrap:wrap;gap:10px;padding:10px 14px 0;font-size:12px;color:var(--sub);align-items:center}
#flow .fl-legend span::before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:var(--line)}
#flow .fl-legend .done::before{background:#3f6b4a}#flow .fl-legend .now::before{background:#e0a43a}#flow .fl-legend .wait::before{background:#2a3142}
#flow .fl-tip{font-size:11.5px;color:var(--sub);padding:6px 14px 8px;line-height:1.6}
#flow .fl-cols{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:4px 14px 24px}
#flow .fl-col{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;padding-left:12px;border-left:2px solid var(--line);position:relative}
#flow .fl-lv{grid-column:1/-1;font-size:12px;color:var(--sub);padding:2px 0}
#flow .fl-col+.fl-col::before{content:'↓';position:absolute;left:-9px;top:-15px;font-size:12px;color:var(--sub)}
#flow .fl-n{text-align:left;font:inherit;background:var(--panel);border:1px solid var(--line);border-left:4px solid #2a3142;border-radius:10px;padding:8px 10px;color:var(--text);display:flex;flex-direction:column;gap:3px;cursor:pointer}
#flow .fl-n .k{font-size:12.5px;font-weight:700;line-height:1.45}
#flow .fl-n .t{font-size:11px;color:var(--sub);line-height:1.5}
#flow .fl-n .g{font-size:11px;color:#9fb4d8;line-height:1.5}
#flow .fl-n.done{border-left-color:#3f6b4a;opacity:.75}#flow .fl-n.now{border-left-color:#e0a43a;box-shadow:0 0 0 1px #e0a43a55}#flow .fl-n.wait{border-left-color:#2a3142}
#flow .fl-n.sel{outline:2px solid #fff}#flow .fl-n.up{outline:2px solid #6aa9ff}#flow .fl-n.down{outline:2px solid #c77dff}#flow .fl-n.dim{opacity:.3}
#flow.hide-done .fl-n.done{display:none}
/* いつも同じボタン（記録・もどる）は、一覧の線の下にまとめる。記録はもどる（点線）とも中身のボタン（塗り）ともちがう、金色の枠 */
#cmd .foot{grid-column:1/-1;display:flex;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
#cmd .foot button{flex:1;min-height:46px;flex-direction:row;justify-content:center;gap:7px;padding:8px 12px}
#cmd button.nb{background:transparent;border:1.5px solid var(--accent);color:var(--accent);position:relative}
#cmd .foot button.nb{border-radius:999px}
#cmd .foot button.nb svg{width:18px;height:18px}
#cmd button.nb:active{background:#2a2414}
#cmd .foot .badge{top:-8px;right:-4px}
#cmd .badge:empty{display:none}
#nbook{z-index:9}  /* 推理ボードの上でも開ける */
.big.nbk{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
#cmd.pad .foot button{aspect-ratio:auto;border-radius:999px;min-height:46px;font-size:14px;padding:8px 12px}#cmd.pad .foot button.back{border-radius:14px}
#title .dbg-jump{margin-top:8px;padding:12px;border:1px dashed #e0a43a;border-radius:16px;display:flex;flex-direction:column;gap:8px;width:280px}
#title .dbg-jump .lb{color:#e0a43a;font-size:12px}
#title .dbg-jump select{font:inherit;font-size:13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
#title .dbg-jump .big{width:100%}
#title .dbg-jump .st{font-size:11.5px;color:var(--sub);min-height:1em}

</style>
</head>
<body>
<div id="loading" class="screen"><div class="eyebrow">LOADING</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">読み込み中…</p></div>
<div id="title" class="screen hide"></div>
<div id="prologue" class="screen hide"></div>
<div id="toast"></div>
<div id="wrap" class="hide">
  <header><div id="locname"></div><div id="hdr-r"><button class="pill" id="menu">メニュー</button><button class="pill" id="snd" aria-label="音の設定"></button></div></header>
  <div id="scene"><div id="bg"></div><div id="here"></div></div>
  <div id="msgbox"><div id="who"></div><div id="msg"></div></div>

"三島「昭和35年の冬、汐見の海で事故死。遺体は上がっていません。…記者としては、気になるでしょう？」","note":"昭和35年の冬、汐見の海で事故死。遺体は上がっていない"},{"text":"三島「続きは、島で一族の方に聞いてみてください。私が聞くより、作家さんのほうが話してもらえますよ」"}]},"hito":{"seq":[{"text":"三島「黒田家の皆さんとは、取材で何度か。社長の康彦さんは紳士、専務の圭さんは切れ者。…執事の磯村さんが、いちばん何でも知っていそうですけどね」"},{"text":"三島「あの家の人たちは、創業者の話になると、口が重くなるんです。不思議なくらいに」"}]},"yakata":{"seq":[{"text":"三島「鴎島の館は、昭和37年に黒田惣一郎が建てた別邸です。創業者の名前を取って『久我館』」","note":"久我館は昭和37年、黒田惣一郎が建てた別邸。創業者の名を取った"},{"text":"三島「島には館と灯台しかない。船が止まれば、陸の孤島ですよ」"}]}}},"isomura":{"topics":{"ima":[{"if":"here:front && !flag:isomura_i0","text":"磯村「ようこそお越しくださいました。執事の磯村でございます。お荷物はわたくしがお運びいたします」","card":"執事。黒田家に長く仕えている","do":["flag:isomura_i0"]},{"if":"here:front","text":"磯村「どうぞ館の中へ。足元が濡れておりますので、お気をつけくださいませ」"},{"if":"!flag:dinner_called && !flag:i_tour","text":"磯村「館をご案内いたします。本館の1階に、この玄関ホールと大食堂、談話室。お客さまのお部屋は2階でございます」","do":["flag:i_tour"],"card":"本館：1階に玄関ホール・大食堂・談話室・厨房、2階に客室"},{"if":"!flag:dinner_called && !flag:i_west","text":"磯村「奥の渡り廊下の先が西棟でございます。書庫と、わたくしの執事室、それに大奥さまのお部屋。…本館と西棟は、あの渡り廊下だけでつながっております」\n\n書庫、と口にしたとき、磯村はわずかに言いよどんだ。","do":["flag:i_west"],"card":"本館と西棟は1階の渡り廊下だけでつながる。西棟には書庫・執事室・タキの私室"},{"if":"!flag:dinner_called && !flag:i_door","text":"磯村「西棟には外へ出る通用口もございます。灯台へ続く小道に出られますが、21時にはわたくしが施錠し、鍵は執事室の鍵棚に掛けております」","do":["flag:i_door"],"card":"西棟の通用口は21時に磯村が施錠。鍵は執事室の鍵棚"},{"if":"!flag:dinner_called","text":"磯村「宴は19時からでございます。それまでどうぞ、ごゆっくり」"},{"if":"flag:dinner_done && !flag:i_mishima","text":"磯村「三島さま、でございますか。宴の途中、20時40分ごろにテラスへ出ていかれました。お戻りは、大奥さまのお話のあとでございます」","do":["flag:i_mishima"],"card":"三島は20時40分ごろテラスへ出て、タキの話のあとに戻った"},{"if":"flag:dinner_done && !flag:locked","text":"磯村「では、わたくしは通用口の戸締まりをしてまいります。…もう21時でございますので」\n\n磯村は鍵束を手に、渡り廊下のほうへ歩いていった。","do":["flag:locked"],"card":"宴のあと21時、磯村が通用口を施錠しに西棟へ向かった"},{"text":"磯村「何かございましたら、お申し付けくださいませ」"}],"kuga":{"seq":[{"text":"磯村「わたくしが書生としてお仕えしはじめたのは、昭和35年。久我さまが亡くなられる少し前でございます。…とても静かな方でございました」","note":"磯村は昭和35年、久我が亡くなる少し前に書生として仕えはじめた"},{"text":"磯村「久我さまは、毎月欠かさず、信州へお出かけになっておられました。ご母堂さまのお見舞いだと伺っております」","note":"久我は毎月欠かさず信州へ出かけた。母親の見舞いだったらしい"},{"text":"磯村「…それ以上のことは、わたくしの口から申し上げることではございません」"}]},"hito":{"seq":[{"text":"磯村「大奥さまは、旦那さま――惣一郎さまが亡くなられてから、ずっとこの島でお暮らしでございます」"},{"text":"磯村「康彦さまも玲子さまも、お小さいころからお仕えしております。圭さまと沙耶さまは、わたくしにとっては孫のようなもので」"}]},"yakata":{"seq":[{"text":"磯村「この館は昭和37年の築でございます。台風のたびに停電いたしますので、西棟の地下に自家発電を備えております。動かすのは、わたくしの役目で」","card":"台風のたびに停電する。西棟地下の自家発電は磯村が動かす"},{"text":"磯村「書庫は、惣一郎さまがお使いになっていたお部屋でございます。今は大奥さまのお許しがなければ、どなたも…」"}]}}},"saya":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:saya_i0","text":"沙耶「あ、作家の先生たち？ 黒田沙耶です。建築をやってて、この館の改修を頼まれてるの」","card":"建築家。館の改修を任されている","do":["flag:saya_i0"]},{"if":"!flag:dinner_done && !flag:saya_i1","text":"沙耶「古い館って面白いのよ。図面と実物を見比べると、いろいろ出てくるの。隠し扉とか、ね。なんて」","do":["flag:saya_i1"]},{"if":"!flag:dinner_done && !flag:saya_i2","text":"沙耶「たとえば西棟の書庫。右の壁だけ、図面と寸法が合わないのよ。壁が厚すぎる。…まあ、昔の建物にはよくあることだけど」","card":"書庫の右の壁だけ、図面と寸法が合わない（壁が厚すぎる）","do":["flag:saya_i2"]},{"if":"!flag:dinner_done && !flag:saya_i3","text":"沙耶「…ごめん、電話。――はい、黒田です。…分かってます。来月には必ずお支払いしますから。…はい」\n\n電話を切った沙耶は、こちらに気づいて、ばつが悪そうに笑った。\n\n沙耶「独立したばっかりの事務所って、大変なのよ」","card":"沙耶は電話で「来月には必ず払う」と話していた。独立したばかりの事務所は苦しいらしい","do":["flag:saya_i3"]},{"if":"!flag:dinner_done","text":"沙耶「宴、退屈だろうなあ。おばあさまの話、長いから」"},{"if":"!flag:s_after","text":"沙耶「おばあさま、本気かな。財団に寄付なんて…。ママのホテルの話も、みんなが当てにしていたものも、全部なくなっちゃう」","do":["flag:s_after"],"card":"沙耶：財団に寄付となれば、みんなが当てにしていたものがなくなる"},{"text":"沙耶「わたし、部屋で図面の続きをやるね。今夜中に終わらせたいの」"}],"kuga":{"seq":[{"text":"沙耶「創業者？ おばあさまの話でしか知らないなあ。おじいさまは、久我さんのことを『恩人』って呼んでたんだって」","note":"黒田惣一郎は久我を「恩人」と呼んでいた"},{"text":"沙耶「あ、でも変な話がある。久我さんって、海が嫌いだったらしいの。海運会社の社長なのに、船に乗らなかったんだって」","note":"久我は海運会社の社長なのに、船に乗ろうとしなかった"}]},"hito":{"seq":[{"text":"沙耶「ママはホテルのことで頭がいっぱい。伯父さんは優しいけど、圭兄さんの言いなりって、みんな言ってる」"},{"text":"沙耶「浅見先生は、おばあさまのお気に入り。最近はずっと二人で書庫にこもってた」","card":"最近、浅見はタキとずっと書庫にこもっていた"}]},"yakata":{"seq":[{"text":"沙耶「この館、昭和の洋館にしてはよくできてるの。渡り廊下だけは、あとから付けたみたいだけど」"},{"text":"沙耶「改修の図面、もうすぐできるの。見たい？ …まだだめ。完成したらね」"}]}}},"yasuhiko":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:yasuhiko_i0","text":"康彦「やあ、伝記の先生方か。社長の黒田康彦です。母のわがままに付き合わせて、すまないね」","do":["flag:yasuhiko_i0"]},{"if":"!flag:dinner_done && !flag:yasuhiko_i1","text":"康彦「創業者の久我さんは、父の恩人でね。父はずっと右腕だった。…私が生まれる前に亡くなったから、父から聞いた話しか知らないが」","do":["flag:yasuhiko_i1"]},{"if":"!flag:dinner_done && !flag:yasuhiko_i2","text":"康彦「圭、合併の話は明日にしよう。母さんの前では、まだ言わないでおく約束だ」\n\n圭が肩をすくめた。親子のあいだには、何か二人だけの取り決めがあるらしい。","card":"康彦と圭は、合併の話をタキにまだ伝えていない","do":["flag:yasuhiko_i2"]},{"if":"!flag:dinner_done","text":"康彦「宴まで、ゆっくりしていてくれ」"},{"if":"!flag:y_after","text":"康彦「母さんが、あんなことを考えていたとはな…。いや、悪くない話だ。父も、きっとそう言う」\n\n言葉とは裏腹に、康彦の指は、空のグラスを何度も回していた。","do":["flag:y_after"],"card":"タキの遺言を、康彦は「悪くない話」と言った（グラスを回す手は落ち着かない）"},{"text":"康彦「今夜は冷える。暖炉のそばにいるといい」"}],"kuga":{"seq":[{"text":"康彦「父は、久我さんのことを話したがらなかった。『あの人は、自分のことを語らない人だった』とだけ」","note":"惣一郎は「あの人は、自分のことを語らない人だった」と言っていた"},{"text":"康彦「会社の古い記録には、創業の資金は『引き揚げ後の闇市の商売で作った』とある。帳簿の付け方が、とにかくうまかったそうだ」","note":"創業資金は闇市の商売で作った。帳簿の付け方がうまかった"},{"text":"康彦「事故の夜のことは、母のほうが詳しい。私はまだ生まれてもいなかったから」"}]},"hito":{"seq":[{"text":"康彦「圭は、私よりずっと商売がうまい。合併も、あいつがいなければまとまらなかった」"},{"text":"康彦「玲子とは昔から意見が合わなくてね。この館をホテルにするなんて、私は反対なんだが」"}]},"yakata":{"seq":[{"text":"康彦「子どものころは、夏になるとこの島で過ごした。灯台まで走って、よく磯村に叱られたよ」"}]}}},"kei":{"topics":{"ima":[{"if":"!flag:kei_i0","text":"圭「専務の黒田圭です。伝記ですか。…祖母が喜びます」","do":["flag:kei_i0"]},{"if":"!flag:kei_i1","text":"圭「来月、グループの大きな合併があるんです。父と二人で3年かけて進めてきた話で。こんな島で祝っている場合じゃないんだけど、祖母の米寿ですからね」","card":"来月の大型合併は、社長の康彦と専務の圭が3年かけて進めてきた","do":["flag:kei_i1"]},{"if":"!flag:kei_i2","text":"圭「父は社長、僕は専務。合併がまとまれば、グループは倍の大きさになる。…祖母には、まだ詳しく話していないんですけどね」","do":["flag:kei_i2"]},{"text":"圭「…失礼。仕事の電話を待っているので」"}],"kuga":{"seq":[{"text":"圭「創業者の伝記ね。正直、僕は興味がない。60年以上も前の人ですよ」"},{"text":"圭「ただ、会社の社是は今も久我さんの言葉なんです。『預かったものは、必ず返す』。…古くさいでしょう？」","note":"久我グループの社是は久我の言葉「預かったものは、必ず返す」"}]},"hito":{"seq":[{"text":"圭「沙耶は昔からこの館が好きでね。改修の話も、あいつが自分から手を挙げた」"},{"text":"圭「浅見先生？ 優秀な弁護士ですよ。最近は祖母の専属みたいになってるけど」"}]},"yakata":{"seq":[{"text":"圭「この島、電波が弱いんですよ。仕事の電話がろくにつながらない」","card":"島は電波が弱く、携帯電話がつながりにくい"}]}}},"reiko":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:reiko_i0","text":"玲子「長女の玲子です。ホテルの部門を見ております。…娘の沙耶には、もうお会いになった？」","do":["flag:reiko_i0"]},{"if":"!flag:dinner_done && !flag:reiko_i1","text":"玲子「この館も、来年にはホテルに改装する予定なのよ。母が許せば、だけど」","do":["flag:reiko_i1"]},{"if":"!flag:dinner_done","text":"玲子「宴では、母の近くにお座りになって。喜ぶわ」"},{"if":"!flag:r_after","text":"玲子「…財団ね。母は昔から、父が残したものを『預かりもの』って呼んでいたの。いつか返さなきゃいけない、って。\n\nでも、この館のホテルの計画は、もう銀行とも話がついているのよ。それを全部…」","do":["flag:r_after"],"card":"財団に寄付となれば、銀行とも話がついている玲子のホテル計画がなくなる"},{"text":"玲子「わたしはここで少し飲んでいくわ。眠れそうにないもの」"}],"kuga":{"seq":[{"text":"玲子「母から聞いたことがあるわ。久我さんは亡くなる前の年に、汐見の古い漁村のお墓に、こっそりお参りしていたって。誰のお墓かは知らないけど」","note":"久我は亡くなる前の年、汐見の古い漁村の墓にこっそり参っていた"},{"text":"玲子「わたしが生まれる前の話よ。母は、それ以上は話さないの」"}]},"hito":{"seq":[{"text":"玲子「沙耶には苦労をかけたわ。独立したいって言い出したとき、わたしは反対したの」"},{"text":"玲子「三島さん？ 社史の取材の人ね。母が呼んだのよ。わたしは、記者は好きじゃないけれど」"}]},"yakata":{"seq":[{"text":"玲子「ホテルにしたら、この談話室はラウンジにするの。暖炉はそのまま残して」"}]}}},"taki":{"topics":{"ima":[{"if":"!flag:taki_i0","text":"タキ「伝記の先生方。よう来てくださいましたね。…主人と久我さんのこと、どうか書いてくださいな。きれいごとじゃない、本当のことを」","card":"タキ：主人と久我さんの「本当のこと」を書いてほしい","do":["flag:taki_i0"]},{"if":"!flag:taki_i1","text":"タキ「わたしはもうすぐ西棟の部屋に戻ります。年寄りは早寝でね」","do":["flag:taki_i1"]},{"text":"タキ「明日の朝、皆に話しますよ。それまでは、何も聞かないでちょうだい」"}],"kuga":{"seq":[{"text":"タキ「久我さんはね、ご自分の誕生日を、一度も祝わせなかったの。『おれの誕生日は、もう祝う人がいない』って」","note":"久我は自分の誕生日を一度も祝わせなかった"},{"text":"タキ「主人と久我さんは、戦地で知り合ったのではないの。引き揚げたあと、闇市で出会ったのよ。主人は、久我さんの帳簿の腕に惚れこんだの」","note":"惣一郎と久我は戦地ではなく、引き揚げ後の闇市で出会った"},{"text":"タキ「明日、遺言を読み終えたら、もう少し話してあげますよ」"}]},"hito":{"seq":[{"text":"タキ「孫たちは、皆いい子ですよ。…欲がなければ、ね」"}]},"yakata":{"seq":[{"text":"タキ「わたしは西棟の部屋で休みます。夜は、渡り廊下の向こうはしんとして、波の音しか聞こえないの」"}]}}},"asami":{"topics":{"ima":[{"if":"!flag:a1","text":"浅見「顧問弁護士の浅見です。…ええ、遺言書はわたしがお預かりしています。中身は、明日の朝まで申し上げられません」","do":["flag:a1"],"card":"浅見：遺言書は自分が預かっている"},{"if":"!flag:a2","text":"浅見「このあと書庫で、大奥さまと最後の確認をします。…嵐になりそうですね」\n\n浅見は、膝の上の革のファイルを両手で押さえた。","do":["flag:a2"],"card":"浅見はこのあと書庫で遺言の確認をする。革のファイルを持っている"},{"text":"浅見「失礼。少し急ぎますので」"}],"kuga":{"seq":[{"text":"浅見「創業者の記録なら、書庫に古い資料がそろっています。ただ、明日までは誰も入れないよう、大奥さまに言われています」"}]},"hito":{"seq":[{"text":"浅見「黒田家の皆さまは、それぞれにお仕事を抱えておいでです。…遺言のことで、明日はたいへんな一日になるでしょう」"}]}}}},"look":{"ferry":"小さな白い連絡船。定員30人ほど。船体に「かもめ丸」と書いてある。","notice":{"text":"掲示板に紙が貼ってある。\n『台風12号接近のため、明日以降の運航は未定です』","card":"台風12号接近。明日以降の連絡船の運航は未定"},"town":"汐見の港町。坂に沿って家々が並び、窓に明かりがともりはじめている。","island":{"text":"灰色の海に、小さな岩の島が浮かんでいる。頂上に石造りの洋館、西の端に白い灯台。\n\nあれが鴎島。島の周りでは、波が白く砕けている。","do":["flag:saw_island"],"card":"鴎島：頂上に洋館、西の端に灯台"},"lighthouse":"西の崖の上に、白い灯台が立っている。もう灯りがともっていた。","wake":"船のあとに、白い泡の道が続いている。汐見港の明かりが、もう遠い。","gate":"鉄の門。門柱に、小さく「久我館」と彫られている。","windows":"1階の窓にはすべて明かりがついている。2階の西のほうの窓だけが暗い。","path":{"text":"館の西側、別棟の脇から、細い小道が崖のほうへ延びている。先に灯台が見える。","card":"西棟の脇から、灯台へ続く小道がある"},"portrait":"大階段の上に、男の肖像画。背広姿で、胸に手を当てている。顔のあたりは絵の具が褪せて、表情がよく分からない。","plaque":{"text":"肖像画の下に、真鍮の銘板。\n『久我誠一郎　昭和二十一年 帰還　昭和二十五年 久我海運 創業』","card":"肖像画の銘板：久我誠一郎、昭和二十一年 帰還、昭和二十五年 久我海運 創業"},"stairs":"赤い絨毯の敷かれた大階段。2階の回廊につながっている。","corridor":{"text":"ホールの奥に、ガラス張りの渡り廊下の入口がある。40メートルほど先が西棟だ。夜は真っ暗になりそうだ。","card":"渡り廊下はガラス張りで約40m。その先が西棟"},"fireplace":"暖炉の火が勢いよく燃えている。8月なのに、島の夜は冷えるらしい。","window":"窓の外は真っ暗だ。ガラスを打つ雨の音が、だんだん強くなっていく。","shelf":"古い本がぎっしり並んでいる。社史の分厚い背表紙もある。","chess":"チェス盤。白のキングが追いつめられたところで、手が止まっている。","bag":{"text":"自分の旅行かばんを、ベッドの脇に置いた。中には原稿用紙と、タキからの依頼状が入っている。","do":["flag:room_seen"]},"desk":"窓際の小さな机。ここで原稿を書けということらしい。","map":{"text":"壁に館の案内図が貼ってある。本館と西棟、そのあいだの渡り廊下。西棟の地下には『ボイラー室・乾燥室』とある。","card":"西棟の地下に、ボイラー室と乾燥室がある"},"table":"長いテーブルに、白いクロスと燭台。宴の名残の皿がまだ残っている。","clock":"背の高い振り子時計。時を刻む音が、大食堂に低く響いている。","flowers":"米寿の祝いの花。白いカードに『祝 米寿 タキ様』とある。"},"events":{"call":{"pages":["18時50分。廊下のどこかで、小さな鈴が鳴った。","磯村「皆さま、宴の支度が整いました。大食堂へお越しくださいませ」"]},"dinner":{"bg":"dining","place":"大食堂","pages":["19時。大食堂の長いテーブルに、一族と客がそろった。窓の外では、風が強くなりはじめている。","タキ「皆、今日はありがとう。米寿だなんて、自分でも信じられませんよ」","乾杯のあと、料理が運ばれてくる。康彦が社長らしく場をまとめ、玲子が来年のホテルの話をし、圭は合併の話を持ち出しかけて父に目で止められた。沙耶は祖母のグラスに、そっと水を注いでいる。","20時40分ごろ。三島が小さく会釈して席を立ち、テラスへ出ていった。たばこだろう。磯村がテラスの扉を開けてやっている。","タキ「…さて。皆に言っておくことがあります」","タキ「遺言を書き直しました。新しい遺言書は、浅見先生に預けてあります。明日の朝、ここで皆に読んでもらいます」","タキ「財産の大半は、汐見の町の財団に寄付します。黒田の家が、この先も会社を握ることはありません。…主人から預かったものを、お返しするだけですよ」","大食堂が静まりかえった。康彦は目を閉じ、玲子は青ざめてグラスを置いた。圭は腕を組んだまま動かない。沙耶は唇をかんで、祖母の顔を見つめている。給仕をしていた磯村の手の中で、皿がかすかに鳴った。","浅見は、膝の上の革のファイルを抱え直した。テーブルの全員の目が、一度はそのファイルに向いた。","このとき大食堂にいたのは、タキ、康彦、玲子、圭、沙耶、浅見、磯村。そして僕と鷹宮。三島はまだテラスから戻っていない。","しばらくして三島が戻ってきたが、誰も今の話を口にしなかった。宴は、どこかぎこちないまま21時前にお開きになった。"],"do":["flag:dinner_done","card:taki:遺言を書き直し、浅見に預けた。明日の朝に発表する","card::タキの宣言のとき大食堂にいたのは、タキ・康彦・玲子・圭・沙耶・浅見・磯村・葛西・鷹宮（三島はテラス）"]},"blackout":{"bgm":"common_incident","bg":"salon","place":"談話室","pages":["22時を回った。談話室には玲子、康彦、三島、そして僕と鷹宮。暖炉の火が、ときどき風にあおられる。","タキは西棟の自室へ。浅見は書庫へ向かったと、磯村が言っていた。沙耶と圭は、それぞれ本館2階の部屋に戻っている。","鷹宮「えらい音やな。雷が近い」","その瞬間、窓の外が白く光った。","――轟音。","そして、館じゅうの明かりが消えた。","玲子「停電…！」","康彦「落ち着いて。自家発電がある。磯村がすぐに動かしてくれる」","暗闇の中で腕時計を見る。夜光の針は、10時40分を指していた。","この20分のあいだに、何が起きていたのか。それを知るのは、翌朝のことになる。"],"do":["card::停電は22時40分。そのとき談話室にいたのは玲子・康彦・三島・葛西・鷹宮","chapter:ch2"]}},"triggers":[{"if":"flag:room_seen && flag:i_tour && talked:saya>=1 && talked:yasuhiko>=1 && talked:kei>=1 && talked:reiko>=1 && var:notes>=5 && !flag:dinner_called","do":["flag:dinner_called","event:call"]},{"if":"flag:locked && flag:m_after2 && flag:y_after && flag:r_after && flag:s_after && flag:a2 && talked:taki>=1 && !flag:blackout_ready","do":["flag:blackout_ready","toast:談話室に皆が集まりはじめた"]},{"if":"flag:blackout_ready && here:salon && !flag:blackout","do":["flag:blackout","event:blackout"]}]},"ch2":{"id":"ch2","label":"第二章","title":"書庫の密室","recap":"8月14日、鴎島の久我館で、当主タキの米寿の宴が開かれた。タキは「遺言を書き直して浅見に預けた。財産の大半を汐見の財団に寄付する。明日の朝に発表する」と告げた。三島はそのときテラスにいた。\n\n22時40分、落雷で停電。談話室には玲子・康彦・三島・葛西・鷹宮がいた。電気が戻ったのは23時だった。","start":{"loc":"guestroom","text":"8月15日、朝7時。\n\n叩きつける雨の音で目が覚めた。…いや、雨だけじゃない。下の階で、誰かが叫んでいる。"},"locations":{"guestroom":{"name":"客室（葛西と鷹宮）","bg":"guestroom","people":["takamiya"],"objs":{"window":"窓","desk":"机","bag":"旅行かばん"},"arrive":"客室に戻ってきた。窓の外は、まだ嵐だ。"},"hall":{"name":"玄関ホール","bg":"hall","people":["takamiya",{"id":"isomura","if":"flag:found && !flag:phone"}],"objs":{"phone":"電話","portrait":"肖像画","door":"玄関の扉"},"arrive":[{"if":"!flag:found","text":"階段を駆け下りる。玄関ホールの奥、渡り廊下のほうから、磯村の声が聞こえる。"},{"text":"玄関ホール。シャンデリアの明かりが、どこか頼りない。"}]},"corridor":{"name":"西棟の廊下","bg":"corridor","people":["takamiya",{"id":"isomura","if":"!flag:found"}],"objs":{"blood":"床のしみ","libdoor":"書庫の扉","bridge":"渡り廊下","stairs2":"2階への階段"},"arrive":[{"if":"!flag:found","text":"渡り廊下を抜けて西棟へ。廊下の突き当たり、書庫の扉の前で、磯村が扉を叩いていた。\n\n磯村「浅見先生！ 浅見先生、お返事を…！」"},{"text":"西棟の廊下。昨夜の停電のときは、ここも真っ暗だったはずだ。"}]},"library":{"name":"書庫","bg":"library","unlock":"flag:found","people":["takamiya",{"id":"isomura","if":"flag:found && !flag:phone"}],"objs":{"body":"浅見","bar":"閂","file":"革のファイル","shelf":"右の本棚","window":"小窓","desk":"読書机"},"arrive":"書庫。床に倒れた浅見には、毛布が掛けられている。"},"butler":{"name":"執事室","bg":"butler","unlock":"flag:phone","people":["takamiya","isomura"],"objs":{"keys":"鍵棚","log":"発電機の記録","photo":"古い写真立て"},"arrive":"西棟の執事室。壁一面の鍵棚に、館じゅうの鍵が掛かっている。"},"salon":{"name":"談話室","bg":"salon","unlock":"flag:phone","people":["takamiya","taki","yasuhiko","reiko","kei","saya","mishima"],"objs":{"fireplace":"暖炉","window":"窓","clock2":"置き時計"},"arrive":[{"if":"!flag:gathered","text":"談話室に、館の全員が集められていた。誰も口をきかない。暖炉の火だけが、ぱちぱちと鳴っている。","do":["flag:gathered"]},{"text":"談話室。一族は、互いに目を合わせようとしない。"}]},"dining":{"name":"大食堂","bg":"dining","unlock":"flag:phone","people":["takamiya"],"objs":{"table":"長いテーブル","clock":"振り子時計","window":"窓の外"},"arrive":"誰もいない大食堂。昨夜の祝いの花が、そのまま残っている。"}},"talk":{"takamiya":{"topics":{"hint":[{"if":"!flag:found && !here:corridor","hints":["鷹宮「…なんや、騒がしいな」","鷹宮「下で誰かが叫んでる。磯村さんの声や」","鷹宮「『移動』で西棟の廊下へ行こ。急ぐで」"]},{"if":"!flag:found","hints":["鷹宮「扉が開かへんのか」","鷹宮「磯村さんと話してみ」","鷹宮「磯村さんに『いまのこと』を聞いて、扉を破るのを手伝お」"]},{"if":"!flag:phone","hints":["鷹宮「警察に知らせなあかん」","鷹宮「電話は玄関ホールにあったはずや」","鷹宮「玄関ホールへ行って、『調べる』で電話を見よ」"]},{"if":"var:alibis<7","hints":["鷹宮「昨夜の停電、20分あったな」","鷹宮「その20分、みんなどこにおったんやろ」","鷹宮「談話室と執事室で、全員に『停電のあいだ』を聞いて回ろ。タキさん、康彦さん、玲子さん、圭さん、沙耶さん、三島さん、磯村さんの7人や」"]},{"if":"!flag:saw_bar || !flag:saw_blood || !has:file","hints":["鷹宮「現場は、まだ見落としがあるかもしれん」","鷹宮「扉、床、それから浅見さんの持ち物や」","鷹宮「書庫の『閂』『革のファイル』と、西棟の廊下の『床のしみ』を調べよ」"]},{"text":"鷹宮「…ちょっと考えさせてくれ。何かが引っかかってるんや」"}],"dangi":{"seq":[{"text":"鷹宮「閂は内側からしか掛けられへん。ほんで中には浅見さんだけ。…教科書どおりの密室やな」"},{"text":"鷹宮「密室の三つの分け方、覚えてるか？ 犯人が外から作った密室、中で作った密室、それから犯人やない誰かが作ってもうた密室」"},{"text":"鷹宮「葛西。ミステリーの話をしてる場合やないのは分かってる。けど、こういうときこそ、順番に考えるんや」"}]}}},"isomura":{"topics":{"ima":[{"if":"!flag:opened","text":"磯村「閂が…内側から掛かっております！ 浅見先生が中に。お返事がございません！」\n\n鷹宮「磯村さん、扉を破りましょう。葛西、手伝え！」","do":["flag:opened","event:breakin"]},{"if":"!flag:phone","text":"磯村「わ、わたくしが…皆さまをお呼びしてまいります。電話は玄関ホールに…」"},{"text":"磯村「何かございましたら、執事室におります」"}],"teiden":{"seq":[{"text":"磯村「停電してすぐ、懐中電灯を持って渡り廊下を通り、西棟地下のボイラー室へ参りました。自家発電を動かしまして、23時に電気が戻りました」","card":"停電してすぐ、懐中電灯を持って渡り廊下を通り、西棟地下のボイラー室へ。23時に電気を戻した","do":["inc:alibis"]},{"text":"磯村「その間、どなたとも…いえ。渡り廊下は真っ暗で、わたくしの懐中電灯のほかに明かりはございませんでした。誰かとすれ違ったかと言われますと…分かりません」"},{"text":"磯村「ボイラー室におりましたので、書庫の物音などは聞こえておりません」"}]},"asami":{"seq":[{"text":"磯村「浅見先生は、22時ごろ大奥さまと書庫に入られ、大奥さまがお部屋に戻られたあとも、おひとりでお仕事を続けておいででした」"},{"text":"磯村「書庫の鍵は、外からかける錠と、内側の閂がございます。外の鍵は、昨夜はかかっておりませんでした」","card":"書庫は外からかける錠と、内側の閂。昨夜、外の錠はかかっていなかった"}]},"kuga":{"seq":[{"text":"磯村「久我さまが亡くなられた夜のことは…申し訳ございません。今は、そのお話は」"}]}}},"taki":{"topics":{"ima":{"seq":[{"text":"タキ「…浅見先生が。どうして、こんなことに」"},{"text":"タキ「わたしが遺言のことなど言わなければ…」"}]},"teiden":{"seq":[{"text":"タキ「わたしは西棟2階の自分の部屋にいましたよ。22時に書庫で浅見先生と最後の確認をして、先に部屋へ戻ったの」","card":"22時に書庫で浅見と確認をし、先に西棟2階の自室へ戻った。停電中は自室","do":["inc:alibis"]},{"text":"タキ「暗いのは慣れています。年寄りは、じっとしているだけですよ。耳が遠いから、何も聞こえなかったわ」"}]},"asami":{"seq":[{"text":"タキ「浅見先生は、遺言書を革のファイルに入れて、肌身離さず持っておられた。…あのファイルは、どこに？」"}]},"yakata":{"seq":[{"text":"タキ「書庫には、主人の大事な預かりものがしまってあるの。…いつか、お返ししなければならないものよ」","card":"書庫には、夫の大事な「預かりもの」がしまってある"},{"text":"タキ「それが何かは、まだ言えません。浅見先生にだけは、話してあったけれど」"}]},"kuga":{"seq":[{"text":"タキ「久我さんのことは、また今度。…今は、そんな気持ちになれないの」"}]}}},"yasuhiko":{"topics":{"ima":{"seq":[{"text":"康彦「とにかく警察だ。…電話が通じない？ 携帯も？ 冗談だろう」"},{"text":"康彦「みんな、勝手に動き回らないでくれ。…犯人が、この中にいるかもしれないんだ」"}]},"teiden":{"seq":[{"text":"康彦「停電のあいだは、談話室だ。玲子と三島くん、それに君たちと一緒にいた。暗い中で、鷹宮くんと大学の話をしていたよ」","card":"停電中は談話室。玲子・三島・葛西・鷹宮と一緒だった","do":["inc:alibis"]},{"text":"康彦「圭？ 部屋に戻ると言っていたな。宴のあと、ずいぶん不機嫌だったから」"}]},"asami":{"seq":[{"text":"康彦「浅見くんは、父の代からの顧問の娘さんでね。母がいちばん信頼していた」"},{"text":"康彦「遺言の中身？ 私も知らない。母は、浅見くんにしか話していなかったはずだ」","card":"遺言の中身は、タキと浅見しか知らなかったはず"}]},"hito":{"seq":[{"text":"康彦「…正直に言おう。合併が止まれば、会社は困る。私も、圭もだ。だが、だからといって人を殺すような人間は、うちにはいない」"}]}}},"reiko":{"topics":{"ima":{"seq":[{"text":"玲子「警察が来るまで、どのくらいかかるの？ …船が出ない？ じゃあ、わたしたち、犯人と一緒にこの島に閉じこめられているってこと？」"}]},"teiden":{"seq":[{"text":"玲子「停電のあいだは、ずっと談話室よ。兄さんと三島さんと、あなたたち。真っ暗で、誰がどこにいるかなんて分からなかったけど、声はずっと聞こえていたわ」","card":"停電中は談話室にいた。真っ暗で、誰がどこにいるかは見えなかったが、声は聞こえていた","do":["inc:alibis"]},{"text":"玲子「沙耶？ あの子は部屋で図面を描くって言ってたわ。…まさか、あの子を疑ってるの？」"}]},"asami":{"seq":[{"text":"玲子「浅見さんとは、ホテルの件でよくもめたわ。銀行との契約に、母の承諾が要るって。…それだけよ」"}]},"hito":{"seq":[{"text":"玲子「遺言が読まれなかったら、どうなるのかしら。…ごめんなさい、こんなときに」"}]}}},"kei":{"topics":{"ima":{"seq":[{"text":"圭「電話も駄目、携帯は圏外、船は欠航。…完璧ですね。誰かが仕組んだみたいに」"}]},"teiden":{"seq":[{"text":"圭「停電？ 自室で寝ていましたよ。宴で飲みすぎて、22時前にはベッドに入った。停電にも気づかなかったくらいです」","card":"停電中は本館2階の自室で寝ていた。停電にも気づかなかった","cardId":"kei_sleep","do":["inc:alibis"]},{"text":"圭「証人？ いませんよ。寝ている人間に、証人がいるわけがない」"}]},"asami":{"seq":[{"text":"圭「浅見先生とは仕事でよく顔を合わせました。有能な人でしたよ。祖母の言うことを、何でも聞く人でもあった」"}]},"hito":{"seq":[{"text":"圭「疑うなら、まずは書庫に近づきたがっていた人を疑うべきじゃないですか。…社史の取材とか言ってね」"}]}}},"saya":{"topics":{"ima":{"seq":[{"text":"沙耶「…信じられない。昨日の夜、宴で浅見先生と話したばかりなのに」"}]},"teiden":{"seq":[{"text":"沙耶「わたしは本館2階の自分の部屋で、図面を描いてた。停電で手元が真っ暗になって、懐中電灯を探してバタバタしてたの」","card":"停電中は本館2階の自室で図面を描いていた。懐中電灯を探していた","do":["inc:alibis"]},{"text":"沙耶「証人？ …いない。ひとりだったもの」"}]},"asami":{"seq":[{"text":"沙耶「浅見先生、昨日の宴のあと、わたしに『書庫の改修は、遺言が読まれるまで待ってほしい』って言ったの。どういう意味だったんだろう」"}]},"yakata":{"seq":[{"text":"沙耶「書庫の閂は、内側からしか掛けられないの。古い造りよ。外から細工する隙間もない。…わたし、改修のときに確かめたから間違いない」","card":"書庫の閂は内側からしか掛けられず、外から細工する隙間もない（沙耶が改修の下見で確かめた）"}]}}},"mishima":{"topics":{"ima":{"seq":[{"text":"三島「…取材に来て、こんなことになるとは。記者としては、記録を取っておくべきなんでしょうけどね」"}]},"teiden":{"seq":[{"text":"三島「停電中ですか？ 談話室から一歩も出ていません。皆さんと一緒でしたよ」","card":"停電中は談話室から一歩も出ていない","cardId":"mishima_stay","do":["inc:alibis"]},{"text":"三島「真っ暗でしたからね。誰が何をしていたかまでは…」"}]},"asami":{"seq":[{"text":"三島「浅見先生には、書庫の資料を見せてくれと頼んで、断られました。それきりです」"},{"text":"三島「遺言？ 昨日も言いましたが、私はその場にいなかったんです。タキさんが何を言ったのかも、あとで聞いたくらいで」","card":"タキの宣言のとき、三島はその場にいなかった"}]},"hito":{"seq":[{"text":"三島「圭さんに、さっき嫌味を言われましたよ。書庫に近づきたがっていた記者が怪しい、ってね」"}]}}}},"look":{"window":"窓の外は灰色の嵐。海は白く荒れて、汐見の町は見えない。","desk":"読書机の上に、浅見の万年筆とメモ用紙。メモには、日付と数字がいくつか書いてあるだけだ。","bag":"旅行かばん。伝記の資料が入っている。","phone":[{"if":"!flag:phone","text":"玄関ホールの電話を取る。…何の音もしない。何度かけ直しても同じだ。\n\n康彦「電話線が切れたか。携帯は…圏外だ」\n\n磯村「港の事務所にも、連絡がつきません。この嵐では、船も…」\n\n島は、完全に孤立した。","do":["flag:phone","card::電話は不通、携帯は圏外、船は欠航。島は孤立した","toast:談話室に全員が集められた"]},{"text":"受話器からは、何の音もしない。"}],"portrait":"肖像画の男は、今朝も表情が分からない。","door":"玄関の扉の外は、横なぐりの雨だ。とても出られそうにない。","blood":[{"if":"!flag:found","text":"…今はそれどころではない。"},{"text":"書庫の扉の手前、廊下の床に、点々と黒いしみがある。拭き取ったあとがあるが、板の目に入りこんだ色は消えていない。\n\n鷹宮「血や。…ここで刺されて、書庫まで歩いたんやな」","do":["flag:saw_blood"],"card":"西棟の廊下の床に、拭き取られた血のあと。書庫の扉の前まで点々と続く"}],"libdoor":[{"if":"!flag:opened","text":"重い木の扉。押しても引いても動かない。内側から閂が掛かっている。"},{"text":"破られた書庫の扉。蝶番が外れかけている。"}],"bridge":{"text":"ガラス張りの渡り廊下。停電中は、真っ暗だったはずだ。本館からここまで、走れば1分もかからない。","card":"渡り廊下は、走れば1分もかからない"},"stairs2":"西棟2階への階段。上にはタキの私室と、浅見の客室がある。","body":{"text":"浅見は、背中を刺されていた。うつ伏せに倒れ、右手を本棚のほうへ伸ばしている。凶器は見当たらない。","card":"浅見は背中を刺されていた。右手を本棚のほうへ伸ばして倒れていた。凶器はない"},"bar":{"text":"扉の内側の閂。太い木の棒を、鉄の受け金に落としこむ造りだ。外から動かせる仕掛けはない。破った扉の側で、受け金ごと外れている。","do":["flag:saw_bar"],"card":"閂は内側からしか掛けられない。扉を破ったとき、受け金ごと外れた"},"file":[{"if":"has:file","text":"革のファイルは預かっている。"},{"text":"浅見の足もとに、革のファイルが落ちている。…中は空だ。遺言書がない。","do":["give:file"],"card":"浅見の革のファイルは、書庫の床で空になっていた。遺言書がない"}],"shelf":"天井までの本棚。浅見の伸ばした手の先にある。何冊か、本の並びが乱れているようにも見える。","keys":{"text":"鍵棚に、館じゅうの鍵が並んでいる。『書庫』『通用口』『西棟2階』…。どれも、きちんと掛かっている。","card":"執事室の鍵棚には、書庫・通用口などの鍵がそろって掛かっている"},"log":{"text":"発電機の記録帳。几帳面な字で書いてある。\n『8月14日 22時40分 停電（落雷） 23時00分 自家発電にて復旧 磯村』","card":"発電機の記録：停電は22時40分〜23時00分の20分間"},"photo":"古い写真立て。若い書生姿の磯村と、背広の男が写っている。男の顔は、日に焼けて見えない。","fireplace":"暖炉の火を、誰かがくべ直したらしい。","clock2":"置き時計は8時半を指している。" い"},"bed":"マットレスがずらされ、枕カバーまではがされている。何かを、徹底的に探したらしい。","door":"扉の鍵は壊されていない。昨夜は、かかっていなかったのだろう。","keys":"鍵棚の鍵は、今日もきちんと並んでいる。","log":"『8月14日 22時40分 停電 23時00分 復旧』。磯村の几帳面な字。"},"events":{"lecture":{"bg":"salon","place":"談話室","pages":["鷹宮は、暖炉の前に立った。一族の何人かが、遠巻きにこちらを見ている。","鷹宮「密室には、三つの型がある。犯人が外から作った密室。犯人が中で作って、どうにかして抜け出した密室。それから――犯人やない誰かが作ってもうた密室や」","鷹宮「書庫の閂は、内側からしか掛けられへん。外から細工する隙間もない。窓ははめ殺し。ほな、外から作った密室でも、中から抜け出した密室でもない」","鷹宮「残るのは三つめや。閂を掛けたのは、浅見さん自身やった」","鷹宮「浅見さんは、西棟の廊下で刺された。血のあとが、書庫の扉の前まで続いてる。刺されて、逃げて、書庫に飛びこんで、内側から閂を掛けた。犯人が入ってこられへんようにな」","鷹宮「ほな、犯人は何が欲しかったんか。浅見さんの革のファイルは、空やった」","鷹宮「犯人が遺言書を奪ったんなら、話は早い。けど、もし奪えてへんかったら？ 犯人は、どこを探す？」","鷹宮「…それから、もうひとつ。浅見さんは、死ぬ前に右手を本棚に伸ばしてた。閉じこもったあと、最後の力で何をしたんか」","鷹宮「葛西。浅見さんの部屋と、書庫の本棚や。見に行こ」"],"do":["flag:lecture","card:takamiya:密室は、刺された浅見が自分で閂を掛けて作った（鷹宮の仮説）"]},"close":{"pages":["書庫の本棚の前で、鷹宮はしばらく黙っていた。","鷹宮「浅見さんの部屋は、ひっかき回されてた。財布もスマホも残して、な。犯人は、遺言書を探してたんや」","鷹宮「つまり、犯人は遺言書を手に入れてへん。ファイルは空やったのに、や」","鷹宮「ほな、遺言書はどこへ行った？」","鷹宮「書庫に逃げこんだ浅見さんは、閂を掛けて、それから本棚に手を伸ばした。本を3冊抜いて、棚の奥に触れて…そこで力尽きた」","鷹宮「葛西。浅見さんは、死ぬ前に、この本棚のどこかに遺言書を隠したんや」"],"do":["chapter:ch4"]}},"contradictions":[{"id":"m2","pairs":[["mishima_stay","reiko_left"]],"if":"here:salon","text":"三島に、2つの証言をつきつけた。\n\n三島「……」\n\n三島「…参ったな。ええ、出ました。手洗いじゃありません。真っ暗なうちに、書庫へ行ったんです」\n\n三島「祖父が探していた、古い手帳があるんです。この館の書庫にあるかもしれない、と。…でも、書庫の扉は開きませんでした。中から何かで押さえられているみたいに」\n\n三島「戻るとき、渡り廊下で人影を見ました。明かりも持たずに、本館のほうへ急いでいた。誰かは分かりません。…信じてください。私は、浅見先生には触ってもいない」","card":"停電中、手帳を探して書庫へ行ったが扉が開かなかった。戻るとき、渡り廊下で明かりを持たない人影が本館へ急ぐのを見た","cardId":"mishima_confess","p":"mishima","breaks":["mishima_stay"],"do":["toast:三島のうそを崩した"],"notYet":"鷹宮「その食い違いは、三島さん本人につきつけなあかん。談話室におるはずや」","doneText":"鷹宮「三島さんのうそは、もう崩したで」"}],"contradictWrong":"鷹宮「葛西、その2つは食い違ってへんで。もういっぺん、よう読んでみ」","triggers":[{"if":"flag:lecture && flag:saw_room && flag:know_unguarded && flag:contra_m2 && flag:shelf && here:library && !flag:ch3_done","do":["flag:ch3_done","event:close"]},{"if":"flag:lecture && flag:saw_room && flag:know_unguarded && flag:contra_m2 && flag:shelf && !here:library && !flag:c  !flag:will_taki","text":"タキ「遺言書が、見つかったの…？ 浅見先生が、最後に守ってくださったのね」\n\nタキは目を閉じた。\n\nタキ「警察が来たら、皆の前で読んでもらいます。それまで、あなたたちが預かっていてちょうだい」","do":["flag:will_taki"]},{"if":"flag:techou_read && !flag:taki_techou","text":"タキ「…その手帳を、読んだのね」\n\nタキ「主人から、聞いていました。書庫には、久我さんの『預かりもの』がしまってあると。中を見たことは、一度もないけれど」\n\nタキ「それは、わたしたちのものじゃないの。いつか、持ち主に返さなければ」","do":["flag:taki_techou"],"card":"タキは、書庫の金庫に久我の「預かりもの」があることを夫から聞いて知っていた"},{"text":"タキ「夕食は、皆、無理に食べなくていいわ」"}],"kuga":{"seq":[{"text":"タキ「主人は、久我さんが亡くなった夜、ひと晩じゅう書斎にこもっていたわ。朝になって出てきた主人の手が、真っ黒に汚れていたのを覚えている。何かを燃やしたのか、埋めたのか…」","note":"久我が亡くなった夜、惣一郎はひと晩じゅう書斎にこもり、朝、手が真っ黒に汚れていた（タキ）"}]}}},"reiko":{"topics":{"ima":{"seq":[{"text":"玲子「隠し金庫…？ この館に、そんなものが。わたし、何十年も知らなかったわ」"},{"text":"玲子「遺言書が見つかったのなら、少なくとも、盗まれてはいなかったのね」"}]},"hito":{"seq":[{"text":"玲子「兄さん、今日はずっと上の空なの。何か考えこんでるみたい」"},{"text":"玲子「さっき兄さんが、夕方の天気を磯村に聞いてたわ。『夜、少しでも雨が弱まる時間はあるか』って。こんな嵐の中、どこへ行くつもりなのかしら」","card":"康彦は磯村に「夜、少しでも雨が弱まる時間はあるか」と聞いていた（玲子）"}]}}},"yasuhiko":{"topics":{"ima":{"seq":[{"text":"康彦「遺言書が出てきたか。…そうか」\n\n康彦は、それきり黙りこんだ。"},{"text":"康彦「葛西くん。昨日言った、確かめたいことだが…今夜、自分で確かめてくる。結果は、明日の朝に話すよ」"}]},"hito":{"seq":[{"text":"康彦「圭には、まだ何も言っていない。…父親としてはな、信じたいんだ」"}]}}},"mishima":{"topics":{"ima":[{"if":"flag:techou_read && !flag:memo_seen","text":"三島「その手帳…本当に、あったんですね」\n\n三島は、上着の内ポケットから、黄ばんだメモ帳を取り出した。\n\n三島「祖父、三島透の取材メモです。昭和35年の冬。汐見署の沖田という刑事さんに、祖父はこう頼まれたそうです」\n\n三島「『いつか手帳が見つかったら、あの子に届けてくれ』」\n\n三島「あの子が誰なのか、祖父は最後まで突き止められませんでした。…私は、その約束の続きをしに来たんです」","do":["flag:memo_seen"],"card":"三島の祖父・三島透の取材メモ：昭和35年、汐見署の沖田刑事に「手帳が見つかったら、あの子に届けてくれ」と頼まれた","note":"昭和35年、汐見署の沖田刑事が、記者の三島透に「手帳が見つかったら、あの子に届けてくれ」と頼んだ"},{"text":"三島「本棚の奥に、金庫？ …見つかったら、私にも見せてもらえませんか」"}],"hito":{"seq":[{"text":"三島「さっきは、うそをついてすみませんでした。祖父の代からの探しものだったもので、つい」"}]}}},"kei":{"topics":{"ima":{"seq":[{"text":"圭「隠し金庫ねえ。祖父らしいや。…で、遺言書は？ 見つかった？」"},{"text":"圭「警察が来るまで、遺言書はちゃんとしまっておいたほうがいい。また誰かに狙われないようにね」"}]},"hito":{"seq":[{"text":"圭「父さんの様子が、今日はおかしいんです。僕と目を合わせようとしない」"}]},"yakata":{"seq":[{"text":"圭「この館に隠し金庫があるなんて、初耳ですよ。僕は子どものころから、ここにはあまり来なかったから」"}]}}}},"look":{"shelf":[{"if":"!f く背中が見えた。…康彦だった。","鷹宮「放っとき。『自分で確かめてくる』言うてはったやろ」","眠れそうにないので、鷹宮と談話室へ下りた。22時少し前。暖炉の前には、玲子と沙耶がいた。","それから22時半ごろまで、4人でとりとめのない話をした。誰も、康彦の名前は口にしなかった。","そのとき、もっと強く止めていれば――。あとになって、僕は何度もそう思うことになる。"],"do":["chapter:ch5"]}},"puzzles":{"box":{"length":4,"answer":"1946","label":"4ケタの数字を合わせよう","prompt":"小箱の錠。4ケタの数字を合わせる。","display":"錠の数字：{code}","success":{"text":"カチリ、と錠が外れた。\n\n小箱の中には、古びた鳶色の手帳が一冊、入っていた。","do":["flag:box_open","give:techou"]},"fail":"錠の数字：{code}\n…開かない。","cancel":"小箱から手を離した。"}},"contradictions":[{"id":"m3","pairs":[["iso_nothing","saya_plan"]],"if":"here:butler","text":"磯村に、2つの証言をつきつけた。\n\n磯村は、しばらく黙っていた。それから、手にした写真立てを、そっと机に伏せた。\n\n磯村「…ございます。書庫の右の本棚の奥に、惣一郎さまがお作りになった金庫が」\n\n磯村「昭和35年の暮れ、久我さまが亡くなられた年でございます。まだ書生だったわたくしは、惣一郎さまに命じられて、久我さまの書斎にあった手帳をお預かりしました。2年後にこの館ができましたとき、あの金庫にお入れしたのは、わたくしでございます」\n\n磯村「奥の棚板の右下を、強く押してくださいませ。…それで開きます」","card":"磯村の告白：昭和35年の暮れ、惣一郎に命じられて久我の手帳を預かり、昭和37年に館ができたとき、書庫の隠し金庫に入れた。開け方は、奥の棚板の右下を強く押す","cardId":"iso_confess","p":"isomura","breaks":["iso_nothing"],"do":["toast:磯村のうそを崩した"],"notYet":"鷹宮「磯村さん本人につきつけなあかん。執事室におるはずや」","doneText":"鷹宮「磯村さんは、もう話してくれたで」"}],"contradictWrong":"鷹宮「葛西、その2つは食い違ってへんで」","triggers":[{"if":"flag:techou_read && flag:memo_seen && flag:contra_m3 && !flag:ch4_done","do":["flag:ch4_done","event:night"]}]},"ch5":{"id":"ch5","label":"第五章","title":"崖の灯台","recap":"書庫の隠し金庫から、遺言書と鍵付きの小箱が見つかった。小箱の中の鳶色の手帳の最初のページには、「おれは今日から、久我誠一郎になる」と書かれていた。66年前、その手帳を金庫に入れたのは執事の磯村だった。\n\n三島の祖父は、昭和35年に沖田刑事から「手帳が見つかったら、あの子に届けてくれ」と頼まれていた。\n\n21時40分、康彦が部屋を出ていった。葛西と鷹宮は22時少し前に談話室へ下り、22時半ごろまで玲子・沙耶と一緒にいた。","start":{"loc":"guestroom","text":"8月16日、朝6時半。\n\n扉を叩く音で飛び起きた。外から、誰かが叫ぶ声がする。…磯村の声だ。"},"locations":{"guestroom":{"name":"客室（葛西と鷹宮）","bg":"guestroom","people":["takamiya"],"objs":{"bag":"鞄","window":"窓"},"arrive":"客室。鞄の中の遺言書と手帳を、もう一度確かめた。"},"hall":{"name":"玄関ホール","bg":"hall","people":["takamiya"],"objs":{"coats":"コート掛け","umbrella":"傘立て","door":"玄関の扉"},"arrive":"玄関ホール。床に、泥の足あとが乾いて残っている。"},"cliff":{"name":"灯台の崖","bg":"cliff","people":["takamiya",{"id":"isomura","if":"!flag:carried"}],"objs":{"body":"康彦","coat":"康彦の雨具","edge":"崖の縁","path":"小道","light":"灯台"},"arrive":[{"if":"!flag:found_y","text":"西棟の通用口から小道を走る。灯台の崖の縁で、磯村が膝をついて下をのぞきこんでいた。","do":["flag:found_y"]},{"text":"灯台の崖。雨は小降りになったが、風はまだ強い。"}]},"corridor":{"name":"西棟の廊下","bg":"corridor","people":["takamiya"],"objs":{"sidedoor":"通用口","stairs_b":"地下への階段"},"arrive":"西棟の廊下。突き当たりの通用口から、冷たい風が吹きこんでくる。"},"drying":{"name":"乾燥室（西棟地下）","bg":"drying","people":["takamiya"],"objs":{"raincoats":"雨具","floor":"床","boiler":"ボイラー"},"arrive":"西棟の地下、乾燥室。ボイラーの熱で、空気がむっとしている。"},"butler":{"name":"執事室","bg":"butler","people":["takamiya",{"id":"isomura","if":"flag:carried"}],"objs":{"keys":"鍵棚","log":"発電機の記録"},"arrive":"執事室。主のいない部屋に、鍵棚だけが整然と並んでいる。"},"salon":{"name":"談話室","bg":"salon","unlock":"flag:carried","people":["takamiya","taki","reiko","kei","saya","mishima"],"objs":{"fireplace":"暖炉","window":"窓"},"arrive":"談話室。圭が、窓の外を見つめたまま動かない。玲子はタキの肩を抱いている。"}},"talk":{"takamiya":{"topics":{"hint":[{"if":"!flag:found_y","hints":["鷹宮「…なんや、外が騒がしいな」","鷹宮「磯村さんの声や。外からや」","鷹宮「『移動』で灯台の崖へ行こ」"]},{"if":"!flag:carried","hints":["鷹宮「康彦さんを、このままにはしておけへん」","鷹宮「磯村さんと、運び上げよ」","鷹宮「磯村さんに『いまのこと』を聞いて、康彦さんを館へ運ぶのを手伝お」"]},{"if":"!has:memo2","hints":["鷹宮「康彦さんは、何しに灯台へ来たんや」","鷹宮「持ち物を見てみ」","鷹宮「灯台の崖で『康彦の雨具』を調べよ」"]},{"if":"!flag:wet_coat","hints":["鷹宮「康彦さんは玄関から出た。ほな、ほかに外へ出た人は？」","鷹宮「西棟には、外へ出る通用口があったな。その近くに、雨具を干す部屋が」","鷹宮「西棟地下の乾燥室で『雨具』を調べよ」"]},{"if":"!flag:key_info","hints":["鷹宮「通用口は、夜は鍵がかかってたはずや」","鷹宮「その鍵は、どこにある？」","鷹宮「執事室の磯村さんに『昨夜のこと』を聞いてみ」"]},{"if":"var:yuube<6","hints":["鷹宮「昨夜の22時から22時半、みんなどこにおった？」","鷹宮「僕らは談話室で、玲子さんと沙耶さんと一緒やった。ほかの人は？」","鷹宮「タキさん・玲子さん・圭さん・沙耶さん・三島さん・磯村さんの6人に『昨夜のこと』を聞いて回ろ」"]}],"dangi":{"seq":[{"text":"鷹宮「二人目や。…けど、一人目と同じ犯人やと決めつけたらあかん。それぞれ、別に考える」"},{"text":"鷹宮「メモには『22時 灯台』。康彦さんが誰かを呼び出したんか、呼び出されたんか。筆跡は、康彦さん本人のもんやった」"},{"text":"鷹宮「アリバイのある人と、ない人。昨夜は、僕らが談話室で証人になれる。…皮肉なもんやな」"}]}}},"isomura":{"topics":{"ima":[{"if":"!flag:carried","text":"磯村「わたくしが、朝6時に灯台の燃料を見にまいりましたら…崖の下の岩場に、康彦さまが」\n\n鷹宮「磯村さん、引き上げましょう。ロープはありますか。葛西、手伝え」","do":["event:carry"]},{"text":"磯村「…康彦さままで。わたくしは、何をしていたのでございましょう」"}],"yuube":{"seq":[{"text":"磯村「昨夜は21時に通用口を施錠し、鍵は執事室の鍵棚に掛けました。それから22時半まで、厨房で後片付けをしておりました。その間、執事室は空でございます」","card":"昨夜21時、磯村が通用口を施錠し、鍵は鍵棚へ。22時半まで磯村は厨房にいて、執事室は空だった","do":["inc:yuube","flag:key_info"]},{"text":"磯村「今朝6時、灯台へ出ようと鍵棚を見ましたら、通用口の鍵はいつも通り掛かっておりました。通用口にも、きちんと鍵がかかっておりました」","card":"今朝6時、通用口の鍵は鍵棚に掛かっていた。通用口にも鍵がかかっていた"},{"text":"磯村「厨房には、わたくしひとりでございました。証人と申されましても…」"}]},"asami":{"seq":[{"text":"磯村「浅見先生に続いて、康彦さままで…。この館で、いったい何が起きているのでございましょう」"}]}}},"taki":{"topics":{"ima":{"seq":[{"text":"タキ「…康彦。あの子は、小さいころから、灯台が好きだった」"},{"text":"タキ「遺言を書き直したのは、わたしよ。…わたしが、この子たちを殺したようなものね」"}]},"yuube":{"seq":[{"text":"タキ「昨夜は、21時には西棟の自分の部屋に戻っていました。ひとりよ。…年寄りは、早く寝るものだから」","card":"昨夜は21時から西棟の自室にひとりでいた（タキ）","do":["inc:yuube"]}]}}},"reiko":{"topics":{"ima":{"seq":[{"text":"玲子「兄さん…どうして、こんな嵐の夜に外へなんて」"},{"text":"玲子「昨日の夕方、兄さんが磯村に『夜、雨が弱まる時間はあるか』って聞いてたの。…止めればよかった」"}]},"yuube":{"seq":[{"text":"玲子「昨夜？ 21時半ごろから、談話室で沙耶と飲んでたわ。22時前にあなたたちも来たでしょう。22時半ごろまで、4人で一緒だった」","card":"昨夜22時ごろから22時半ごろまで、玲子・沙耶・葛西・鷹宮は談話室で一緒だった","do":["inc:yuube"]}]}}},"saya":{"topics":{"ima":{"seq":[{"text":"沙耶「伯父さんまで…。ねえ、次は誰？ わたしたち、警察が来るまで、ここで待ってるしかないの？」"}]},"yuube":{"seq":[{"text":"沙耶「ママと談話室にいたわ。21時半くらいから。あなたたちも22時前に来たでしょ。…わたしにはアリバイがある、ってこと？ 皮肉ね」","card":"昨夜21時半ごろから、沙耶は玲子と談話室にいた","do":["inc:yuube"]}]},"yakata":{"seq":[{"text":"沙耶「通用口から灯台の小道までは、走れば3分。玄関から外を回ると、15分はかかるわ。…伯父さんは、どっちから行ったのかしら」"}]}}},"kei":{"topics":{"ima":{"seq":[{"text":"圭「…父さん」\n\n圭は、それ以上何も言わなかった。窓ガラスに映った顔からは、何も読み取れない。"},{"text":"圭「警察が来たら、全部話しますよ。今は…放っておいてください」"}]},"yuube":{"seq":[{"text":"圭「昨夜は、自室で合併の資料を見ていました。21時ごろから、ずっと。ひとりでしたよ」","card":"昨夜は21時ごろから自室で合併の資料を見ていた。ひとりだった（圭）","cardId":"kei_room2","do":["inc:yuube"]}]}}},"mishima":{"topics":{"ima":{"seq":[{"text":"三島「二人目、ですか。…もう、記者として記録するどころじゃない」"}]},"yuube":{"seq":[{"text":"三島「自室にいました。祖父のメモを読み返していたんです。ひとりでしたから、証人はいません。…また、私が疑われるんでしょうね」","card":"昨夜は自室で祖父のメモを読み返していた。ひとりだった（三島）","do":["inc:yuube"]}]}}}},"look":{"bag":"鞄の中に、遺言書と鳶色の手帳。昨夜のまま、ちゃんとある。","window":"雨は小降りになってきた。だが海は、まだ白く荒れている。","coats":{"text":"玄関のコート掛け。一族の雨具が掛かっていた場所が、ひとつ空いている。康彦のものだ。","card":"玄関のコート掛けから、康彦の雨具がなくなっていた。康彦は玄関から出たらしい"},"umbrella":"傘立てが倒れている。誰かが急いで出ていったようだ。","door":"玄関の扉には、鍵がかかっていない。夜のうちに誰かが開けたまま出ていったらしい。","body":[{"if":"!flag:carried","text":"崖の下の岩場に、康彦が倒れている。…ここからでは、手が届かない。"},{"text":"灯台の小屋に運びこまれた康彦の遺体。額に大きな傷がある。崖から落ちたときのものだろう。"}],"coat":[{"if":"!flag:carried","text":"崖の下だ。まずは引き上げないと。"},{"if":"!has:memo2","text":"康彦が着ていたのは、玄関に掛けてあった彼自身の雨具だ。ポケットから、濡れた紙切れが出てきた。\n\n康彦の字で、『22時 灯台』とだけ書いてある。","do":["give:memo2"],"card":"康彦は自分の雨具を着ていた。ポケットに康彦の字で『22時 灯台』のメモ"},{"text":"康彦の雨具。ポケットはもう空だ。"}],"edge":{"text":"崖の縁。濡れた草が、何か所か踏み荒らされている。足あとは、雨で崩れて形が分からない。","card":"崖の縁の草が踏み荒らされていた。足あとは雨で崩れている"},"path":{"text":"西棟の通用口から続く小道。走れば3分ほどで館に戻れる。","card":"灯台の小道は西棟の通用口に続いている。走れば3分"},"light":"白い灯台。昨夜も、嵐の海を照らし続けていたはずだ。","sidedoor":"西棟の通用口。今は磯村が開けている。夜は鍵がかかり、その鍵は執事室の鍵棚に掛かっている。","stairs_b":"地下へ下りる階段。ボイラー室と乾燥室がある。","floor":"乾燥室の床。濡れた雨具の下に、まだ水たまりが残っている。","boiler":"ボイラーが低くうなっている。停電の夜、磯村が自家発電を動かしたのはこの奥だ。","keys":"鍵棚。『通用口』の札の下に、鍵がきちんと掛かっている。","log":"発電機の記録。昨夜の欄には何も書かれていない。停電はなかった。","fireplace":"暖炉の火は、誰も気にかけないうちに消えかけている。","raincoats":{"text":"乾燥室の竿に、館の雨具が6着、並んで掛かっている。\n\n…そのうち1着だけが、まだぐっしょりと濡れていた。ほかの5着は乾いている。","do":["flag:wet_coat"],"card":"乾燥室の雨具6着のうち、1着だけがまだ濡れていた"}},"events":{"carry":{"bgm":"common_incident","bg":"cliff","place":"灯台の崖","pages":["磯村が灯台の小屋からロープを持ってきた。鷹宮が体に巻き、慎重に岩場へ下りていく。","…長い時間がかかった。三人がかりで、康彦の体を崖の上まで引き上げた。","康彦は、もう冷たくなっていた。額に大きな傷がある。","鷹宮「落ちたんは、昨夜のうちやな。…足を滑らせたか、それとも」","康彦を灯台の小屋に寝かせ、毛布をかけた。磯村は、声もなく肩を震わせていた。","館に戻ると、一族は談話室に集められていた。"],"do":["flag:carried","card::朝6時、灯台の崖の下で康彦が見つかった。額に大きな傷。昨夜のうちに落ちたらしい"]},"close":{"bg":"salon","place":"談話室","pages":["談話室の隅で、鷹宮と並んで座った。","鷹宮「康彦さんは、玄関から自分の雨具を着て出た。『22時 灯台』と書いたメモを持ってな。誰かと、会う約束をしてたんや」","鷹宮「乾燥室の雨具が1着、濡れてた。康彦さんのやない。誰かが西棟の通用口から出て、戻ってきて、雨具を干したんや。通用口の鍵は、空っぽの執事室の鍵棚にあった。誰でも取れた」","鷹宮「昨夜の22時から22時半。談話室におった玲子さんと沙耶さんには、僕らが証人や。ほかの4人――タキさん、圭さん、三島さん、磯村さんは、ひとりやった」","鷹宮「…なあ、葛西。この館で起きてることは、ひとつの話やないかもしれん」","鷹宮「手帳を探してる人がおる。遺言書を消したい人がおる。この二つを、いっぺん切り離して考えなあかん」"],"do":["chapter:ch6"]}},"triggers":[{"if":"flag:carried && has:memo2 && flag:wet_coat && flag:key_info && var:yuube>=6 && here:salon && !flag:ch5_done","do":["flag:ch5_done","event:close"]},{"if":"flag:carried && has:memo2 && flag:wet_coat && flag:key_info && var:yuube>=6 && !here:salon && !flag:ch5_ready","do":["flag:ch5_ready","toast:鷹宮が談話室で考えこんでいる"]}]},"ch6":{"id":"ch6","label":"第六章","title":"二つの謎","recap":"8月16日の朝、灯台の崖の下で康彦が見つかった。康彦は「22時 灯台」のメモを持ち、玄関から自分の雨具で出ていた。乾燥室では、ほかの誰かが使った雨具が1着、濡れていた。通用口の鍵は、空だった執事室の鍵棚にあった。\n\n第2夜の22時から22時半、談話室にいた玲子・沙耶には葛西と鷹宮が証人になる。タキ・圭・三島・磯村はひとりだった。","start":{"loc":"salon","text":"8月16日、昼。\n\n嵐が去りはじめた。磯村の無線が、ようやく港とつながった。だが海はまだ荒れていて、警察の船が着くのは明日の朝になるという。それまでに、できることがある。"},"locations":{"salon":{"name":"談話室","bg":"salon","people":["takamiya","taki","reiko","mishima"],"objs":{"fireplace":"暖炉","window":"窓"},"arrive":"談話室。雨はほとんどやみ、窓の外に、ようやく水平線が見えはじめた。"},"hall":{"name":"玄関ホール","bg":"hall","people":["takamiya","saya"],"objs":{"stairs":"大階段","portrait":"肖像画"},"arrive":"玄関ホール。沙耶が大階段に座りこみ、膝を抱えている。"},"dining":{"name":"大食堂","bg":"dining","people":["takamiya","kei"],"objs":{"table":"長いテーブル","clock":"振り子時計"},"arrive":"大食堂。圭が、空になったコーヒーカップを手の中で回している。"},"butler":{"name":"執事室","bg":"butler","people":["takamiya","isomura"],"objs":{"switchboard":"内線の交換台","keys":"鍵棚"},"arrive":"執事室。壁ぎわに、古い内線の交換台がある。"},"guestroom":{"name":"客室（葛西と鷹宮）","bg":"guestroom","people":["takamiya"],"objs":{"bag":"鞄","desk":"机"},"arrive":"客室。原稿用紙に、事件の流れを書き出してみた。"},"library":{"name":"書庫","bg":"library-safe","people":["takamiya"],"objs":{"safebox":"隠し金庫","shelf":"右の本棚"},"arrive":"書庫。開いたままの隠し金庫が、暗い口を開けている。"}},"talk":{"takamiya":{"topics":{"ima":[{"if":"!flag:split","text":"鷹宮「葛西。昨日言うた、二つの謎の話をしよか」","do":["event:split"]},{"text":"鷹宮「手帳の謎と、遺言書の謎。混ぜたらあかんで」"}],"hint":[{"if":"!flag:split","hints":["鷹宮「頭の中、整理しよか」","鷹宮「二つの謎の話、まだちゃんとしてへんかったな」","鷹宮「僕に『いまのこと』を聞いてくれ」"]},{"if":"!flag:techou_side","hints":["鷹宮「手帳のほうの謎から、片づけよ」","鷹宮「手帳を探してたのは、誰と誰やった？」","鷹宮「三島さんと磯村さんに『いまのこと』を聞いて、手帳のことを確かめよ」"]},{"if":"!flag:saya_saw","hints":["鷹宮「停電のあいだのこと、まだ話してへん人がおらんか？」","鷹宮「本館2階におった人や。廊下に出たかもしれん」","鷹宮「玄関ホールの沙耶さんに『停電のあいだ』を聞いてみ」"]},{"if":"!flag:contra_m1","hints":["鷹宮「誰かの話が、食い違ってへんか」","鷹宮「停電中、自室で寝てた…ほんまにそうか？」","鷹宮「取材メモで『矛盾をつく』や。圭さんの『自室で寝ていた』と、沙耶さんの話を、大食堂で圭さんにつきつけよ」"]},{"if":"!flag:call_log","hints":["鷹宮「康彦さんは、なんで圭さんを…いや、誰かを疑ったんやろ」","鷹宮「最初の夜、康彦さんの部屋に、何か連絡がなかったか」","鷹宮「執事室の『内線の交換台』を調べよ」"]}],"dangi":{"seq":[{"text":"鷹宮「本格の名探偵はな、『誰が怪しいか』やなくて、『誰にできたか』から考えるんや。気持ちは、あとからついてくる」"},{"text":"鷹宮「消去法の条件は、ひとつずつ確かめられる事実だけで作る。『怪しい』は条件にならへん」"}]}}},"mishima":{"topics":{"ima":[{"if":"!flag:m6","text":"三島「手帳のこと、ですか。…正直に言います。私がこの島に来たのは、手帳を探すためです。祖父と沖田さんの約束を果たしたかった」\n\n三島「遺言書なんて、どうでもいい。私は、宣言のときにテラスにいて、遺言書の話さえ聞いていなかったんですから」","do":["flag:m6","inc:tside"],"card":"三島が探していたのは手帳だけ。遺言書の話は、宣言のときテラスにいて聞いていなかった"},{"text":"三島「警察が来たら、手帳のことも話します。…あれは、祖父の代からの宿題なんです」"}],"teiden":{"seq":[{"text":"三島「停電中のことは、もう全部話しました。書庫へ行って、扉が開かなくて、戻った。それだけです」"}]}}},"isomura":{"topics":{"ima":[{"if":"!flag:i6","text":"磯村「わたくしが書庫のまわりを気にしておりましたのは…手帳のためでございます。66年、あの手帳を守ってまいりました」\n\n磯村「遺言書のことは、存じませんでした。浅見先生が金庫に入れられたことも。…もし知っておりましたら、すぐに大奥さまにお返ししております」","do":["flag:i6","inc:tside"],"card":"磯村が気にしていたのは手帳だけ。浅見が遺言書を金庫に入れたことは知らなかった"},{"text":"磯村「手帳は…持ち主のもとへ、お返しすべきものでございます」"}],"yakata":{"seq":[{"text":"磯村「内線の交換台でございますか。この館の内線は、すべてあれを通ります。かけた部屋と時刻が、記録に残る仕組みで」","card":"館の内線は執事室の交換台を通り、かけた部屋と時刻が記録に残る"}]}}},"saya":{"topics":{"ima":{"seq":[{"text":"沙耶「…ねえ、ひとつ、黙ってたことがあるの」"},{"text":"沙耶「でも、言ったら…」"}]},"teiden":[{"if":"talked:saya>=1","text":"沙耶「…停電のとき、懐中電灯を探して、一度だけ廊下に出たの。22時50分ごろ。圭兄さんの部屋の前を通ったら、ドアが半分開いてて、中は真っ暗で…誰もいなかった」\n\n沙耶「言ったら、圭兄さんが疑われると思って。…ごめんなさい」","do":["flag:saya_saw"],"card":"停電中の22時50分ごろ、圭の部屋のドアが半分開いていて、中には誰もいなかった（沙耶）","cardId":"saya_keiroom"},{"text":"沙耶「停電のときのこと？ …ちょっと待って。少し、話す順番を考えさせて」"}],"hito":{"seq":[{"text":"沙耶「圭兄さんは、小さいころから、わたしをかばってくれたの。だから…」"}]}}},"kei":{"topics":{"ima":{"seq":[{"text":"圭「警察の船は、明日の朝だそうですよ。磯村の無線が、やっと港とつながったって」"},{"text":"圭「…父さんのことは、警察に任せます」"}]},"teiden":[{"if":"flag:contra_m1","text":"圭「停電中は、本館の1階の手洗いにいました。さっき言ったとおりです。…それ以上、何を話せというんですか」"},{"text":"圭「停電中？ 何度言わせるんですか。自室で寝てましたよ」","card":"（圭は、停電中は自室で寝ていたとくり返した）"}],"hito":{"seq":[{"text":"圭「沙耶が何か言いましたか？ あいつは昔から、思いこみが激しいんですよ」"}]}}},"taki":{"topics":{"ima":{"seq":[{"text":"タキ「警察が来たら、遺言を読んでもらいます。…康彦も、浅見先生も、それを望んでいたはずだから」"}]},"kuga":{"seq":[{"text":"タキ「あの手帳を読んだのなら、分かるでしょう。主人が久我さんを『恩人』と呼んだ理由も、わたしが財産を返そうと思った理由も」","note":"タキが財産を寄付するのは、夫が久我から「預かったもの」を返すため"}]}}},"reiko":{"topics":{"ima":{"seq":[{"text":"玲子「明日の朝には、船が来るのね。…やっと、この島から出られる」"},{"text":"玲子「でも、犯人も一緒に船に乗るのよね。この中の誰かが」"}]}}}},"look":{"fireplace":"暖炉の火が、また大きくなっている。磯村がくべ直したのだろう。","window":"雲の切れ間から、夏の日差しがのぞいた。","stairs":"大階段の上の回廊から、本館2階の客室が並ぶ廊下が見える。圭の部屋は、階段のすぐそばだ。","portrait":"肖像画の男。名前を借りて生きた男。","table":"長いテーブル。圭のノートパソコンは閉じられている。","clock":"振り子時計が、正午を打った。","switchboard":{"text":"古い内線の交換台。記録紙に、かけた部屋と時刻が打ち出されている。\n\n『8月14日 21:50　2-3（圭）→ 2-1（康彦）　3分』\n\n鷹宮「最初の夜、宴のあとや。圭さんが、康彦さんの部屋に内線をかけてる」","do":["flag:call_log"],"card":"内線の記録：8月14日21時50分、圭の部屋から康彦の部屋へ、3分"},"keys":"鍵棚。今日も、すべての鍵がそろっている。","bag":"鞄の中の遺言書と手帳。警察が来るまで、ここに。","desk":"原稿用紙に書き出した事件の流れ。矢印だらけだ。","safebox":"開いたままの隠し金庫。中はもう空だ。","shelf":"右の本棚。開いた一角は、もう閉じない。"},"events":{"split":{"bg":"salon","place":"談話室","pages":["鷹宮「この館には、謎が二つある。ひとつは手帳。もうひとつは遺言書や」","鷹宮「手帳を探してたのは、三島さんと磯村さん。二人とも、停電中や夜中に書庫のまわりにおった。けど二人が欲しかったんは、手帳であって、遺言書やない」","鷹宮「遺言書を消したい人間は、別におる。浅見さんを刺して、ファイルを奪って、空っぽやと知って部屋まで荒らした人間や」","鷹宮「この二つを混ぜたら、何も見えへん。まず、手帳の側の二人に、ほんまのところを確かめよ」"],"do":["flag:split"]},"close":{"bg":"salon","place":"談話室","pages":["鷹宮は、暖炉の前で長いこと黙っていた。","鷹宮「…葛西。材料は、そろった」","鷹宮「停電中の居場所。宣言を聞いた人。隠し金庫を知っていた人。昨夜のアリバイ。濡れた雨具。内線の記録」","鷹宮「あとは、組み立てるだけや」"],"do":["chapter:ch7"]}},"contradictions":[{"id":"m1","pairs":[["kei_sleep","saya_keiroom"]],"if":"here:dining","text":"圭に、2つの証言をつきつけた。\n\n圭は、しばらく黙ってカップを見つめていた。\n\n圭「…ああ、そうですよ。部屋にはいなかった。手洗いに行ってたんです。本館の、1階の」\n\n圭「停電で真っ暗だったから、手探りで。…それだけのことで、人殺し扱いですか」","card":"停電中は部屋にいなかった。本館1階の手洗いに行っていた、と言い直した","cardId":"kei_toilet","p":"kei","breaks":["kei_sleep"],"do":["toast:圭のうそを崩した"],"notYet":"鷹宮「圭さん本人につきつけなあかん。大食堂におるはずや」","doneText":"鷹宮「圭さんは、もう言い直したで」"}],"contradictWr // ---------- 条件 ----------
// 例: "has:capsule && !flag:sent"  "var:wait>=1"  "count:talk:haru>=2" は不可（キーは英数字と _ -）
const TOK = /\s*(\|\||&&|!|\(|\)|true|false|[a-z]+:[A-Za-z0-9_\-]+(?:\s*(?:>=|<=|==|!=|>|<)\s*-?\d+)?)/y;
function cond(src) {
  if (src == null || src === '') return true;
  const toks = []; TOK.lastIndex = 0;
  while (TOK.lastIndex < src.length) {
    const at = TOK.lastIndex, m = TOK.exec(src);
    if (!m) { if (/^\s*$/.test(src.slice(at))) break; throw new Error('条件の書き方が正しくありません: ' + src); }
    toks.push(m[1]);
  }
  let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const or = () => { let v = and(); while (peek() === '||') { next(); const r = and(); v = v || r; } return v; };
  const and = () => { let v = not(); while (peek() === '&&') { next(); const r = not(); v = v && r; } return v; };
  const not = () => { if (peek() === '!') { next(); return !not(); } return atom(); };
  const atom = () => {
    const t = next();
    if (t === '(') { const v = or(); if (next() !== ')') throw new Error('かっこが閉じていません: ' + src); return v; }
    return term(t, src);
  };
  const v = or();
  if (p < toks.length) throw new Error('条件の書き方が正しくありません: ' + src);
  return v;
}
function term(t, src) {
  if (t === 'true') return true;
  if (t === 'false') return false;
  const m = t && t.match(/^([a-z]+):([A-Za-z0-9_\-]+)(?:\s*(>=|<=|==|!=|>|<)\s*(-?\d+))?$/);
  if (!m) throw new Error('条件の書き方が正しくありません: ' + src);
  const [, k, n, op, num] = m;
  if (k === 'has') return S.items.includes(n);
  if (k === 'flag') return !!S.f[n];
  if (k === 'here') return S.loc === n;
  if (k === 'var' || k === 'talked') {
    const x = k === 'var' ? (S.v[n] || 0) : (S.seq['talkc:' + S.chapter + ':' + n] || 0);
    if (!op) return x > 0;
    const y = +num;
    return { '>=': x >= y, '<=': x <= y, '==': x === y, '!=': x !== y, '>': x > y, '<': x < y }[op];
  }
  throw new Error('不明な条件: ' + t);
}

// ---------- 効果 ----------
function run(list) {
  for (const e of list || []) {
    const i = e.indexOf(':'), k = i < 0 ? e : e.slice(0, i), a = i < 0 ? '' : e.slice(i + 1);
    switch (k) {
      case 'give': if (!S.items.includes(a)) { S.items.push(a); toast('入手：' + D.items[a]); snd.se('note'); } break;
      case 'take': S.items = S.items.filter(x => x !== a); break;
      case 'flag': S.f[a] = 1; break;
      case 'unflag': delete S.f[a]; break;
      case 'set': { const [n, v] = a.split('='); S.v[n] = +v; break; }
      case 'inc': S.v[a] = (S.v[a] || 0) + 1; break;
      case 'miss': S.v.miss = (S.v.miss || 0) + 1; break;
      case 'toast': if (!S.toasted) S.toasted = []; if (!S.toasted.includes(a)) { S.toasted.push(a); toast(a); } break;
      case 'goto': pending.goto = a; break;
      case 'puzzle': pending.puzzle = a; break;
      case 'ending': pending.ending = a; break;
      case 'chapter': pending.chapter = a; break;
      case 'event': pending.event = a; break;
      case 'board': pending.board = a; break;
      case 'choice': pending.choice = a; break;
      case 'search': pending.search = a; break;
      case 'doc': if (!S.docs) S.docs = []; if (!S.docs.includes(a)) { S.docs.push(a); toast('資料に追加：' + D.docs[a].title); snd.se('note'); } break;
      case 'card': { const k = a.indexOf(':'); addCard({ card: a.slice(k + 1) }, { p: a.slice(0, k) || null }); break; }
      default: throw new Error('不明な効果: ' + e);
    }
  }
}
const runAll = rules => (rules || []).forEach(r => { if (cond(r.if)) run(r.do); });

// 文字列 / ルール / ルールの配列（最初に条件が合うもの）/ {seq:[...]}（話すたびに次へ。最後はくり返し）
function resolve(entry, key) {
  if (entry == null) return null;
  if (typeof entry === 'string') return { text: entry };
  if (Array.isArray(entry)) return entry.find(r => cond(r.if)) || null;
  if (entry.seq) { const k = S.chapter + '|' + key, i = S.seq[k] || 0; S.seq[k] = i + 1; return entry.seq[Math.min(i, entry.seq.length - 1)]; }
  return cond(entry.if) ? entry : null;
}

// ---------- 音 ----------
// game.json の audio: {base, title, bgm, deduce, ending, step, amb: {場所id: 環境音}}。章は audio: {bgm, amb, hush, deduce}（deduce はその章の推理の曲）
// イベントは "bgm"（そのイベントのあいだ流す。"bgmKeep": true でそのまま）と "hush"（いったん無音にする）
// ブラウザは最初のタップまで音を出せないので、タップされるまでは「何を流すか」だけ覚えておく
const snd = (() => {
  const A = D.audio || null;
  let ctx = null, want = { bgm: null, amb: null }, cur = { bgm: null, amb: null }, deduce = false, hushT = null, noteT = 0;
  // 音量（0〜100）。はじめは、音は出るが小さめ
  const DEF = { bgm: 30, amb: 30, se: 30 };
  let vol = Object.assign({}, DEF);
  const tracks = {}, ses = {};
  try {
    const v = localStorage.getItem('mg:sound');
    if (v === 'off') vol = { bgm: 0, amb: 0, se: 0 };
    else if (v && v[0] === '{') { const o = JSON.parse(v); for (const k in DEF) if (typeof o[k] === 'number') vol[k] = Math.max(0, Math.min(100, o[k])); }
  } catch (e) {}
  const save = () => { try { localStorage.setItem('mg:sound', JSON.stringify(vol)); } catch (e) {} };
  const anyOn = () => vol.bgm + vol.amb + vol.se > 0;
  const VOL = { bgm: 0.5, bgmUnder: 0.38, amb: 0.85, se: 0.7 };
  const url = n => A.base + n + '.m4a' + (A.v ? '?v=' + A.v : '');
  function track(n, loop) {
    if (tracks[n]) return tracks[n];
    const el = new Audio(url(n)); el.loop = loop; el.preload = 'auto';
    const t = { el, g: null, v: 0 };
    if (ctx && !ctx.none) { try { const s = ctx.createMediaElementSource(el); t.g = ctx.createGain(); t.g.gain.value = 0; s.connect(t.g).connect(ctx.destination); } catch (e) { t.g = null; } }
    if (!t.g) el.volume = 0;
    return (tracks[n] = t);
  }
  function setVol(t, v, sec) {
    t.v = v;
    if (t.g) { const g = t.g.gain, now = ctx.currentTime; g.cancelScheduledValues(now); g.setValueAtTime(g.value, now); g.linearRampToValueAtTime(v, now + sec); }
    else { const from = t.el.volume, t0 = performance.now(); const step = () => { const k = Math.min(1, (performance.now() - t0) / (sec * 1000 || 1)); try { t.el.volume = Math.max(0, Math.min(1, from + (v - from) * k)); } catch (e) {} if (k < 1) requestAnimationFrame(step); }; step(); }
    if (v > 0 && t.el.paused) t.el.play().catch(() => {});
    if (v === 0) setTimeout(() => { if (t.v === 0 && !t.hold) t.el.pause(); }, sec * 1000 + 50);
  }
  const dd = () => { const C = S && D.chapters[S.chapter]; return (C && C.audio && C.audio.deduce) || A.deduce; };
  const level = kind => kind === 'amb' ? (deduce ? 0 : VOL.amb * vol.amb / 100) : (cur.amb && !deduce ? VOL.bgmUnder : VOL.bgm) * vol.bgm / 100;
  function apply(kind, sec = 1.2) {
    if (!A || !ctx) return;
    const n = kind === 'bgm' && deduce && dd() ? dd() : want[kind];
    if (cur[kind] && cur[kind] !== n) setVol(track(cur[kind], true), 0, sec);
    cur[kind] = n;
    if (n) { const t = track(n, !/_ending$/.test(n)); if (t.el.ended) t.el.currentTime = 0; setVol(t, level(kind), sec); }
  }
  const refresh = (sec) => { apply('amb', sec); apply('bgm', sec); };
  function unlock() {
    if (ctx || !A) return;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch (e) { ctx = null; }
    if (!ctx) ctx = { currentTime: 0, none: true };  // Web Audio が無い環境では、要素の音量で鳴らす
    refresh(0.6);
  }
  if (A && !SIM) ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true }));
  return {
    get state() { return { on: anyOn(), vol: Object.assign({}, vol), bgm: cur.bgm || (deduce && dd() ? dd() : want.bgm), amb: cur.amb || want.amb, deduce, playing: Object.entries(tracks).filter(([, t]) => !t.el.paused && t.v > 0).map(([n, t]) => n + '@' + t.el.currentTime.toFixed(1)) }; },
    bgm(n) { if (SIM || !A || want.bgm === (n || null)) return; want.bgm = n || null; if (!hushT) apply('bgm'); },
    amb(n) { if (SIM || !A || want.amb === (n || null)) return; want.amb = n || null; if (!hushT) { apply('amb'); apply('bgm', 1.5); } },
    // 推理の場面：環境音を止め、推理の曲にする
    deduce(v) { if (SIM || !A || deduce === !!v) return; deduce = !!v; if (!hushT) refresh(0.8); },
    // 対峙の前など：すべての音を止め、間をおいてから次の曲
    hush(ms = 1800) {
      if (SIM || !A) return;
      clearTimeout(hushT);
      if (!ctx) return;
      Object.values(tracks).forEach(t => setVol(t, 0, 0.6));
      cur = { bgm: null, amb: null };
      // 次の曲はタップの最中に鳴らしはじめておく（iPhone はタップの外では新しく鳴らせない）
      const nb = deduce && dd() ? dd() : want.bgm, pre = [nb, want.amb].filter(Boolean).map(n => track(n, !/_ending$/.test(n)));
      pre.forEach(t => { t.hold = true; t.el.play().catch(() => {}); });
      hushT = setTimeout(() => { hushT = null; pre.forEach(t => { t.hold = false; }); refresh(1.5); }, ms);
    },
    se(n) {
      if (SIM || !A || !vol.se || !ctx) return;
      if (n === 'note') { const now = Date.now(); if (now - noteT < 400) return; noteT = now; }
      const key = 'se_' + (n === 'step' ? 'step_' + (A.step || 'asphalt') : n);
      const el = ses[key] || (ses[key] = new Audio(url(key)));
      el.volume = VOL.se * vol.se / 100; el.currentTime = 0; el.play().catch(() => {});
    },
    // 音量バー：kind は bgm / amb / se、v は 0〜100
    setVol(kind, v) { vol[kind] = Math.max(0, Math.min(100, Math.round(v))); save(); unlock(); refresh(0.2); },
    get vol() { return Object.assign({}, vol); },
    mute() { vol = { bgm: 0, amb: 0, se: 0 }; save(); refresh(0.3); },
    unlock() { unlock(); },
    get on() { return anyOn(); },
    get enabled() { return !!A; },
  };
})();

// ---------- デバッグ：進み具合のフローチャート ----------
// URL に ?debug をつけたときだけ。章のデータから「何をすると → 何が手に入り → 何が開くか」を段階に分けて描く
const DEBUG = /[?&]debug\b/.test(location.search);
function flowGraph(cid) {
  const C = D.chapters[cid], cur = !!S && cid === S.chapter;
  const nodes = [], res = {};   // res: 資源（フラグ・もちもの・証言カード・場所）→ それを生む行動
  const locOf = o => Object.entries(C.locations).find(([, L]) => L.objs && o in L.objs);
  const pick = (r, v) => (r && r[v]) || [];
  // 条件のうち「そろうと進む」もの（! のついていないもの）
  const needs = src => {
    const out = [];
    if (!src) return out;
    const re = /(!?)\s*([a-z]+):([A-Za-z0-9_\-]+)(?:\s*(>=|<=|==|!=|>|<)\s*(-?\d+))?/g; let m;
    while ((m = re.exec(src))) {
      const [, neg, k, n, op, num] = m;
      if (neg || !['flag', 'has', 'var'].includes(k)) continue;
      if (k !== 'var') { out.push((k === 'has' ? 'item' : k) + ':' + n); continue; }
      // 数（何日目など）は「その値まで進んだか」で見る。小さいほう・ちがう値の条件は進みではないので数えない
      if (!op) out.push('var:' + n);
      else if (op === '==' || op === '>=') { if (+num > 0) out.push('var:' + n + '=' + num); }
      else if (op === '>') out.push('var:' + n + '=' + (+num + 1));
    }
    return out;
  };
  const gives = r => {
    const g = [];
    for (const e of (r && r.do) || []) {
      const i = e.indexOf(':'), k = e.slice(0, i), a = e.slice(i + 1);
      if (k === 'flag') g.push('flag:' + a);
      else if (k === 'give') g.push('item:' + a);
      else if (k === 'set') { const [n, v] = a.split('='); if (+v > 0) g.push('var:' + n + '=' + v); }
      else if (k === 'inc') g.push('var:' + a);
      else if (k === 'doc') g.push('doc:' + a);
      else if (['event', 'puzzle', 'choice', 'search', 'board'].includes(k)) g.push('go:' + k + ':' + a);
      else if (k === 'chapter' || k === 'ending') g.push(k + ':' + a);
    }
    if (r && r.cardId) g.push('card:' + r.cardId);
    return g;
  };
  const add = (kind, label, r, extra = {}) => {
    const g = (extra.gives || []).concat(gives(r));
    if (!g.length && !extra.keep) return;
    const n = { id: nodes.length, kind, label, text: (r && (r.text || r.card)) || '', need: needs(r && r.if).concat(extra.need || []), gives: g, rule: r, loc: extra.loc, p: extra.p, target: extra.target };

    g.forEach(x => { (res[x] = res[x] || []).push(n.id); });

// ---------- 行動 ----------

// 行けるようになった場所は、エンジンが自動で知らせる（シナリオに toast を書かなくてよい）

// 文を出した直後に場面・問い・謎へ移るときは、「つぎへ」をはさんで文を読めるようにする

let actSaid = false;
// 聞いたあとは同じ人の話題（話題のない人なら「だれに聞く？」）に、調べたあとは「何を調べる？」に戻る。毎回押し直さなくてよい

  const ps = here();
  if (rs.startsWith('topic:')) {
    const who = rs.slice(6);
    if (ps.includes(who) && (topicsOf(who) || []).length) return talk(who);
  }

function after() {
  const p = pending; pending = {};
  const rs = backTo; backTo = null;
  const said = actSaid && !SIM; actSaid = false;
  const gate = (id, fn) => (said && (id === null || reask !== id)) ? nextBtn(fn) : fn();
  if (openBefore) {
    const now = openLocs().filter(k => !openBefore.includes(k));
    if (now.length) toast(now.map(k => ch().locations[k].name).join('・') + 'に行けるようになった');
    openBefore = null;
  }
  if (p.goto) { S.loc = p.goto; renderScene(); }
  // 自動の進行：条件がそろったトリガーを1つだけ動かす（トリガーには once 用のフラグを do に入れておく）
  if (!p.event && !p.ending && !p.chapter && !p.puzzle && !p.choice && !p.search) {
    const t = (ch().triggers || []).find(r => cond(r.if));
    if (t) { pending = {}; run(t.do); Object.assign(p, pending); pending = {}; }
  }
  autosave();
  if (p.event) return gate(null, () => playEvent(p.event));
  if (SIM && p.puzzle) { S.simPuzzle = p.puzzle; return; }
  if (SIM && p.board) { S.simBoard = p.board; return; }
  if (!p.choice && !p.search) reask = null;
  if (SIM && p.search) { S.simSearch = p.search; return; }
  if (p.search) return gate(p.search, () => openSearch(p.search));
  if (SIM && p.choice) { S.simChoice = p.choice; return; }
  if (p.choice) return gate(p.choice, () => openChoice(p.choice));
  if (p.board) return gate(null, () => openBoard(p.board));

const avail = id => cond(ch().locations[id].unlock);

  const q = here().find(p => p !== AS() && hasNewTalk(p, heard) && !S.seq['ahint:' + S.chapter + ':' + p]);

function accuse(p) {
  const A = ch().accuse;
  if (p === A.culprit) {
    const miss = (A.required || []).filter(x => !cond(x.if)).map(x => '・' + x.label);
    if (miss.length) return act({ text: fmt(A.missingText, { missing: miss.join('\n'), name: short(p) }) });
    autosave();
    if (A.do) return act({ text: A.successText, do: A.do });   // 例：第8章の解決編へ（chapter:ch8）
    if (SIM) { S.simEnd = 'ending:' + A.ending; return; }
    return ending(A.ending);
  }
  act(resolve((A.wrong || {})[p], 'accuse:' + p) || { text: A.wrongDefault || 'ちがうようだ。', do: ['miss'] });
}

// ---------- イベント（何ページか続けて見せる場面） ----------
// 章の events: {id: {bg, place, pages: [文...], do: [最後に行う効果]}}
function playEvent(id) {
  const E = ch().events[id];
  if (SIM) { E.pages.forEach(t => say(t)); pending = {}; openBefore = openLocs(); run(E.do); return after(); }
  if (E.bg || E.place) setScene(E.bg || loc().bg, E.place || loc().name, ch().label || '現在地');
  if (E.hush) snd.hush(typeof E.hush === 'number' ? E.hush : undefined);
  if (E.bgm) snd.bgm(E.bgm);
  if ('amb' in E) snd.amb(E.amb);
  let k = 0;
  const next = () => {
    if (k < E.pages.length) { say(E.pages[k++]); nextBtn(next); return; }
    if (E.bgm && !E.bgmKeep) snd.bgm(chapterBgm());
    pending = {}; openBefore = openLocs(); run(E.do);
    renderScene(); after();
  };
  next();
}

// ---------- 考える（助手のいない章のヒント） ----------
// 章の think：ルール（hints も使える）。まず「まだ話を聞いていない人」を thinkHint の文で教え、なければ think の文
function think() {
  const h = assistantHint(ch().thinkHint);
  if (h) { S.v.hints = (S.v.hints || 0) + 1; return act(h); }
  const e = ch().think;
  if (Array.isArray(e)) {
    const i = e.findIndex(r => cond(r.if)), r = e[i];
    if (r && r.hints) {
      const hk = 'hint:' + S.chapter + ':think:' + i, lv = S.seq[hk] || 0;
      S.seq[hk] = lv + 1; S.v.hints = (S.v.hints || 0) + 1;
      return act({ text: r.hints[Math.min(lv, r.hints.length - 1)], do: r.do });
    }
  }
  act(resolve(e, 'think') || { text: '…いまは、考えがまとまらない。' });
}

// ---------- 選択式の問い ----------

}
let reask = null;

}

// ---------- 記事の検索 ----------
// 章の searches: {id: {label, prompt, placeholder, entries: [{keys: [ことば...], ...ルール}], none}}。効果 search:id で出す
// 入力した言葉に keys のどれかが含まれていれば、そのルールを行う（最初に当たったもの。if も使える）
// 空白を無視し、全角を半角にそろえ、数字の頭の0を取る（「10月08日」→「10月8日」）
const norm = t => String(t).normalize('NFKC').replace(/\s/g, '').replace(/(^|\D)0+(?=\d)/g, '$1');
function searchAnswer(id, q) {
  const Q = ch().searches[id]; S.simSearch = null;
  // 見つからないときは、その返事を残したまま入力欄を出し直す
  if (!norm(q)) { reask = id; return act({ text: Q.empty || '何も入力していない。', do: ['search:' + id] }); }
  S.v.searches = (S.v.searches || 0) + 1;
  const hit = Q.entries.find(e => cond(e.if) && e.keys.some(k => norm(q).includes(norm(k))));
  if (hit) return act(hit);
  reask = id; act({ text: fmt(Q.none || '「{q}」の記事は見つからなかった。', { q }), do: ['search:' + id] });
}
function openSearch(id) {
  snd.deduce(true);
  const Q = ch().searches[id];
  if (Q.prompt && reask !== id) say(Q.prompt, { nolog: true });
  reask = null;
  const c = $('cmd'); c.innerHTML = ''; c.className = 'list';
  c.insertAdjacentHTML('beforeend', `<div class="label">${esc(Q.label || 'ことばで探す')}</div><input id="sq" type="search" enterkeyhint="search" placeholder="${esc(Q.placeholder || '例：会社の名前')}" autocomplete="off">`);
  const go = () => searchAnswer(id, $('sq').value);
  $('sq').onkeydown = e => { if (e.key === 'Enter') go(); };
  const sb = btn('探す', go, 'primary'); sb.onclick = go; c.appendChild(sb);
  const f = document.createElement('div'); f.className = 'foot';
  f.appendChild(btn(...nbB())); f.appendChild(btn('やめる', () => main(), 'back')); c.appendChild(f);
}

// ---------- 謎解き（番号入力） ----------
function openPuzzle(id) {
  snd.deduce(true);
  const P = ch().puzzles[id]; let code = '';
  const disp = () => fmt(P.display, { code: code.padEnd(P.length, '＊') });
  say(P.prompt + '\n' + disp());
  const draw = () => btns([...'1234567890'.split('').map(d => [d, () => {
    code += d;
    if (code.length < P.length) { say(disp()); draw(); }
    else puzzleAnswer(id, code);
  }]), nbB(), ['やめる', () => { say(P.cancel || 'やめた。'); main(); }, 'back']], P.label, 'pad');
  draw();
}

function puzzleAnswer(id, code) {
  const P = ch().puzzles[id];
  S.simPuzzle = null;
  // answers：計算の答えで、少しの丸めの違いも正解にしたいとき（例：["1740", "1745", "1750"]）
  if (code === P.answer || (P.answers || []).includes(code)) act(P.success); else act({ text: fmt(P.fail, { code }) });
}

// ---------- 推理ボード（消去法） ----------
// 章の boards: {id: {suspects: [人物id], conditions: [{id, label, keeps: [条件に合う人物id], correct}], culprit,
//   success: ルール, wrong: {none, many, decoy}}}
// 条件を選ぶたびに、合わない人が外れる。正しい条件をすべて選んで犯人ひとりが残れば成功
const boardLeft = (B, sel) => B.suspects.filter(p => sel.every(cid => B.conditions.find(c => c.id === cid).keeps.includes(p)));
function boardSubmit(id, sel) {
  const B = ch().boards[id];
  S.simBoard = null;
  const left = boardLeft(B, sel);
  // 正しい条件だけで犯人ひとりが残れば成功（犯人に合わない「まちがった条件」を選ぶと、犯人は必ず外れる）
  const ok = left.length === 1 && left[0] === B.culprit && sel.every(cid => B.conditions.find(c => c.id === cid).correct);
  if (ok) return act(B.success);
  const why = !left.length ? B.wrong.none : left.length > 1 ? B.wrong.many : B.wrong.decoy;
  act({ text: why, do: ['miss'] });
}
function openBoard(id) {
  snd.deduce(true);
  const B = ch().boards[id];
  let sel = [];
  const draw = () => {
    closeModal();
    const left = boardLeft(B, sel);
    const m = document.createElement('div'); m.id = 'modal';
    m.innerHTML = `<div class="sheet board"><div class="eyebrow">推理ボード</div><h3>${esc(B.title || '犯人の条件')}</h3><p class="nb-note">${esc(B.lead || '')}</p>
      <div class="b-sus">${B.suspects.map(p => `<span class="${left.includes(p) ? '' : 'out'}">${esc(short(p))}</span>`).join('')}</div>
      <div class="b-con"></div><div class="row2"></div></div>`;
    const box = m.querySelector('.b-con');
    B.conditions.forEach(c => {
      const b = document.createElement('button'); b.className = 'row' + (sel.includes(c.id) ? ' on' : '');
      b.innerHTML = `<span class="t">${sel.includes(c.id) ? '☑' : '☐'} ${esc(c.label)}</span>`;
      b.onclick = () => { sel = sel.includes(c.id) ? sel.filter(x => x !== c.id) : [...sel, c.id]; draw(); };
      box.appendChild(b);
    });
    const r2 = m.querySelector('.row2');
    const go = document.createElement('button'); go.className = 'big primary'; go.textContent = `この条件で推理する（${sel.length}つ）`;
    go.disabled = !sel.length; go.onclick = () => { closeModal(); boardSubmit(id, sel); };
    const no = document.createElement('button'); no.className = 'big'; no.textContent = 'あとで';
    no.onclick = () => { closeModal(); main(); };
    // 推理ボードのまま記録を見返せる（とじるとボードに戻る）
    const nb = document.createElement('button'); nb.className = 'big nbk'; nb.textContent = nbLabel() + 'を見る';
    nb.onclick = () => { nbAfter = () => draw(); openNotebook(); };
    r2.append(no, nb, go);
    document.body.appendChild(m);
  };
  draw();
}

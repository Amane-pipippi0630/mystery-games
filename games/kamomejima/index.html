<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鴎島館の論理（仮）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1117;--panel:#171b24;--panel2:#1f2430;--line:#2b3140;--text:#e8e6e1;--sub:#9aa1ae;--accent:#d9a441;--accent2:#c2553f;--blue:#7fa7d6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;height:100%;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit}
#wrap{width:100%;max-width:560px;padding:14px 14px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between}
#locname{font-family:'Shippori Mincho',serif;font-weight:800;font-size:19px;letter-spacing:.04em}
#locname small{display:block;font-family:'Noto Sans JP';font-weight:500;font-size:11px;color:var(--accent);letter-spacing:.2em;margin-bottom:1px}
#bag-unused{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
#bag-unused b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#scene{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;position:relative;background:#000;box-shadow:0 10px 30px #0008}
#scene svg{width:100%;height:100%;display:block;filter:saturate(.8) contrast(1.05)}
#scene::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,#000a 100%),linear-gradient(180deg,transparent 60%,#0009);pointer-events:none}
#here{position:absolute;left:12px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:1}
#here span{background:#0e1117cc;backdrop-filter:blur(6px);border:1px solid #ffffff22;border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text)}
#msgbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;min-height:150px;position:relative;cursor:pointer}
#who{display:none;position:absolute;top:-12px;left:16px;background:var(--accent);color:#1a1405;font-weight:700;font-size:13px;padding:3px 12px;border-radius:999px}
#who.on{display:block}
#msg{font-size:16px;line-height:1.85;white-space:pre-wrap}
#msgbox.more::after{content:'';position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px) rotate(45deg)}}
#cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#cmd .label{grid-column:1/-1;color:var(--sub);font-size:13px;padding:2px 2px 0}
#cmd button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:14px;font-weight:500;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;min-height:64px}
#cmd button svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#cmd button:hover{border-color:var(--accent)}
#cmd button:active{transform:scale(.96);background:#262c3a}
#cmd.list{grid-template-columns:1fr 1fr}
#cmd.list button{flex-direction:row;justify-content:flex-start;min-height:50px;padding:10px 14px;text-align:left}
#cmd.pad{grid-template-columns:repeat(5,1fr)}
#cmd.pad button{min-height:52px;font-size:20px;border-radius:50%;aspect-ratio:1;padding:0}
#cmd button.back{background:transparent;color:var(--sub);border-style:dashed}
#cmd.pad button.back{border-radius:14px;aspect-ratio:auto;grid-column:1/-1;font-size:14px}
#cmd button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#cmd.one{grid-template-columns:1fr}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:0 8px 24px #0006;transition:.3s;z-index:9;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#24304a 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:5;text-align:center;padding:24px;overflow:auto}
.eyebrow{color:var(--accent);font-size:12px;letter-spacing:.35em}
#title h1{font-family:'Shippori Mincho',serif;font-weight:800;font-size:44px;line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 30px #000}
#title p{color:var(--sub);font-size:14px;line-height:1.9}
.big{width:240px;padding:14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:15px;font-weight:500;cursor:pointer}
.big.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
#prologue{justify-content:flex-start}
#prologue .card{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 22px;text-align:left;line-height:1.95;font-size:15px;margin:auto 0}
#prologue h2{font-family:'Shippori Mincho',serif;font-size:24px;text-align:center;margin-bottom:14px}
#prologue b{color:var(--accent)}
#prologue .cast{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
#prologue .cast div{display:flex;gap:10px;font-size:13.5px;padding:4px 0}
#prologue .cast span{min-width:76px;color:var(--blue);font-weight:700}
.hide{display:none!important}

#hdr-r{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer}
.pill b{background:var(--accent);color:#1a1405;border-radius:999px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
#modal{position:fixed;inset:0;background:#000a;z-index:8;display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:20px 16px 26px;max-height:85vh;overflow:auto}
#modal h3{font-family:'Shippori Mincho',serif;font-size:19px;margin-bottom:12px}
#modal .row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;width:100%;text-align:left;font-size:14px}
#modal .row:not([disabled]):hover{border-color:var(--accent)}
#modal .row .t{flex:1}
#modal .row small{display:block;color:var(--sub);font-size:12px;margin-top:2px}
#modal .row[disabled]{opacity:.45;cursor:default}
#modal .close{margin-top:6px;width:100%;padding:12px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--sub);font-size:14px;cursor:pointer}
#card{position:fixed;inset:0;z-index:7;background:radial-gradient(ellipse at 50% 40%,#24304a 0%,var(--bg) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;animation:fade .6s}
#card .n{color:var(--accent);letter-spacing:.35em;font-size:13px}
#card .t{font-family:'Shippori Mincho',serif;font-weight:800;font-size:30px;letter-spacing:.08em}
#card .tap{color:var(--sub);font-size:12px;margin-top:30px}
@keyframes fade{from{opacity:0}to{opacity:1}}
#bg,#bg img{width:100%;height:100%;display:block;object-fit:cover}
#loading .bar{width:220px;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden}
#loading .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
#loading p{color:var(--sub);font-size:13px}
#nbook{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.nb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.nb-head h3{font-family:'Shippori Mincho',serif;font-size:21px}
.nb-x{background:transparent;border:1px dashed var(--line);color:var(--sub);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.nb-tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
.nb-tabs button{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-size:12.5px;cursor:pointer}
.nb-tabs button.on{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:700}
.nb-body{flex:1;overflow:auto;padding:12px 14px 30px}
.nb-entry{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 44px 11px 14px;margin-bottom:8px}
.nb-entry.pinned{border-color:var(--accent)}
.nb-entry .meta{color:var(--blue);font-size:12px;font-weight:700;margin-bottom:3px}
.nb-entry .txt{font-size:14px;line-height:1.75;white-space:pre-wrap}
.nb-entry .pin{position:absolute;right:8px;top:8px;background:transparent;border:0;font-size:20px;color:var(--sub);cursor:pointer;padding:2px 6px}
.nb-entry .pin.on{color:var(--accent)}
.nb-bar,.nb-filter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)}
.nb-filter input[type=search]{flex:1 1 100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px}
.nb-filter select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--text);font:inherit;font-size:13px;max-width:48%}
.nb-bar .cnt,.nb-body .cnt{margin-left:auto;color:var(--sub);font-size:12px;margin-bottom:6px}
.nb-empty,.nb-note{color:var(--sub);font-size:13px;line-height:1.8;padding:6px 2px}
#memo{width:100%;min-height:50vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--text);font:inherit;font-size:15px;line-height:1.8;resize:vertical}
#modal .recap{font-size:15px;line-height:1.9;white-space:pre-wrap;margin:6px 0 18px}
#modal .eyebrow{margin-bottom:4px}
.nb-contra{background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center;position:sticky;top:0;z-index:1}
.nb-contra .big{width:100%}
.nb-contra small{display:block;color:var(--sub);font-size:12px;margin-top:6px}
.nb-contra .sel{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px}
.nb-contra .row2{display:flex;gap:8px}
.nb-contra .row2 .big{flex:1;width:auto}
.nb-contra .big.back{background:transparent;color:var(--sub);border-style:dashed}
.nb-contra .big[disabled]{opacity:.4}
.nb-entry.selectable{cursor:pointer}
.nb-entry.chosen{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset}
#cmd button{position:relative}
#cmd .badge{position:absolute;top:7px;right:9px;background:var(--accent2);color:#fff;border-radius:999px;font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;line-height:1.5}
.big,.pill,#modal .row,.nb-tabs button,.nb-x{transition:transform .08s,filter .15s,background .15s}
.big:active,.pill:active,#modal .row:not([disabled]):active,.nb-tabs button:active,.nb-x:active{transform:scale(.96);filter:brightness(1.25)}
.big.going{filter:brightness(1.25);pointer-events:none}
body.leaving::after{content:'開いています…';position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#0e1117cc;color:var(--text);font-size:15px;letter-spacing:.1em;animation:fade .2s}
.nb-entry .broken{display:inline-block;background:var(--accent2);color:#fff;border-radius:999px;font-size:10.5px;padding:0 8px;margin-right:6px}
.nb-entry.is-broken .txt{color:var(--sub);text-decoration:line-through;text-decoration-color:#c2553f99}

</style>
</head>
<body>
<div id="loading" class="screen"><div class="eyebrow">LOADING</div><div class="bar"><i id="loadbar"></i></div><p id="loadtxt">読み込み中…</p></div>
<div id="title" class="screen hide"></div>
<div id="prologue" class="screen hide"></div>
<div id="toast"></div>
<div id="wrap" class="hide">
  <header><div id="locname"></div><div id="hdr-r"><button class="pill" id="menu">メニュー</button></div></header>
  <div id="scene"><div id="bg"></div><div id="here"></div></div>
  <div id="msgbox"><div id="who"></div><div id="msg"></div></div>
  <div id="cmd"></div>
</div>

部、読者の前に出す』や。探偵だけが知ってる手がかりで解くのは反則。論理は、誰にでもたどれるもんやないとあかん」"},{"text":"鷹宮「消去法、いうのがある。犯人の条件をひとつずつ積み上げて、合わへん人を外していく。最後に一人だけ残ったら、それが犯人や。…きれいやろ？」"},{"text":"鷹宮「密室はな、三つに分けて考えるんや。犯人が外から作った密室、中で作った密室、それから――犯人やない誰かが作ってもうた密室」"},{"text":"鷹宮「アリバイは『その時間、そこにいられたか』の話や。『やったかどうか』とは別。いられた人の中から、やった人を探すんや」"},{"text":"鷹宮「葛西の小説、もうちょっと売れてもええと思うで。論理はきれいやのに、地味なんや。…今回の伝記で、ひと皮むけたらええな」"},{"text":"鷹宮「…ミステリーの話はもうええか？ 僕はいくらでもできるけどな」"}]}}},"mishima":{"topics":{"ima":[{"if":"here:pier && !flag:mishima_i0","text":"三島「鴎島行きの方ですか？ 私もなんです。フリーの記者で、三島といいます。久我グループの社史の取材で呼ばれまして」","card":"フリー記者。久我グループの社史の取材で鴎島へ","do":["flag:mishima_i0"]},{"if":"here:pier && !flag:mishima_i1","text":"三島「お二人は作家さん？ へえ、創業者の伝記小説を。…久我誠一郎は謎の多い人でしてね。昭和35年、冬の海で事故死したことになってますが」","do":["flag:mishima_i1"]},{"if":"here:pier && !flag:mishima_i2","text":"三島「実は祖父も新聞記者でした。汐見日報です。若いころに追いかけていた事件があって…私はその続きを、ちょっとね」","card":"祖父も汐見日報の記者。若いころ追っていた事件の続きを調べている","do":["flag:mishima_i2"]},{"if":"here:pier","text":"三島「いえ、ただの昔話ですよ。忘れてください」"},{"if":"here:ferry && !flag:m_ferry","text":"三島「…あの島に、祖父が探していたものがあるかもしれないんです。まあ、半分は夢みたいな話ですけど」","do":["flag:m_ferry"]},{"if":"here:ferry","text":"三島「揺れますね。台風が近いらしい。明日は船が出ないかもしれません」","card":"台風が近く、明日は船が出ないかもしれない"},{"if":"flag:dinner_done && !flag:m_after","text":"三島「宴の途中で失礼しました。どうしても一服したくて。…何かあったんですか？ 戻ったら、皆さん妙に静かで」","do":["flag:m_after"],"card":"宴の途中でたばこを吸いに出た。戻ると皆が妙に静かだった"},{"if":"flag:dinner_done && !flag:m_after2","text":"三島「遺言？ そんな話が出たんですか。…いや、私は聞いてませんよ。ずっとテラスにいたので」","do":["flag:m_after2"],"card":"タキの遺言の話は聞いていない。テラスにいた"},{"if":"flag:dinner_done && !flag:m_after3","text":"三島「さっき浅見先生に、書庫の古い資料を見せてほしいと頼んだんです。社史のために。…でも、きっぱり断られました。『明日まで、書庫には誰も入れません』って」\n\n三島は笑ってみせたが、目は笑っていなかった。","do":["flag:m_after3"],"card":"三島は書庫の資料を見たいと頼んだが、浅見に「明日まで誰も入れない」と断られた"},{"text":"三島「今夜は眠れそうにないな。風の音がひどい」"}],"kuga":{"seq":[{"text":"三島「久我誠一郎は、昭和21年に南方から引き揚げてきて、4年後に久我海運を興しました。そこから一代で、汐見いちばんの会社です」","note":"昭和21年に南方から引き揚げ、昭和25年に久我海運を創業。一代で汐見いちばんの会社に"},{"text":"三島「ただ、引き揚げる前のことが、ほとんど分からないんですよ。東京の生まれ、大学出、くらいで。親戚も友人も、名乗り出た人がいない」","note":"引き揚げ前の経歴がほとんど分からない。親戚も友人も名乗り出ていない"},{"text":"三島「昭和35年の冬、汐見の海で事故死。遺体は上がっていません。…記者としては、気になるでしょう？」","note":"昭和35年の冬、汐見の海で事故死。遺体は上がっていない"},{"text":"三島「続きは、島で一族の方に聞いてみてください。私が聞くより、作家さんのほうが話してもらえますよ」"}]},"hito":{"seq":[{"text":"三島「黒田家の皆さんとは、取材で何度か。社長の康彦さんは紳士、専務の圭さんは切れ者。…執事の磯村さんが、いちばん何でも知っていそうですけどね」"},{"text":"三島「あの家の人たちは、創業者の話になると、口が重くなるんです。不思議なくらいに」"}]},"yakata":{"seq":[{"text":"三島「鴎島の館は、昭和37年に黒田惣一郎が建てた別邸です。創業者の名前を取って『久我館』」","note":"久我館は昭和37年、黒田惣一郎が建てた別邸。創業者の名を取った"},{"text":"三島「島には館と灯台しかない。船が止まれば、陸の孤島ですよ」"}]}}},"isomura":{"topics":{"ima":[{"if":"here:front && !flag:isomura_i0","text":"磯村「ようこそお越しくださいました。執事の磯村でございます。お荷物はわたくしがお運びいたします」","card":"執事。黒田家に長く仕えている","do":["flag:isomura_i0"]},{"if":"here:front","text":"磯村「どうぞ館の中へ。足元が濡れておりますので、お気をつけくださいませ」"},{"if":"!flag:dinner_called && !flag:i_tour","text":"磯村「館をご案内いたします。本館の1階に、この玄関ホールと大食堂、談話室。お客さまのお部屋は2階でございます」","do":["flag:i_tour"],"card":"本館：1階に玄関ホール・大食堂・談話室・厨房、2階に客室"},{"if":"!flag:dinner_called && !flag:i_west","text":"磯村「奥の渡り廊下の先が西棟でございます。書庫と、わたくしの執事室、それに大奥さまのお部屋。…本館と西棟は、あの渡り廊下だけでつながっております」\n\n書庫、と口にしたとき、磯村はわずかに言いよどんだ。","do":["flag:i_west"],"card":"本館と西棟は1階の渡り廊下だけでつながる。西棟には書庫・執事室・タキの私室"},{"if":"!flag:dinner_called && !flag:i_door","text":"磯村「西棟には外へ出る通用口もございます。灯台へ続く小道に出られますが、夜9時にはわたくしが施錠し、鍵は執事室の鍵棚に掛けております」","do":["flag:i_door"],"card":"西棟の通用口は夜9時に磯村が施錠。鍵は執事室の鍵棚"},{"if":"!flag:dinner_called","text":"磯村「宴は7時からでございます。それまでどうぞ、ごゆっくり」"},{"if":"flag:dinner_done && !flag:i_mishima","text":"磯村「三島さま、でございますか。宴の途中、8時40分ごろにテラスへ出ていかれました。お戻りは、大奥さまのお話のあとでございます」","do":["flag:i_mishima"],"card":"三島は8時40分ごろテラスへ出て、タキの話のあとに戻った"},{"if":"flag:dinner_done && !flag:locked","text":"磯村「では、わたくしは通用口の戸締まりをしてまいります。…もう9時でございますので」\n\n磯村は鍵束を手に、渡り廊下のほうへ歩いていった。","do":["flag:locked"],"card":"宴のあと9時、磯村が通用口を施錠しに西棟へ向かった"},{"text":"磯村「何かございましたら、お申し付けくださいませ」"}],"kuga":{"seq":[{"text":"磯村「わたくしが書生としてお仕えしはじめたのは、昭和35年。久我さまが亡くなられる少し前でございます。…とても静かな方でございました」","note":"磯村は昭和35年、久我が亡くなる少し前に書生として仕えはじめた"},{"text":"磯村「久我さまは、毎月欠かさず、信州へお出かけになっておられました。ご母堂さまのお見舞いだと伺っております」","note":"久我は毎月欠かさず信州へ出かけた。母親の見舞いだったらしい"},{"text":"磯村「…それ以上のことは、わたくしの口から申し上げることではございません」"}]},"hito":{"seq":[{"text":"磯村「大奥さまは、旦那さま――惣一郎さまが亡くなられてから、ずっとこの島でお暮らしでございます」"},{"text":"磯村「康彦さまも玲子さまも、お小さいころからお仕えしております。圭さまと沙耶さまは、わたくしにとっては孫のようなもので」"}]},"yakata":{"seq":[{"text":"磯村「この館は昭和37年の築でございます。台風のたびに停電いたしますので、西棟の地下に自家発電を備えております。動かすのは、わたくしの役目で」","card":"台風のたびに停電する。西棟地下の自家発電は磯村が動かす"},{"text":"磯村「書庫は、惣一郎さまがお使いになっていたお部屋でございます。今は大奥さまのお許しがなければ、どなたも…」"}]}}},"saya":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:saya_i0","text":"沙耶「あ、作家の先生たち？ 黒田沙耶です。建築をやってて、この館の改修を頼まれてるの」","card":"建築家。館の改修を任されている","do":["flag:saya_i0"]},{"if":"!flag:dinner_done && !flag:saya_i1","text":"沙耶「古い館って面白いのよ。図面と実物を見比べると、いろいろ出てくるの。隠し扉とか、ね。なんて」","do":["flag:saya_i1"]},{"if":"!flag:dinner_done && !flag:saya_i2","text":"沙耶「たとえば西棟の書庫。右の壁だけ、図面と寸法が合わないのよ。壁が厚すぎる。…まあ、昔の建物にはよくあることだけど」","card":"書庫の右の壁だけ、図面と寸法が合わない（壁が厚すぎる）","do":["flag:saya_i2"]},{"if":"!flag:dinner_done && !flag:saya_i3","text":"沙耶「…ごめん、電話。――はい、黒田です。…分かってます。来月には必ずお支払いしますから。…はい」\n\n電話を切った沙耶は、こちらに気づいて、ばつが悪そうに笑った。\n\n沙耶「独立したばっかりの事務所って、大変なのよ」","card":"沙耶は電話で「来月には必ず払う」と話していた。独立したばかりの事務所は苦しいらしい","do":["flag:saya_i3"]},{"if":"!flag:dinner_done","text":"沙耶「宴、退屈だろうなあ。おばあさまの話、長いから」"},{"if":"!flag:s_after","text":"沙耶「おばあさま、本気かな。財団に寄付なんて…。ママのホテルの話も、みんなが当てにしていたものも、全部なくなっちゃう」","do":["flag:s_after"],"card":"沙耶：財団に寄付となれば、みんなが当てにしていたものがなくなる"},{"text":"沙耶「わたし、部屋で図面の続きをやるね。今夜中に終わらせたいの」"}],"kuga":{"seq":[{"text":"沙耶「創業者？ おばあさまの話でしか知らないなあ。おじいさまは、久我さんのことを『恩人』って呼んでたんだって」","note":"黒田惣一郎は久我を「恩人」と呼んでいた"},{"text":"沙耶「あ、でも変な話がある。久我さんって、海が嫌いだったらしいの。海運会社の社長なのに、船に乗らなかったんだって」","note":"久我は海運会社の社長なのに、船に乗ろうとしなかった"}]},"hito":{"seq":[{"text":"沙耶「ママはホテルのことで頭がいっぱい。伯父さんは優しいけど、圭兄さんの言いなりって、みんな言ってる」"},{"text":"沙耶「浅見先生は、おばあさまのお気に入り。最近はずっと二人で書庫にこもってた」","card":"最近、浅見はタキとずっと書庫にこもっていた"}]},"yakata":{"seq":[{"text":"沙耶「この館、昭和の洋館にしてはよくできてるの。渡り廊下だけは、あとから付けたみたいだけど」"},{"text":"沙耶「改修の図面、もうすぐできるの。見たい？ …まだだめ。完成したらね」"}]}}},"yasuhiko":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:yasuhiko_i0","text":"康彦「やあ、伝記の先生方か。社長の黒田康彦です。母のわがままに付き合わせて、すまないね」","do":["flag:yasuhiko_i0"]},{"if":"!flag:dinner_done && !flag:yasuhiko_i1","text":"康彦「創業者の久我さんは、父の恩人でね。父はずっと右腕だった。…私が子どものころに亡くなったから、ほとんど覚えていないが」","do":["flag:yasuhiko_i1"]},{"if":"!flag:dinner_done && !flag:yasuhiko_i2","text":"康彦「圭、合併の話は明日にしよう。母さんの前では、まだ言わないでおく約束だ」\n\n圭が肩をすくめた。親子のあいだには、何か二人だけの取り決めがあるらしい。","card":"康彦と圭は、合併の話をタキにまだ伝えていない","do":["flag:yasuhiko_i2"]},{"if":"!flag:dinner_done","text":"康彦「宴まで、ゆっくりしていてくれ」"},{"if":"!flag:y_after","text":"康彦「母さんが、あんなことを考えていたとはな…。いや、悪くない話だ。父も、きっとそう言う」\n\n言葉とは裏腹に、康彦の指は、空のグラスを何度も回していた。","do":["flag:y_after"],"card":"タキの遺言を、康彦は「悪くない話」と言った（グラスを回す手は落ち着かない）"},{"text":"康彦「今夜は冷える。暖炉のそばにいるといい」"}],"kuga":{"seq":[{"text":"康彦「父は、久我さんのことを話したがらなかった。『あの人は、自分のことを語らない人だった』とだけ」","note":"惣一郎は「あの人は、自分のことを語らない人だった」と言っていた"},{"text":"康彦「会社の古い記録には、創業の資金は『引き揚げ後の闇市の商売で作った』とある。帳簿の付け方が、とにかくうまかったそうだ」","note":"創業資金は闇市の商売で作った。帳簿の付け方がうまかった"},{"text":"康彦「事故の夜のことは、母のほうが詳しい。私はまだ5歳だったから」"}]},"hito":{"seq":[{"text":"康彦「圭は、私よりずっと商売がうまい。合併も、あいつがいなければまとまらなかった」"},{"text":"康彦「玲子とは昔から意見が合わなくてね。この館をホテルにするなんて、私は反対なんだが」"}]},"yakata":{"seq":[{"text":"康彦「子どものころは、夏になるとこの島で過ごした。灯台まで走って、よく磯村に叱られたよ」"}]}}},"kei":{"topics":{"ima":[{"if":"!flag:kei_i0","text":"圭「専務の黒田圭です。伝記ですか。…祖母が喜びます」","do":["flag:kei_i0"]},{"if":"!flag:kei_i1","text":"圭「来月、グループの大きな合併があるんです。父と二人で3年かけて進めてきた話で。こんな島で祝っている場合じゃないんだけど、祖母の米寿ですからね」","card":"来月の大型合併は、社長の康彦と専務の圭が3年かけて進めてきた","do":["flag:kei_i1"]},{"if":"!flag:kei_i2","text":"圭「父は社長、僕は専務。合併がまとまれば、グループは倍の大きさになる。…祖母には、まだ詳しく話していないんですけどね」","do":["flag:kei_i2"]},{"text":"圭「…失礼。仕事の電話を待っているので」"}],"kuga":{"seq":[{"text":"圭「創業者の伝記ね。正直、僕は興味がない。60年以上も前の人ですよ」"},{"text":"圭「ただ、会社の社是は今も久我さんの言葉なんです。『預かったものは、必ず返す』。…古くさいでしょう？」","note":"久我グループの社是は久我の言葉「預かったものは、必ず返す」"}]},"hito":{"seq":[{"text":"圭「沙耶は昔からこの館が好きでね。改修の話も、あいつが自分から手を挙げた」"},{"text":"圭「浅見先生？ 優秀な弁護士ですよ。最近は祖母の専属みたいになってるけど」"}]},"yakata":{"seq":[{"text":"圭「この島、電波が弱いんですよ。仕事の電話がろくにつながらない」","card":"島は電波が弱く、携帯電話がつながりにくい"}]}}},"reiko":{"topics":{"ima":[{"if":"!flag:dinner_done && !flag:reiko_i0","text":"玲子「長女の玲子です。ホテルの部門を見ております。…娘の沙耶には、もうお会いになった？」","do":["flag:reiko_i0"]},{"if":"!flag:dinner_done && !flag:reiko_i1","text":"玲子「この館も、来年にはホテルに改装する予定なのよ。母が許せば、だけど」","do":["flag:reiko_i1"]},{"if":"!flag:dinner_done","text":"玲子「宴では、母の近くにお座りになって。喜ぶわ」"},{"if":"!flag:r_after","text":"玲子「…財団ね。母は昔から、父が残したものを『預かりもの』って呼んでいたの。いつか返さなきゃいけない、って。\n\nでも、この館のホテルの計画は、もう銀行とも話がついているのよ。それを全部…」","do":["flag:r_after"],"card":"財団に寄付となれば、銀行とも話がついている玲子のホテル計画がなくなる"},{"text":"玲子「わたしはここで少し飲んでいくわ。眠れそうにないもの」"}],"kuga":{"seq":[{"text":"玲子「母から聞いたことがあるわ。久我さんは亡くなる前の年に、汐見の古い漁村のお墓に、こっそりお参りしていたって。誰のお墓かは知らないけど」","note":"久我は亡くなる前の年、汐見の古い漁村の墓にこっそり参っていた"},{"text":"玲子「わたしが生まれる前の話よ。母は、それ以上は話さないの」"}]},"hito":{"seq":[{"text":"玲子「沙耶には苦労をかけたわ。独立したいって言い出したとき、わたしは反対したの」"},{"text":"玲子「三島さん？ 社史の取材の人ね。母が呼んだのよ。わたしは、記者は好きじゃないけれど」"}]},"yakata":{"seq":[{"text":"玲子「ホテルにしたら、この談話室はラウンジにするの。暖炉はそのまま残して」"}]}}},"taki":{"topics":{"ima":[{"if":"!flag:taki_i0","text":"タキ「伝記の先生方。よう来てくださいましたね。…主人と久我さんのこと、どうか書いてくださいな。きれいごとじゃない、本当のことを」","card":"タキ：主人と久我さんの「本当のこと」を書いてほしい","do":["flag:taki_i0"]},{"if":"!flag:taki_i1","text":"タキ「わたしはもうすぐ西棟の部屋に戻ります。年寄りは早寝でね」","do":["flag:taki_i1"]},{"text":"タキ「明日の朝、皆に話しますよ。それまでは、何も聞かないでちょうだい」"}],"kuga":{"seq":[{"text":"タキ「久我さんはね、ご自分の誕生日を、一度も祝わせなかったの。『おれの誕生日は、もう祝う人がいない』って」","note":"久我は自分の誕生日を一度も祝わせなかった"},{"text":"タキ「主人と久我さんは、戦地で知り合ったのではないの。引き揚げたあと、闇市で出会ったのよ。主人は、久我さんの帳簿の腕に惚れこんだの」","note":"惣一郎と久我は戦地ではなく、引き揚げ後の闇市で出会った"},{"text":"タキ「明日、遺言を読み終えたら、もう少し話してあげますよ」"}]},"hito":{"seq":[{"text":"タキ「孫たちは、皆いい子ですよ。…欲がなければ、ね」"}]},"yakata":{"seq":[{"text":"タキ「わたしは西棟の部屋で休みます。夜は、渡り廊下の向こうはしんとして、波の音しか聞こえないの」"}]}}},"asami":{"topics":{"ima":[{"if":"!flag:a1","text":"浅見「顧問弁護士の浅見です。…ええ、遺言書はわたしがお預かりしています。中身は、明日の朝まで申し上げられません」","do":["flag:a1"],"card":"浅見：遺言書は自分が預かっている"},{"if":"!flag:a2","text":"浅見「このあと書庫で、大奥さまと最後の確認をします。…嵐になりそうですね」\n\n浅見は、膝の上の革のファイルを両手で押さえた。","do":["flag:a2"],"card":"浅見はこのあと書庫で遺言の確認をする。革のファイルを持っている"},{"text":"浅見「失礼。少し急ぎますので」"}],"kuga":{"seq":[{"text":"浅見「創業者の記録なら、書庫に古い資料がそろっています。ただ、明日までは誰も入れないよう、大奥さまに言われています」"}]},"hito":{"seq":[{"text":"浅見「黒田家の皆さまは、それぞれにお仕事を抱えておいでです。…遺言のことで、明日はたいへんな一日になるでしょう」"}]}}}},"look":{"ferry":"小さな白い連絡船。定員30人ほど。船体に「かもめ丸」と書いてある。","notice":{"text":"掲示板に紙が貼ってある。\n『台風12号接近のため、明日以降の運航は未定です』","card":"台風12号接近。明日以降の連絡船の運航は未定"},"town":"汐見の港町。坂に沿って家々が並び、窓に明かりがともりはじめている。","island":{"text":"灰色の海に、小さな岩の島が浮かんでいる。頂上に石造りの洋館、西の端に白い灯台。\n\nあれが鴎島。島の周りでは、波が白く砕けている。","do":["flag:saw_island"],"card":"鴎島：頂上に洋館、西の端に灯台"},"lighthouse":"西の崖の上に、白い灯台が立っている。もう灯りがともっていた。","wake":"船のあとに、白い泡の道が続いている。汐見港の明かりが、もう遠い。","gate":"鉄の門。門柱に、小さく「久我館」と彫られている。","windows":"1階の窓にはすべて明かりがついている。2階の西のほうの窓だけが暗い。","path":{"text":"館の西側、別棟の脇から、細い小道が崖のほうへ延びている。先に灯台が見える。","card":"西棟の脇から、灯台へ続く小道がある"},"portrait":"大階段の上に、男の肖像画。背広姿で、胸に手を当てている。顔のあたりは絵の具が褪せて、表情がよく分からない。","plaque":{"text":"肖像画の下に、真鍮の銘板。\n『久我誠一郎　昭和二十一年 帰還　昭和二十五年 久我海運 創業』","card":"肖像画の銘板：久我誠一郎、昭和二十一年 帰還、昭和二十五年 久我海運 創業"},"stairs":"赤い絨毯の敷かれた大階段。2階の回廊につながっている。","corridor":{"text":"ホールの奥に、ガラス張りの渡り廊下の入口がある。40メートルほど先が西棟だ。夜は真っ暗になりそうだ。","card":"渡り廊下はガラス張りで約40m。その先が西棟"},"fireplace":"暖炉の火が勢いよく燃えている。8月なのに、島の夜は冷えるらしい。","window":"窓の外は真っ暗だ。ガラスを打つ雨の音が、だんだん強くなっていく。","shelf":"古い本がぎっしり並んでいる。社史の分厚い背表紙もある。","chess":"チェス盤。白のキングが追いつめられたところで、手が止まっている。","bag":{"text":"自分の旅行かばんを、ベッドの脇に置いた。中には原稿用紙と、タキからの依頼状が入っている。","do":["flag:room_seen"]},"desk":"窓際の小さな机。ここで原稿を書けということらしい。","map":{"text":"壁に館の案内図が貼ってある。本館と西棟、そのあいだの渡り廊下。西棟の地下には『ボイラー室・乾燥室』とある。","card":"西棟の地下に、ボイラー室と乾燥室がある"},"table":"長いテーブルに、白いクロスと燭台。宴の名残の皿がまだ残っている。","clock":"背の高い振り子時計。時を刻む音が、大食堂に低く響いている。","flowers":"米寿の祝いの花。白いカードに『祝 米寿 タキ様』とある。"},"events":{"call":{"pages":["6時50分。廊下のどこかで、小さな鈴が鳴った。","磯村「皆さま、宴の支度が整いました。大食堂へお越しくださいませ」"]},"dinner":{"bg":"dining","place":"大食堂","pages":["7時。大食堂の長いテーブルに、一族と客がそろった。窓の外では、風が強くなりはじめている。","タキ「皆、今日はありがとう。米寿だなんて、自分でも信じられませんよ」","乾杯のあと、料理が運ばれてくる。康彦が社長らしく場をまとめ、玲子が来年のホテルの話をし、圭は合併の話を持ち出しかけて父に目で止められた。沙耶は祖母のグラスに、そっと水を注いでいる。","8時40分ごろ。三島が小さく会釈して席を立ち、テラスへ出ていった。たばこだろう。磯村がテラスの扉を開けてやっている。","タキ「…さて。皆に言っておくことがあります」","タキ「遺言を書き直しました。新しい遺言書は、浅見先生に預けてあります。明日の朝、ここで皆に読んでもらいます」","タキ「財産の大半は、汐見の町の財団に寄付します。黒田の家が、この先も会社を握ることはありません。…主人から預かったものを、お返しするだけですよ」","大食堂が静まりかえった。康彦は目を閉じ、玲子は青ざめてグラスを置いた。圭は腕を組んだまま動かない。沙耶は唇をかんで、祖母の顔を見つめている。給仕をしていた磯村の手の中で、皿がかすかに鳴った。","浅見は、膝の上の革のファイルを抱え直した。テーブルの全員の目が、一度はそのファイルに向いた。","このとき大食堂にいたのは、タキ、康彦、玲子、圭、沙耶、浅見、磯村。そして僕と鷹宮。三島はまだテラスから戻っていない。","しばらくして三島が戻ってきたが、誰も今の話を口にしなかった。宴は、どこかぎこちないまま9時前にお開きになった。"],"do":["flag:dinner_done","card:taki:遺言を書き直し、浅見に預けた。明日の朝に発表する","card::タキの宣言のとき大食堂にいたのは、タキ・康彦・玲子・圭・沙耶・浅見・磯村・葛西・鷹宮（三島はテラス）"]},"blackout":{"bg":"salon","place":"談話室","pages":["10時を回った。談話室には玲子、康彦、三島、そして僕と鷹宮。暖炉の火が、ときどき風にあおられる。","タキは西棟の自室へ。浅見は書庫へ向かったと、磯村が言っていた。沙耶と圭は、それぞれ本館2階の部屋に戻っている。","鷹宮「えらい音やな。雷が近い」","その瞬間、窓の外が白く光った。","――轟音。","そして、館じゅうの明かりが消えた。","玲子「停電…！」","康彦「落ち着いて。自家発電がある。磯村がすぐに動かしてくれる」","暗闇の中で腕時計を見る。夜光の針は、10時40分を指していた。","この20分のあいだに、何が起きていたのか。それを知るのは、翌朝のことになる。"],"do":["card::停電は10時40分。そのとき談話室にいたのは玲子・康彦・三島・葛西・鷹宮","chapter:ch2"]}},"triggers":[{"if":"flag:room_seen && flag:i_tour && talked:saya>=1 && talked:yasuhiko>=1 && talked:kei>=1 && talked:reiko>=1 && var:notes>=5 && !flag:dinner_called","do":["flag:dinner_called","event:call"]},{"if":"flag:locked && flag:m_after2 && flag:y_after && flag:r_after && flag:s_after && flag:a2 && talked:taki>=1 && !flag:blackout_ready","do":["flag:blackout_ready","toast:談話室に皆が集まりはじめた"]},{"if":"flag:blackout_ready && here:salon && !flag:blackout","do":["flag:blackout","event:blackout"]}]},"ch2":{"id":"ch2","label":"第二章","title":"書庫の密室","recap":"8月14日、鴎島の久我館で、当主タキの米寿の宴が開かれた。タキは「遺言を書き直して浅見に預けた。財産の大半を汐見の財団に寄付する。明日の朝に発表する」と告げた。三島はそのときテラスにいた。\n\n夜10時40分、落雷で停電。談話室には玲子・康彦・三島・葛西・鷹宮がいた。電気が戻ったのは11時だった。","start":{"loc":"guestroom","text":"8月15日、朝7時。\n\n叩きつける雨の音で目が覚めた。…いや、雨だけじゃない。下の階で、誰かが叫んでいる。"},"locations":{"guestroom":{"name":"客室（葛西と鷹宮）","bg":"guestroom","people":["takamiya"],"objs":{"window":"窓","desk":"机","bag":"旅行かばん"},"arrive":"客室に戻ってきた。窓の外は、まだ嵐だ。"},"hall":{"name":"玄関ホール","bg":"hall","people":["takamiya",{"id":"isomura","if":"flag:found && !flag:phone"}],"objs":{"phone":"電話","portrait":"肖像画","door":"玄関の扉"},"arrive":[{"if":"!flag:found","text":"階段を駆け下りる。玄関ホールの奥、渡り廊下のほうから、磯村の声が聞こえる。"},{"text":"玄関ホール。シャンデリアの明かりが、どこか頼りない。"}]},"corridor":{"name":"西棟の廊下","bg":"corridor","people":["takamiya",{"id":"isomura","if":"!flag:found"}],"objs":{"blood":"床のしみ","libdoor":"書庫の扉","bridge":"渡り廊下","stairs2":"2階への階段"},"arrive":[{"if":"!flag:found","text":"渡り廊下を抜けて西棟へ。廊下の突き当たり、書庫の扉の前で、磯村が扉を叩いていた。\n\n磯村「浅見先生！ 浅見先生、お返事を…！」"},{"text":"西棟の廊下。昨夜の停電のときは、ここも真っ暗だったはずだ。"}]},"library":{"name":"書庫","bg":"library","unlock":"flag:found","people":["takamiya",{"id":"isomura","if":"flag:found && !flag:phone"}],"objs":{"body":"浅見","bar":"閂","file":"革のファイル","shelf":"右の本棚","window":"小窓","desk":"読書机"},"arrive":"書庫。床に倒れた浅見には、毛布が掛けられている。"},"butler":{"name":"執事室","bg":"butler","unlock":"flag:phone","people":["takamiya","isomura"],"objs":{"keys":"鍵棚","log":"発電機の記録","photo":"古い写真立て"},"arrive":"西棟の執事室。壁一面の鍵棚に、館じゅうの鍵が掛かっている。"},"salon":{"name":"談話室","bg":"salon","unlock":"flag:phone","people":["takamiya","taki","yasuhiko","reiko","kei","saya","mishima"],"objs":{"fireplace":"暖炉","window":"窓","clock2":"置き時計"},"arrive":[{"if":"!flag:gathered","text":"談話室に、館の全員が集められていた。誰も口をきかない。暖炉の火だけが、ぱちぱちと鳴っている。","do":["flag:gathered"]},{"text":"談話室。一族は、互いに目を合わせようとしない。"}]},"dining":{"name":"大食堂","bg":"dining","unlock":"flag:phone","people":["takamiya"],"objs":{"table":"長いテーブル","clock":"振り子時計","window":"窓の外"},"arrive":"誰もいない大食堂。昨夜の祝いの花が、そのまま残っている。"}},"talk":{"takamiya":{"topics":{"hint":[{"if":"!flag:found","hints":["鷹宮「…なんや、騒がしいな」","鷹宮「下で誰かが叫んでる。磯村さんの声や」","鷹宮「『移動』で西棟の廊下へ行こ。急ぐで」"]},{"if":"!flag:opened","hints":["鷹宮「扉が開かへんのか」","鷹宮「磯村さんと話してみ」","鷹宮「磯村さんに『いまのこと』を聞いて、扉を破るのを手伝お」"]},{"if":"!flag:phone","hints":["鷹宮「警察に知らせなあかん」","鷹宮「電話は玄関ホールにあったはずや」","鷹宮「玄関ホールへ行って、『調べる』で電話を見よ」"]},{"if":"var:alibis<7","hints":["鷹宮「昨夜の停電、20分あったな」","鷹宮「その20分、みんなどこにおったんやろ」","鷹宮「談話室と執事室で、全員に『停電のあいだ』を聞いて回ろ。タキさん、康彦さん、玲子さん、圭さん、沙耶さん、三島さん、磯村さんの7人や」"]},{"if":"!flag:saw_bar || !flag:saw_blood || !has:file","hints":["鷹宮「現場は、まだ見落としがあるかもしれん」","鷹宮「扉、床、それから浅見さんの持ち物や」","鷹宮「書庫の『閂』『革のファイル』と、西棟の廊下の『床のしみ』を調べよ」"]},{"text":"鷹宮「…ちょっと考えさせてくれ。何かが引っかかってるんや」"}],"dangi":{"seq":[{"text":"鷹宮「閂は内側からしか掛けられへん。ほんで中には浅見さんだけ。…教科書どおりの密室やな」"},{"text":"鷹宮「密室の三つの分け方、覚えてるか？ 犯人が外から作った密室、中で作った密室、それから犯人やない誰かが作ってもうた密室」"},{"text":"鷹宮「葛西。ミステリーの話をしてる場合やないのは分かってる。けど、こういうときこそ、順番に考えるんや」"}]}}},"isomura":{"topics":{"ima":[{"if":"!flag:opened","text":"磯村「閂が…内側から掛かっております！ 浅見先生が中に。お返事がございません！」\n\n鷹宮「磯村さん、扉を破りましょう。葛西、手伝え！」","do":["flag:opened","event:breakin"]},{"if":"!flag:phone","text":"磯村「わ、わたくしが…皆さまをお呼びしてまいります。電話は玄関ホールに…」"},{"text":"磯村「何かございましたら、執事室におります」"}],"teiden":{"seq":[{"text":"磯村「停電してすぐ、懐中電灯を持って渡り廊下を通り、西棟地下のボイラー室へ参りました。自家発電を動かしまして、11時に電気が戻りました」","card":"停電してすぐ、懐中電灯を持って渡り廊下を通り、西棟地下のボイラー室へ。11時に電気を戻した","do":["inc:alibis"]},{"text":"磯村「その間、どなたとも…いえ。渡り廊下は真っ暗で、わたくしの懐中電灯のほかに明かりはございませんでした。誰かとすれ違ったかと言われますと…分かりません」"},{"text":"磯村「ボイラー室におりましたので、書庫の物音などは聞こえておりません」"}]},"asami":{"seq":[{"text":"磯村「浅見先生は、10時ごろ大奥さまと書庫に入られ、大奥さまがお部屋に戻られたあとも、おひとりでお仕事を続けておいででした」"},{"text":"磯村「書庫の鍵は、外からかける錠と、内側の閂がございます。外の鍵は、昨夜はかかっておりませんでした」","card":"書庫は外からかける錠と、内側の閂。昨夜、外の錠はかかっていなかった"}]},"kuga":{"seq":[{"text":"磯村「久我さまが亡くなられた夜のことは…申し訳ございません。今は、そのお話は」"}]}}},"taki":{"topics":{"ima":{"seq":[{"text":"タキ「…浅見先生が。どうして、こんなことに」"},{"text":"タキ「わたしが遺言のことなど言わなければ…」"}]},"teiden":{"seq":[{"text":"タキ「わたしは西棟2階の自分の部屋にいましたよ。10時に書庫で浅見先生と最後の確認をして、先に部屋へ戻ったの」","card":"10時に書庫で浅見と確認をし、先に西棟2階の自室へ戻った。停電中は自室","do":["inc:alibis"]},{"text":"タキ「暗いのは慣れています。年寄りは、じっとしているだけですよ。耳が遠いから、何も聞こえなかったわ」"}]},"asami":{"seq":[{"text":"タキ「浅見先生は、遺言書を革のファイルに入れて、肌身離さず持っておられた。…あのファイルは、どこに？」"}]},"yakata":{"seq":[{"text":"タキ「書庫には、主人の大事な預かりものがしまってあるの。…いつか、お返ししなければならないものよ」","card":"書庫には、夫の大事な「預かりもの」がしまってある"},{"text":"タキ「それが何かは、まだ言えません。浅見先生にだけは、話してあったけれど」"}]},"kuga":{"seq":[{"text":"タキ「久我さんのことは、また今度。…今は、そんな気持ちになれないの」"}]}}},"yasuhiko":{"topics":{"ima":{"seq":[{"text":"康彦「とにかく警察だ。…電話が通じない？ 携帯も？ 冗談だろう」"},{"text":"康彦「みんな、勝手に動き回らないでくれ。…犯人が、この中にいるかもしれないんだ」"}]},"teiden":{"seq":[{"text":"康彦「停電のあいだは、談話室だ。玲子と三島くん、それに君たちと一緒にいた。暗い中で、鷹宮くんと大学の話をしていたよ」","card":"停電中は談話室。玲子・三島・葛西・鷹宮と一緒だった","do":["inc:alibis"]},{"text":"康彦「圭？ 部屋に戻ると言っていたな。宴のあと、ずいぶん不機嫌だったから」"}]},"asami":{"seq":[{"text":"康彦「浅見くんは、父の代からの顧問の娘さんでね。母がいちばん信頼していた」"},{"text":"康彦「遺言の中身？ 私も知らない。母は、浅見くんにしか話していなかったはずだ」","card":"遺言の中身は、タキと浅見しか知らなかったはず"}]},"hito":{"seq":[{"text":"康彦「…正直に言おう。合併が止まれば、会社は困る。私も、圭もだ。だが、だからといって人を殺すような人間は、うちにはいない」"}]}}},"reiko":{"topics":{"ima":{"seq":[{"text":"玲子「警察が来るまで、どのくらいかかるの？ …船が出ない？ じゃあ、わたしたち、犯人と一緒にこの島に閉じこめられているってこと？」"}]},"teiden":{"seq":[{"text":"玲子「停電のあいだは、ずっと談話室よ。兄さんと三島さんと、あなたたち。真っ暗で、誰がどこにいるかなんて分からなかったけど、声はずっと聞こえていたわ」","card":"停電中は談話室にいた。真っ暗で、誰がどこにいるかは見えなかったが、声は聞こえていた","do":["inc:alibis"]},{"text":"玲子「沙耶？ あの子は部屋で図面を描くって言ってたわ。…まさか、あの子を疑ってるの？」"}]},"asami":{"seq":[{"text":"玲子「浅見さんとは、ホテルの件でよくもめたわ。銀行との契約に、母の承諾が要るって。…それだけよ」"}]},"hito":{"seq":[{"text":"玲子「遺言が読まれなかったら、どうなるのかしら。…ごめんなさい、こんなときに」"}]}}},"kei":{"topics":{"ima":{"seq":[{"text":"圭「電話も駄目、携帯は圏外、船は欠航。…完璧ですね。誰かが仕組んだみたいに」"}]},"teiden":{"seq":[{"text":"圭「停電？ 自室で寝ていましたよ。宴で飲みすぎて、10時前にはベッドに入った。停電にも気づかなかったくらいです」","card":"停電中は本館2階の自室で寝ていた。停電にも気づかなかった","cardId":"kei_sleep","do":["inc:alibis"]},{"text":"圭「証人？ いませんよ。寝ている人間に、証人がいるわけがない」"}]},"asami":{"seq":[{"text":"圭「浅見先生とは仕事でよく顔を合わせました。有能な人でしたよ。祖母の言うことを、何でも聞く人でもあった」"}]},"hito":{"seq":[{"text":"圭「疑うなら、まずは書庫に近づきたがっていた人を疑うべきじゃないですか。…社史の取材とか言ってね」"}]}}},"saya":{"topics":{"ima":{"seq":[{"text":"沙耶「…信じられない。昨日の夜、宴で浅見先生と話したばかりなのに」"}]},"teiden":{"seq":[{"text":"沙耶「わたしは本館2階の自分の部屋で、図面を描いてた。停電で手元が真っ暗になって、懐中電灯を探してバタバタしてたの」","card":"停電中は本館2階の自室で図面を描いていた。懐中電灯を探していた","do":["inc:alibis"]},{"text":"沙耶「証人？ …いない。ひとりだったもの」"}]},"asami":{"seq":[{"text":"沙耶「浅見先生、昨日の宴のあと、わたしに『書庫の改修は、遺言が読まれるまで待ってほしい』って言ったの。どういう意味だったんだろう」"}]},"yakata":{"seq":[{"text":"沙耶「書庫の閂は、内側からしか掛けられないの。古い造りよ。外から細工する隙間もない。…わたし、改修のときに確かめたから間違いない」","card":"書庫の閂は内側からしか掛けられず、外から細工する隙間もない（沙耶が改修の下見で確かめた）"}]}}},"mishima":{"topics":{"ima":{"seq":[{"text":"三島「…取材に来て、こんなことになるとは。記者としては、記録を取っておくべきなんでしょうけどね」"}]},"teiden":{"seq":[{"text":"三島「停電中ですか？ 談話室から一歩も出ていません。皆さんと一緒でしたよ」","card":"停電中は談話室から一歩も出ていない","cardId":"mishima_stay","do":["inc:alibis"]},{"text":"三島「真っ暗でしたからね。誰が何をしていたかまでは…」"}]},"asami":{"seq":[{"text":"三島「浅見先生には、書庫の資料を見せてくれと頼んで、断られました。それきりです」"},{"text":"三島「遺言？ 昨日も言いましたが、私はその場にいなかったんです。タキさんが何を言ったのかも、あとで聞いたくらいで」","card":"タキの宣言のとき、三島はその場にいなかった"}]},"hito":{"seq":[{"text":"三島「圭さんに、さっき嫌味を言われましたよ。書庫に近づきたがっていた記者が怪しい、ってね」"}]}}}},"look":{"window":"窓の外は灰色の嵐。海は白く荒れて、汐見の町は見えない。","desk":"読書机の上に、浅見の万年筆とメモ用紙。メモには、日付と数字がいくつか書いてあるだけだ。","bag":"旅行かばん。伝記の資料が入っている。","phone":[{"if":"!flag:phone","text":"玄関ホールの電話を取る。…何の音もしない。何度かけ直しても同じだ。\n\n康彦「電話線が切れたか。携帯は…圏外だ」\n\n磯村「港の事務所にも、連絡がつきません。この嵐では、船も…」\n\n島は、完全に孤立した。","do":["flag:phone","card::電話は不通、携帯は圏外、船は欠航。島は孤立した","toast:談話室に全員が集められた"]},{"text":"受話器からは、何の音もしない。"}],"portrait":"肖像画の男は、今朝も表情が分からない。","door":"玄関の扉の外は、横なぐりの雨だ。とても出られそうにない。","blood":[{"if":"!flag:found","text":"…今はそれどころではない。"},{"text":"書庫の扉の手前、廊下の床に、点々と黒いしみがある。拭き取ったあとがあるが、板の目に入りこんだ色は消えていない。\n\n鷹宮「血や。…ここで刺されて、書庫まで歩いたんやな」","do":["flag:saw_blood"],"card":"西棟の廊下の床に、拭き取られた血のあと。書庫の扉の前まで点々と続く"}],"libdoor":[{"if":"!flag:opened","text":"重い木の扉。押しても引いても動かない。内側から閂が掛かっている。"},{"text":"破られた書庫の扉。蝶番が外れかけている。"}],"bridge":{"text":"ガラス張りの渡り廊下。停電中は、真っ暗だったはずだ。本館からここまで、走れば1分もかからない。","card":"渡り廊下は、走れば1分もかからない"},"stairs2":"西棟2階への階段。上にはタキの私室と、浅見の客室がある。","body":{"text":"浅見は、背中を刺されていた。うつ伏せに倒れ、右手を本棚のほうへ伸ばしている。凶器は見当たらない。","card":"浅見は背中を刺されていた。右手を本棚のほうへ伸ばして倒れていた。凶器はない"},"bar":{"text":"扉の内側の閂。太い木の棒を、鉄の受け金に落としこむ造りだ。外から動かせる仕掛けはない。破った扉の側で、受け金ごと外れている。","do":["flag:saw_bar"],"card":"閂は内側からしか掛けられない。扉を破ったとき、受け金ごと外れた"},"file":[{"if":"has:file","text":"革のファイルは預かっている。"},{"text":"浅見の足もとに、革のファイルが落ちている。…中は空だ。遺言書がない。","do":["give:file"],"card":"浅見の革のファイルは、書庫の床で空になっていた。遺言書がない"}],"shelf":"天井までの本棚。浅見の伸ばした手の先にある。何冊か、本の並びが乱れているようにも見える。","keys":{"text":"鍵棚に、館じゅうの鍵が並んでいる。『書庫』『通用口』『西棟2階』…。どれも、きちんと掛かっている。","card":"執事室の鍵棚には、書庫・通用口などの鍵がそろって掛かっている"},"log":{"text":"発電機の記録帳。几帳面な字で書いてある。\n『8月14日 22時40分 停電（落雷） 23時00分 自家発電にて復旧 磯村』","card":"発電機の記録：停電は22時40分〜23時00分の20分間"},"photo":"古い写真立て。若い書生姿の磯村と、背広の男が写っている。男の顔は、日に焼けて見えない。","fireplace":"暖炉の火を、誰かがくべ直したらしい。","clock2":"置き時計は8時半を指している。","table":"昨夜の宴のテーブル。浅見の座っていた椅子が、空いたままだ。","clock":"振り子時計の音が、やけに大きく聞こえる。"},"events":{"breakin":{"bg":"library","place":"書庫","pages":["鷹宮と磯村と三人で、扉に肩を打ちつける。一度、二度。三度目で、内側の何かが外れる音がした。","扉が開く。","書庫の床に、浅見理沙が倒れていた。","鷹宮が駆け寄り、首すじに指を当てる。…ゆっくりと、首を横に振った。","磯村「そんな…浅見先生…」","閂は内側から掛かっていた。書庫の中には、浅見ひとり。窓は、はめ殺しの小窓だけ。","鷹宮「葛西。何も触るなよ。…まずは警察や」"],"do":["flag:found","card::朝7時、閂の掛かった書庫で浅見が死んでいた。中には浅見ひとり"]},"close":{"pages":["談話室に戻ると、鷹宮が暖炉の前で腕を組んでいた。","鷹宮「…なあ、葛西。ひとつ引っかかってることがある」","鷹宮「浅見さんは廊下で刺された。血のあとが、書庫の扉の前まで続いてた。ほんで、閂は内側からしか掛けられへん」","鷹宮「犯人が中から閂を掛けて、どうやって外へ出たんや？ 出られへん。窓も開かへん」","鷹宮「ほな、逆に考えよ。閂を掛けたのが、犯人やなかったとしたら」","鷹宮「この密室は、犯人が作ったもんやないかもしれん」"],"do":["ending:ch2end"]}},"triggers":[{"if":"var:alibis>=7 && flag:saw_bar && flag:saw_blood && has:file && here:salon && !flag:ch2_done","do":["flag:ch2_done","event:close"]},{"if":"var:alibis>=7 && flag:saw_bar && flag:saw_blood && has:file && !here:salon && !flag:ch2_ready","do":["flag:ch2_ready","toast:鷹宮が談話室で考えこんでいる"]}]}},"titleScreen":{"eyebrow":"汐見ミステリー 第一作","title":"鴎島館の<br>論理","lead":"嵐で孤立した島の洋館。<br>閂のかかった書庫で、弁護士が死んでいた。<br><small>（第2章まで遊べる試作版）<\/small>"},"prologue":{"eyebrow":"PROLOGUE","title":"あらすじ","paragraphs":["8月。売れない本格ミステリ作家の<b>葛西湊<\/b>は、大学時代の先輩で論理学講師の<b>鷹宮恭介<\/b>とともに、汐見沖の小島・<b>鴎島<\/b>へ向かう。","島には、久我グループの創業者を支えた黒田家の別邸「久我館」が建っている。当主の<b>黒田タキ<\/b>から、米寿の祝いに合わせて「創業者の伝記小説」を書いてほしいと頼まれたのだ。","集まったのは、黒田家の一族、顧問弁護士、執事、そして社史を取材する記者。台風が近づくなか、祝宴の夜が始まる。"],"cast":[["鷹宮 恭介","論理学講師。葛西の先輩"],["黒田 タキ","当主。米寿を迎える"],["黒田 康彦","長男。久我グループ社長"],["黒田 玲子","長女。ホテル部門"],["黒田 圭","康彦の息子。専務"],["黒田 沙耶","玲子の娘。建築家"],["磯村","執事"],["浅見 理沙","顧問弁護士"],["三島 陽","フリー記者"]],"button":"島へ向かう"},"resumeText":"続きから始めよう。","assistant":"takamiya","assistantHint":"鷹宮「{name}さん、まだ何か話してくれそうやで。いろんな話題で聞いてみ」","talkDefault":"{name}は、いまは話す気がなさそうだ。","items":{"file":"空の革のファイル"},"people":{"takamiya":{"name":"鷹宮"},"taki":{"name":"タキ"},"yasuhiko":{"name":"康彦"},"reiko":{"name":"玲子"},"kei":{"name":"圭"},"saya":{"name":"沙耶"},"isomura":{"name":"磯村"},"asami":{"name":"浅見"},"mishima":{"name":"三島"}},"endings":{"ch1end":{"bg":"salon","place":"談話室","small":"第一章","pages":["第1章「鴎島へ」 おわり","――翌朝、閂のかかった書庫で、ひとりの死体が見つかる。\n\n（第2章「書庫の密室」へつづく）"],"finalBg":"island","finalPlace":"つづく","finalSmall":"試作版","ranks":[{"label":""}],"result":"～ 第1章 おわり ～\n\nプレイ時間：{time}\n行動回数：{turns}\n鷹宮への相談：{hints}回\n取材ノート：{notes}件\n\nこの章は試作です。遊んだ時間と、長すぎた・短すぎたところを教えてください。","clear":false},"ch2end":{"bg":"library","place":"書庫","small":"第二章","pages":["第2章「書庫の密室」 おわり","――密室を作ったのは、誰なのか。\n\n（第3章「鷹宮の講義」へつづく）"],"finalBg":"island","finalPlace":"つづく","finalSmall":"試作版","clear":false,"ranks":[{"label":""}],"result":"～ 第2章 おわり ～\n\nプレイ時間：{time}\n行動回数：{turns}\n鷹宮への相談：{hints}回\n取材ノート：{notes}件\n\nこの章は試作です。遊んだ時間と、分かりにくかったところを教えてください。"}},"topics":{"ima":"いまのこと","kuga":"創業者のこと","hito":"一族のこと","yakata":"館と島のこと","hint":"相談する","dangi":"ミステリー談義","teiden":"停電のあいだ","asami":"浅見さんのこと"},"hintTopic":"hint","notes":{"tab":"取材ノート","lead":"創業者・久我誠一郎の伝記のために集めた話"},"assets":{"bg":{"butler":"bg/butler.webp","cliff":"bg/cliff.webp","corridor":"bg/corridor.webp","dining":"bg/dining.webp","drying":"bg/drying.webp","exterior":"bg/exterior.webp","guestroom":"bg/guestroom.webp","hall":"bg/hall.webp","island":"bg/island.webp","library-safe":"bg/library-safe.webp","library":"bg/library.webp","pier":"bg/pier.webp","salon":"bg/salon.webp","terrace":"bg/terrace.webp"}}}</script>
<script>
// mystery-games 共通エンジン
// シナリオは <script id="game-data"> の JSON から読む（tools/build.py が埋め込む）。
// 書き方は engine/README.md を参照。
'use strict';
(() => {
const D = JSON.parse(document.getElementById('game-data').textContent);
const KEY = 'mg:' + D.id;
const $ = id => document.getElementById(id);
const SLOTS = 3;

// ---------- 保存 ----------
const store = {
  get(k) { try { const v = localStorage.getItem(KEY + ':' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(KEY + ':' + k, JSON.stringify(v)); } catch (e) {} },
};
function markCleared() {
  try {
    const c = JSON.parse(localStorage.getItem('mg:cleared') || '[]');
    if (!c.includes(D.id)) { c.push(D.id); localStorage.setItem('mg:cleared', JSON.stringify(c)); }
  } catch (e) {}
}

// ---------- 状態 ----------
let S = null;
let pending = {};
const fresh = () => ({ chapter: D.start, loc: null, f: {}, v: { turns: 0, miss: 0 }, items: [], seq: {}, done: false, log: [], cards: [], memo: '', seenCards: 0 });
const ch = () => D.chapters[S.chapter];
const loc = () => ch().locations[S.loc];
// 場所にいる人。{"id": "...", "if": "条件"} で、場面によって出入りさせられる
const here = (L = loc()) => (L.people || []).filter(p => typeof p === 'string' || cond(p.if)).map(p => typeof p === 'string' ? p : p.id);
const person = p => D.people[p] || { name: p };
const short = p => person(p).short || person(p).name;
const fmt = (t, o) => String(t).replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
function snapshot(label) {
  return { state: JSON.parse(JSON.stringify(S)), at: Date.now(), label: label || ((ch().label ? ch().label + ' ' : '') + (loc() ? loc().name : '')) };
}
function autosave() { if (S) store.set('auto', snapshot()); }

// ---------- 条件 ----------
// 例: "has:capsule && !flag:sent"  "var:wait>=1"  "count:talk:haru>=2" は不可（キーは英数字と _ -）
const TOK = /\s*(\|\||&&|!|\(|\)|true|false|[a-z]+:[A-Za-z0-9_\-]+(?:\s*(?:>=|<=|==|!=|>|<)\s*-?\d+)?)/y;
function cond(src) {
  if (src == null || src === '') return true;
  const toks = []; TOK.lastIndex = 0;
  while (TOK.lastIndex < src.length) {
    const at = TOK.lastIndex, m = TOK.exec(src);
    if (!m) { if (/^\s*$/.test(src.slice(at))) break; throw new Error('条件の書き方が正しくありません: ' + src); }
    toks.push(m[1]);
  }
  let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const or = () => { let v = and(); while (peek() === '||') { next(); const r = and(); v = v || r; } return v; };
  const and = () => { let v = not(); while (peek() === '&&') { next(); const r = not(); v = v && r; } return v; };
  const not = () => { if (peek() === '!') { next(); return !not(); } return atom(); };
  const atom = () => {
    const t = next();
    if (t === '(') { const v = or(); if (next() !== ')') throw new Error('かっこが閉じていません: ' + src); return v; }
    return term(t, src);
  };
  const v = or();
  if (p < toks.length) throw new Error('条件の書き方が正しくありません: ' + src);
  return v;
}
function term(t, src) {
  if (t === 'true') return true;
  if (t === 'false') return false;
  const m = t && t.match(/^([a-z]+):([A-Za-z0-9_\-]+)(?:\s*(>=|<=|==|!=|>|<)\s*(-?\d+))?$/);
  if (!m) throw new Error('条件の書き方が正しくありません: ' + src);
  const [, k, n, op, num] = m;
  if (k === 'has') return S.items.includes(n);
  if (k === 'flag') return !!S.f[n];
  if (k === 'here') return S.loc === n;
  if (k === 'var' || k === 'talked') {
    const x = k === 'var' ? (S.v[n] || 0) : (S.seq['talk:' + n] || 0);
    if (!op) return x > 0;
    const y = +num;
    return { '>=': x >= y, '<=': x <= y, '==': x === y, '!=': x !== y, '>': x > y, '<': x < y }[op];
  }
  throw new Error('不明な条件: ' + t);
}

// ---------- 効果 ----------
function run(list) {
  for (const e of list || []) {
    const i = e.indexOf(':'), k = i < 0 ? e : e.slice(0, i), a = i < 0 ? '' : e.slice(i + 1);
    switch (k) {
      case 'give': if (!S.items.includes(a)) { S.items.push(a); toast('入手：' + D.items[a]); } break;
      case 'take': S.items = S.items.filter(x => x !== a); break;
      case 'flag': S.f[a] = 1; break;
      case 'unflag': delete S.f[a]; break;
      case 'set': { const [n, v] = a.split('='); S.v[n] = +v; break; }
      case 'inc': S.v[a] = (S.v[a] || 0) + 1; break;
      case 'miss': S.v.miss = (S.v.miss || 0) + 1; break;
      case 'toast': if (!S.toasted) S.toasted = []; if (!S.toasted.includes(a)) { S.toasted.push(a); toast(a); } break;
      case 'goto': pending.goto = a; break;
      case 'puzzle': pending.puzzle = a; break;
      case 'ending': pending.ending = a; break;
      case 'chapter': pending.chapter = a; break;
      case 'event': pending.event = a; break;
      case 'card': { const k = a.indexOf(':'); addCard({ card: a.slice(k + 1) }, { p: a.slice(0, k) || null }); break; }
      default: throw new Error('不明な効果: ' + e);
    }
  }
}
const runAll = rules => (rules || []).forEach(r => { if (cond(r.if)) run(r.do); });

// 文字列 / ルール / ルールの配列（最初に条件が合うもの）/ {seq:[...]}（話すたびに次へ。最後はくり返し）
function resolve(entry, key) {
  if (entry == null) return null;
  if (typeof entry === 'string') return { text: entry };
  if (Array.isArray(entry)) return entry.find(r => cond(r.if)) || null;
  if (entry.seq) { const i = S.seq[key] || 0; S.seq[key] = i + 1; return entry.seq[Math.min(i, entry.seq.length - 1)]; }
  return cond(entry.if) ? entry : null;
}

// ---------- 表示 ----------
let typer = null, full = '', toastT;
const toastLog = [];
function toast(t) { toastLog.push(t); const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => e.classList.remove('on'), 2200); }
function say(t, meta) {
  if (t == null) return;
  if (S && !(meta && meta.nolog)) S.log.push({ c: S.chapter, l: S.loc, p: (meta && meta.p) || null, t });
  const sp = t.match(/^([^「\n]{1,10})「([\s\S]*)」$/);
  const w = $('who');

// ---------- 行動 ----------
function main() {
  if (S.done) return;
  const cmds = [['移動', moveMenu], ['聞く', askMenu], ['調べる', lookMenu], ['見せる', showMenu]];
  if (ch().accuse) cmds.push(['推理', accuseMenu]);

// 行けるようになった場所は、エンジンが自動で知らせる（シナリオに toast を書かなくてよい）
const openLocs = () => Object.keys(ch().locations).filter(k => avail(k));
let openBefore = null;
function act(rule, meta) {
  S.v.turns = (S.v.turns || 0) + 1;
  pending = {};
  openBefore = openLocs();
  if (rule) { run(rule.do); if (rule.text) say(rule.text, meta); if (rule.card) addCard(rule, meta); if (rule.note) addNote(rule, meta); }
  after();
}
// 取材ノート：ルールに "note": "要約" を付けると、伝記の取材メモとして残る
function addNote(rule, meta) {
  if (!S.notes) S.notes = [];
  if (S.notes.some(n => n.t === rule.note)) return;
  S.notes.push({ c: S.chapter, p: (meta && meta.p) || null, t: rule.note });
  S.v.notes = S.notes.length;
  toast('取材ノートに書き留めた');
}
// 証言カード：ルールに "card": true（その文をそのまま）か "card": "要約" を付けると記録される
function addCard(rule, meta) {
  const t = typeof rule.card === 'string' ? rule.card : rule.text;
  if (S.cards.some(c => c.t === t)) return;
  S.cards.push({ id: rule.cardId || null, c: S.chapter, l: S.loc, p: (meta && meta.p) || null, t, pin: false });
  toast('証言カードに記録した');
  updateNbBadge();
}
function after() {
  const p = pending; pending = {};
  if (openBefore) {
    const now = openLocs().filter(k => !openBefore.includes(k));
    if (now.length) toast(now.map(k => ch().locations[k].name).join('・') + 'に行けるようになった');
    openBefore = null;
  }
  if (p.goto) { S.loc = p.goto; renderScene(); }
  // 自動の進行：条件がそろったトリガーを1つだけ動かす（トリガーには once 用のフラグを do に入れておく）
  if (!p.event && !p.ending && !p.chapter && !p.puzzle) {
    const t = (ch().triggers || []).find(r => cond(r.if));
    if (t) { pending = {}; run(t.do); Object.assign(p, pending); pending = {}; }
  }
  autosave();
  if (p.event) return playEvent(p.event);
  if (p.puzzle) return openPuzzle(p.puzzle);
  if (p.ending) return nextBtn(() => ending(p.ending));
  if (p.chapter) return nextBtn(() => startChapter(p.chapter));
  main();
}
const avail = id => cond(ch().locations[id].unlock);
function moveMenu() {

  btns([...ids.map(k => [ch().locations[k].name, () => moveTo(k)]), back], 'どこへ行く？');
}
function moveTo(id) {

  runAll(ch().onMove);

// まだ聞いていない大事な話があるか（次に返ってくる文が証言カードになるもので、まだ一度も表示されていなければ「ある」）
function peekEntry(e, key) {
  if (e == null) return null;
  if (typeof e === 'string') return { text: e };
  if (Array.isArray(e)) return e.find(r => cond(r.if)) || null;
  if (e.seq) return e.seq[Math.min(S.seq[key] || 0, e.seq.length - 1)];
  return cond(e.if) ? e : null;
}
const peekTalk = p => peekEntry((ch().talk || {})[p], 'talk:' + p);
// 話題ごとの会話：talk の値を {"topics": {話題id: 返事}} にすると、聞くときに話題を選べる
const topicsOf = p => { const e = (ch().talk || {})[p]; return e && e.topics ? Object.keys(e.topics).filter(t => peekEntry(e.topics[t], 'talk:' + p + ':' + t)) : null; };
function hasNewTalk(p, heard) {
  const e = (ch().talk || {})[p];
  const rs = e && e.topics ? Object.keys(e.topics).map(t => peekEntry(e.topics[t], 'talk:' + p + ':' + t)) : [peekTalk(p)];
  return rs.some(r => r && r.text && r.card && !heard.has(r.text));
}
const heardSet = () => new Set(S.log.map(e => e.t));
function askMenu() { btns([...here().map(p => [person(p).name, () => talk(p)]), back], 'だれに聞く？'); }
// 助手（game.json の assistant）に聞くと、この場所でまだ大事な話を聞いていない人を教えてくれる
function assistantHint() {
  const heard = heardSet();
  // 同じ人の聞き残しを教えるのは、その章で1回だけ（2回目からはふだんのヒントに進む）
  const q = here().find(p => p !== D.assistant && hasNewTalk(p, heard) && !S.seq['ahint:' + S.chapter + ':' + p]);
  if (!q) return null;
  S.seq['ahint:' + S.chapter + ':' + q] = 1;
  return { text: fmt(D.assistantHint || '{name}さん、まだ何か知っていそうですよ。', { name: short(q) }) };
}
function talk(p) {
  const e = (ch().talk || {})[p], key = 'talk:' + p;
  const hint = p === D.assistant && !(e && e.topics) ? assistantHint() : null;
  if (hint) { S.seq[key] = (S.seq[key] || 0) + 1; S.v.hints = (S.v.hints || 0) + 1; return act(hint, { p }); }
  if (e && e.topics) {
    const ts = topicsOf(p);
    return btns([...ts.map(t => [(D.topics && D.topics[t]) || t, () => talkTopic(p, t)]), ['もどる', askMenu, 'back']], person(p).name + 'に、何を聞く？');
  }
  if (tieredHint(e, p, key)) return;
  const r = resolve(e, key);
  if (!(e && e.seq)) S.seq[key] = (S.seq[key] || 0) + 1;
  act(r || { text: fmt(ch().talkDefault || D.talkDefault || '{name}は、何も話してくれない。', { name: short(p) }) }, { p });
}
// 段階式のヒント：ルールに "hints": [ぼかした文, …, はっきりした文] を書くと、同じ段階で聞くたびに次の文になる
function tieredHint(e, p, key) {
  if (!Array.isArray(e)) return false;
  const i = e.findIndex(r => cond(r.if)), r = e[i];
  if (!r || !r.hints) return false;
  const hk = 'hint:' + S.chapter + ':' + key + ':' + i, lv = S.seq[hk] || 0;
  S.seq[hk] = lv + 1; S.seq[key] = (S.seq[key] || 0) + 1; S.seq['talk:' + p] = (S.seq['talk:' + p] || 0) + 1;
  S.v.hints = (S.v.hints || 0) + 1;
  act({ text: r.hints[Math.min(lv, r.hints.length - 1)], do: r.do }, { p });
  return true;
}
function talkTopic(p, t) {
  const e = ch().talk[p].topics[t], key = 'talk:' + p + ':' + t;
  if (p === D.assistant && t === D.hintTopic) {
    const h = assistantHint();
    if (h) { S.seq['talk:' + p] = (S.seq['talk:' + p] || 0) + 1; S.v.hints = (S.v.hints || 0) + 1; return act(h, { p }); }
  }
  if (tieredHint(e, p, key)) return;
  const r = resolve(e, key);
  if (!(e && e.seq)) S.seq[key] = (S.seq[key] || 0) + 1;
  S.seq['talk:' + p] = (S.seq['talk:' + p] || 0) + 1;
  act(r || { text: fmt(ch().talkDefault || D.talkDefault || '{name}は、何も話してくれない。', { name: short(p) }) }, { p });
}
function lookMenu() { btns([...Object.entries(loc().objs || {}).map(([o, name]) => [name, () => look(o)]), back], '何を調べる？'); }
function look(o) {

function accuseMenu() {

function accuse(p) {
  const A = ch().accuse;

  act(resolve((A.wrong || {})[p], 'accuse:' + p) || { text: A.wrongDefault || 'ちがうようだ。', do: ['miss'] });
}

// ---------- イベント（何ページか続けて見せる場面） ----------
// 章の events: {id: {bg, place, pages: [文...], do: [最後に行う効果]}}
function playEvent(id) {
  const E = ch().events[id];
  if (E.bg || E.place) setScene(E.bg || loc().bg, E.place || loc().name, ch().label || '現在地');
  let k = 0;
  const next = () => {
    if (k < E.pages.length) { say(E.pages[k++]); nextBtn(next); return; }
    pending = {}; openBefore = openLocs(); run(E.do);
    renderScene(); after();
  };
  next();
}

// ---------- 謎解き（番号入力） ----------
function openPuzzle(id) {
  const P = ch().puzzles[id]; let code = '';
  const disp = () => fmt(P.display, { code: code.padEnd(P.length, '＊') });
  say(P.prompt + '\n' + disp());
  const draw = () => btns([...'1234567890'.split('').map(d => [d, () => {
    code += d;
    if (code.length < P.length) { say(disp()); draw(); }
    else if (code === P.answer) act(P.success);
    else act({ text: fmt(P.fail, { code }) });
  }]), ['やめる', () => { say(P.cancel || 'やめた。'); main(); }, 'back']], P.label, 'pad');
  draw();
}

// ---------- 矛盾をつく ----------
// 章の contradictions: [{id, pairs: [[カードid, カードid], ...], if, text, do}]
function contradict(ids) {
  const same = (p) => (p[0] === ids[0] && p[1] === ids[1]) || (p[0] === ids[1] && p[1] === ids[0]);
  const list = ch().contradictions || [];
  const hit = list.find(x => x.pairs.some(same));
  if (hit && S.f['contra_' + hit.id]) return act({ text: hit.doneText || 'その食い違いは、もう明らかにした。' });
  if (hit && cond(hit.if)) {
    // 崩した証言カードに印を付け、認めた内容を新しいカードにする
    S.cards.forEach(c => { if (c.id && ids.includes(c.id) && hit.broken !== false && (hit.breaks || [ids[0], ids[1]]).includes(c.id)) c.broken = true; });
    return act({ text: hit.text, do: [...(hit.do || []), 'flag:contra_' + hit.id], card: hit.card, cardId: hit.cardId }, { p: hit.p || null });
  }
  if (hit) return act({ text: hit.notYet || 'いまは、それをつきつける相手がいない。' });
  act({ text: ch().contradictWrong || D.contradictWrong || 'その2つは、食い違っていないようだ…。', do: ['miss'] });
}

  e.style.display = n > 0 ? '' : 'none';
}
let nbTab = 'cards', nbQ = { who: '', place: '', ch: '', pin: false, q: '' };
function openNotebook(tab) {
  if (tab) nbTab = tab;
  closeModal();
  const old = $('nbook'); if (old) old.remove();
  const m = document.createElement('div'); m.id = 'nbook';
  const tabs = [['cards', '証言カード'], ...(D.notes ? [['notes', D.notes.tab || '取材ノート']] : []), ['log', '会話ログ'], ['items', 'もちもの'], ['memo', 'メモ'], ['story', 'これまで']];
  m.innerHTML = `<div class="nb-head"><h3>捜査手帳</h3><button class="nb-x" aria-label="とじる">とじる</button></div>
    <div class="nb-tabs">${tabs.map(([k, n]) => `<button data-k="${k}" class="${k === nbTab ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="nb-body"></div>`;
  m.querySelector('.nb-x').onclick = () => { nbSel = null; m.remove(); };
  m.querySelectorAll('.nb-tabs button').forEach(b => b.onclick = () => { nbTab = b.dataset.k; nbSel = null; openNotebook(); });
  document.body.appendChild(m);
  const body = m.querySelector('.nb-body');
  ({ cards: nbCards, notes: nbNotes, log: nbLog, items: nbItems, memo: nbMemo, story: nbStory })[nbTab](body);
}
const pinBtn = (on, fn) => { const b = document.createElement('button'); b.className = 'pin' + (on ? ' on' : ''); b.textContent = on ? '★' : '☆'; b.title = 'ピン留め'; b.onclick = e => { e.stopPropagation(); fn(); }; return b; };
function entryEl(e, onPin, isCard) {
  const d = document.createElement('div'); d.className = 'nb-entry' + (e.pin ? ' pinned' : '') + (e.broken ? ' is-broken' : '');
  const who = speaker(e), where = placeName(e.c, e.l);
  d.innerHTML = `<div class="meta">${e.broken ? '<span class="broken">崩した</span>' : ''}${esc(who || (isCard ? '調べたこと' : '（地の文）'))}${where ? '・' + esc(where) : ''}${D.chapters[e.c] && D.chapters[e.c].label ? '・' + esc(D.chapters[e.c].label) : ''}</div><div class="txt">${esc(e.t)}</div>`;
  d.prepend(pinBtn(e.pin, onPin));
  return d;
}
let nbSel = null; // 矛盾をつくときに選んだカードの番号
function nbCards(body) {
  S.seenCards = S.cards.length; updateNbBadge(); autosave();
  const only = nbQ.pinCards && !nbSel;
  if ((ch().contradictions || []).length && S.cards.length >= 2 && !S.done) {
    const box = document.createElement('div'); box.className = 'nb-contra';
    if (!nbSel) {
      box.innerHTML = '<button class="big primary">矛盾をつく</button><small>食い違っている証言カードを2枚選んで、つきつける</small>';
      box.querySelector('button').onclick = () => { nbSel = []; openNotebook(); };
    } else {
      box.innerHTML = `<div class="sel">食い違うカードを2枚選ぶ（${nbSel.length}/2）</div><div class="row2"><button class="big back">やめる</button><button class="big primary" ${nbSel.length === 2 ? '' : 'disabled'}>つきつける</button></div>`;
      const [cancel, go] = box.querySelectorAll('button');
      cancel.onclick = () => { nbSel = null; openNotebook(); };
      go.onclick = () => {
        const ids = nbSel.map(i => S.cards[i].id || ('#' + i)); nbSel = null;
        $('nbook').remove(); contradict(ids);
      };
    }
    body.appendChild(box);
  }
  const bar = document.createElement('div'); bar.className = 'nb-bar';
  bar.innerHTML = `<label><input type="checkbox" ${only ? 'checked' : ''}> ピン留めだけ</label><span class="cnt">${S.cards.length}枚</span>`;
  bar.querySelector('input').onchange = e => { nbQ.pinCards = e.target.checked; openNotebook(); };
  body.appendChild(bar);
  const list = S.cards.filter(c => !only || c.pin);
  if (!list.length) body.insertAdjacentHTML('beforeend', '<p class="nb-empty">まだ証言カードはありません。大事な証言を聞くと、ここに記録されます。</p>');
  list.forEach(c => {
    const el = entryEl(c, () => { c.pin = !c.pin; autosave(); openNotebook(); }, true);
    if (nbSel) {
      const i = S.cards.indexOf(c);
      el.classList.add('selectable'); if (nbSel.includes(i)) el.classList.add('chosen');
      el.onclick = () => {
        const k = nbSel.indexOf(i);
        if (k >= 0) nbSel.splice(k, 1); else if (nbSel.length < 2) nbSel.push(i);
        openNotebook();
      };
    }
    body.appendChild(el);
  });
}
function nbLog(body) {
  const whoSet = [...new Set(S.log.map(speaker).filter(Boolean))];
  const placeSet = [...new Set(S.log.map(e => e.c + '|' + e.l).filter(k => !k.endsWith('|null')))];
  const chSet = [...new Set(S.log.map(e => e.c))];
  const sel = (key, opts, label) => `<select data-k="${key}"><option value="">${label}</option>${opts.map(([v, n]) => `<option value="${esc(v)}" ${nbQ[key] === v ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const bar = document.createElement('div'); bar.className = 'nb-filter';
  bar.innerHTML = `<input type="search" placeholder="ことばで探す" value="${esc(nbQ.q)}">`
    + sel('who', whoSet.map(w => [w, w]), '話した人：すべて')
    + sel('place', placeSet.map(k => { const [c, l] = k.split('|'); return [k, placeName(c, l)]; }), '場所：すべて')
    + (chSet.length > 1 ? sel('ch', chSet.map(c => [c, D.chapters[c].label || D.chapters[c].title || c]), '章：すべて') : '')
    + `<label><input type="checkbox" class="pinonly" ${nbQ.pin ? 'checked' : ''}> ピン留めだけ</label>`;
  body.appendChild(bar);
  const list = document.createElement('div'); body.appendChild(list);
  const draw = () => {
    const q = nbQ.q.trim();
    const hits = [];
    for (let i = S.log.length - 1; i >= 0 && hits.length < 300; i--) {
      const e = S.log[i];
      if (nbQ.who && speaker(e) !== nbQ.who) continue;
      if (nbQ.place && e.c + '|' + e.l !== nbQ.place) continue;
      if (nbQ.ch && e.c !== nbQ.ch) continue;
      if (nbQ.pin && !e.pin) continue;
      if (q && !e.t.includes(q)) continue;
      hits.push(e);
    }
    list.innerHTML = hits.length ? `<div class="cnt">${hits.length}件（新しい順）</div>` : '<p class="nb-empty">見つかりませんでした。</p>';
    hits.forEach(e => list.appendChild(entryEl(e, () => { e.pin = !e.pin; autosave(); draw(); })));
  };
  const s = bar.querySelector('input[type=search]');
  s.oninput = () => { nbQ.q = s.value; draw(); };
  bar.querySelectorAll('select').forEach(x => x.onchange = () => { nbQ[x.dataset.k] = x.value; draw(); });
  bar.querySelector('.pinonly').onchange = e => { nbQ.pin = e.target.checked; draw(); };
  draw();
}
function nbNotes(body) {
  const ns = S.notes || [];
  body.innerHTML = `<p class="nb-note">${esc(D.notes.lead || '')}（${ns.length}件）</p>` + (ns.length ? '' : '<p class="nb-empty">まだ何も書き留めていない。</p>');
  ns.forEach(n => body.appendChild(entryEl({ ...n, l: null }, () => { n.pin = !n.pin; autosave(); openNotebook(); }, true)));
}
function nbItems(body) {
  body.innerHTML = S.items.length ? S.items.map(i => `<div class="nb-entry"><div class="txt">${esc(D.items[i])}</div></div>`).join('') : '<p class="nb-empty">まだ何も持っていない。</p>';
}
function nbMemo(body) {
  body.innerHTML = '<p class="nb-note">自分用のメモです。ゲームの進み方には関係しません。</p><textarea id="memo" placeholder="気づいたことを書いておこう"></textarea>';
  const t = body.querySelector('textarea'); t.value = S.memo || '';
  let timer; t.oninput = () => { S.memo = t.value; clearTimeout(timer); timer = setTimeout(autosave, 400); };
}
function nbStory(body) {
  const ids = Object.keys(D.chapters), upto = ids.indexOf(S.chapter);
  const parts = ids.slice(0, upto + 1).map(id => D.chapters[id]).filter(C => C.recap);
  body.innerHTML = parts.length ? parts.map(C => `<div class="nb-entry"><div class="meta">${esc((C.label || '') + ' ' + (C.title || ''))}</div><div class="txt">${esc(C.recap)}</div></div>`).join('') : '<p class="nb-empty">まだ記録はありません。</p>';
}
// 章のはじめと「つづきから」で、その章の「これまでの話」を出す
function showRecap() {
  const C = ch();
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="sheet"><div class="eyebrow">これまでの話</div><h3>${esc((C.label || '') + ' ' + (C.title || ''))}</h3><p class="recap">${esc(C.recap)}</p></div>`;
  const b = document.createElement('button'); b.className = 'big primary'; b.textContent = 'つづける'; b.style.width = '100%';
  b.onclick = closeModal; m.firstChild.appendChild(b);
  document.body.appendChild(m);
}

// ---------- プレイ時間 ----------
// 画面が見えていて、最後の操作から2分以内のあいだだけ数える（放置した時間は入れない）
let lastInput = Date.now();
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { lastInput = Date.now(); }, true));
setInterval(() => {
  if (!S || S.done || document.visibilityState !== 'visible' || Date.now() - lastInput > 120000) return;
  S.v.playSec = (S.v.playSec || 0) + 5;
}, 5000);
const hm = s => { s = s || 0; const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}時間${m}分` : `${m}分`; };

// ---------- 起動時の一括読み込み ----------
// 背景をすべて先に読み込んでおき、遊んでいる間は通信しないようにする。
function preload() {
  const urls = Object.values((D.assets && D.assets.bg) || {});
  let done = 0, failed = 0;
  const bar = $('loadbar'), txt = $('loadtxt');
  const tick = () => { bar.style.width = (urls.length ? done / urls.length * 100 : 100) + '%'; txt.textContent = `読み込み中… ${done}/${urls.length}`; };
  tick();
  // 日本語フォントは文字ごとに分割配信されるので、ゲームで使う文字をすべて一度描いて先に取り寄せる
  const fonts = new Promise(res => {
    const chars = [...new Set(JSON.stringify(Object.assign({}, D, { assets: null })))].join('');
    const box = document.createElement('div');
    box.setAttribute('aria-hidden', 'true');
    box.style.cssText = 'position:absolute;left:-9999px;top:0;width:10px;overflow:hidden;opacity:0;pointer-events:none';
    box.innerHTML = [["'Noto Sans JP'", 400], ["'Noto Sans JP'", 500], ["'Noto Sans JP'", 700], ["'Shippori Mincho'", 700], ["'Shippori Mincho'", 800]]
      .map(([f, w]) => `<span style="font-family:${f};font-weight:${w}">${chars.replace(/[<&]/g, '')}</span>`).join('');
    document.body.appendChild(box);
    const finish = () => { box.remove(); res(); };
    if (!document.fonts) return finish();
    setTimeout(finish, 8000);
    requestAnimationFrame(() => document.fonts.ready.then(finish, finish));
  });
  return Promise.all([fonts, ...urls.map(u => new Promise(res => {
    const im = new Image();
    im.onload = () => { done++; tick(); res(); };
    im.onerror = () => { done++; failed++; tick(); res(); };
    im.src = u;
    preloaded.push(im);
  }))]).then(() => failed);
}
const preloaded = [];

window.addEventListener('pageshow', e => { if (e.persisted) { document.body.classList.remove('leaving'); toTitle(); } });
document.title = D.title;
window.__mg = { get state() { return S; }, cond, D, openNotebook, toastLog, startChapter: id => { $('wrap').classList.remove('hide'); startChapter(id); } };
preload().then(failed => {
  $('loading').classList.add('hide');
  toTitle();
  if (failed) toast(`背景 ${failed} 枚を読み込めませんでした`);
});
})();

</script>
